<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>print-bench — media rework preview</title>
<style>
  /* Modernist — from the "Product Page Media Rework" design export: flat and
     architectural, Archivo throughout, ink on a warm light ground, one red
     accent, zero radius, strong 2px rules, labels flush left. This preview
     commits to the system's light look. */
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url("__FONT__") format("woff2");
  }
  :root {
    --bg: #f3f2f2;
    --surface: #fbfafa;
    --ink: #201e1d;
    --muted: #6b6663;
    --accent: #ec3013;
    --accent-deep: #a02008;
    --rule: #201e1d;
    --hair: #d8d4d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 "Archivo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:hover { color: var(--accent-deep); }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  ::selection { background: #ec301322; }
  img { display: block; max-width: 100%; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

  /* nav */
  .nav { border-bottom: 2px solid var(--rule); background: var(--bg); }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; text-decoration: none; }
  .brand .mark { width: 14px; height: 14px; background: var(--accent); }
  .previewtag {
    font: 600 11px/1 "Archivo"; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent-deep); border: 1px solid var(--accent); padding: 6px 8px;
  }

  /* gallery header */
  .head { padding: 48px 0 0; }
  .kicker { font: 700 12px/1 "Archivo"; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1.display { font-size: clamp(30px, 4.6vw, 52px); font-weight: 800; line-height: 1.05; letter-spacing: -0.015em; margin: 14px 0 16px; max-width: 18ch; }
  .intro { max-width: 52ch; color: var(--muted); }
  .head .hr { border: 0; border-top: 2px solid var(--rule); margin: 36px 0 0; }

  /* gallery grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2px; background: var(--rule); border: 2px solid var(--rule); border-top: 0; margin: 0 0 64px; }
  .card { background: var(--surface); display: flex; flex-direction: column; text-decoration: none; }
  .card figure { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #fff; border-bottom: 2px solid var(--rule); }
  .card figure img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.02); transition: filter .15s ease; }
  .card:hover figure img { filter: none; }
  .chip {
    position: absolute; right: 0; bottom: 0; background: var(--ink); color: var(--bg);
    font: 600 10px/1 "Archivo"; letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px;
  }
  .chip.spin { background: var(--accent); opacity: 0; transition: opacity .15s ease; }
  .card:hover .chip.spin { opacity: 1; }
  .card .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .card h2 .lin { color: var(--accent); }
  .card .pitch { color: var(--muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tag {
    font: 600 10px/1 "Archivo"; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 7px; border: 1px solid var(--ink); color: var(--ink); white-space: nowrap;
  }
  .tag.accent { border-color: var(--accent); color: var(--accent-deep); }
  .tag.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .from { font-size: 12px; color: var(--muted); }
  .from .plink { color: var(--accent-deep); text-decoration: underline; cursor: pointer; }
  .filler { background: var(--surface); position: relative; }
  .filler::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent 0 10px, #d8d4d1 10px 12px);
  }

  /* product page */
  .crumb { padding: 20px 0 0; font: 600 12px/1 "Archivo"; letter-spacing: .1em; text-transform: uppercase; }
  .crumb a { text-decoration: none; color: var(--muted); }
  .crumb a:hover { color: var(--accent-deep); }
  .prod-head { padding: 18px 0 22px; border-bottom: 2px solid var(--rule); }
  .prod-head h1 { font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: -0.015em; }
  .prod-head .pitch { max-width: 62ch; color: var(--muted); margin-top: 8px; }
  .banner {
    margin-top: 14px; border: 2px solid var(--accent); color: var(--accent-deep);
    padding: 10px 12px; font-size: 13px; font-weight: 600; max-width: 72ch;
  }

  /* built-by roster */
  .team { margin-top: 18px; }
  .team .kicker { color: var(--accent-deep); font-size: 11px; }
  .team .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .member {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--ink); padding: 8px 16px 8px 8px; min-width: 240px;
  }
  .member img { width: 48px; height: 48px; border: 1px solid var(--hair); background: #fff; filter: grayscale(1); }
  .member .monogram {
    width: 48px; height: 48px; border: 1px solid var(--hair); background: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 18px; color: var(--muted);
  }
  .member .mono {
    font: 500 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    background: #e9e6e4; color: var(--muted); padding: 2px 5px; margin-left: 6px;
  }
  .member .nm { font-size: 16px; font-weight: 800; }
  .member .rl { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .reviewed { margin-top: 12px; font-size: 14px; color: var(--muted); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .reviewed a { color: var(--ink); }
  .reviewed .mono {
    font: 500 12px/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace;
    color: var(--muted); text-decoration: underline;
  }

  .stagewrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 0; border: 2px solid var(--rule); border-top: 0; background: var(--surface); }
  .stage { border-right: 2px solid var(--rule); min-width: 0; }
  .stage .frame { background: #fff; display: grid; place-items: center; height: min(58vh, 560px); overflow: hidden; }
  .stage .frame img { max-width: 100%; max-height: min(58vh, 560px); object-fit: contain; }
  .stage .caption { border-top: 2px solid var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .caption .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .caption .row strong { font-size: 14px; letter-spacing: .01em; }
  .caption .alt { font-size: 13px; color: var(--muted); }
  .caption .ai {
    border-left: 3px solid var(--accent); padding: 6px 0 6px 10px;
    font-size: 12.5px; font-style: italic; color: var(--accent-deep); max-width: 80ch;
  }
  .rail { display: flex; flex-direction: column; overflow-y: auto; max-height: calc(min(58vh, 560px) + 120px); }
  .thumb {
    display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center;
    padding: 8px 10px; border: 0; border-bottom: 1px solid var(--hair); background: var(--surface);
    text-align: left; cursor: pointer; font: inherit; color: inherit;
  }
  .thumb:last-child { border-bottom: 0; }
  .thumb img { width: 76px; height: 57px; object-fit: cover; background: #fff; border: 1px solid var(--hair); filter: grayscale(1); }
  .thumb.sel { background: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  .thumb.sel img, .thumb:hover img { filter: none; }
  .thumb .tl { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .thumb .tk { font: 600 9.5px/1.4 "Archivo"; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .thumb .tk .aik { color: var(--accent-deep); }

  .facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 0 0; }

  .readme { max-width: 76ch; padding: 8px 0 72px; }
  .readme h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; border-top: 2px solid var(--rule); padding-top: 14px; margin: 34px 0 10px; }
  .readme h3 { font-size: 16px; font-weight: 700; margin: 22px 0 8px; }
  .readme p, .readme ul, .readme ol { margin: 10px 0; }
  .readme ul, .readme ol { padding-left: 22px; }
  .readme li { margin: 4px 0; }
  .readme code { font: 500 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace; background: #e9e6e4; padding: 1px 5px; }
  .readme pre { background: #e9e6e4; padding: 12px; overflow-x: auto; margin: 12px 0; }
  .readme pre code { background: none; padding: 0; }
  .readme table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .readme th { text-align: left; font: 700 11px/1.4 "Archivo"; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--rule); padding: 8px 10px 6px 0; }
  .readme td { border-bottom: 1px solid var(--hair); padding: 8px 10px 8px 0; vertical-align: top; }
  .readme blockquote { border-left: 3px solid var(--ink); padding-left: 12px; color: var(--muted); margin: 12px 0; }
  .readme img { border: 2px solid var(--rule); margin: 12px 0; }
  .readme a { color: var(--accent-deep); }

  footer { border-top: 2px solid var(--rule); }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 16px; padding-bottom: 24px; font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    .stagewrap { grid-template-columns: 1fr; }
    .stage { border-right: 0; }
    .rail { flex-direction: row; overflow-x: auto; max-height: none; border-top: 2px solid var(--rule); }
    .thumb { grid-template-columns: 64px; grid-template-rows: auto auto; border-bottom: 0; border-right: 1px solid var(--hair); min-width: 120px; }
    .thumb img { width: 64px; height: 48px; }
    .thumb.sel { box-shadow: inset 0 3px 0 var(--accent); }
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="#/"><span class="mark"></span>PRINT-BENCH</a>
    <span class="previewtag">Media rework · preview</span>
  </div>
</nav>
<main id="app" class="wrap"></main>
<footer>
  <div class="wrap">
    <span>Preview SPA — baked from the committed READMEs and previews; no invented content.</span>
    <span>shaiss/print-bench</span>
  </div>
</footer>
<script>
/*__DATA__*/

const app = document.getElementById("app");
// esc() guards every attribute/text interpolation below. d.pitch and d.body
// are the deliberate exceptions: they hold marked-rendered HTML baked from
// the committed READMEs at build time, so they are inserted raw.
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const AI_STILL = "AI-generated impression for general illustration only — geometry is approximate and may not exactly match the printed part; see the studio render and the STL for the true shape.";
const AI_MOTION = "AI-generated motion impression for general illustration only — geometry is approximate, and the motion is illustrative; see the deterministic previews and the STL for the true shape.";

function tags(d) {
  const t = [];
  if (d.parts) t.push(`<span class="tag">${d.parts} parts</span>`);
  if (d.coupon) t.push(`<span class="tag">fit coupon</span>`);
  if (d.archived) t.push(`<span class="tag accent">Archived v0.1</span>`);
  return t.join("");
}

let galleryAbort = null;

function gallery() {
  document.title = "print-bench — media rework preview";
  const cards = DESIGNS.map((d) => {
    const hero = d.media[0] || { src: "", alt: `${d.title} (no previews yet)` };
    const lin = d.depth ? `<span class="lin">↳ </span>` : "";
    const from = d.parents.length
      ? `<span class="from">derived from <span class="plink" data-goto="${esc(d.parents[0])}">${esc(d.parents[0])}</span></span>`
      : "";
    return `<a class="card" href="#/d/${d.name}" ${d.spin ? `data-spin="${esc(d.spin)}" data-hero="${esc(hero.src)}"` : ""}>
      <figure>
        <img src="${esc(hero.src)}" alt="${esc(hero.alt)}" loading="lazy">
        <span class="chip">${d.media.length} media</span>
        ${d.spin ? `<span class="chip spin" style="bottom:26px">turntable</span>` : ""}
      </figure>
      <div class="body">
        <h2>${lin}${esc(d.title)}</h2>
        <p class="pitch">${d.pitch}</p>
        ${from}
        <div class="meta">${tags(d)}</div>
      </div>
    </a>`;
  }).join("");
  app.innerHTML = `
    <header class="head">
      <p class="kicker">${DESIGNS.length} designs · every one gated in CI</p>
      <h1 class="display">Parametric designs, gated before they ship.</h1>
      <p class="intro">OpenSCAD models co-designed by humans and AI reviewers. Previews render from source; a printability gate — watertight, overhang-checked, test-sliced — passes before merge.</p>
      <hr class="hr">
    </header>
    <section class="grid">${cards}</section>`;
  for (const card of app.querySelectorAll(".card[data-spin]")) {
    const img = card.querySelector("figure img");
    card.addEventListener("mouseenter", () => { img.src = card.dataset.spin; });
    card.addEventListener("mouseleave", () => { img.src = card.dataset.hero; });
  }
  for (const p of app.querySelectorAll(".plink")) {
    p.addEventListener("click", (e) => {
      e.preventDefault();
      location.hash = `#/d/${p.dataset.goto}`;
    });
  }
  // fill the last grid row so leftover cells read as intentional structure
  const grid = app.querySelector(".grid");
  function fillGrid() {
    grid.querySelectorAll(".filler").forEach((f) => f.remove());
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
    const rem = DESIGNS.length % cols;
    if (rem) for (let i = 0; i < cols - rem; i++) grid.insertAdjacentHTML("beforeend", `<div class="filler"></div>`);
  }
  fillGrid();
  // Tied to this render: route() aborts it, so re-entering the gallery never
  // stacks stale listeners over detached grids.
  galleryAbort = new AbortController();
  addEventListener("resize", fillGrid, { signal: galleryAbort.signal });
}

const GH = "https://github.com/shaiss/print-bench";

function team(d) {
  if (!d.team) return "";
  const cards = d.team.core.map((m) => `
    <div class="member">
      ${m.avatar ? `<img src="${esc(m.avatar)}" alt="">` : `<span class="monogram" aria-hidden="true">${esc(m.initials || (m.name || "?")[0])}</span>`}
      <div>
        <span class="nm">${esc(m.name)}</span><span class="mono">${esc(m.handle)}</span>
        <div class="rl">${esc(m.role)}</div>
      </div>
    </div>`).join("");
  const rev = REVIEWERS.map(
    (r) => `<a href="${GH}/blob/main/people/${r.handle}.md" target="_blank" rel="noopener" title="${esc(r.role)}">${esc(r.name)}</a>`
  ).join(", ");
  return `<div class="team">
    <p class="kicker">Built by</p>
    <div class="cards">${cards}</div>
    <p class="reviewed"><span>Reviewed by → ${rev}</span>
      <a class="mono" href="${GH}/tree/main/people" target="_blank" rel="noopener">People</a></p>
  </div>`;
}

function product(name) {
  const d = DESIGNS.find((x) => x.name === name);
  if (!d) { location.hash = "#/"; return; }
  document.title = `${d.title} — media rework preview`;
  const thumbs = d.media.map((m, i) => `
    <button class="thumb" data-i="${i}" aria-label="${esc(m.label)} — ${esc(m.kind)}">
      <img src="${esc(m.src)}" alt="" loading="lazy">
      <span><span class="tl">${esc(m.label)}</span><br>
        <span class="tk">${esc(m.kind)}${m.ai ? ` · <span class="aik">AI</span>` : ""}</span></span>
    </button>`).join("");
  app.innerHTML = `
    <p class="crumb"><a href="#/">← All designs</a></p>
    <header class="prod-head">
      <h1>${esc(d.title)}</h1>
      <p class="pitch">${d.pitch}</p>
      ${d.archived ? `<p class="banner">${esc(d.archived)}</p>` : ""}
      ${team(d)}
    </header>
    <section class="stagewrap">
      <div class="stage">
        <div class="frame"><img id="stage-img" src="" alt=""></div>
        <div class="caption" id="stage-cap"></div>
      </div>
      <div class="rail" id="rail">${thumbs}</div>
    </section>
    <div class="facts">${tags(d)}
      <a class="tag" style="text-decoration:none" href="https://github.com/shaiss/print-bench/tree/main/designs/${d.name}" target="_blank" rel="noopener">source ↗</a>
    </div>
    <article class="readme">${d.body}</article>`;

  const stageImg = document.getElementById("stage-img");
  const cap = document.getElementById("stage-cap");
  const rail = document.getElementById("rail");
  let cur = -1;
  function show(i) {
    if (!d.media.length) return;
    cur = (i + d.media.length) % d.media.length;
    const m = d.media[cur];
    stageImg.src = m.src;
    stageImg.alt = m.alt;
    cap.innerHTML = `
      <div class="row"><strong>${esc(m.label)}</strong>
        <span class="tag${m.ai ? " accent" : ""}">${esc(m.kind)}</span>
        <span class="alt">${cur + 1} / ${d.media.length}</span></div>
      <span class="alt">${esc(m.alt)}</span>
      ${m.ai ? `<p class="ai">${esc(m.motion ? AI_MOTION : AI_STILL)}</p>` : ""}`;
    rail.querySelectorAll(".thumb").forEach((b, j) => b.classList.toggle("sel", j === cur));
  }
  rail.addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (b) show(+b.dataset.i);
  });
  document.onkeydown = (e) => {
    if (e.key === "ArrowRight") show(cur + 1);
    if (e.key === "ArrowLeft") show(cur - 1);
  };
  show(0);
}

function route() {
  document.onkeydown = null;
  if (galleryAbort) { galleryAbort.abort(); galleryAbort = null; }
  const m = /^#\/d\/([a-z0-9-]+)/.exec(location.hash);
  if (m) product(m[1]);
  else gallery();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
