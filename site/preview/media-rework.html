<script>
const DESIGNS = [{"name":"aerochord","title":"aerochord","pitch":"A musical wind instrument that (a) prints in place as <strong>one piece</strong> with no supports, (b) does not correspond to any instrument in the historical record, and (c) is only really designable/printable with an FDM machine and a computed internal geometry. The brief was an explicit stress test of the whole co-design pipeline.","archived":"Archived at v0.1 (2026-08-07) — frozen, not actively maintained.","parts":0,"coupon":true,"parents":[],"depth":0,"media":[{"file":"product-hero.png","src":"../../designs/aerochord/previews/product-hero.png","label":"Product Hero","alt":"aerochord printed in amber-orange PLA (satin finish) — three graduated fipple pipes rising from a base bar, with the bed-resting mouthpiece snout at the front","kind":"Studio render","ai":false,"motion":false},{"file":"air-path.png","src":"../../designs/aerochord/previews/air-path.png","label":"Air Path","alt":"Cutaway of the internal air path","kind":"Detail","ai":false,"motion":false},{"file":"fipple.png","src":"../../designs/aerochord/previews/fipple.png","label":"Fipple","alt":"Fipple close-up","kind":"Detail","ai":false,"motion":false},{"file":"contact-sheet.png","src":"../../designs/aerochord/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":null,"body":"<p><strong>One breath, a whole chord.</strong> aerochord is a print-in-place wind instrument\nwith no equivalent in the historical record: a single mouthpiece feeds a shared\nplenum that splits into several internal <em>fipples</em> (the flue-and-edge sound\nmaker of a recorder or tin whistle), each voicing its own closed pipe tuned to a\nnote of a chord. Blow once and every voice speaks together. It prints as <strong>one\npiece, standing up, with no supports</strong> — the intricate internal air path only\nworks because it was solved to be printable. For anyone who wants an\ninstrument that is impossible to buy and faintly impossible to explain.</p>\n<p>The three graduated pipes are the three voices of the default major triad — the\ntallest is the lowest note. The windows (mouths) sit at the front base of each\npipe; the mouthpiece snout you blow into is at the front, resting on the bed.</p>\n<h2>How it works</h2>\n<p>A recorder makes sound with a <em>fipple</em>: your breath is squeezed into a thin flat\njet (the <strong>flue</strong>) and thrown across a <strong>window</strong> at a sharp edge (the\n<strong>labium</strong>), which splits it and sets the air in the pipe oscillating.\naerochord puts <strong>one fipple per voice</strong> and feeds them all from a single\n<strong>plenum</strong> (a shared air reservoir), so a single breath drives several pipes at\nonce. Each pipe&#39;s length is <em>solved</em> from the closed-pipe relation\n<code>f = c / (4·L)</code> so its pitch is one note of the chosen chord.</p>\n<p>A cutaway through one voice shows the whole path — mouthpiece → plenum → windway\n→ flue → window → labium → the closed-pipe bore with its self-supporting\nconical top:</p>\n<p>…and the fipple itself close up — the thin windway, the flue exit, the open\nwindow, and the beveled labium:</p>\n<blockquote>\n<p><strong>Honest note on sound.</strong> The repo&#39;s gate proves this print is watertight,\nprintable, and sliceable — it does <strong>not</strong> prove the pitch or that a given\nvoice speaks. Those depend on fine fipple geometry and airflow that only a\nphysical print confirms. The dimensions follow documented whistle/recorder\npractice, and the design ships a one-voice coupon and a <code>tune</code> knob precisely\nso you can calibrate on a short print. Treat the printed pitches as <em>nominal</em>\nand expect to tune. See <code>NOTES.md</code> for the full acoustic derivation and\ncaveats.</p>\n</blockquote>\n<h2>What you get</h2>\n<p>A single print-in-place object — no assembly, no supports, no fasteners.</p>\n<ul>\n<li><code>aerochord</code> — the full instrument, default 3 voices (approx. 22 × 67 × 106 mm,\n~4 h, ~26 g PLA)</li>\n<li><code>aerochord-coupon</code> — <strong>print this first</strong>: one voice to dial in the fipple and\npitch on a ~1 h print before committing to the full chord</li>\n</ul>\n<h2>Print settings</h2>\n<ul>\n<li><strong>Material:</strong> PLA (or PETG). Any color; the sound doesn&#39;t care.</li>\n<li><strong>Layer height:</strong> 0.2 mm. Finer layers only sharpen the labium.</li>\n<li><strong>Nozzle:</strong> 0.2 mm or 0.4 mm (a 0.4 mm nozzle is assumed throughout). The thin\n1 mm flue is the make-or-break feature — a larger nozzle can&#39;t form it.</li>\n<li><strong>Infill:</strong> 15–20 % is plenty; the acoustic volumes are the hollow bores, not\ninfill.</li>\n<li><strong>Supports:</strong> <strong>none needed.</strong> Everything is self-supporting by construction.</li>\n<li><strong>Orientation:</strong> exactly as it renders — base flat on the bed, pipes up.</li>\n<li><strong>Brim:</strong> <strong>recommended.</strong> The instrument is tall and slim; a 5 mm brim keeps\nit planted. The slicer&#39;s generic &quot;stability&quot; warning is expected and is what\nthe brim answers.</li>\n<li><strong>Print the coupon first</strong> (<code>aerochord-coupon.scad</code>) and tune before the full\nrun — see <code>NOTES.md</code> → <em>Print this first</em>.</li>\n</ul>\n<h2>Parameters</h2>\n<p>All parameters live at the top of <code>aerochord.scad</code>, grouped in Customizer\nsections. The ones most worth touching:</p>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>chord_ratios</code></td>\n<td><code>[1, 5/4, 3/2]</code></td>\n<td>The chord, as just-intonation ratios. <code>[1, 6/5, 3/2]</code> = minor; add <code>2</code> for a root+octave; more entries = more voices</td>\n</tr>\n<tr>\n<td><code>root_freq</code></td>\n<td><code>1046.5</code> Hz (C6)</td>\n<td>Pitch of the lowest voice. Lower = taller, floppier pipes; higher = shorter, sturdier</td>\n</tr>\n<tr>\n<td><code>tune</code></td>\n<td><code>1.0</code></td>\n<td>Scales every pipe length together to correct measured pitch. Set <code>tune = measured/target</code> after a test print (pitch ∝ 1/<code>tune</code>, so &gt;1 lengthens tubes and lowers pitch)</td>\n</tr>\n<tr>\n<td><code>flue_h</code></td>\n<td><code>1.0</code> mm</td>\n<td>Windway air-gap — the critical FDM feature. Raise in 0.1 mm steps if a voice won&#39;t speak. Guarded ≥ 0.8</td>\n</tr>\n<tr>\n<td><code>cutup</code></td>\n<td><code>4.5</code> mm</td>\n<td>Flue-to-labium distance; the fipple&#39;s tone control. Breathy → lower it; shrill → raise it</td>\n</tr>\n<tr>\n<td><code>bore_d</code></td>\n<td><code>10</code> mm</td>\n<td>Pipe bore diameter — louder/lower-impedance when wider</td>\n</tr>\n<tr>\n<td><code>window_corr</code></td>\n<td><code>2</code> mm</td>\n<td>The open-window end correction folded into every tube&#39;s length so the chord <em>intervals</em> stay true (see NOTES). ~0.3–0.6 × bore radius; calibrate physically if the intervals sound off</td>\n</tr>\n</tbody></table>\n<p>Override on the command line, e.g. a warmer minor chord an octave down:</p>\n<pre><code class=\"language-bash\">export OPENSCADPATH=&quot;$PWD/lib:$PWD&quot;   # so `use &lt;printability.scad&gt;` resolves\nxvfb-run -a openscad -o build/aerochord.stl \\\n  -D &#39;chord_ratios=[1, 6/5, 3/2]&#39; -D &#39;root_freq=523.25&#39; \\\n  designs/aerochord/aerochord.scad\n</code></pre>\n<p>(Or just <code>./scripts/render.sh aerochord</code>, which sets <code>OPENSCADPATH</code> for you.)</p>\n<h2>Assembly &amp; use</h2>\n<p>No assembly. Snip the brim, clear any stray strands from the windows and the\nflue slots (a slip of paper or a 0.3 mm feeler through each window helps), and\nblow steadily into the mouthpiece. All voices should sound at once. If one is\nsilent or airy, that&#39;s a fipple to tune — see <code>NOTES.md</code> → <em>Print this first</em>.</p>\n"},{"name":"calibration-cube","title":"calibration-cube","pitch":"Simple dimensional-accuracy test print; also serves as the repo&#39;s starter design demonstrating the parameter conventions.","archived":null,"parts":0,"coupon":false,"parents":[],"depth":0,"media":[{"file":"product-hero.png","src":"../../designs/calibration-cube/previews/product-hero.png","label":"Product Hero","alt":"Product shot: the printed cube, satin orange PLA on a studio backdrop","kind":"Studio render","ai":false,"motion":false},{"file":"lifestyle-bench-calipers.png","src":"../../designs/calibration-cube/previews/lifestyle-bench-calipers.png","label":"Bench Calipers","alt":"AI-styled scene: calibration-cube staged in a real-world setting","kind":"AI-styled scene","ai":true,"motion":false},{"file":"size-marker.png","src":"../../designs/calibration-cube/previews/size-marker.png","label":"Size Marker","alt":"Product shot: the engraved 20 mm size marker, high three-quarter view, satin orange PLA","kind":"Detail","ai":false,"motion":false},{"file":"turntable.gif","src":"../../designs/calibration-cube/previews/turntable.gif","label":"Turntable","alt":"Turntable: chamfered bottom edges and the engraved size marker","kind":"Turntable","ai":false,"motion":true},{"file":"lifestyle-turntable.gif","src":"../../designs/calibration-cube/previews/lifestyle-turntable.gif","label":"Turntable","alt":"AI-styled scene: calibration-cube in motion, staged in a real-world setting","kind":"AI motion clip","ai":true,"motion":true},{"file":"contact-sheet.png","src":"../../designs/calibration-cube/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":"../../designs/calibration-cube/previews/turntable.gif","body":"<p>A 20 mm test cube for checking your printer&#39;s dimensional accuracy — and the\nstarter design demonstrating this repo&#39;s parameter conventions. The bottom\nedges carry a 0.6 mm 45° chamfer so the first layer releases cleanly, and the\ntop face is engraved with the cube&#39;s edge length, so every print labels its\nown intended size.</p>\n<h2>What you get</h2>\n<p>A single printable part, no assembly:</p>\n<ul>\n<li><code>calibration-cube</code> — one cube, 20 × 20 × 20 mm at default settings, with\nchamfered bottom edges and the edge length engraved 0.4 mm deep into the\ntop face.</li>\n</ul>\n<h2>Print settings</h2>\n<ul>\n<li><strong>Material:</strong> any — use the filament you want to calibrate</li>\n<li><strong>Layer height:</strong> 0.2 mm or finer (the engraved marker is sized to survive\nslicing at 0.2 mm layers)</li>\n<li><strong>Infill:</strong> 100% if you&#39;ll check dimensional accuracy under load; otherwise\nyour usual default</li>\n<li><strong>Supports:</strong> none needed</li>\n<li><strong>Orientation:</strong> as modeled — flat face down</li>\n</ul>\n<h2>Parameters</h2>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>size</code></td>\n<td>20 mm</td>\n<td>Edge length of the cube; the engraved marker updates to match</td>\n</tr>\n<tr>\n<td><code>bottom_chamfer</code></td>\n<td>0.6 mm</td>\n<td>45° chamfer on the bottom edges so the first layer releases cleanly (0 to disable)</td>\n</tr>\n<tr>\n<td><code>$fn</code></td>\n<td>64</td>\n<td>Curve resolution — 32 while iterating, 64+ for production</td>\n</tr>\n</tbody></table>\n<p>All parameters are at the top of <code>calibration-cube.scad</code>, grouped in\nCustomizer sections; override on the command line with <code>-D &#39;size=25&#39;</code>.</p>\n<h2>Assembly &amp; use</h2>\n<p>Nothing to assemble. Print it, then measure the X, Y, and Z faces with\ncalipers and compare against the number engraved on top. If you want a\ndifferent reference size, change <code>size</code> and reprint — the marker follows\nautomatically.</p>\n<p>Design rationale and modeling decisions live in <a href=\"NOTES.md\">NOTES.md</a>.</p>\n"},{"name":"desiccant-capsule","title":"Desiccant Capsule","pitch":"Refillable two-part capsule for loose silica gel beads, lived-in filament dry-boxes. Perforated body lets air/moisture reach the beads; screw-on lid with real threads (not press-fit) and a ribbed grip edge so it can be opened with dry-box gloves on. Must print on FDM with no supports on either part.","archived":"Archived at v0.1 (2026-08-07) — frozen, not actively maintained.","parts":0,"coupon":false,"parents":[],"depth":0,"media":[{"file":"product-hero.png","src":"../../designs/desiccant-capsule/previews/product-hero.png","label":"Product Hero","alt":"Product shot: the assembled capsule, teal PLA on a studio backdrop","kind":"Studio render","ai":false,"motion":false},{"file":"turntable.gif","src":"../../designs/desiccant-capsule/previews/turntable.gif","label":"Turntable","alt":"Assembled capsule turntable: vent pattern and lid ribs all the way around","kind":"Turntable","ai":false,"motion":true},{"file":"vents-closeup.png","src":"../../designs/desiccant-capsule/previews/vents-closeup.png","label":"Vents Closeup","alt":"Vent close-up","kind":"Detail","ai":false,"motion":false},{"file":"assembly.png","src":"../../designs/desiccant-capsule/previews/assembly.png","label":"Assembly","alt":"Desiccant Capsule — Assembly","kind":"Detail","ai":false,"motion":false},{"file":"cutaway.png","src":"../../designs/desiccant-capsule/previews/cutaway.png","label":"Cutaway","alt":"Desiccant Capsule — Cutaway","kind":"Detail","ai":false,"motion":false},{"file":"contact-sheet.png","src":"../../designs/desiccant-capsule/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":"../../designs/desiccant-capsule/previews/turntable.gif","body":"<p>Refillable two-part screw capsule for loose silica gel beads in filament\ndry-boxes. The perforated body lets air and moisture reach the beads, and\nthe lid screws on with real trapezoidal threads and a ribbed grip edge —\neasy to open even with dry-box gloves on. Both parts print support-free\non FDM, with vents sized for a standard 0.4 mm nozzle.</p>\n<h2>What you get</h2>\n<p>One <code>.scad</code> file that generates both parts. With the default\n<code>part = &quot;print&quot;</code>, both are laid out side by side on one plate, ready to\nslice; <code>body</code>, <code>lid</code>, <code>assembly</code>, and <code>cutaway</code> are also available.</p>\n<ul>\n<li><strong>Body</strong> — perforated cylinder with a threaded neck, ~30 mm outer\ndiameter × ~40 mm tall. Vertical slot vents (0.8 mm wide, 2.4 mm webs)\nplus a perforated floor; every opening is sized to retain a worn 1 mm\nindicating-silica bead, and the render fails with a clear message if\nyou widen the vents past that limit.</li>\n<li><strong>Lid</strong> — screw-on cap with internal threads, a lead-in chamfer, and\n24 grip ribs (~35 mm across the ribs). Two-start, 4 mm-pitch threads\nmean it opens in about one turn.</li>\n</ul>\n<p>Closed up, the capsule is ~35 mm across the ribs × ~43 mm tall — handy\nwhen sizing a dry-box slot; the <code>.scad</code> echoes the exact values\n(35.0 mm and 42.8 mm at the defaults) at render time.</p>\n<table>\n<thead>\n<tr>\n<th>Closed assembly</th>\n<th>Section through the thread zone</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><img src=\"previews/assembly.png\" alt=\"Assembly\"></td>\n<td><img src=\"previews/cutaway.png\" alt=\"Cutaway\"></td>\n</tr>\n</tbody></table>\n<h2>Print settings</h2>\n<ul>\n<li><strong>Material:</strong> PLA or PETG. If you regenerate the silica in a warm oven\nwith the beads still inside the capsule, use PETG (or empty the beads\nout first).</li>\n<li><strong>Layer height:</strong> 0.2 mm works well — the 45° thread flanks and\nvertical slot vents print cleanly at standard layer heights; finer\nlayers just cost time.</li>\n<li><strong>Infill:</strong> doesn&#39;t matter here — the part is nearly all walls, floor,\nand threads, so any default is fine.</li>\n<li><strong>Supports:</strong> none needed, on either part. Thread flanks are 45°, the\nbody&#39;s internal shoulder is a 45° cone, and each slot vent bridges\nonly its own 0.8 mm width.</li>\n<li><strong>Orientation:</strong> as generated. The body prints upright on its floor;\n<code>part = &quot;lid&quot;</code> (and the default <code>&quot;print&quot;</code> layout) already outputs the\nlid flipped — flat top on the bed, internal threads up a vertical\nbore.</li>\n<li><strong>Nozzle:</strong> the default 0.8 mm slot vents are chosen to print crisply\non a standard 0.4 mm nozzle; the optional hex vents tend to seal shut\nat sub-1 mm sizes, so keep them for coarser beads.</li>\n</ul>\n<h2>Parameters</h2>\n<p>The ones you&#39;re most likely to touch:</p>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>part</code></td>\n<td><code>&quot;print&quot;</code></td>\n<td>Geometry to generate: <code>body</code>, <code>lid</code>, <code>print</code> (both, sliceable), <code>assembly</code>, <code>cutaway</code></td>\n</tr>\n<tr>\n<td><code>thread_tol</code></td>\n<td>0.3 mm</td>\n<td>Radial clearance on the female thread — the fit-tuning knob (see below)</td>\n</tr>\n<tr>\n<td><code>body_od</code></td>\n<td>30 mm</td>\n<td>Body outer diameter</td>\n</tr>\n<tr>\n<td><code>body_h</code></td>\n<td>40 mm</td>\n<td>Overall body height, including the threaded neck</td>\n</tr>\n<tr>\n<td><code>vent_style</code></td>\n<td><code>&quot;slot&quot;</code></td>\n<td><code>slot</code> (default) or <code>hex</code> vents on the side wall</td>\n</tr>\n<tr>\n<td><code>vent_w</code></td>\n<td>0.8 mm</td>\n<td>Max vent opening size; guarded against <code>bead_min</code></td>\n</tr>\n<tr>\n<td><code>bead_min</code></td>\n<td>1.0 mm</td>\n<td>Smallest bead the capsule must retain (1.0 = indicating silica gel, 1–3 mm grade)</td>\n</tr>\n<tr>\n<td><code>floor_vents</code></td>\n<td><code>true</code></td>\n<td>Perforate the floor as well</td>\n</tr>\n</tbody></table>\n<p>All parameters are at the top of <code>desiccant-capsule.scad</code>, grouped in\nCustomizer sections; override on the command line with\n<code>-D &#39;thread_tol=0.4&#39;</code>.</p>\n<h2>Assembly &amp; use</h2>\n<p>Print both parts, fill the body with silica gel through the neck, and\nscrew the lid down until its rim seats on the body shoulder — that\nshoulder is a positive stop, so you can&#39;t overtighten into the threads.\nDrop the capsule into your dry-box and swap or regenerate the beads\nwhenever your indicating silica changes color.</p>\n<p><strong>Dialing in the thread fit:</strong> thread clearance is one number,\n<code>thread_tol</code> (default 0.3 mm), and it applies equally at crests, roots,\nand flanks. If the lid binds, increase it in steps of 0.1 and reprint\n<strong>the lid only</strong> (<code>part = &quot;lid&quot;</code>); if the lid feels sloppy, decrease it\nby 0.1. The body never needs reprinting to fix the fit.</p>\n<p>Design rationale — the thread-clearance derivation, bead-containment\nguards, and vent open-area accounting — lives in <a href=\"NOTES.md\">NOTES.md</a>.</p>\n"},{"name":"nuggs","title":"N.U.G.G.S.","pitch":"An 80 mm-bore tunnel <strong>system</strong> for an adult Syrian hamster, built around one genderless quarter-turn port that every module carries at every end. The kit that exists today is the Bin Bridge: two bulkheads and one straight joining two enclosures through their walls, with nothing inside the cage.","archived":"Archived at v0.1 (2026-08-07) — frozen, not actively maintained.","parts":3,"coupon":true,"parents":[],"depth":0,"media":[{"file":"contact-sheet.png","src":"../../designs/nuggs/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":null,"body":"<p>An 80 mm-bore tunnel <strong>system</strong> for an adult Syrian hamster whose factory\ncage tubes are too narrow for a pouch-full animal. The system is really one\nthing: a <strong>genderless quarter-turn port</strong>. Every module carries the same\nport at every end, so any module mates with any other either way round, and\nthe whole run comes apart in one twist with the animal still inside it.\nToday the kit that exists is the <strong>Bin Bridge</strong> — two bulkheads and one\nstraight, joining two enclosures through their walls. Everything else\n(elbow, node, open module, wye) is backlog, not product.</p>\n<blockquote>\n<p><strong>Work in progress — nothing here has been printed yet.</strong> The design\npasses <code>gate.sh --slice</code>, and the coupling is verified in geometry: two\nidentical ports nest, twist either way, and resist axial pull. What no\none has checked is how it behaves in plastic — <code>port_tol = 0.30</code> is a\nstarting guess, so <strong>print the coupon first</strong> and expect to tune it.\nTrack progress in <a href=\"https://github.com/shaiss/print-bench/issues/34\">issue #34</a>;\n<code>NOTES.md</code> has the open items and <code>PM.md</code> the ranked backlog.</p>\n</blockquote>\n<h2>Read this before anything else</h2>\n<p>The expert consensus is that hamster tube systems <strong>should not exist</strong>.\nPLOS One 2022 rated them unsuitable as a product category, and the German\nveterinary welfare association&#39;s Merkblatt 62 gives reasons: they cannot be\nventilated, they condense, they cannot be cleaned, and clear tube denies a\nprey animal any refuge.</p>\n<p>This design exists to answer each of those individually, or to omit the\npart. That is why it is short, opaque, open at both ends, and lives\n<em>between</em> enclosures rather than inside one.</p>\n<p><strong>And here is the limit of that claim, stated plainly:</strong> we could not\nretrieve <em>why</em> PLOS One rated tube systems unsuitable — only that it did.\nSo the table below answers the defects <strong>we</strong> enumerated. It is not a\ndemonstration that this design escapes that paper&#39;s verdict. If you are\ndeciding whether to print this, that gap is yours to weigh, and it is the\nhonest reason the page leads with the objection instead of burying it.</p>\n<table>\n<thead>\n<tr>\n<th>Documented defect</th>\n<th>What this does about it</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Bore too narrow for a pouch-full adult</td>\n<td>80 mm, full-bore through the wall crossing; 70 mm floor as a hard <code>assert</code></td>\n</tr>\n<tr>\n<td>Cannot be ventilated / condenses</td>\n<td>No closed volumes. Every run is open at both ends into a ventilated enclosure — no caps, no blind branches</td>\n</tr>\n<tr>\n<td>Cannot be cleaned</td>\n<td>One twist releases any module for a hand wash, without disturbing the nest</td>\n</tr>\n<tr>\n<td>Transparent tube gives no refuge</td>\n<td>Opaque, uncoloured filament; you inspect it by it being short and straight</td>\n</tr>\n<tr>\n<td>Endless tube mazes</td>\n<td><strong>No single <em>run</em> of enclosed bore exceeds 2 × your animal&#39;s body length</strong> — 360 mm at the default. A run ends at an open end, an open module, or a chamber he can turn around in. <strong>A bend, a junction, a coupling and a top hatch are not ends</strong> (see <a href=\"#the-length-rule-and-how-far-to-trust-it\">The length rule</a>). The Bin Bridge is one 246 mm run, and the limit is engraved on the part (<code>MAX RUN 360MM</code> / <code>COUPLINGS DONT RESET</code>)</td>\n</tr>\n<tr>\n<td>Eats cage floor and substrate</td>\n<td>Runs between enclosures at bedding height — zero floor area, zero substrate</td>\n</tr>\n</tbody></table>\n<p><strong>Measure your hamster.</strong> <code>body_len_mm</code> defaults to 180 mm and sets the\nbudget for each enclosed <strong>run</strong> (not for the system as a whole — see\n<a href=\"#the-length-rule-and-how-far-to-trust-it\">The length rule</a>).</p>\n<p>And <code>min_bore_mm = 70</code> is not a suggestion. The reason usually given is\nthat an undersized opening lets grit in a full pouch lacerate the mucosa,\nleading to impaction and abscess with no visible symptom until surgery —\nand that mechanism is <strong>reported rather than verified</strong>: it comes from\nsecondary rescue and veterinary pages, and nobody on this project has read\nthe primary literature. Treat it as the reason the floor is conservative,\nnot as a diagnosis.</p>\n<p>The floor stays regardless, and the argument for it does not depend on that\nmechanism being exactly right: the animal cannot report a bore that is too\nnarrow, being generous costs a few grams of filament, and being wrong costs\nsurgery. That asymmetry is why it is an <code>assert</code> and not a preference.</p>\n<h2>The length rule, and how far to trust it</h2>\n<p>The one rule you have to hold in your head when you lay out a run. It is\nalso the rule this project got wrong twice, so it comes with its receipts.</p>\n<p><strong>The rule.</strong> No <strong>run</strong> of continuously enclosed bore may exceed\n<strong>2 × body length</strong> (360 mm at <code>body_len_mm = 180</code>). A <em>run</em> is the\nunbroken stretch of enclosed bore between two <strong>breaks</strong>, and there are\nexactly three breaks:</p>\n<ul>\n<li>an <strong>open end</strong> — a port discharging into a ventilated enclosure;</li>\n<li>an <strong>open module</strong> — a bore with a longitudinal window of at least 180°,\nso the opening is the widest part of the void and the animal lifts\nstraight out;</li>\n<li>a <strong>turnaround node</strong> — a chamber at least one body length clear inside\n<strong>and itself open to ventilated space</strong> (an open top, a ≥ 180° window, or\na port into an enclosure). Width alone is not enough: width answers <em>can\nhe turn around</em>, and it says nothing about <em>can the air move</em>. A sealed\nwide chamber is a dead volume in the middle of a run, which is one of the\ndefects this whole design exists to answer.</li>\n</ul>\n<p><strong>What is not a break, and this matters more than the number:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Not a break</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A bend</td>\n<td>He cannot rotate in an 80 mm bore. A 45° elbow turns the <em>tube</em>, not the <em>animal</em> — he still has to reverse the whole way back</td>\n</tr>\n<tr>\n<td>A junction at bore diameter</td>\n<td>A wye at 80 mm is a <em>branching</em> one-way bore. It multiplies the ways to be trapped, it does not reduce them</td>\n</tr>\n<tr>\n<td>A coupling</td>\n<td>It is a joint. Two straights coupled are <strong>one 406 mm run</strong>, which is over the limit</td>\n</tr>\n<tr>\n<td>A top hatch</td>\n<td>It resets <strong>retrieval</strong> — you can reach him. It does not reset <strong>reversing</strong> — he still cannot turn around. Two different problems, two different fixes</td>\n</tr>\n</tbody></table>\n<p><strong>Why 360 and not some other number.</strong> Because he cannot turn around, he\nleaves by whichever end is nearer — so the worst case is <strong>half the run</strong>.\nA 360 mm run bounds worst-case unassisted reversing at 180 mm: one body\nlength. <strong>That reasoning is ours, not a published finding.</strong> No literature\nmeasures how far a hamster will reverse, or the width he needs to fold in.</p>\n<p><strong>Where the 2× comes from, corrected.</strong> It is the <strong>Deutscher\nTierschutzbund</strong> position paper <em>Tierschutzwidriges Zubehör</em> — <strong>not</strong> TVT\nMerkblatt 62, which this project cited for two rounds and which appears\nnever to have published a length limit at all (its objections are\nqualitative). In the source it is one limb of a <em>conjunctive</em> test: tubes\nare acceptable only if they are at most twice body length <strong>and</strong> ensure\nadequate ventilation. Both limbs, or neither.</p>\n<p><strong>How much to trust it.</strong> Every source here was reached through search-result\nsummaries under an egress block; <strong>nobody on this project has read the\nprimary text.</strong> Specifically:</p>\n<ul>\n<li><em>Probably right:</em> the rule is DTSchB&#39;s, not TVT&#39;s, and it is conjunctive.</li>\n<li><em>Least certain, and it is the load-bearing part:</em> that the limit applies\n<strong>per tube</strong> rather than to a whole system. That reading is inferred from\nplural German in a search summary. If it turns out to be per-system, this\npage&#39;s rule is too permissive and the &quot;one straight per run&quot; line becomes\n&quot;one straight, full stop.&quot;</li>\n<li><em>Two figures that cut the other way, both real:</em> German pet-care sites\ncirculate a <strong>stricter</strong> 25–30 cm maximum; and wild Syrians work burrow\ngalleries averaging <strong>200 cm</strong> and reaching 900 cm, at tunnel diameters\nof only 40–50 mm (Gattermann et al. 2001) — which is why the 2× figure\ncannot be read as a biological tolerance. A soil burrow is grippable on\nall sides, self-ventilating, dug to fit that animal, and escapable by\ndigging. Printed PETG is none of those, which is why we keep the limit\nanyway.</li>\n</ul>\n<p>The full working, with the confidence ladder, is in\n<a href=\"../../docs/nuggs-research.md\"><code>docs/nuggs-research.md</code></a> §11.</p>\n<h2>What you get</h2>\n<ul>\n<li><code>straight</code> — the enclosed run, ⌀96.8 × 180 mm at defaults</li>\n<li><code>bulkhead_in</code> — inner flange + full-bore spigot through an 89 mm wall hole</li>\n<li><code>bulkhead_out</code> — outer flange + bolt circle; doubles as the drill template</li>\n<li><code>nuggs-coupon</code> — two port stubs; print this first to tune the fit</li>\n</ul>\n<p>A complete Bin Bridge is two bulkhead pairs and one straight.</p>\n<h2>Print settings</h2>\n<ul>\n<li><strong>Material:</strong> natural (uncoloured) PETG. <strong>Not PLA</strong> — its glass\ntransition (57–70 °C) overlaps dishwasher temperatures, and a deformed\ntube is a <em>narrowed</em> tube.</li>\n<li><strong>Layer height:</strong> 0.2 mm</li>\n<li><strong>Perimeters:</strong> 5 (fills the 2.4 mm wall)</li>\n<li><strong>Infill:</strong> 20 %</li>\n<li><strong>Supports:</strong> none needed — every downward-facing surface is ≥ 50°</li>\n<li><strong>Orientation:</strong> tube axis vertical. This is not a preference: horizontal\nputs unsupported bore crown <em>inside</em> the tube the animal walks through,\nand it is also what caps any future bend at 45° per module</li>\n<li><strong>Brim:</strong> required, <code>outer_and_inner</code>, 5 mm. Not optional, and worth\nunderstanding: the straight has no flat base — it stands on the six port\nsector tips, 528 mm² across 69% of the circumference, holding up a 180 mm\ntall part for ten hours. A brim roughly triples the anchored area, but it\ndoes <strong>not</strong> bridge the gaps between the tips (each is ~17 mm of arc, and\na 5 mm brim reaches 5 mm). Use it anyway; also print on a clean, degreased\nplate, and do not run a draughty room.</li>\n<li><strong>You will also need:</strong> an 89 mm bi-metal hole saw. It is a stocked size\nbut <em>not</em> in a typical 13-piece set, and there is no way around a hole\nlarger than the bore.</li>\n</ul>\n<p><strong>Never drill tempered glass</strong> — Detolfs and most tank panels shatter under\na hole saw. This design does not serve glass enclosures.</p>\n<p><strong>Cleaning:</strong> hand wash only, ≤ 50 °C, unscented mild dish soap, rinse and\ndry fully. Never a dishwasher — the heated dry cycle exceeds even PETG.</p>\n<h2>Parameters</h2>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>bore_d</code></td>\n<td>80 mm</td>\n<td>Internal bore. The headline number; asserted ≥ <code>min_bore_mm</code></td>\n</tr>\n<tr>\n<td><code>min_bore_mm</code></td>\n<td>70 mm</td>\n<td>Welfare floor (DTSchB pouch-full entrance minimum). Never lower it</td>\n</tr>\n<tr>\n<td><code>body_len_mm</code></td>\n<td>180 mm</td>\n<td>Your animal&#39;s head-and-body length; sets the enclosed-<strong>run</strong> budget (2 ×)</td>\n</tr>\n<tr>\n<td><code>straight_len</code></td>\n<td>160 mm</td>\n<td>Face-to-face run length</td>\n</tr>\n<tr>\n<td><code>port_tol</code></td>\n<td>0.30 mm</td>\n<td><strong>The one fit knob.</strong> A real clearance in millimetres on every coupling surface — radial, axial <em>and</em> circumferential — whatever bore you set. Tune on the coupon in ±0.05 steps</td>\n</tr>\n<tr>\n<td><code>wall</code></td>\n<td>2.4 mm</td>\n<td>Tube shell; 6 perimeters at a 0.4 mm nozzle</td>\n</tr>\n<tr>\n<td><code>lug_deg</code></td>\n<td>40°</td>\n<td>Coupling sector width. Also sets first-layer area, since the part stands on these tips — raise it toward 46 for more bed grip, never past <code>pitch/2 − twist_deg</code></td>\n</tr>\n<tr>\n<td><code>wall_hole_d</code></td>\n<td>89 mm</td>\n<td>Enclosure-wall hole — a stocked hole-saw size</td>\n</tr>\n<tr>\n<td><code>twist_deg</code></td>\n<td>14°</td>\n<td>The locking twist. Bounded by <code>rib_deg + twist_deg ≤ lug_deg</code></td>\n</tr>\n<tr>\n<td><code>mark_h</code></td>\n<td>5 mm</td>\n<td>Cap height of the engraved revision mark. 0 leaves parts unmarked</td>\n</tr>\n</tbody></table>\n<p>All parameters are at the top of <code>nuggs.scad</code>, grouped in Customizer\nsections; override on the command line with <code>-D &#39;straight_len=120&#39;</code>.</p>\n<h2>Assembly &amp; use</h2>\n<blockquote>\n<h3>One straight per run. Never chain two.</h3>\n<p>This is the one rule the model cannot enforce for you. A <strong>run</strong> — the\ncontinuously enclosed bore between two breaks — must stay within\n<strong>2 × your animal&#39;s head-and-body length</strong>. One straight plus both\nbulkhead throats is 160 + 2×(4+4+25+10) = <strong>246 mm</strong>, inside the 360 mm\nbudget at <code>body_len_mm = 180</code>. (The two 4 mm figures are the bulkhead\nflange plates. They are bored at full bore, so they are tube the animal\nwalks through, not mounting hardware outside the run — omitting them is\nwhat made this read 230 mm until PR #78.) Two straights coupled together\nis <strong>406 mm</strong> and breaks it, because <strong>a coupling is not a break</strong> — the two\ntubes are one run. And because every NUGGS face mates with every other,\ntwo straights <em>will</em> click together and feel right. <code>assert</code> runs at\nrender time and cannot see what you assemble on the bench, so the rule is\nengraved on the outside of every straight instead: the port revision\n(<code>NUGGS PORT R1</code>) plus <strong><code>MAX RUN 360MM</code></strong> and <strong><code>COUPLINGS DONT RESET</code></strong>.\nBoth engraved lines are derived from <code>body_len_mm</code>, so they cannot\ndisagree with the assert.</p>\n<p>If you need a longer bridge, move the enclosures closer or raise\n<code>body_len_mm</code> to your <em>measured</em> animal — never add a second straight.</p>\n</blockquote>\n<p>Drill one 89 mm hole in each facing wall, at bedding height, level with\neach other. Bolt a bulkhead pair into each hole with 6 × M4. Push the\nstraight onto one port, twist 14° to lock — either direction works, the\ncoupling is symmetric — then the same at the other end.</p>\n<p>To open a run — for cleaning, or because an animal is in trouble — twist\none joint back 14° and lift the straight away. Do not pull the animal.</p>\n<h3>Markings</h3>\n<p>Every part that has a face the animal can never reach carries its port\nrevision engraved on it, so you can tell what a printed part conforms to\nyears later — which is the point of there being one port standard rather\nthan several:</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>Mark</th>\n<th>Where</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>straight</code></td>\n<td><code>NUGGS PORT R1</code> + <code>MAX RUN 360MM</code> + <code>COUPLINGS DONT RESET</code></td>\n<td>outer tube wall, mid-length — in the room, between the enclosures</td>\n</tr>\n<tr>\n<td><code>bulkhead_out</code></td>\n<td>port revision</td>\n<td>flange rim, outside the enclosure wall</td>\n</tr>\n<tr>\n<td><code>bulkhead_in</code></td>\n<td><em>(none, deliberately)</em></td>\n<td>every face it has is either inside the enclosure or buried in the wall hole</td>\n</tr>\n</tbody></table>\n<p>The marks are <strong>engraved, never raised</strong> — a proud character is a\nchew-initiation edge. Set <code>mark_h = 0</code> to omit them.</p>\n"},{"name":"nuggs-yard","title":"N.U.G.G.S. Yard","pitch":"An open-top run for an adult Syrian hamster&#39;s <strong>playpen</strong> — free-roam time outside the cage. The ask was &quot;loops and twists, turns, branches, all the stuff to keep him busy&quot;. It is a floor-standing kit of modules the owner lays out themselves, not a fixed object.","archived":"Archived at v0.1 (2026-08-07) — frozen, not actively maintained.","parts":5,"coupon":true,"parents":[],"depth":0,"media":[{"file":"product-hero.png","src":"../../designs/nuggs-yard/previews/product-hero.png","label":"Product Hero","alt":"Product shot","kind":"Studio render","ai":false,"motion":false},{"file":"refuge-shot.png","src":"../../designs/nuggs-yard/previews/refuge-shot.png","label":"Refuge Shot","alt":"The covered refuge","kind":"Detail","ai":false,"motion":false},{"file":"contact-sheet.png","src":"../../designs/nuggs-yard/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":null,"body":"<!-- -->\n\n<blockquote>\n<p><strong>Superseded joint — this kit does not interoperate with <code>nuggs</code> today.</strong>\nAs of 2026-08-03, N.U.G.G.S. is a system with <strong>one</strong> genderless\ninterlock standard, and it is <code>nuggs</code>&#39;s quarter-turn port. This design&#39;s\ngendered lap-skirt joint is superseded by it: a Yard module and a <code>nuggs</code>\nmodule will not mate, in either direction. A rebuild onto the shared port\n— as <strong>open modules with a round arc floor</strong>, not flat troughs — is\nplanned as its own PR. Until it lands, treat the two kits as separate.\nThe welfare length rule quoted below has also been re-attributed and\nre-scoped; the corrected version lives in\n<a href=\"../nuggs/PM.md\"><code>designs/nuggs/PM.md</code></a> (N2) and\n<a href=\"../../docs/nuggs-research.md\"><code>docs/nuggs-research.md</code></a> §11.</p>\n</blockquote>\n<p>An <strong>open-top playpen run</strong> for an adult Syrian hamster: turns, branches, a\ncovered hide, and a closed circuit with no dead ends in it anywhere. It is a\nkit of modules you lay out on the floor of a playpen during free-roam time —\nnot a tube system, and nothing goes in the cage.</p>\n<blockquote>\n<p><strong>Work in progress — nothing here has been printed yet.</strong> All six parts\npass <code>gate.sh --slice</code> at 100/100 and the covered segment&#39;s bore is\nmeasured on the exported mesh, not just asserted. What no one has checked\nis how the joint behaves in plastic: <code>joint_tol = 0.30</code> is a starting\nguess, so <strong>print the coupon first</strong>. Design request:\n<a href=\"https://github.com/shaiss/print-bench/issues/73\">issue #73</a>.\n<code>NOTES.md</code> has the decisions and the open items.</p>\n</blockquote>\n<h2>Why this one is open at the top</h2>\n<p>The sibling design <a href=\"../nuggs/\"><code>nuggs</code></a> is an <em>enclosed</em> tunnel, and its\nproduct page leads with an uncomfortable fact: the expert consensus (PLOS\nOne 2022 EXOPET-II; TVT Merkblatt 62) is that hamster tube systems <strong>should\nnot exist</strong>. They cannot be ventilated, they condense, they cannot be\ncleaned, and a long tube is somewhere an animal can get stuck and cannot be\nreached. Those objections are why <code>nuggs</code> is short and straight — and why it\nrefuses exactly the loops and branches this design is built from.</p>\n<p>Take the roof off and most of those objections stop applying, because every\none of them is a consequence of enclosure:</p>\n<table>\n<thead>\n<tr>\n<th>Objection to tube systems</th>\n<th>An open-top run</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Length limit — he cannot reverse, you cannot reach him</td>\n<td>He steps out anywhere along it. So does your hand</td>\n</tr>\n<tr>\n<td>Cannot be ventilated, condenses</td>\n<td>Nothing encloses air</td>\n</tr>\n<tr>\n<td>Cannot be cleaned</td>\n<td>It is a trough. Lift a module out and wash it</td>\n</tr>\n<tr>\n<td>Dead ends trap and stress</td>\n<td>A <strong>closed circuit</strong> has no terminus at all</td>\n</tr>\n<tr>\n<td>Eats cage floor and substrate</td>\n<td>Lives in the playpen, not the cage. Zero substrate cost</td>\n</tr>\n</tbody></table>\n<p>What does <strong>not</strong> change is anything about the animal&#39;s body. Wherever this\ndesign puts a roof on — the refuge — the full 70 mm bore floor applies, and\nthe whole run is flat, because Syrians climb well but have almost no depth\nperception and will walk off a raised edge.</p>\n<p><strong>&quot;Loop&quot; here means a closed circuit, not a loop-the-loop.</strong> Twists,\nswitchbacks, S-bends, spurs and figure-eights are all fine. A helix, a\nspiral ramp or a vertical loop is refused by the model.</p>\n<h2>What you get</h2>\n<p>Six parts from one <code>.scad</code>. Every module is 80 mm wide inside with a flat\nfloor, prints flat on the bed, and needs <strong>no supports</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>Size (mm)</th>\n<th>Filament</th>\n<th>Time</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>straight</code></td>\n<td>172.0 × 88.6 × 48.6</td>\n<td>62.11 g</td>\n<td>5h 14m</td>\n</tr>\n<tr>\n<td><code>curve90</code></td>\n<td>124.3 × 133.6 × 48.6</td>\n<td>49.49 g</td>\n<td>4h 18m</td>\n</tr>\n<tr>\n<td><code>curve45</code></td>\n<td>97.1 × 98.0 × 48.6</td>\n<td>26.65 g</td>\n<td>2h 27m</td>\n</tr>\n<tr>\n<td><code>wye</code></td>\n<td>183.3 × 165.6 × 48.6</td>\n<td>76.28 g</td>\n<td>6h 40m</td>\n</tr>\n<tr>\n<td><code>refuge</code> (covered)</td>\n<td>172.0 × 88.6 × 89.3</td>\n<td>91.89 g</td>\n<td>7h 18m</td>\n</tr>\n<tr>\n<td><code>nuggs-yard-coupon</code></td>\n<td>57.0 × 208.8 × 48.6</td>\n<td>40.40 g</td>\n<td>3h 39m</td>\n</tr>\n</tbody></table>\n<p>Masses and times are the gate&#39;s own PrusaSlicer test-slice at 0.2 mm /\n0.4 nozzle, <strong>PLA at 1.24 g/cm³</strong>. PETG is about 2.4% heavier.</p>\n<p>The <strong>refuge</strong> is the one covered part, and it is where the welfare numbers\nbite. Its roof is a 45° gable rather than an arch so both slopes print\nwithout support, and the measured inscribed circle through it is <strong>70.75 mm</strong>\n— checked on the exported mesh at six stations along its length, not merely\nasserted in the source.</p>\n<p>A <code>wye</code> is the same 160 mm face-to-face as a <code>straight</code>, so it drops into\nany layout in place of one.</p>\n<h2>Suggested builds</h2>\n<p>Pick one to suit your spool. <strong>Print the coupon (40 g) before any of them.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Build</th>\n<th>Parts</th>\n<th>Filament</th>\n<th>Footprint</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Oval + branch</strong> ⭐</td>\n<td>4 × <code>curve90</code>, 1 × <code>wye</code>, 1 × <code>refuge</code></td>\n<td><strong>366 g</strong></td>\n<td>~406 × 246 mm</td>\n</tr>\n<tr>\n<td>Oval circuit</td>\n<td>4 × <code>curve90</code>, 1 × <code>straight</code>, 1 × <code>refuge</code></td>\n<td>352 g</td>\n<td>~406 × 246 mm</td>\n</tr>\n<tr>\n<td>Square circuit</td>\n<td>4 × <code>curve90</code>, 3 × <code>straight</code>, 1 × <code>refuge</code></td>\n<td>476 g</td>\n<td>~409 × 409 mm</td>\n</tr>\n<tr>\n<td>Open S-run (no circuit)</td>\n<td>2 × <code>curve90</code>, 2 × <code>straight</code></td>\n<td>223 g</td>\n<td>fits anything</td>\n</tr>\n</tbody></table>\n<p>Totals are summed from the gate&#39;s unrounded figures and then rounded once, so\nadding up the rounded per-part masses above can land a gram out.</p>\n<p>The starred build is the recommendation: it has the loop, the branch and the\nhide, and lands at <strong>407 g including the coupon</strong>.</p>\n<p><strong>Shorter run, more stops.</strong> The evidence base for hamster welfare\n(Hauzenberger et al. 2006) puts substrate depth and foraging — not tunnel\nlength — at the centre of enrichment. A 2 m circuit of bare channel is a\ncorridor; a 1.2 m circuit with things to do on it is a foraging route. Scatter\nfeed along the run and stand a shallow ceramic dish of sand beside it. That\ncosts 0 g of filament and does more than another metre of channel.</p>\n<h2>Print settings</h2>\n<ul>\n<li><strong>Material:</strong> PLA or PETG. PETG is the welfare-safer answer for the same\nreason as <code>nuggs</code> (its glass transition is well above any wash you would\ngive it), PLA is cheaper and easier and changes <code>joint_tol</code> slightly.</li>\n<li><strong>Layer height:</strong> 0.2 mm</li>\n<li><strong>Perimeters:</strong> 4 (fills the 1.6 mm wall)</li>\n<li><strong>Infill:</strong> 20%</li>\n<li><strong>Supports:</strong> <strong>none — for any part.</strong> The steepest downward-facing\nsurface in the whole kit is the refuge&#39;s 45° gable.</li>\n<li><strong>Orientation:</strong> exactly as each part renders — flat on the bed; printcheck\nreports &quot;current orientation is as good as any axis-aligned alternative&quot;\nfor all six.</li>\n<li><strong>Brim:</strong> not needed. Every module has a full flat footprint (unlike the\n<code>nuggs</code> straight, which stands 160 mm tall on a 2.4 mm ring and does).</li>\n<li><strong>Plate:</strong> a <code>straight</code> is 88.6 mm wide, so <strong>two</strong> fit side by side on a\n256 mm bed (three would need 266 mm). A 350 mm-class bed takes three.</li>\n</ul>\n<p><strong>Cleaning:</strong> hand wash, ≤ 50 °C, unscented mild dish soap, dry fully. Never\na dishwasher — the heated dry cycle exceeds even PETG, and a deformed\ncovered segment is a <em>narrowed</em> one.</p>\n<h2>Parameters</h2>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>joint_tol</code></td>\n<td>0.30 mm</td>\n<td><strong>The one fit knob.</strong> Clearance between a skirt and the wall it laps. Tune on the coupon in ±0.05 steps</td>\n</tr>\n<tr>\n<td><code>inner_w</code></td>\n<td>80 mm</td>\n<td>Internal floor width. Asserted ≥ <code>min_run_width</code></td>\n</tr>\n<tr>\n<td><code>min_run_width</code></td>\n<td>80 mm</td>\n<td>Welfare floor for the open run&#39;s width, and what <code>inner_w</code> is asserted against. Lower it and the guard moves with it</td>\n</tr>\n<tr>\n<td><code>side_h</code></td>\n<td>47 mm</td>\n<td>Sidewall height. <strong>Set by the refuge, not the open run</strong> — it is the smallest value at which a covered segment still clears the 70 mm bore floor. At 45 mm the refuge measures 69.1 mm and is non-compliant</td>\n</tr>\n<tr>\n<td><code>min_covered_bore</code></td>\n<td>70 mm</td>\n<td>Welfare floor for any covered segment. Never lower it</td>\n</tr>\n<tr>\n<td><code>body_len_mm</code></td>\n<td>180 mm</td>\n<td>Your animal&#39;s head-and-body length; caps <code>refuge_len</code> at 2× it</td>\n</tr>\n<tr>\n<td><code>straight_len</code></td>\n<td>160 mm</td>\n<td>Face-to-face module length; <code>wye_len</code> and <code>refuge_len</code> match it so modules interchange</td>\n</tr>\n<tr>\n<td><code>curve_r</code></td>\n<td>80 mm</td>\n<td>Curve centreline radius. Bigger sweeps are gentler and cost more</td>\n</tr>\n<tr>\n<td><code>wall</code></td>\n<td>1.6 mm</td>\n<td>Shell thickness; 4 perimeters at a 0.4 mm nozzle</td>\n</tr>\n<tr>\n<td><code>wye_junction</code></td>\n<td>50 mm</td>\n<td>Where the branch leaves the main run. Moving it forward thins the crotch — asserted</td>\n</tr>\n</tbody></table>\n<p>All parameters are at the top of <code>nuggs-yard.scad</code>, grouped in Customizer\nsections; override on the command line with <code>-D &#39;curve_r=100&#39;</code>.</p>\n<h2>Assembly &amp; use</h2>\n<p>Modules simply sit on the pen floor. Each has <strong>skirts at one end and a bare\nend at the other</strong>: slide a skirted end over the neighbour&#39;s bare end. Keep\nevery module facing the same way round the circuit and any module mates with\nany other.</p>\n<p>To take a module out — for cleaning, or because you want the layout\ndifferent — <strong>lift it straight up</strong>. The skirts wrap the sidewalls only and\nnever pass under the neighbour&#39;s floor, so nothing has to be slid along the\nrun to free one piece in the middle.</p>\n<h3>Print this first</h3>\n<p><code>nuggs-yard-coupon.scad</code> gives you two 45 mm stubs for 40 g. Mate them:</p>\n<ul>\n<li><strong>Rocks or falls off</strong> → lower <code>joint_tol</code> by 0.05 and reprint.</li>\n<li><strong>Will not seat, or the skirt splays</strong> → raise it by 0.05.</li>\n</ul>\n<p>Do not commit 92 g to a refuge before a stub mates cleanly.</p>\n<h3>Layout rules the model cannot check for you</h3>\n<ol>\n<li><strong>No dead ends.</strong> Close the circuit, or leave a spur ending in open\nchannel he can turn around in and step out of. Never point a spur into a\ncorner he can be cornered in.</li>\n<li><strong>Keep it flat.</strong> Do not prop, stack or ramp any module. The whole design\nassumes level ground.</li>\n<li><strong>One covered segment per run, and keep it short.</strong> The refuge is the only\nroofed part and it is sized to the 2 × body-length budget on its own.\nCoupling two refuges end to end doubles the enclosed length and breaks it.</li>\n<li><strong>Supervised free-roam only.</strong> This is playpen furniture, not housing.</li>\n</ol>\n"},{"name":"sushi-battleship","title":"sushi-battleship","pitch":"Battleship played with real sushi.","archived":"Archived at v0.1 (2026-08-07) — frozen, not actively maintained.","parts":3,"coupon":true,"parents":[],"depth":0,"media":[{"file":"product-hero.png","src":"../../designs/sushi-battleship/previews/product-hero.png","label":"Product Hero","alt":"Product shot: the assembled board in charcoal PLA, D1 shutter opened","kind":"Studio render","ai":false,"motion":false},{"file":"shutter-slide.gif","src":"../../designs/sushi-battleship/previews/shutter-slide.gif","label":"Shutter Slide","alt":"A hit on D1: the shutter slides to its end stop, lifts out, and reveals the piece","kind":"Animation","ai":false,"motion":true},{"file":"coupon.png","src":"../../designs/sushi-battleship/previews/coupon.png","label":"Coupon","alt":"Test coupon","kind":"Detail","ai":false,"motion":false},{"file":"assembly.png","src":"../../designs/sushi-battleship/previews/assembly.png","label":"Assembly","alt":"Assembled board with shutter D1 opened","kind":"Detail","ai":false,"motion":false},{"file":"turntable.gif","src":"../../designs/sushi-battleship/previews/turntable.gif","label":"Turntable","alt":"Full-board turntable with shutter D1 opened","kind":"Turntable","ai":false,"motion":true},{"file":"shutter-closeup.png","src":"../../designs/sushi-battleship/previews/shutter-closeup.png","label":"Shutter Closeup","alt":"Shutter D1 slid fully open, ready to lift out","kind":"Detail","ai":false,"motion":false},{"file":"cutaway.png","src":"../../designs/sushi-battleship/previews/cutaway.png","label":"Cutaway","alt":"sushi-battleship — Cutaway","kind":"Detail","ai":false,"motion":false},{"file":"ridge-closeup.png","src":"../../designs/sushi-battleship/previews/ridge-closeup.png","label":"Ridge Closeup","alt":"sushi-battleship — Ridge Closeup","kind":"Detail","ai":false,"motion":false},{"file":"slide-section.png","src":"../../designs/sushi-battleship/previews/slide-section.png","label":"Slide Section","alt":"sushi-battleship — Slide Section","kind":"Detail","ai":false,"motion":false},{"file":"contact-sheet.png","src":"../../designs/sushi-battleship/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":"../../designs/sushi-battleship/previews/turntable.gif","body":"<p>Battleship, played with real sushi. A two-part printable game board: a\ntray holds a 4×4 grid of cut roll pieces, and a lid on top carries one\n<strong>print-in-place sliding shutter per cell</strong> (A1–D4). Call a shot; on a\n&quot;hit&quot; your opponent slides the shutter ~6.7 mm until it stops, lifts it\nout, and you eat the piece underneath. Closed shutters are locked and\ncannot be lifted, so nobody peeks. No supports, no hardware, no\nassembly — the shutters print captive in the lid and free up with one\nfirm push each.</p>\n<h2>What you get</h2>\n<p>Three printable parts, selected with the <code>part</code> parameter (the default\n<code>part = &quot;assembled&quot;</code> is a preview only) or via the tiny per-part\nwrapper files:</p>\n<ul>\n<li><strong><code>bottom</code></strong> (<code>sushi-battleship-bottom.scad</code>) — the tray,\n~254 × 254 × 44 mm at defaults: 4×4 cells sized for a ~40 mm cut\nroll piece, low dividers, cell coordinates engraved in each floor so\nships can be placed by call-out, tall outer walls, and a rebated rim\nthe lid drops into.</li>\n<li><strong><code>top</code></strong> (<code>sushi-battleship-top.scad</code>) — the lid, 250 × 250 mm:\nsixteen print-in-place shutters, each engraved with its coordinate\nand a slide-direction arrow, plus a raised grip bar for\npushing/pulling.</li>\n<li><strong><code>door</code></strong> (<code>sushi-battleship-door.scad</code>) — a single spare shutter.\nThe <code>door_fit</code> tuning knob changes only the door, never the lid or\ntray, so a re-tuned door drops straight into an already-printed board.</li>\n</ul>\n<p>Plus a test coupon, <code>sushi-battleship-coupon.scad</code> — see below.</p>\n<h2>Print the coupon first</h2>\n<p>The coupon is the full production lid at grid 1×1 — one complete\nshutter with its rails, lips, end stops, and membrane, generated by the\nexact code that builds the full board. It prints in ~30–45 minutes\nversus hours for the top. Before committing to the full board:</p>\n<ol>\n<li>Print the coupon with the settings below.</li>\n<li>Exercise it: free the door with one firm push toward the arrow,\npunch out the membrane, slide + lift the door out, drop it back in\nat the open position, slide forward to re-lock.</li>\n<li>Door welded or sticky? Reprint with <code>door_fit = 0.1</code>, then 0.2, …\n(ceiling 0.5). Too rattly? Go −0.1 (floor −0.2).</li>\n<li>Print the full top with your tuned <code>door_fit</code>.</li>\n</ol>\n<h2>Print settings</h2>\n<ul>\n<li><strong>Supports: OFF — hard requirement.</strong> Any support material inside the\nwindows or under the doors fuses the mechanism.</li>\n<li><strong>Orientation:</strong> both parts flat side down, exactly as modeled.</li>\n<li><strong>Nozzle:</strong> 0.4 mm (a 0.6 mm nozzle eats most of the mechanism&#39;s\n0.5 / 0.4 mm clearances — not recommended).</li>\n<li><strong>Layer height:</strong> 0.12–0.30 mm all safe — every common preset keeps\n≥ 2 air layers under the doors.</li>\n<li><strong>Material:</strong> PLA for the top (sixteen 46 mm free-air bridges in PETG\nis a sag lottery on a first print; if you must, start at\n<code>door_fit = +0.1</code> and max out bridge cooling). The tray can be any\nmaterial.</li>\n<li><strong>Infill:</strong> your slicer&#39;s default is fine for both parts — nothing\nhere is load-bearing. The doors slice solid; the 3 mm plates and\n~4 mm tray walls get a sparse core with default profiles, which is\nfine.</li>\n<li><strong>Brim/skirt: none.</strong> The board leaves ~1 mm of bed margin per side\non 256-class beds — turn off Bambu Studio&#39;s Auto brim and\nOrcaSlicer&#39;s default skirt.</li>\n<li><strong>Bridge direction: pin to 90°</strong> (Bambu/Orca &quot;Bridge direction&quot;,\nPrusaSlicer &quot;Bridging angle&quot;) so the door bridges run along the slide\naxis; auto can legitimately pick a weaker direction.</li>\n<li><strong>Seam:</strong> &quot;Back&quot; (or scarf seam), so door seams land on the deep rear\nchamfer instead of mating edges.</li>\n<li><strong>If doors still weld on the coupon:</strong> check &quot;slice gap closing\nradius&quot; (keep it at the ~0.049 mm default), then step <code>door_fit</code> up\nby +0.1.</li>\n</ul>\n<p><strong>Bed fit</strong> — the 4×4 board (250 mm lid, ~254 mm tray) targets a\n256 mm-class bed, and stock profiles matter:</p>\n<table>\n<thead>\n<tr>\n<th>Printer (stock profile)</th>\n<th>4×4 board</th>\n<th>If not</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Bambu P2S, Bambu H2 class, 300-class and larger</td>\n<td>fits</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Bambu X1 / P1 series</td>\n<td>does <strong>not</strong> fit centred — the stock profile&#39;s 18 × 28 mm front-left exclusion zone clips even the 250 mm lid</td>\n<td>print 3×3 (192 mm), or knowingly edit the printable area</td>\n</tr>\n<tr>\n<td>Prusa CORE One (250 × 220)</td>\n<td>does not fit</td>\n<td>3×3 (192 mm)</td>\n</tr>\n<tr>\n<td>Generic 220-class (Ender 3 etc.)</td>\n<td>does not fit</td>\n<td>3×3 (192 mm)</td>\n</tr>\n</tbody></table>\n<p>Shrinking <code>roll_d</code> is not a bed-fit escape hatch: the lid is still too\nbig long before the shutter mechanism&#39;s margins run out, and an assert\nstops you at the floor (margin math in <a href=\"NOTES.md\">NOTES.md</a>). Drop\n<code>grid_x</code>/<code>grid_y</code> instead.</p>\n<h2>Parameters</h2>\n<p>The ones you&#39;re most likely to touch, with defaults:</p>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>part</code></td>\n<td><code>&quot;assembled&quot;</code></td>\n<td>preview only — set <code>bottom</code> / <code>top</code> / <code>door</code> to export printable parts</td>\n</tr>\n<tr>\n<td><code>grid_x</code>, <code>grid_y</code></td>\n<td>4, 4</td>\n<td>board size; 3×3 gives a 192 mm board for smaller beds</td>\n</tr>\n<tr>\n<td><code>roll_d</code></td>\n<td>40 mm</td>\n<td>diameter of a cut sushi-roll piece; sets cell and window size</td>\n</tr>\n<tr>\n<td><code>roll_h</code></td>\n<td>30 mm</td>\n<td>piece height; sets tray depth</td>\n</tr>\n<tr>\n<td><code>door_fit</code></td>\n<td>0 mm</td>\n<td>door-only fit knob: + looser, − tighter; safe range −0.2…+0.5; tune on the coupon</td>\n</tr>\n<tr>\n<td><code>membrane</code></td>\n<td>0.2 mm</td>\n<td>one-layer sacrificial skin under each window, punched out after printing; set 0 to omit if your bridging is well tuned</td>\n</tr>\n<tr>\n<td><code>clr_h</code>, <code>clr_v</code></td>\n<td>0.5, 0.4 mm</td>\n<td>print-in-place horizontal / vertical clearances</td>\n</tr>\n</tbody></table>\n<p>All parameters are at the top of <code>sushi-battleship.scad</code>, grouped in\nCustomizer sections; override on the command line with\n<code>-D &#39;door_fit=0.1&#39;</code>.</p>\n<h2>Exporting STLs</h2>\n<p><code>./scripts/render.sh sushi-battleship</code> renders the assembled preview.\nFor printable STLs, export each part from its wrapper file:</p>\n<pre><code class=\"language-bash\">mkdir -p build\nxvfb-run -a openscad -o build/sushi-battleship-top.stl    designs/sushi-battleship/sushi-battleship-top.scad\nxvfb-run -a openscad -o build/sushi-battleship-bottom.stl designs/sushi-battleship/sushi-battleship-bottom.scad\nxvfb-run -a openscad -o build/sushi-battleship-door.stl   designs/sushi-battleship/sushi-battleship-door.scad\n</code></pre>\n<p>(or use <code>-D &#39;part=&quot;top&quot;&#39;</code> etc. on the main file). One sanity check\nbefore slicing: the top must export with <strong>18 CGAL volumes</strong> (outer\nspace + lid + 16 doors) — that&#39;s the proof that every door is a\nseparate, free body. Fewer volumes means doors fused in the render;\nre-render before slicing.</p>\n<h2>Assembly &amp; use</h2>\n<p>After printing the top: free each door with one firm push toward its\nengraved arrow, then punch each window&#39;s membrane out with a fingertip\nor knife — it&#39;s exactly one layer thick, about a minute for the whole\nboard. The lid drops into the tray&#39;s rebated rim; thumb notches on the\nleft and right expose the lid edge for lifting it back out.</p>\n<p>To play: load the cells (suggested 4×4 &quot;fleet&quot;: one 3-piece roll, two\n2-piece rolls, two single nigiri — coordinates are engraved in the cell\nfloors), drop the lid on, and call shots. On a hit, slide the shutter\ntoward the high row numbers until it stops on the end-stop ridge, then\nlift it straight out — the removed tile doubles as a hit marker. Doors\ndrop back in at the open position and slide forward to re-lock.</p>\n<p>If a fit is off, reprint only what&#39;s needed: the coupon (or a spare\ndoor via <code>sushi-battleship-door.scad</code>) with a new <code>door_fit</code> — the lid\nand tray never change.</p>\n<p><strong>Food contact:</strong> FDM prints are not dishwasher-safe or truly\nfood-safe. Serve pieces on nori or parchment squares or in silicone\ncups, or seal the tray with a food-safe epoxy if it will touch food\ndirectly.</p>\n<p>Design rationale, margin math, and the full per-decision engineering\nlog live in <a href=\"NOTES.md\">NOTES.md</a>.</p>\n"},{"name":"sushi-battleship-tracker","title":"Sushi Battleship — Shot Tracker","pitch":"The parent tracks hits structurally (an opened door is an eaten cell) but leaves <strong>misses</strong> to memory, and &quot;did we already call B3?&quot; is the real failure mode of a leisurely dinner game. The refit adds a shallow spherical <strong>miss-marker seat</strong> to the top face of every print-in-place shutter door: park any small round marker (dried soybean, 6 mm airsoft BB, peppercorn) on a called cell and nobody re-calls it. The product charter lives in PM.md beside this file.","archived":null,"parts":3,"coupon":true,"parents":["sushi-battleship"],"depth":1,"media":[{"file":"product-hero.png","src":"../../designs/sushi-battleship-tracker/previews/product-hero.png","label":"Product Hero","alt":"Product shot: sushi-battleship-tracker in satin crimson PLA","kind":"Studio render","ai":false,"motion":false},{"file":"lifestyle-product-hero.png","src":"../../designs/sushi-battleship-tracker/previews/lifestyle-product-hero.png","label":"Product Hero","alt":"AI-styled scene: sushi-battleship-tracker staged in a real-world setting","kind":"AI-styled scene","ai":true,"motion":false},{"file":"lifestyle-product-hero.gif","src":"../../designs/sushi-battleship-tracker/previews/lifestyle-product-hero.gif","label":"Product Hero","alt":"AI-styled scene: sushi-battleship-tracker in motion, staged in a real-world setting","kind":"AI motion clip","ai":true,"motion":true},{"file":"seat-detail.png","src":"../../designs/sushi-battleship-tracker/previews/seat-detail.png","label":"Seat Detail","alt":"Close-up: crimson shutter doors with the recessed miss-marker seats","kind":"Detail","ai":false,"motion":false},{"file":"assembly.png","src":"../../designs/sushi-battleship-tracker/previews/assembly.png","label":"Assembly","alt":"Assembled board, shutter D1 open","kind":"Detail","ai":false,"motion":false},{"file":"seat-closeup.png","src":"../../designs/sushi-battleship-tracker/previews/seat-closeup.png","label":"Seat Closeup","alt":"Marker seats on the A1/A2 doors","kind":"Detail","ai":false,"motion":false},{"file":"coupon.png","src":"../../designs/sushi-battleship-tracker/previews/coupon.png","label":"Coupon","alt":"Sushi Battleship — Shot Tracker — Coupon","kind":"Detail","ai":false,"motion":false},{"file":"contact-sheet.png","src":"../../designs/sushi-battleship-tracker/previews/contact-sheet.png","label":"Contact Sheet","alt":"4-view contact sheet","kind":"4-view contact sheet","ai":false,"motion":false}],"spin":null,"body":"<p>A shot-tracker refit of <a href=\"../sushi-battleship/\">Sushi Battleship</a>: the same\ntwo-part board for playing battleship with real sushi, with one addition —\nevery sliding shutter door now carries a shallow dished <strong>miss-marker seat</strong>.\nPark a small round marker (a dried soybean, a 6 mm BB, a peppercorn) on any\ncell that has been called, and nobody re-calls B3 three bites later. For\nanyone who printed (or wants) the original and plays it slowly enough to\nlose track of called shots — which is everyone eating dinner off it.</p>\n<p>This is a <strong>derivative</strong> of the archived\n<a href=\"../sushi-battleship/\">sushi-battleship</a> (frozen at v0.1): its entry <code>.scad</code>\nincludes the parent verbatim and redefines only the shutter door. Everything\nnot described here — the tray, the print-in-place shutter mechanism, the\nmembranes, the whole game — is documented once, on the\n<a href=\"../sushi-battleship/README.md\">parent&#39;s page</a>.</p>\n<h2>What you get</h2>\n<ul>\n<li><code>bottom</code> — the parent&#39;s tray, unchanged (≈ 254 × 254 × 44 mm; 4×4 cells\nfor cut sushi-roll pieces)</li>\n<li><code>top</code> — the print-in-place lid, all 16 shutters captive, each with a\nmarker seat (≈ 250 × 250 × 9 mm)</li>\n<li><code>door</code> — one spare/tuning shutter with the seat (≈ 48 × 50 mm)</li>\n<li><code>sushi-battleship-tracker-coupon</code> — single-cell &quot;print this first&quot; test\npiece for tuning <code>door_fit</code> and marker fit</li>\n</ul>\n<p>Markers are not printed parts: any roughly-spherical 4–10 mm household\nobject works — set <code>marker_d</code> to match yours (dried soybeans are on\ntheme).</p>\n<h2>The delta</h2>\n<p>The seat is a spherical dish (Ø ~5.3 mm opening, 1.0 mm deep at the\ndefaults) cut into each door&#39;s top face between the coordinate engraving\nand the push arrow. It adds zero height, changes no fit surface, and every\nlayer of the dish is wider than the one below it, so the print-in-place\nscheme is untouched. A <code>door_fit</code> value tuned on the parent&#39;s coupon\ncarries over as-is.</p>\n<h2>Print settings</h2>\n<p>Identical to the <a href=\"../sushi-battleship/README.md\">parent</a> — the refit moves\nno printable surface except the door&#39;s top face:</p>\n<ul>\n<li><strong>Material:</strong> PLA or PETG</li>\n<li><strong>Layer height:</strong> 0.2 mm (membranes are quantized to it — see the parent&#39;s notes)</li>\n<li><strong>Infill:</strong> 10–15 %</li>\n<li><strong>Supports:</strong> none needed (the seat dish is self-supporting)</li>\n<li><strong>Orientation:</strong> both parts flat as exported; the top prints with all\ndoors captive in place</li>\n<li><strong>Print first:</strong> the coupon — tune <code>door_fit</code> and drop your marker in the\nseat before committing to the full board</li>\n</ul>\n<h2>Parameters</h2>\n<p>The refit&#39;s own knobs, plus the one inherited parameter you are most likely\nto touch:</p>\n<table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Default</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>marker_d</code></td>\n<td>8 mm</td>\n<td>diameter of the marker the seat is dished for; asserted to the practical 4–10 mm range (peppercorn ~4–5, BB 6, soybean ~7–9)</td>\n</tr>\n<tr>\n<td><code>seat_depth</code></td>\n<td>1.0 mm</td>\n<td>how deep the seat is dished; coupled to <code>marker_d</code> by asserts — it must stay below the marker radius, leave ≥ 1.2 mm of door floor, and keep the seat rim ≥ 0.8 mm clear of the engravings</td>\n</tr>\n<tr>\n<td><code>door_fit</code></td>\n<td>0 mm</td>\n<td>inherited from the parent: door-only fit tuning in ±0.1 steps</td>\n</tr>\n</tbody></table>\n<p>Everything else — grid size, roll diameter, clearances — is the parent&#39;s\nparameter set, inherited unchanged; see the top of\n<a href=\"../sushi-battleship/sushi-battleship.scad\"><code>sushi-battleship.scad</code></a>.\nOverride on the command line with <code>-D &#39;marker_d=6&#39;</code>.</p>\n<h2>Assembly &amp; use</h2>\n<p>Play exactly as the parent describes. The one new rule: when a shot is\ncalled and misses, the <em>defender</em> parks a marker in the called door&#39;s seat.\nAn open door is a hit, a marked door is a spent miss, an unmarked closed\ndoor is fair game. The seat is identical on all 16 doors, so markers leak\nnothing about where the sushi fleet actually is.</p>\n"}];

const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const AI_STILL = "AI-generated impression for general illustration only — geometry is approximate and may not exactly match the printed part; see the studio render and the STL for the true shape.";
const AI_MOTION = "AI-generated motion impression for general illustration only — geometry is approximate, and the movement shown is illustrative, not a simulation; see the deterministic previews and the STL for the true shape.";

function tags(d) {
  const t = [];
  if (d.parts) t.push(`<span class="tag">${d.parts} parts</span>`);
  if (d.coupon) t.push(`<span class="tag">fit coupon</span>`);
  if (d.archived) t.push(`<span class="tag accent">Archived v0.1</span>`);
  return t.join("");
}

function gallery() {
  document.title = "print-bench — media rework preview";
  const cards = DESIGNS.map((d) => {
    const hero = d.media[0];
    const lin = d.depth ? `<span class="lin">↳ </span>` : "";
    const from = d.parents.length
      ? `<span class="from">derived from <span class="plink" data-goto="${esc(d.parents[0])}">${esc(d.parents[0])}</span></span>`
      : "";
    return `<a class="card" href="#/d/${d.name}" ${d.spin ? `data-spin="${esc(d.spin)}" data-hero="${esc(hero.src)}"` : ""}>
      <figure>
        <img src="${esc(hero.src)}" alt="${esc(hero.alt)}" loading="lazy">
        <span class="chip">${d.media.length} media</span>
        ${d.spin ? `<span class="chip spin" style="bottom:26px">turntable</span>` : ""}
      </figure>
      <div class="body">
        <h2>${lin}${esc(d.title)}</h2>
        <p class="pitch">${d.pitch}</p>
        ${from}
        <div class="meta">${tags(d)}</div>
      </div>
    </a>`;
  }).join("");
  app.innerHTML = `
    <header class="head">
      <p class="kicker">${DESIGNS.length} designs · every one gated in CI</p>
      <h1 class="display">Parametric designs, gated before they ship.</h1>
      <p class="intro">OpenSCAD models co-designed by humans and AI reviewers. Previews render from source; a printability gate — watertight, overhang-checked, test-sliced — passes before merge.</p>
      <hr class="hr">
    </header>
    <section class="grid">${cards}</section>`;
  for (const card of app.querySelectorAll(".card[data-spin]")) {
    const img = card.querySelector("figure img");
    card.addEventListener("mouseenter", () => { img.src = card.dataset.spin; });
    card.addEventListener("mouseleave", () => { img.src = card.dataset.hero; });
  }
  for (const p of app.querySelectorAll(".plink")) {
    p.addEventListener("click", (e) => {
      e.preventDefault();
      location.hash = `#/d/${p.dataset.goto}`;
    });
  }
  // fill the last grid row so leftover cells read as intentional structure
  const grid = app.querySelector(".grid");
  function fillGrid() {
    grid.querySelectorAll(".filler").forEach((f) => f.remove());
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
    const rem = DESIGNS.length % cols;
    if (rem) for (let i = 0; i < cols - rem; i++) grid.insertAdjacentHTML("beforeend", `<div class="filler"></div>`);
  }
  fillGrid();
  addEventListener("resize", fillGrid, { once: false });
}

function product(name) {
  const d = DESIGNS.find((x) => x.name === name);
  if (!d) { location.hash = "#/"; return; }
  document.title = `${d.title} — media rework preview`;
  const thumbs = d.media.map((m, i) => `
    <button class="thumb" data-i="${i}" aria-label="${esc(m.label)}">
      <img src="${esc(m.src)}" alt="" loading="lazy">
      <span><span class="tl">${esc(m.label)}</span><br>
        <span class="tk">${esc(m.kind)}${m.ai ? ` · <span class="aik">AI</span>` : ""}</span></span>
    </button>`).join("");
  app.innerHTML = `
    <p class="crumb"><a href="#/">← All designs</a></p>
    <header class="prod-head">
      <h1>${esc(d.title)}</h1>
      <p class="pitch">${d.pitch}</p>
      ${d.archived ? `<p class="banner">${esc(d.archived)}</p>` : ""}
    </header>
    <section class="stagewrap">
      <div class="stage">
        <div class="frame"><img id="stage-img" src="" alt=""></div>
        <div class="caption" id="stage-cap"></div>
      </div>
      <div class="rail" id="rail">${thumbs}</div>
    </section>
    <div class="facts">${tags(d)}
      <a class="tag" style="text-decoration:none" href="https://github.com/shaiss/print-bench/tree/main/designs/${d.name}" target="_blank" rel="noopener">source ↗</a>
    </div>
    <article class="readme">${d.body}</article>`;

  const stageImg = document.getElementById("stage-img");
  const cap = document.getElementById("stage-cap");
  const rail = document.getElementById("rail");
  let cur = -1;
  function show(i) {
    cur = (i + d.media.length) % d.media.length;
    const m = d.media[cur];
    stageImg.src = m.src;
    stageImg.alt = m.alt;
    cap.innerHTML = `
      <div class="row"><strong>${esc(m.label)}</strong>
        <span class="tag${m.ai ? " accent" : ""}">${esc(m.kind)}</span>
        <span class="alt">${cur + 1} / ${d.media.length}</span></div>
      <span class="alt">${esc(m.alt)}</span>
      ${m.ai ? `<p class="ai">${esc(m.motion ? AI_MOTION : AI_STILL)}</p>` : ""}`;
    rail.querySelectorAll(".thumb").forEach((b, j) => b.classList.toggle("sel", j === cur));
  }
  rail.addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (b) show(+b.dataset.i);
  });
  document.onkeydown = (e) => {
    if (e.key === "ArrowRight") show(cur + 1);
    if (e.key === "ArrowLeft") show(cur - 1);
  };
  show(0);
}

function route() {
  document.onkeydown = null;
  const m = /^#\/d\/([a-z0-9-]+)/.exec(location.hash);
  if (m) product(m[1]);
  else gallery();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
