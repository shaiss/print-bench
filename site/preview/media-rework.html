<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>print-bench — media rework preview</title>
<style>
  /* Modernist — from the "Product Page Media Rework" design export: flat and
     architectural, Archivo throughout, ink on a warm light ground, one red
     accent, zero radius, strong 2px rules, labels flush left. This preview
     commits to the system's light look. */
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url("../assets/fonts/archivo-latin.woff2") format("woff2");
  }
  :root {
    --bg: #f3f2f2;
    --surface: #fbfafa;
    --ink: #201e1d;
    --muted: #6b6663;
    --accent: #ec3013;
    --accent-deep: #a02008;
    --rule: #201e1d;
    --hair: #d8d4d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 "Archivo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:hover { color: var(--accent-deep); }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  ::selection { background: #ec301322; }
  img { display: block; max-width: 100%; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

  /* nav */
  .nav { border-bottom: 2px solid var(--rule); background: var(--bg); }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; text-decoration: none; }
  .brand .mark { width: 14px; height: 14px; background: var(--accent); }
  .previewtag {
    font: 600 11px/1 "Archivo"; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent-deep); border: 1px solid var(--accent); padding: 6px 8px;
  }

  /* gallery header */
  .head { padding: 48px 0 0; }
  .kicker { font: 700 12px/1 "Archivo"; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1.display { font-size: clamp(30px, 4.6vw, 52px); font-weight: 800; line-height: 1.05; letter-spacing: -0.015em; margin: 14px 0 16px; max-width: 18ch; }
  .intro { max-width: 52ch; color: var(--muted); }
  .head .hr { border: 0; border-top: 2px solid var(--rule); margin: 36px 0 0; }

  /* gallery grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2px; background: var(--rule); border: 2px solid var(--rule); border-top: 0; margin: 0 0 64px; }
  .card { background: var(--surface); display: flex; flex-direction: column; text-decoration: none; }
  .card figure { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #fff; border-bottom: 2px solid var(--rule); }
  .card figure img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.02); transition: filter .15s ease; }
  .card:hover figure img { filter: none; }
  .chip {
    position: absolute; right: 0; bottom: 0; background: var(--ink); color: var(--bg);
    font: 600 10px/1 "Archivo"; letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px;
  }
  .chip.spin { background: var(--accent); opacity: 0; transition: opacity .15s ease; }
  .card:hover .chip.spin { opacity: 1; }
  .card .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .card h2 .lin { color: var(--accent); }
  .card .pitch { color: var(--muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tag {
    font: 600 10px/1 "Archivo"; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 7px; border: 1px solid var(--ink); color: var(--ink); white-space: nowrap;
  }
  .tag.accent { border-color: var(--accent); color: var(--accent-deep); }
  .tag.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .from { font-size: 12px; color: var(--muted); }
  .from .plink { color: var(--accent-deep); text-decoration: underline; cursor: pointer; }
  .filler { background: var(--surface); position: relative; }
  .filler::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent 0 10px, #d8d4d1 10px 12px);
  }

  /* product page */
  .crumb { padding: 20px 0 0; font: 600 12px/1 "Archivo"; letter-spacing: .1em; text-transform: uppercase; }
  .crumb a { text-decoration: none; color: var(--muted); }
  .crumb a:hover { color: var(--accent-deep); }
  .prod-head { padding: 18px 0 22px; border-bottom: 2px solid var(--rule); }
  .prod-head h1 { font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: -0.015em; }
  .prod-head .pitch { max-width: 62ch; color: var(--muted); margin-top: 8px; }
  .banner {
    margin-top: 14px; border: 2px solid var(--accent); color: var(--accent-deep);
    padding: 10px 12px; font-size: 13px; font-weight: 600; max-width: 72ch;
  }

  .stagewrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 0; border: 2px solid var(--rule); border-top: 0; background: var(--surface); }
  .stage { border-right: 2px solid var(--rule); min-width: 0; }
  .stage .frame { background: #fff; display: grid; place-items: center; height: min(58vh, 560px); overflow: hidden; }
  .stage .frame img { max-width: 100%; max-height: min(58vh, 560px); object-fit: contain; }
  .stage .caption { border-top: 2px solid var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .caption .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .caption .row strong { font-size: 14px; letter-spacing: .01em; }
  .caption .alt { font-size: 13px; color: var(--muted); }
  .caption .ai {
    border-left: 3px solid var(--accent); padding: 6px 0 6px 10px;
    font-size: 12.5px; font-style: italic; color: var(--accent-deep); max-width: 80ch;
  }
  .rail { display: flex; flex-direction: column; overflow-y: auto; max-height: calc(min(58vh, 560px) + 120px); }
  .thumb {
    display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center;
    padding: 8px 10px; border: 0; border-bottom: 1px solid var(--hair); background: var(--surface);
    text-align: left; cursor: pointer; font: inherit; color: inherit;
  }
  .thumb:last-child { border-bottom: 0; }
  .thumb img { width: 76px; height: 57px; object-fit: cover; background: #fff; border: 1px solid var(--hair); filter: grayscale(1); }
  .thumb.sel { background: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  .thumb.sel img, .thumb:hover img { filter: none; }
  .thumb .tl { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .thumb .tk { font: 600 9.5px/1.4 "Archivo"; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .thumb .tk .aik { color: var(--accent-deep); }

  .facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 0 0; }

  .readme { max-width: 76ch; padding: 8px 0 72px; }
  .readme h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; border-top: 2px solid var(--rule); padding-top: 14px; margin: 34px 0 10px; }
  .readme h3 { font-size: 16px; font-weight: 700; margin: 22px 0 8px; }
  .readme p, .readme ul, .readme ol { margin: 10px 0; }
  .readme ul, .readme ol { padding-left: 22px; }
  .readme li { margin: 4px 0; }
  .readme code { font: 500 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace; background: #e9e6e4; padding: 1px 5px; }
  .readme pre { background: #e9e6e4; padding: 12px; overflow-x: auto; margin: 12px 0; }
  .readme pre code { background: none; padding: 0; }
  .readme table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .readme th { text-align: left; font: 700 11px/1.4 "Archivo"; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--rule); padding: 8px 10px 6px 0; }
  .readme td { border-bottom: 1px solid var(--hair); padding: 8px 10px 8px 0; vertical-align: top; }
  .readme blockquote { border-left: 3px solid var(--ink); padding-left: 12px; color: var(--muted); margin: 12px 0; }
  .readme img { border: 2px solid var(--rule); margin: 12px 0; }
  .readme a { color: var(--accent-deep); }

  footer { border-top: 2px solid var(--rule); }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 16px; padding-bottom: 24px; font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    .stagewrap { grid-template-columns: 1fr; }
    .stage { border-right: 0; }
    .rail { flex-direction: row; overflow-x: auto; max-height: none; border-top: 2px solid var(--rule); }
    .thumb { grid-template-columns: 64px; grid-template-rows: auto auto; border-bottom: 0; border-right: 1px solid var(--hair); min-width: 120px; }
    .thumb img { width: 64px; height: 48px; }
    .thumb.sel { box-shadow: inset 0 3px 0 var(--accent); }
  }
</style>
