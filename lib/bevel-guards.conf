# Negative tests for bevel.scad's guards — each line is a parameter set the
# library must REFUSE. Run by scripts/guard-check.sh (via check.sh); format and
# the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>
#
# Every guard here fires BEFORE BOSL2's bevel_gear()/spur_gear() is called.
# That ordering is the point of most of them: BOSL2 either aborts with a
# message naming its own argument (shaft_angle, teeth) or — for a face width
# wider than the cone — builds garbage silently, a watertight gear with its
# small end turned inside out.

# The shaft angle bounds, both ends. BOSL2 has the same bound with nearly the
# same words; the "bevel:" prefix proves it was THIS guard.
shaft-angle-zero | bevel: shaft_angle 0 is outside (0, 180) | bevel_gear_fdm(15, 26, 1.5, shaft_angle = 0);
shaft-angle-180  | bevel: shaft_angle 180 is outside (0, 180) | bevel_pair(15, 26, 1.5, shaft_angle = 180);

# The printable tooth-count floor (bevel_min_teeth = 8), on the gear itself
# and on the mate — the mate's count sets this gear's cone angle, so a bad
# mate count is a bad gear.
few-teeth      | bevel: 6 teeth is below the printable minimum | bevel_gear_fdm(6, 26, 1.5);
mate-few-teeth | bevel: mate has 5 teeth, below the printable minimum | bevel_gear_fdm(15, 5, 1.5);

# The module floor (bevel_min_mod = 0.8: the small-end tooth at 0.8 mm).
small-mod | bevel: module 0.5 is below the printable minimum | bevel_gear_fdm(15, 26, 0.5);

# A negative tol would put the mates INTO each other and still export a
# watertight pair.
neg-tol | bevel: tol must not be negative | bevel_pair(15, 26, 1.5, tol = -0.1);

# Face width: zero/negative, and wider than half the cone distance. At
# 15:26 mod 1.5 the cone distance is 22.5, so the bound is 11.25; BOSL2 would
# accept 12 (its inner cone is still 10.5) and draw a tooth scaled to 47%.
face-zero     | bevel: face width must be positive | bevel_gear_fdm(15, 26, 1.5, face = 0);
face-too-wide | exceeds what the cone allows | bevel_gear_fdm(15, 26, 1.5, face = 12);

# An obtuse shaft angle at a ratio that pushes the crown's cone angle past
# 90: the crown would need internal teeth. Refused rather than drawn.
internal-teeth | would need internal teeth | bevel_pair(15, 35, 2, shaft_angle = 135);

# An acute shaft angle where BOTH cone angles fall below 45 (60 deg, 1:1 —
# 30 and 30): both gears would carry the under-tooth fill and the two fills
# overlap on the far side of the shared back cone. Measured 16.06 mm3 of
# fill-on-fill at 15:26 when the fill still applied to every gear.
fills-collide | under-tooth fills of the two gears would collide | bevel_pair(20, 20, 1, shaft_angle = 60);

# The back face has to clear the large-end root ring by the minimum wall.
# At 15:26 mod 1.5 the ring sits 1.01 below the pitch base, so back = 1 is
# INSIDE the teeth; BOSL2 would assert on its own `bottom` with a number the
# caller never typed.
thin-back | bevel: back 1 is too thin | bevel_gear_fdm(15, 26, 1.5, back = 1);

# A bore that eats the hub: at the small end of this pinion the root ring is
# at r = 6.33, so a 14 mm shaft leaves negative wall.
bore-too-big | leaves a hub wall of | bevel_gear_fdm(15, 26, 1.5, bore = 14);

# A D-flat must lie between bore/2 and bore, or the "flat" removes the whole
# hole side or nothing at all.
bad-flat | must be 0 or between bore/2 and bore | bevel_gear_fdm(15, 26, 1.5, bore = 4, flat = 1);

# Selector typos must not silently emit both gears (or neither).
bad-which  | bevel: which must be | bevel_pair(15, 26, 1.5, which = "wheel");
bad-anchor | bevel: anchor must be | bevel_gear_fdm(15, 26, 1.5, anchor = "top");

# The spur pair carries the same guards under its own prefix.
spur-few-teeth    | spur: 5 teeth is below the printable minimum | spur_pair(5, 30, 1, 5);
spur-small-mod    | spur: module 0.5 is below the printable minimum | spur_pair(12, 30, 0.5, 5);
spur-neg-tol      | spur: tol must not be negative | spur_gear_fdm(12, 30, 1, 5, tol = -1);
spur-zero-th      | spur: thickness must be positive | spur_gear_fdm(12, 30, 1, 0);
spur-bore-too-big | spur: bore 10 leaves a hub wall | spur_gear_fdm(12, 30, 1, 5, bore = 10);
