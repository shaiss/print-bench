# Negative tests for compliant.scad's guards — each line is a parameter set
# the library must REFUSE. Run by scripts/guard-check.sh (via check.sh);
# format and the reason this file exists are documented there.
#
# The guards are the asserts the harvest-site designs already enforce (each
# cited file:line at the guard in compliant.scad), plus the few the library
# adds where an API surface opens a hole the inline copies never had. Every
# case below is arithmetic-checked so the FIRST failing assert is the one
# named (the arch's guard order: t floor, rise > 0, rise/t, span/rise, ns,
# ov, then the root fillet).
#
#   <case name> | <expected message substring> | <statement>

# --- bistable_arch_2d / bistable_arch ---------------------------------------

# t = 0.6 is under the two-perimeter floor bistable-toggle and czs-slider
# hold their arches to (0.8) — the band would print as one extrusion.
arch-thin | under the two-perimeter floor | bistable_arch_2d(60, 2.0, 0.6);

# rise/t = 1.5/0.82 = 1.83 — the exact ratio compliant-gripper's world-x
# drift built before its fix: monostable, it just springs back.
arch-too-flat | arch too flat to be bistable | bistable_arch_2d(60, 1.5, 0.82);

# The 2.3 bar implies rise > 0 — until allow_monostable switches the bar
# off for a coupon. A negative rise then needs its own refusal: mirror the
# arch instead (the root-fillet placement assumes a band rising away from
# its clamps, and would leave the underside pieces standing off the band).
arch-rise-negative | arch rise must be positive | bistable_arch_2d(60, -2.0, 0.82, allow_monostable = true);

# span/rise = 18/2.02 = 8.9: too steep for the shallow fixed-fixed constants
# (rise/t = 2.46 keeps the bistability bar passing).
arch-not-shallow | arch not shallow enough for the fixed-fixed constants | bistable_arch_2d(18, 2.02, 0.82);

# An odd sample count misses the apex: the BUILT rise is lower than the rise
# the bistability bar judged — the compliant-gripper failure class.
arch-ns-odd | must be even and >= 16 | bistable_arch_2d(82, 2.02, 0.82, ns = 61);

# 8 samples sag the polygonal centreline ~4% of the rise below the cosine.
arch-ns-coarse | must be even and >= 16 | bistable_arch_2d(82, 2.02, 0.82, ns = 8);

# A negative overlap builds negative-size squares: an empty clamp burial,
# silently, where the caller asked for one.
arch-ov-negative | clamp overlap ov must not be negative | bistable_arch_2d(82, 2.02, 0.82, ov = -1);

# Issue #202's named refusal: a ZERO root fillet is a sharp root, the crack
# starter the whole rule exists for.
arch-zero-fillet | root fillet must be positive | bistable_arch_2d(82, 2.02, 0.82, root_fillet = 0);

# 0.3 < 0.5*t = 0.41 — under the docs/advanced-techniques.md fatigue rule.
arch-thin-fillet | below 0.5*t | bistable_arch_2d(82, 2.02, 0.82, root_fillet = 0.3);

# r = 15 on a 30 mm span: the two roots' fillets meet and no free arch is
# left between them (let-folding-panel's L > 2r rule; span/rise = 14.9 and
# r >= 0.5t keep the earlier guards passing).
arch-fillet-eats-span | leaves no free arch between the roots | bistable_arch_2d(30, 2.02, 0.82, root_fillet = 15);

# A zero width extrudes nothing — a part with the arch silently missing.
arch-zero-width | arch width must be positive | bistable_arch(82, 2.02, 0.82, 0);

# A zero modulus echoes a zero switch force as if it were a prediction.
arch-bad-modulus | arch modulus E must be positive | bistable_arch(82, 2.02, 0.82, 6, E = 0);

# --- the functions -----------------------------------------------------------

# compliant-gripper's last WORLD sample (x_arch0 + span = 130) fed to a
# local-x centreline on a 120 mm span — the drift compliant-gripper.scad:
# 351-355 records. The generator modules own their sampling; this is the
# one public entry that takes an x, so it refuses one off the span.
centreline-world-x | outside the arch's local span | echo(bistable_arch_y(130, 120, 3.8));

# A zero span passes the domain check above vacuously at x = 0 (both bounds
# are 0) and evaluates cos(0/0): bistable_arch_y returned nan as if it were a
# height. The functions' sign checks below are the module guards' rise > 0
# (and span/rise >= 10, which implies span > 0) restated for a design that
# calls a function directly, where no module guard runs.
centreline-zero-span | bistable_arch_y: arch span must be positive | echo(bistable_arch_y(0, 0, 2.02));

# A negative span: without the sign check first, the domain check names it
# as an x off the span ("[0, -82]") — the wrong diagnosis.
centreline-negative-span | bistable_arch_y: arch span must be positive | echo(bistable_arch_y(0, -82, 2.02));

# A negative rise is a downward bow: mirror the arch instead, as the module
# guard says.
centreline-negative-rise | bistable_arch_y: arch rise must be positive | echo(bistable_arch_y(41, 82, -2.02));

# span = 0 divides by zero: the predicted force came back inf.
fs-zero-span | bistable_arch_fs: arch span must be positive | echo(bistable_arch_fs(0, 2.02, 0.82, 6));

# A negative rise predicts a negative switch force (-3.0 N) as if it were one.
fs-negative-rise | bistable_arch_fs: arch rise must be positive | echo(bistable_arch_fs(82, -2.02, 0.82, 6));

# A negative rise predicts a negative travel.
travel-negative-rise | bistable_arch_travel: arch rise must be positive | echo(bistable_arch_travel(-2.02));

# A zero target travel solves to a zero rise — a flat band, refused only
# later and under an unrelated guard's name.
rise-for-zero-travel | bistable_arch_rise_for: target travel must be positive | echo(bistable_arch_rise_for(0));

# A zero (or negative) target force makes the inverse solve divide by zero
# or take the cube root of a negative: a nan span that then trips an
# unrelated guard with a misleading message.
span-for-zero-force | target switch force must be positive | echo(bistable_arch_span_for(0, 2.02, 0.82, 6));

# A negative rise takes the cube root of a negative: the solve came back nan.
span-for-negative-rise | bistable_arch_span_for: arch rise must be positive | echo(bistable_arch_span_for(3, -2.02, 0.82, 6));

# --- root_fillet_2d / rooted_2d ----------------------------------------------

# The zero refusal again, on the standalone corner piece.
fillet-zero | root fillet must be positive | root_fillet_2d(0, 1.0);

# snap-cantilever-clip's own numbers with the fillet cut to 0.4 < 0.5*t = 0.5.
fillet-thin | below 0.5*t | root_fillet_2d(0.4, 1.0);

# Without t > 0 the 0.5*t rule passes vacuously (any r >= 0.5*0).
fillet-no-thickness | flexure thickness t must be positive | root_fillet_2d(0.6, 0);

# A negative bite pulls the square off both walls: the piece stands off them
# by a gap and never welds — the tangent-point failure the corner piece
# exists to avoid (snap-cantilever-clip's iteration-1 naked edges).
fillet-negative-bite | bite must not be negative | root_fillet_2d(0.6, 1.0, bite = -0.1);

# The closing form, zero radius: offset(0) offset(0) — no fillet at all.
rooted-zero | root fillet must be positive | rooted_2d(0, 1.2) square(5);

# let-folding-panel's own rule on the closing form: 0.5 < 0.5*t = 0.6.
rooted-thin | below 0.5*t | rooted_2d(0.5, 1.2) square(5);
