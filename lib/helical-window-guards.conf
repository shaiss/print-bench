# Negative tests for helical-window.scad's guards — each line is a parameter
# set the library must REFUSE. Run by scripts/guard-check.sh (via check.sh);
# format and the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>
#
# The measurements below are body counts on exported STLs (a plain d 30
# wall 2 shell minus the window, guard-stripped scratch copy of the module,
# counted with `python3 -m printcheck.fusecheck`), taken at pitch 8,
# sweep 450 unless a case says otherwise:
#
#   width 4    starts 1  ->  1 body, renders clean        (the brand numbers)
#   width 7.9  starts 1  ->  1 body, renders clean        (tenth inside bound)
#   width 8.0  starts 1  ->  CGAL "mesh is not closed", garbage STL, exit 0
#   width 8.5  starts 2  ->  2 bodies, renders clean      (the severed shell)
#   width 3    starts 2  ->  1 body                       (demo case 3)
#   sweep 270  width 20  pitch 4      starts 1  ->  1 body (cannot encircle)
#   sweep 270  width 8.5 pitch 8      starts 2  ->  2 bodies (partial tiling)
#
# The one-sided body counts a render can reach are here so the next session
# inherits them; the two-sided exactly-N assert (#612, PR #618) is the gate
# form of the same measurement and should adopt this demo when it lands.

# THE boundary, refusing half. width == pitch is where the land is exactly
# zero: the passes' faces coincide, CGAL dies on the self-intersection, and
# the export is garbage at exit 0 (see the table above). Its accepting half
# is case 5 in lib/helical-window-demo.scad, which renders width 7.9 at this
# same pitch — neither half means much alone; together they say the bound is
# exact, not approximately right.
severed-at-boundary | severs the shell | helical_window(8, 450, 8, 1, 30, 2);

# Comfortably past the bound from a multi-start parameter set, proving the
# bound does not move with starts: adjacent passes sit pitch apart at every
# starts (starts are rotations of one helix, lead = pitch*starts), so the
# same inequality refuses this too. Measured on this shape's wider cousin:
# 2 bodies where the kernel survives.
severed-multi-start | severs the shell | helical_window(8, 450, 8.5, 2, 30, 2);

# The domain restriction that keeps the sever bound exact: below one full
# turn the analysis has no closed answer (a single start cannot encircle —
# measured, one body even at width 20 — but a multi-start set tiles the
# circle from partial windows: measured, two bodies at sweep 270/starts 2).
# Refusing the regime is the honest move; the message says so.
partial-sweep | at least one full turn | helical_window(8, 270, 4, 1, 30, 2);

# `seg` samples the helix as a polygon, so the cut edge falls inside the
# helix it should trace. Bounded as a chord tolerance, not a segment count,
# exactly as threads-fdm bounds the same failure (issue #58); the expected
# substring is the ADVICE, which ties the ceil/acos derivation in the message
# to the edge the condition fires on — refusing seg 8 while advising 28
# would fail here.
coarse-seg | Raise seg to at least 28 | helical_window(8, 450, 4, 1, 30, 2, seg = 8);

# The same bound is radius-dependent, which a fixed seg floor would miss:
# seg = 40 is comfortable at d 30 (0.046 mm) and refused at d 120 (0.185 mm).
coarse-seg-large-d | Raise seg to at least 55 | helical_window(8, 450, 4, 1, 120, 2, seg = 40);

# A fractional `starts` scales lead continuously while the [0:starts-1]
# sweep rounds down — one rib against a lead that says two.
fractional-starts | whole number | helical_window(8, 450, 4, 1.5, 30, 2);

zero-width | width must be positive | helical_window(8, 450, 0, 1, 30, 2);
