# Positive tests for bevel.scad: pairs that must ASSEMBLE, plus the controls
# that prove the measurement can fail. Run by scripts/mate-check.sh (via
# check.sh); the format and the reason this file exists are documented there.
#
#   <case name> | empty|interfering | <statement producing the interference>
#
# Each statement is the library's own interference solid — the intersection
# of the two placed gears, bevel_pair_interference() / spur_pair_interference()
# — at the declared clearance and a stated phase. If the pair meshes, that
# intersection is empty and OpenSCAD writes no facets at all.
#
# WHY THREE PHASES. The phase convention (bevel.scad header) claims the pair
# stays meshed for EVERY pinion rotation with the crown at
# bevel_mate_phase(n1, n2, phase). One phase proves one pose; a pose where
# tooth 0 is centred on the contact line is the most symmetric one and could
# pass while the flanks bind a third of a pitch later. So the reference pair
# is measured at 0, 1/3 and 2/3 of a tooth pitch (24 deg at 15 teeth), which
# between them exercise both flanks of the meshing teeth. A design's
# ci.fitchecks can sweep finer.
#
# WHAT THE NEGATIVE CONTROLS ARE. tol = 0 AND the crown spun half a tooth
# past its meshed phase — tooth on tooth. Unlike threads-fdm's control this
# is not "the same pair at zero clearance": at tol = 0 a correctly phased
# BOSL2 pair touches on coincident flank facets, and whether CGAL reports
# that as zero facets or a zero-volume shell is a tessellation accident, not
# a fit. Tooth on tooth is unconditional: measured 59.9 mm3 (bevel) and
# 17.6 mm3 (spur).
#
# THE FILL LESSON, recorded so it is not re-learned. The first cut of the
# under-tooth fill applied to both gears, and the reference pair measured
# 16.06 mm3 of interference with the teeth themselves perfectly clear (the
# same pair with the fill stripped rendered empty). Every vertex of that
# solid lay on one of the two fills' outer cylinders: the two hubs each
# claimed the far side of the shared back-cone line around the contact
# point, which no fill radius can avoid — the contact point itself is inside
# both cylinders. Hence the rule that only a gear whose cone angle is below
# 45 degrees carries the fill (its tooth ends are the unprintable overhang;
# the other gear's are not), and the guard refusing a pair where both are.

# ---------------------------------------------------------------------------
# The reference pair goes together (15:26 at mod 1.5, tol = bevel_tol)
# ---------------------------------------------------------------------------

pair-phase-0          | empty | bevel_pair_interference(15, 26, 1.5);
pair-phase-third      | empty | bevel_pair_interference(15, 26, 1.5, phase = 8);
pair-phase-two-thirds | empty | bevel_pair_interference(15, 26, 1.5, phase = 16);

# Other shapes of the same contract: the smallest legal pinion (8 teeth,
# cone angle 17 deg — the deepest fill), a 1:1 pair at exactly 45/45 where
# NEITHER gear carries a fill, and a 110 deg shaft angle (12:20 — cone
# angles 35 and 75).
pair-smallest-pinion | empty | bevel_pair_interference(8, 26, 1.5);
pair-equal-no-fill   | empty | bevel_pair_interference(20, 20, 1, phase = 7);
pair-obtuse-shaft    | empty | bevel_pair_interference(12, 20, 1, shaft_angle = 110, phase = 30);

# ---------------------------------------------------------------------------
# The control: the check can fail
# ---------------------------------------------------------------------------

pair-tooth-on-tooth | interfering | bevel_pair_interference(15, 26, 1.5, tol = 0, crown_phase = bevel_mate_phase(15, 26, 0) + 180 / 26);

# ---------------------------------------------------------------------------
# The spur pair, same discipline (12:30 at mod 1, 5 thick)
# ---------------------------------------------------------------------------

spur-phase-0        | empty | spur_pair_interference(12, 30, 1, 5);
spur-phase-11       | empty | spur_pair_interference(12, 30, 1, 5, phase = 11);
spur-tooth-on-tooth | interfering | spur_pair_interference(12, 30, 1, 5, tol = 0, wheel_phase = spur_mate_phase(12, 30, 0) + 180 / 30);
