# Positive tests for printability.scad's teardrop_hole(): pairs that must
# ASSEMBLE, and one that must not. Run by scripts/mate-check.sh (via
# check.sh); the format and the reason this file exists are documented there.
#
# teardrop_hole() is a cutter, so its "mate" is a gauge PLUG: the teardrop
# profile written out independently here (circle + 45-degree hat, hand-rolled
# from the docstring's contract, NOT a call into the module under test),
# shrunk by offset(-clear) for a uniform clearance, and rotated to the
# DOCUMENTED orientation (axis along Y, point +Z). The interference solid is
# that plug intersected with a plate carrying the real teardrop_hole() cut.
#
# This is the manifest issue #398 demanded. The module shipped for years with
# its extrusion rotation sign flipped — point -Z, a round roof where the
# docstring promised the teardrop point — and nothing caught it, because
# every caller that built mating geometry flipped with it (which is exactly
# why pip_hinge's pin and bore stayed consistent with each other). A gauge
# authored OUTSIDE the module is the only witness that can see the absolute
# orientation: under the old rotate([-90,0,0]) the point-up plug's hat lands
# in plate material above the bore's plain circle top, and the empty cases
# below measure a chunky overlap instead of a fit.
#
# <case name> | empty|interfering | <statement producing the interference>

# The point-up gauge at the issue's own minimal case: 12x14x12 plate, d=6
# bore, 0.2 mm uniform clearance. Passes only when the built hole's point
# faces +Z as documented.
point-up-fit | empty | intersection() { difference() { translate([-6,-7,-6]) cube([12,14,12]); teardrop_hole(d=6, l=16); } rotate([90,0,0]) linear_extrude(16, center=true) offset(-0.2) { circle(d=6); intersection() { rotate(45) square(6*0.72, center=false); circle(d=6*1.6); } } }

# A different size entirely — d=3.2, 0.15 clearance, plate sized to it — so
# the orientation is not proven only at the one diameter the issue measured.
point-up-fine | empty | intersection() { difference() { translate([-3.2,-4,-3.2]) cube([6.4,8,6.4]); teardrop_hole(d=3.2, l=10); } rotate([90,0,0]) linear_extrude(10, center=true) offset(-0.15) { circle(d=3.2); intersection() { rotate(45) square(3.2*0.72, center=false); circle(d=3.2*1.6); } } }

# THE NEGATIVE CONTROL — the bug itself as a fixture: the same gauge plug
# rotated to the WRONG orientation (point -Z, the rotate([-90,0,0]) the
# module carried through issue #398). In a correctly-built plate the hat
# swings below the axis into solid material, so this must interfere. If it
# ever reports 0 facets, either the harness has stopped measuring or the
# module's point has flipped back down — both are findings.
point-down-plug | interfering | intersection() { difference() { translate([-6,-7,-6]) cube([12,14,12]); teardrop_hole(d=6, l=16); } rotate([-90,0,0]) linear_extrude(16, center=true) offset(-0.2) { circle(d=6); intersection() { rotate(45) square(6*0.72, center=false); circle(d=6*1.6); } } }
