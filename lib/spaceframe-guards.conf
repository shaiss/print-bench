# Negative tests for spaceframe.scad's guards — each line is a parameter set
# the library must REFUSE. Run by scripts/guard-check.sh (via check.sh); format
# and the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>

# The named-topology contract: an unknown name aborts the render, never
# falls back silently to a default truss.
unknown-topology | unknown topology | space_frame(160, 48, 22, 8, topology = "howe");

# The slenderness token is a MULTIPLE of the 0.8 mm printable floor; under 1
# puts every strut below the thin-feature minimum while the model still
# renders, slices and passes a geometry gate — it is simply too spindly to
# survive handling. Fires inside strut_section().
thin-strut | below the printable minimum | space_frame(160, 48, 22, 8, strut_floor_mult = 0.5);

# The degenerate tapers the issue names: zero and negative end depth. A
# zero-depth needle is a blade edge the taper would carry out to the tip.
zero-taper | degenerate taper | space_frame(160, 48, 22, 8, end_depth = 0);
negative-taper | degenerate taper | space_frame(160, 48, 22, 8, end_depth = -3);

# The measured lie: with strut_floor_mult 3.5 the section is 2.8 mm, so an
# end_depth of 2 claims a needle the members themselves are too fat to
# realise — the exported tip would measure ~2.8 whatever the parameter said.
needle-thinner-than-struts | thinner than the strut section | space_frame(160, 48, 22, 8, end_depth = 2);

# The X-bracing domain guard (amendments 3+4 on the issue thread): warren and
# pratt face diagonals already pass through the panel centres an X would
# brace. Without the guard a caller gets a silently doubled-up braced frame,
# because the congested geometry still exports clean — the ground is the
# joint system (capsules must meet at shared node spheres), not mesh salvage.
x-on-warren | x_depth > 0 needs topology | space_frame(160, 48, 22, 8, topology = "warren", x_depth = 0.5);
x-on-pratt | x_depth > 0 needs topology | space_frame(160, 48, 22, 8, topology = "pratt", x_depth = 0.5);

# x_depth is a fraction of panel height; outside (0, 1] the attachments fall
# outside the panel the X is bracing.
x-over-range | x_depth must be within | space_frame(160, 48, 22, 8, topology = "vierendeel", x_depth = 1.2);
x-negative | x_depth must be within | space_frame(160, 48, 22, 8, topology = "vierendeel", x_depth = -0.1);

# The part selector: an unknown name must abort, never silently render an
# empty model — the same shape of hole as a derivative override that binds
# nothing, except here it is one assert away from being impossible.
unknown-part | unknown part | space_frame(160, 48, 22, 8, part = "chords");

# An inverted taper (midspan shallower than the ends) inverts what the
# parameter names promise; the lens shape it would build is not this
# library's taper.
inverted-taper | depth must be >= end_depth | space_frame(160, 48, 4, 8, end_depth = 12);

# Fractional bays put panel points between panel points.
fractional-bays | bays must be a whole number | space_frame(160, 48, 22, 2.5);

# Zero width collapses the cross-section to a plane.
nonpositive-width | and depth must be positive | space_frame(160, 0, 22, 8);
