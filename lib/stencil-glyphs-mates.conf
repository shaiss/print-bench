# Positive tests for stencil-glyphs.scad: the counter TETHERS are there, and
# the probe that says so is measuring them. Run by scripts/mate-check.sh (via
# check.sh, on every PR); the format and the reason the harness exists are
# documented there.
#
# WHAT THIS PINS, AND WHAT IT DOES NOT
# A stencil digit cut through a shell leaves each counter (the hole in 0, 4,
# 6, 8, 9) as an island held only by its two bridge tethers — the strokes of
# shell the bridge bars leave standing on either side of the counter.
# check.sh CGAL-renders the library demo but fails it only on ERROR/WARNING,
# never on its body count, so a regression that removed or misplaced the bars
# would render clean while every counter came loose. Each case here puts a
# small probe box exactly where one tether must stand, on the demo's own
# numbers (h = 14, bridge = 1.2, stroke 0.22*h = 3.08, a 2.2 mm plate), and
# intersects it with the cut plate:
#
#   * `interfering` (facets > 0) is the TETHER-PRESENT case: the "interference"
#     the harness measures is shell material standing where the bar leaves it.
#   * `empty` (0 facets) is the CONTROL: the same probe against the same plate
#     with bridged = false, where the stroke is unbroken and the probe sits in
#     the void. It proves the probe measures the tether and not the plate
#     around it — move the probe off the stroke band and the control fails.
#
# Both directions are load-bearing here as everywhere, with the roles read the
# other way round from a thread fit: `interfering` is the invariant, `empty`
# the control. This pins the tether GEOMETRY of the library's glyphs. The
# exact-N body count of a real part is enforced where it matters, on the
# consumer's SLICED STL, by the two-sided ci.fusecheck bound of #612 part 2
# (`assert <stl> =N`; designs/ovodyo carries `=1` per half), and the demo
# plate's own body count (1 bridged, > 1 with -D demo_bridged=false) is
# asserted by tools/printcheck/tests/test_stencil_demo.py.
#
# Probe positions (unit space: cap height 1, x from the glyph's left edge, y
# from its base; stencil_digit centres the box on the origin and scales by
# h = 14). The stroke is 0.22, so a bowl's left side is x in [0, 0.22]. The
# bar is 1.2/14 = 0.086 tall about the counter's centre line: for the "0" at
# y = 0.5, so the tether is x in [0, 0.22] x y in [0.457, 0.543] — in mm,
# x in [-4.9, -1.82], y in [-0.6, 0.6]; the probe is 2.3 x 0.8 inside that
# with >= 0.2 mm margin on every side and 2.4 tall through the 2.2 plate.
#
# <case name> | empty|interfering | <statement producing the interference>

# The "0": one counter, bar through the vertical centre, its left tether.
tether-present | interfering | intersection() { linear_extrude(2.2) difference() { square([20, 22], center = true); stencil_digit(0, 14, bridge = 1.2); } translate([-4.5, -0.4, -0.1]) cube([2.3, 0.8, 2.4]); }

# THE CONTROL. Same plate, same probe, bridged = false: the "0" is an unbroken
# ring, the probe is wholly in the cut, the intersection must be empty. If this
# ever reports facets the probe is touching plate that is not a tether, and
# the case above proves nothing.
tether-absent-control | empty | intersection() { linear_extrude(2.2) difference() { square([20, 22], center = true); stencil_digit(0, 14, bridge = 1.2, bridged = false); } translate([-4.5, -0.4, -0.1]) cube([2.3, 0.8, 2.4]); }

# The "8": two counters whose bar heights are DERIVED from the waist line
# (_sg_ym = 0.52) rather than literal, so a drift in that arithmetic moves a
# tether out from under this probe while the "0" above still passes. Top
# counter's left tether: bar at y = (ym - s/2 + 1)/2 = 0.705, i.e. 2.87 mm
# above centre, gap y in [2.27, 3.47]; the top bowl's corner arcs meet exactly
# there, so at the probe's +-0.35 the stroke band is x in [0.015, 3.14] from
# the left edge — the 2.1-wide probe sits inside it with >= 0.45 mm margin.
tether-present-8 | interfering | intersection() { linear_extrude(2.2) difference() { square([20, 22], center = true); stencil_digit(8, 14, bridge = 1.2); } translate([-4.4, 2.52, -0.1]) cube([2.1, 0.7, 2.4]); }
tether-absent-control-8 | empty | intersection() { linear_extrude(2.2) difference() { square([20, 22], center = true); stencil_digit(8, 14, bridge = 1.2, bridged = false); } translate([-4.4, 2.52, -0.1]) cube([2.1, 0.7, 2.4]); }
