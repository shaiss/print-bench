# Negative tests for stencil-glyphs.scad's guards — each line is a parameter
# set the library must REFUSE. Run by scripts/guard-check.sh (via check.sh);
# format and the reason this file exists are documented there.
#
#   <case name> | <expected message substring> | <statement>

# --- cap height -----------------------------------------------------------
# A zero or negative cap height scales every stroke to nothing (or inside
# out); with no guard the render exports an empty, "clean" mesh.
h-zero | cap height h must be positive | stencil_digit(8, 0);
h-negative | cap height h must be positive | stencil_digit(8, -14);
colon-h-zero | cap height h must be positive | stencil_colon(0);

# --- stroke -----------------------------------------------------------------
# Two 0.4 mm extrusion widths is the floor for a stroke that must print as a
# slot wall or a raised bar. The default stroke is 0.22*h, so a small h
# reaches the floor on its own: h = 3 gives 0.66.
stroke-default-too-thin-at-small-h | stroke must be at least 0.8 | stencil_digit(8, 3);
stroke-explicit-too-thin | stroke must be at least 0.8 | stencil_digit(8, 14, stroke = 0.6);
# Above 0.26*h the bowl counters close (the 8 has none left), and the glyph
# still renders as a watertight blob with no error. 0.26 * 14 = 3.64.
stroke-too-heavy | stroke must not exceed 0.26*h | stencil_digit(8, 14, stroke = 4);

# --- bridge -----------------------------------------------------------------
# The tether IS the shell material that holds a counter island, so its width
# has the same floor as a stroke. Below it a counter prints loose.
bridge-below-floor | bridge must be at least bridge_min | stencil_digit(0, 14, bridge = 0.6);
# A design may raise the floor but never lower it: lowering bridge_min to let
# a thin bridge through is refused before the bridge itself is compared.
bridge-min-lowered | bridge_min may be raised above 0.8 mm but never lowered | stencil_digit(0, 14, bridge = 0.6, bridge_min = 0.6);
# A RAISED floor is enforced too — a design that declares 1.2 cannot then
# pass 1.0 (which would clear the 0.8 default).
bridge-below-raised-min | bridge must be at least bridge_min | stencil_digit(0, 14, bridge = 1.0, bridge_min = 1.2);
# A bar wider than a quarter of the cap height removes the bowl's whole side
# rather than a gap in it. 0.25 * 14 = 3.5.
bridge-too-wide | bridge must not exceed 0.25*h | stencil_digit(0, 14, bridge = 5);
# The bridge guards reach every counter-bearing digit, not only the 0.
bridge-guard-on-8 | bridge must be at least bridge_min | stencil_digit(8, 14, bridge = 0.5);
# stencil_text passes the bridge through to every digit it lays out.
text-inherits-bridge-guard | bridge must be at least bridge_min | stencil_text("00", 14, bridge = 0.5);

# --- the digit ----------------------------------------------------------------
# stencil_digit draws by name lookup on str(n): an out-of-range or fractional
# n would otherwise match nothing and emit an empty glyph without a word.
digit-out-of-range | n must be an integer digit 0-9 | stencil_digit(10, 14);
digit-negative | n must be an integer digit 0-9 | stencil_digit(-1, 14);
digit-fractional | n must be an integer digit 0-9 | stencil_digit(2.5, 14);

# --- the text ---------------------------------------------------------------
# A non-digit character has no glyph; silently skipping it would lay out a
# clock face missing a numeral.
text-non-digit | unsupported character | stencil_text("1A", 14);
text-letter-o-for-zero | unsupported character | stencil_text("1O", 14);
text-empty | text must not be empty | stencil_text("", 14);
# A number where a string is expected: len(12) is undef, and without the
# guard the layout loop would evaluate against it.
text-not-a-string | s must be a string | stencil_text(12, 14);
# The width function is the caller's fit check, so it refuses the same set:
# a width computed over an unknown character would be a fit check that lies.
width-non-digit | unsupported character | echo(stencil_text_width("1A", 14));
