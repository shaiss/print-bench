# Positive tests for compliant.scad fits the stiffness coupon relies on
# (issue #1049). Run by scripts/mate-check.sh (via check.sh).
#
# The coupon proves predicted K ≈ measured on a real print; these cases prove
# the interference-style invariants a render can still catch — LET fingers of
# one side must not reach the opposite panel at rest (they only meet through
# the torsion bars). A check that has only ever seen the passing input looks
# exactly like a check that cannot fail, so each library carries a negative
# control.
#
# <case name> | empty|interfering | <statement producing the interference>

# A-side fingers (even pitches) must not reach the B-side panel zone
# (y ≥ gap - embed = 5). Keep A-finger X columns across ALL Y — including the
# tested +Y region — so an A finger that wrongly extends into the B panel is
# still present for the intersection. Do NOT subtract a box covering y ≥ 0
# first: that deletes the intrusion before the probe can see it.
let-afingers-clear-bpanel | empty | intersection() { intersection() { let_joint(1, 3, 2.0, 1.2, 14, 6, finger_w = 3.5, root_fillet = 0.8, embed = 1); union() { translate([6.5, -20, -1]) cube([4.5, 60, 4]); translate([41.5, -20, -1]) cube([4.5, 60, 4]); } } translate([0, 5, 0]) cube([70, 16, 1.2]); }

# Same construction at the hand-scale coupon size (n_parallel = 2) so the
# invariant is not proven only at the one harvest size. A columns at i=0,2.
let-afingers-clear-bpanel-hand | empty | intersection() { intersection() { let_joint(1, 2, 2.0, 1.2, 14, 6, finger_w = 3.5, root_fillet = 0.8, embed = 1); union() { translate([6.5, -20, -1]) cube([4.5, 60, 4]); translate([41.5, -20, -1]) cube([4.5, 60, 4]); } } translate([0, 5, 0]) cube([52.5, 16, 1.2]); }

# THE NEGATIVE CONTROL: extend an A-side finger into the B panel zone. If this
# reports 0 facets the harness has stopped measuring and the empty cases above
# are worthless.
let-afinger-into-bpanel | interfering | intersection() { translate([7, -1, 0]) cube([3.5, 10, 1.2]); translate([0, 5, 0]) cube([70, 16, 1.2]); }
