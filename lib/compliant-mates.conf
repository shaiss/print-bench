# Positive tests for compliant.scad fits the stiffness coupon relies on
# (issue #1049). Run by scripts/mate-check.sh (via check.sh).
#
# The coupon proves predicted K ≈ measured on a real print; these cases prove
# the interference-style invariants a render can still catch — LET fingers of
# one side must not reach the opposite panel at rest (they only meet through
# the torsion bars). A check that has only ever seen the passing input looks
# exactly like a check that cannot fail, so each library carries a negative
# control.
#
# <case name> | empty|interfering | <statement producing the interference>

# A-side half of the production LET (everything at y <= 0) must not intersect
# a B-side panel seated on the +Y finger tips (y >= gap - embed). At rest the
# two meet only through the torsion bar, which this cut removes from the A
# half's reach into +Y.
let-afingers-clear-bpanel | empty | intersection() { difference() { let_joint(1, 3, 2.0, 1.2, 14, 6, finger_w = 3.5, root_fillet = 0.8, embed = 1); translate([-1, 0, -1]) cube([72, 40, 4]); } translate([0, 5, 0]) cube([70, 16, 1.2]); }

# Same construction at the hand-scale coupon size (n_parallel = 2) so the
# invariant is not proven only at the one harvest size.
let-afingers-clear-bpanel-hand | empty | intersection() { difference() { let_joint(1, 2, 2.0, 1.2, 14, 6, finger_w = 3.5, root_fillet = 0.8, embed = 1); translate([-1, 0, -1]) cube([60, 40, 4]); } translate([0, 5, 0]) cube([52.5, 16, 1.2]); }

# THE NEGATIVE CONTROL: shove the "B panel" down into the A-finger zone
# (y ≈ -gap). A fingers occupy y down to -gap - embed = -7; a panel cube
# covering y ∈ [-20, -4] must collide. If this reports 0 facets the harness
# has stopped measuring and the empty cases above are worthless.
let-afingers-hit-apanel-zone | interfering | intersection() { difference() { let_joint(1, 3, 2.0, 1.2, 14, 6, finger_w = 3.5, root_fillet = 0.8, embed = 1); translate([-1, 0, -1]) cube([72, 40, 4]); } translate([0, -20, 0]) cube([70, 16, 1.2]); }
