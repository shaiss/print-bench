# The selftest's base fixture (format: tools/concept-preview/README.md, or
# `scripts/concept-preview.sh --vocab`). A generic hex-bolt canister laid out
# on the reference canvas's sheet geometry — every primitive is exercised on
# at least one sheet, and every sheet carries a note so the furniture is too.
# It must emit four sheets that pass every check; each neg-*.conf beside it
# is appended to this file and must then FAIL the check it names.
title: HEX-BOLT CANISTER
rev: A
scale: NTS
units: mm

sheet: exterior | subtitle=EXTERIOR ELEVATION — CLOSED | caption=EXTERIOR — CLOSED
sheet: cutaway | subtitle=LONGITUDINAL HALF-SECTION — TWIST DRIVES THE NUT | caption=MECHANISM — HALF SECTION
sheet: section | heading=TOP SECTION A–A | subtitle=LAYOUT — THE SCREW SITS DEAD CENTRE | caption=TOP SECTION A–A
sheet: exploded | subtitle=ASSEMBLY ORDER, TOP DOWN — 4 PRINTED PARTS | bom=372,176

part: n=1 | name=Lid — hex cap nut | print=open up
part: n=2 | name=Body — threaded tube | print=knob down
part: n=3 | name=Screw-knob — central bolt | print=head down
part: n=4 | name=Elevator — travelling nut | print=flat

