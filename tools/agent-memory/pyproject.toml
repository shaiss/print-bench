[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Per-agent episodic memory store + deterministic write path for print-bench's autonomy routines (agentic memory Slice 1a, issue #429)"
license = "CC-BY-SA-4.0"
requires-python = ">=3.10"
# Stdlib-only on purpose — the mold tools/lineage, tools/brief-sources and
# tools/andon keep: check.sh runs `--selftest` and `check` from the bare
# checkout (PYTHONPATH=tools/agent-memory/src, no pip step), and a routine that
# records a memory at run end must not need a pip resolve in front of it.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agent-memory = "agent_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
