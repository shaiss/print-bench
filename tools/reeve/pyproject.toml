[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reeve"
version = "0.1.0"
description = "Deterministic bench-health report for print-bench's platform PM (advisory-only)"
license = "CC-BY-SA-4.0"
requires-python = ">=3.10"
# Stdlib-only on purpose: the scheduled workflow runs this on the system
# Python right after checkout, and a third-party import would force a pip
# resolve in front of the step that reads the bench's pulse — the same rule
# tools/lineage, tools/telemetry and tools/backlog-groomer keep. Reeve's
# primary pulse is committed files (telemetry + previews + confs); the opt-in
# run-health read (github.py, issue #313) uses stdlib urllib.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[project.scripts]
reeve = "reeve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
