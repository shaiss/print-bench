name: Resolve a /decide command

# The human half of the HITL decision gate (issue #161). An agentic run
# (/ship-issue, /design-run, a design PM) that reaches a fork in the road it
# must NOT decide itself parks the decision: it labels the issue
# `needs-decision` and posts a `🚦 DECISION NEEDED` comment carrying a stable
# decision id and exactly two options. A maintainer then replies
# `/decide yes <id>` or `/decide no <id>`, and this workflow records the verdict
# as machine state:
#   * it flips the LABEL (needs-decision -> decision-approved / decision-rejected)
#     — the AUTHORITATIVE, unspoofable resolved state, because setting a label
#     needs write access;
#   * it appends a row to the committed ledger (.github/decisions/ledger.conf)
#     — the reproducible audit trail, keyed by decision id.
# A paused pipeline reads that state on its next scheduled firing: the
# backlog-burn selector excludes any issue still carrying `needs-decision`, so
# nothing is held open (see tools/backlog-burn/src/backlog_burn/select.py).
#
# SECURITY — this is a privileged workflow. `issue_comment` runs in the base
# repository's context from the DEFAULT BRANCH (GitHub's design; confirmed in
# docs/actions-security.md), with a write-capable token, so it must NEVER check
# out or execute code from the issue/PR head (the "pwn request" TOCTOU). Its
# defenses are stronger than a checked-out privileged job's:
#   * it checks out NOTHING — no ref at all; the ledger is read and written
#     purely as DATA through the Contents API;
#   * the comment body is only ever handled inside github-script as a JS string,
#     validated against an anchored strict pattern, never interpolated into a
#     shell command;
#   * authorization is the commenter's REAL repository permission
#     (getCollaboratorPermissionLevel), never author_association.
#
# Unlike ci-gate-approve.yml, a decision is repo-global state (a fact about the
# repo, not configuration for one PR — contrast the per-PR ci-gates registry),
# so the ledger commits to the DEFAULT BRANCH with the ambient GITHUB_TOKEN
# rather than a PAT: a decision-ledger commit must NOT re-trigger CI (the
# telemetry-commit reason — a re-triggering commit on the default branch would
# gate the whole catalog on every decision), and the async selector re-reads the
# state on its own schedule regardless. `contents: write` is safe here precisely
# because the job runs no head code; the label flip carries the verdict even if
# the ledger commit is refused (e.g. by branch protection), so the gate degrades
# safely.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write   # append the decision to the ledger on the default branch
  issues: write     # react to the command, reply, and flip the decision labels

concurrency:
  # One writer at a time for the shared ledger, across every issue.
  group: decide-ledger
  cancel-in-progress: false

env:
  LEDGER_PATH: .github/decisions/ledger.conf

jobs:
  decide:
    name: Apply a /decide command
    if: startsWith(github.event.comment.body, '/decide')
    runs-on: ubuntu-latest
    steps:
      - name: Authorize and parse the command
        id: parse
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.comment.body.trim();
            // verb, then an optional kebab-case decision id. The strict anchored
            // pattern also keeps anything shell-hostile out of values that flow
            // into later env vars.
            const m = body.match(/^\/decide\s+(yes|no|status)(?:\s+([a-z0-9][a-z0-9-]*))?\s*$/);
            const react = (content) => github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content,
            });
            const reply = (msg) => github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `${msg}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            if (!m) {
              await react('confused');
              await reply(
                '**/decide** — usage:\n'
                + '```\n/decide yes <id>\n/decide no <id>\n/decide status\n```\n'
                + 'Records a human yes/no for a `🚦 DECISION NEEDED` on this thread '
                + '(needs write access).'
              );
              core.setOutput('valid', 'false');
              return;
            }
            const [, verb, decisionId] = m;
            if (verb !== 'status' && !decisionId) {
              await react('confused');
              await reply(`**/decide ${verb}** needs a decision id, e.g. \`/decide ${verb} lock-clearance-loosen\`.`);
              core.setOutput('valid', 'false');
              return;
            }
            // Native authorization: the commenter's real permission on this repo.
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              await react('-1');
              await reply(
                `@${context.payload.comment.user.login} — \`/decide\` needs write access `
                + `to this repository (you have \`${perm.permission}\`).`
              );
              core.setOutput('valid', 'false');
              return;
            }
            const { data: repo } = await github.rest.repos.get({ ...context.repo });
            await react('eyes');
            core.setOutput('valid', 'true');
            core.setOutput('verb', verb);
            core.setOutput('verdict', verb === 'yes' ? 'approved' : verb === 'no' ? 'rejected' : 'status');
            core.setOutput('decision_id', decisionId || '');
            core.setOutput('default_branch', repo.default_branch);

      - name: Record the decision in the ledger
        id: commit
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.verdict != 'status'
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.parse.outputs.default_branch }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          VERDICT: ${{ steps.parse.outputs.verdict }}
          ACTOR: ${{ github.event.comment.user.login }}
        with:
          script: |
            const path = process.env.LEDGER_PATH;
            const branch = process.env.BRANCH;
            const id = process.env.DECISION_ID;
            // One pipe-delimited row per decision id:
            //   id | verdict | #issue | login | iso8601
            const row = [id, process.env.VERDICT, `#${context.issue.number}`,
              process.env.ACTOR, new Date().toISOString()].join(' | ');
            for (let attempt = 0; attempt < 3; attempt++) {
              let existing = '', sha;
              try {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
                existing = Buffer.from(data.content, 'base64').toString('utf8');
                sha = data.sha;
              } catch (e) {
                if (e.status !== 404) throw e;   // 404 => first-ever decision
              }
              // Preserve the header comments; append-or-replace the row for this
              // id (so re-deciding overwrites, idempotent, instead of stacking).
              const lines = existing.split('\n');
              const header = lines.filter((l) => l.startsWith('#'));
              const kept = lines.filter(
                (l) => l.trim() && !l.startsWith('#') && l.split('|')[0].trim() !== id
              );
              const content = [...header, ...kept, row].join('\n') + '\n';
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo, path, branch, sha,
                  message: `decide: ${id} -> ${process.env.VERDICT} (#${context.issue.number})`,
                  content: Buffer.from(content).toString('base64'),
                });
                core.setOutput('committed', 'true');
                return;
              } catch (e) {
                if (e.status === 409 && attempt < 2) continue;   // sha race: refetch
                core.setOutput('committed', 'false');
                core.setOutput('commit_error', `${e.status || ''} ${e.message || e}`.trim());
                return;
              }
            }

      - name: Reply and flip the decision labels
        if: steps.parse.outputs.valid == 'true' && !cancelled()
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.parse.outputs.default_branch }}
          VERB: ${{ steps.parse.outputs.verb }}
          VERDICT: ${{ steps.parse.outputs.verdict }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          COMMIT_ERROR: ${{ steps.commit.outputs.commit_error }}
        with:
          script: |
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const react = (content) => github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content,
            });
            const reply = (body) => github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body: body + footer,
            });
            const { VERB, VERDICT, DECISION_ID, COMMITTED, COMMIT_ERROR } = process.env;

            if (VERB === 'status') {
              let dump = '(no decisions recorded yet)';
              try {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo, path: process.env.LEDGER_PATH, ref: process.env.BRANCH,
                });
                const text = Buffer.from(data.content, 'base64').toString('utf8').trim();
                if (text) dump = text;
              } catch (e) { if (e.status !== 404) throw e; }
              await react('+1');
              await reply(`**Decision ledger** (\`${process.env.LEDGER_PATH}\`):\n\n\`\`\`\n${dump}\n\`\`\``);
              return;
            }

            // Ensure the resolution labels exist (created on demand — the repo's
            // no-central-registry convention), then flip needs-decision -> verdict.
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            };
            const want = VERDICT === 'approved' ? 'decision-approved' : 'decision-rejected';
            await ensureLabel('decision-approved', '0e8a16', 'A /decide human decision resolved yes');
            await ensureLabel('decision-rejected', 'b60205', 'A /decide human decision resolved no');
            // Fail CLOSED: add the verdict label BEFORE removing needs-decision.
            // The two calls are not atomic, and the selector's durable pause keys
            // solely on `needs-decision`. If we removed first and the add then
            // failed (a transient 5xx), the issue would carry NEITHER label and
            // un-pause with no verdict recorded — the gate failing OPEN. In this
            // order a failed add leaves needs-decision in place (still paused; a
            // /decide re-run heals it), and a failed remove leaves BOTH labels
            // (the selector still excludes on needs-decision) — both keep the
            // pipeline paused rather than resuming with no decision.
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number, labels: [want],
            });
            try {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: context.issue.number, name: 'needs-decision',
              });
            } catch (e) { if (e.status !== 404) throw e; }
            await react('+1');

            const head = `\`${DECISION_ID}\`: recorded **${VERDICT}** and labelled \`${want}\`.`;
            const tail = COMMITTED === 'true'
              ? ' Appended to the ledger; the paused run resumes on its next firing.'
              : ' The label is the authoritative verdict; the ledger append did not complete'
                + (COMMIT_ERROR ? ` (\`${COMMIT_ERROR}\`)` : '')
                + `, so add the row to \`${process.env.LEDGER_PATH}\` by hand if you want the audit trail.`;
            await reply(head + tail);
