name: Resolve a /decide command

# The human half of the HITL decision gate (issue #161). An agentic run
# (/ship-issue, /design-run, a design PM) that reaches a fork in the road it
# must NOT decide itself parks the decision: it labels the issue
# `needs-decision` and posts a `🚦 DECISION NEEDED` comment carrying a stable
# decision id and exactly two options. A maintainer then replies
# `/decide yes <id>` or `/decide no <id>`, and this workflow records the verdict
# as machine state:
#   * it flips the LABEL (needs-decision -> decision-approved / decision-rejected)
#     — the AUTHORITATIVE, unspoofable resolved state, because setting a label
#     needs write access;
#   * it appends a row to the committed ledger (.github/decisions/ledger.conf)
#     — the reproducible audit trail, keyed by decision id.
# A paused pipeline reads that state on its next scheduled firing: the
# backlog-burn selector excludes any issue still carrying `needs-decision`, so
# nothing is held open (see tools/backlog-burn/src/backlog_burn/select.py).
#
# SECURITY — this is a privileged workflow. `issue_comment` runs in the base
# repository's context from the DEFAULT BRANCH (GitHub's design; confirmed in
# docs/actions-security.md), with a write-capable token, so it must NEVER check
# out or execute code from the issue/PR head (the "pwn request" TOCTOU). Its
# defenses are stronger than a checked-out privileged job's:
#   * it checks out NOTHING — no ref at all; the ledger is read and written
#     purely as DATA through the Contents API;
#   * the comment body is only ever handled inside github-script as a JS string,
#     validated against an anchored strict pattern, never interpolated into a
#     shell command;
#   * authorization is the commenter's REAL repository permission
#     (getCollaboratorPermissionLevel), never author_association.
#
# Unlike ci-gate-approve.yml, a decision is repo-global state (a fact about the
# repo, not configuration for one PR — contrast the per-PR ci-gates registry),
# so the ledger commits to the DEFAULT BRANCH with the ambient GITHUB_TOKEN
# rather than a PAT: a decision-ledger commit must NOT re-trigger CI (the
# telemetry-commit reason — a re-triggering commit on the default branch would
# gate the whole catalog on every decision), and the async selector re-reads the
# state on its own schedule regardless. `contents: write` is safe here precisely
# because the job runs no head code; the label flip carries the verdict even if
# the ledger commit is refused (e.g. by branch protection), so the gate degrades
# safely. The acknowledgment reactions/replies degrade the same way (fail-soft,
# issue #463): a react()/reply() failure logs a ::warning:: instead of aborting
# the verdict — the label flip and ledger row are the outputs that matter.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write   # append the decision to the ledger on the default branch
  issues: write     # react to the command, reply, and flip the decision labels
  # issue_comment fires for PR comments too (decisions get parked on PR
  # threads), and reacting to or replying on a PR-thread comment needs this
  # grant — the issues grant does not extend there (issue #463).
  pull-requests: write

concurrency:
  # One writer at a time for the shared ledger, across every issue.
  group: decide-ledger
  cancel-in-progress: false

env:
  LEDGER_PATH: .github/decisions/ledger.conf

jobs:
  decide:
    name: Apply a /decide command
    if: startsWith(github.event.comment.body, '/decide')
    runs-on: ubuntu-latest
    steps:
      - name: Authorize and parse the command
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            // verb, then an optional kebab-case decision id. The strict anchored
            // pattern also keeps anything shell-hostile out of values that flow
            // into later env vars.
            const m = body.match(/^\/decide\s+(yes|no|status)(?:\s+([a-z0-9][a-z0-9-]*))?\s*$/);
            // Acknowledgments are fail-soft (issue #463): react()/reply() are
            // cosmetic, but an un-caught react() failure ran BEFORE the label
            // flip and aborted the verdict entirely. A failure now logs a
            // ::warning:: and the run continues.
            const react = async (content) => {
              try {
                await github.rest.reactions.createForIssueComment({
                  ...context.repo, comment_id: context.payload.comment.id, content,
                });
              } catch (e) {
                const err = `${e.status || ''} ${e.message || e}`.trim();
                core.warning(`react('${content}') failed, continuing: ${err}`);
              }
            };
            const reply = async (msg) => {
              try {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: context.issue.number,
                  body: `${msg}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
                });
              } catch (e) {
                const err = `${e.status || ''} ${e.message || e}`.trim();
                core.warning('reply failed, continuing: ' + err);
              }
            };
            if (!m) {
              await react('confused');
              await reply(
                '**/decide** — usage:\n'
                + '```\n/decide yes <id>\n/decide no <id>\n/decide status\n```\n'
                + 'Records a human yes/no for a `🚦 DECISION NEEDED` on this thread '
                + '(needs write access).'
              );
              core.setOutput('valid', 'false');
              return;
            }
            const [, verb, decisionId] = m;
            if (verb !== 'status' && !decisionId) {
              await react('confused');
              await reply(`**/decide ${verb}** needs a decision id, e.g. \`/decide ${verb} lock-clearance-loosen\`.`);
              core.setOutput('valid', 'false');
              return;
            }
            // Native authorization: the commenter's real permission on this repo.
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              await react('-1');
              await reply(
                `@${context.payload.comment.user.login} — \`/decide\` needs write access `
                + `to this repository (you have \`${perm.permission}\`).`
              );
              core.setOutput('valid', 'false');
              return;
            }
            // Bind a yes/no to a PENDING gate on THIS thread: only resolve an
            // issue/PR currently carrying `needs-decision`. The issue_comment
            // payload already carries the thread's labels (no extra API call), so
            // this refuses a /decide on a thread with nothing to resolve — which
            // also stops a verdict/ledger row from landing on an unrelated thread
            // — and makes re-opening a resolved decision a deliberate act
            // (re-add the label first). `status` is read-only and always allowed.
            const labels = (context.payload.issue.labels || []).map((l) => l.name);
            if (verb !== 'status' && !labels.includes('needs-decision')) {
              await react('confused');
              await reply(
                `\`${decisionId}\`: this thread has no pending decision (no \`needs-decision\` `
                + 'label), so there is nothing to resolve. Re-open a resolved decision by '
                + 're-adding the `needs-decision` label first.'
              );
              core.setOutput('valid', 'false');
              return;
            }
            const { data: repo } = await github.rest.repos.get({ ...context.repo });
            await react('eyes');
            core.setOutput('valid', 'true');
            core.setOutput('verb', verb);
            core.setOutput('verdict', verb === 'yes' ? 'approved' : verb === 'no' ? 'rejected' : 'status');
            core.setOutput('decision_id', decisionId || '');
            core.setOutput('default_branch', repo.default_branch);

      - name: Resolve the decision
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.parse.outputs.default_branch }}
          VERB: ${{ steps.parse.outputs.verb }}
          VERDICT: ${{ steps.parse.outputs.verdict }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          ACTOR: ${{ github.event.comment.user.login }}
        with:
          script: |
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const path = process.env.LEDGER_PATH;
            const branch = process.env.BRANCH;
            const { VERB, VERDICT, DECISION_ID } = process.env;
            // Same fail-soft acknowledgments as the parse step (issue #463):
            // reactions and replies must never abort the verdict — the label
            // flip and ledger row are the outputs that matter.
            const react = async (content) => {
              try {
                await github.rest.reactions.createForIssueComment({
                  ...context.repo, comment_id: context.payload.comment.id, content,
                });
              } catch (e) {
                const err = `${e.status || ''} ${e.message || e}`.trim();
                core.warning(`react('${content}') failed, continuing: ${err}`);
              }
            };
            const reply = async (body) => {
              try {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: context.issue.number, body: body + footer,
                });
              } catch (e) {
                const err = `${e.status || ''} ${e.message || e}`.trim();
                core.warning('reply failed, continuing: ' + err);
              }
            };

            // ---- status: read-only, size-bounded dump of the ledger ---------
            if (VERB === 'status') {
              const MAX_ROWS = 50;
              let dump = '(no decisions recorded yet)', note = '';
              try {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
                const all = Buffer.from(data.content, 'base64').toString('utf8')
                  .split('\n').filter((l) => l.trim());
                const header = all.filter((l) => l.startsWith('#'));
                const rows = all.filter((l) => !l.startsWith('#'));
                // The ledger is append-only, so a full dump would eventually
                // exceed GitHub's comment-size limit and fail the run when the
                // audit is most needed. Show the header + the most recent rows.
                const shown = rows.slice(-MAX_ROWS);
                if (rows.length > shown.length) {
                  note = `\n\n_Showing the ${shown.length} most recent of ${rows.length} decisions — see \`${path}\` for the full ledger._`;
                }
                const body = [...header, ...shown].join('\n').trim();
                if (body) dump = body;
              } catch (e) { if (e.status !== 404) throw e; }
              await react('+1');
              await reply(`**Decision ledger** (\`${path}\`):\n\n\`\`\`\n${dump}\n\`\`\`${note}`);
              return;
            }

            // ---- yes/no: authoritative LABEL first, audit LEDGER after -------
            // Ensure the verdict labels exist (created on demand — the repo's
            // no-central-registry convention).
            const ensureLabel = async (name, color, description) => {
              try { await github.rest.issues.getLabel({ ...context.repo, name }); }
              catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            };
            const want  = VERDICT === 'approved' ? 'decision-approved' : 'decision-rejected';
            const other = VERDICT === 'approved' ? 'decision-rejected' : 'decision-approved';
            await ensureLabel('decision-approved', '0e8a16', 'A /decide human decision resolved yes');
            await ensureLabel('decision-rejected', 'b60205', 'A /decide human decision resolved no');

            // FAIL CLOSED, and label-before-ledger. The verdict LABEL is the
            // authoritative state the selector/pipeline reads; the ledger is a
            // best-effort audit trail. Apply the label FIRST: if it can't be
            // applied we record NOTHING and leave `needs-decision` in place, so
            // the issue stays paused (a /decide re-run heals it) rather than the
            // ledger claiming a decision the authoritative state never received.
            try {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: context.issue.number, labels: [want],
              });
            } catch (e) {
              const err = `${e.status || ''} ${e.message || e}`.trim();
              await react('confused');
              await reply(`\`${DECISION_ID}\`: could not apply the \`${want}\` label (\`${err}\`) — the issue stays paused (\`needs-decision\`). Re-run \`/decide ${VERB} ${DECISION_ID}\`.`);
              core.setFailed('verdict label could not be applied; failing closed');
              return;
            }
            // Verdict labels are mutually exclusive: drop the opposite one (so a
            // re-decision can never leave BOTH present, an ambiguous verdict) and
            // lift the pause. Both removals are best-effort — an absent label
            // 404s, which is fine.
            for (const name of [other, 'needs-decision']) {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name });
              } catch (e) { if (e.status !== 404) throw e; }
            }

            // Best-effort audit ledger, AFTER the authoritative label is set.
            // One pipe-delimited row per id: id | verdict | #issue | login | iso8601
            let committed = false, commitError = '';
            const row = [DECISION_ID, VERDICT, `#${context.issue.number}`,
              process.env.ACTOR, new Date().toISOString()].join(' | ');
            for (let attempt = 0; attempt < 3 && !committed; attempt++) {
              let existing = '', sha;
              try {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
                existing = Buffer.from(data.content, 'base64').toString('utf8');
                sha = data.sha;
              } catch (e) { if (e.status !== 404) throw e; }   // 404 => first-ever decision
              const lines = existing.split('\n');
              const header = lines.filter((l) => l.startsWith('#'));
              // append-or-replace the row for this id (idempotent re-decision)
              const kept = lines.filter(
                (l) => l.trim() && !l.startsWith('#') && l.split('|')[0].trim() !== DECISION_ID
              );
              const content = [...header, ...kept, row].join('\n') + '\n';
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo, path, branch, sha,
                  message: `decide: ${DECISION_ID} -> ${VERDICT} (#${context.issue.number})`,
                  content: Buffer.from(content).toString('base64'),
                });
                committed = true;
              } catch (e) {
                if (e.status === 409 && attempt < 2) continue;   // sha race: refetch
                commitError = `${e.status || ''} ${e.message || e}`.trim();
                break;
              }
            }

            await react('+1');
            const head = `\`${DECISION_ID}\`: recorded **${VERDICT}** and labelled \`${want}\`.`;
            const tail = committed
              ? ' Appended to the audit ledger; the paused run resumes on its next firing.'
              : ` The label is the authoritative verdict; the audit-ledger append did not complete${commitError ? ` (\`${commitError}\`)` : ''}, so add the row to \`${path}\` by hand if you want the audit trail.`;
            await reply(head + tail);
