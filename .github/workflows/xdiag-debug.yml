name: xdiag-debug
on: push
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: X credential diagnostic
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          echo "=== XDIAG START ==="
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, secrets, time, urllib.parse, urllib.request, urllib.error
          BASE = "https://api.x.com"
          ENV = ("X_API_KEY", "X_API_SECRET", "X_ACCESS_TOKEN", "X_ACCESS_TOKEN_SECRET")

          def _pct(s):
              return urllib.parse.quote(s, safe="-._~")

          def hdr(method, url):
              p = {
                  "oauth_consumer_key": os.environ["X_API_KEY"],
                  "oauth_nonce": secrets.token_hex(16),
                  "oauth_signature_method": "HMAC-SHA1",
                  "oauth_timestamp": str(int(time.time())),
                  "oauth_token": os.environ["X_ACCESS_TOKEN"],
                  "oauth_version": "1.0",
              }
              ps = "&".join(f"{_pct(k)}={_pct(v)}" for k, v in sorted(p.items()))
              base = "&".join((method.upper(), _pct(url), _pct(ps)))
              key = f"{_pct(os.environ['X_API_SECRET'])}&{_pct(os.environ['X_ACCESS_TOKEN_SECRET'])}".encode()
              p["oauth_signature"] = base64.b64encode(hmac.new(key, base.encode(), hashlib.sha1).digest()).decode()
              return "OAuth " + ", ".join(f'{_pct(k)}="{_pct(v)}"' for k, v in sorted(p.items()))

          def call(method, url, body=None):
              h = {"Authorization": hdr(method, url), "User-Agent": "print-bench-xdiag"}
              data = None
              if body is not None:
                  h["Content-Type"] = "application/json"; data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method)
              for k, v in h.items(): req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          miss = [v for v in ENV if not (os.environ.get(v) or "").strip()]
          if miss:
              print("MISSING:", miss); raise SystemExit(0)
          print("1) GET /2/users/me")
          s, b = call("GET", f"{BASE}/2/users/me"); print("HTTP", s); print(b[:800]); print()
          print("2) POST /2/tweets")
          txt = f"print-bench cred check {secrets.token_hex(4)} - delete me"
          s, b = call("POST", f"{BASE}/2/tweets", {"text": txt}); print("HTTP", s); print(b[:800])
          tid = None
          try: tid = (json.loads(b).get("data") or {}).get("id")
          except Exception: pass
          print()
          if tid:
              print("3) DELETE /2/tweets/%s" % tid)
              s, b = call("DELETE", f"{BASE}/2/tweets/{tid}"); print("HTTP", s); print(b[:400])
              print(">>> WRITE_OK")
          else:
              print(">>> WRITE_FAILED")
          PY
          echo "=== XDIAG END ==="
