name: Backlog-burn cgroup reaper fixture

# Runtime proof that sudo systemd-run --scope + systemctl kill work on
# ubuntu-latest the same way backlog-burn.yml uses them. Not wired into
# check.sh (no process signaling / sudo in the local gate).

on:
  pull_request:
    paths:
      - '.github/workflows/backlog-burn.yml'
      - '.github/workflows/backlog-burn-cgroup-reap.yml'
      - '.github/actions/bb-scoped-claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cgroup-reap-fixture:
    name: systemd scope orphan reap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove passwordless sudo + systemd
        run: |
          set -euo pipefail
          ps -p 1 -o comm= | grep -qx systemd
          sudo -n true
          command -v systemd-run
          command -v systemctl

      - name: Check systemd-run --expand-environment support
        id: systemd_expand
        run: |
          set -euo pipefail
          # ubuntu-latest is systemd 255.x today; require >= 254 and that
          # `systemd-run --help` lists the flag before we pass it.
          ver_line="$(systemctl --version | head -1)"
          ver="$(printf '%s\n' "$ver_line" | grep -oE '[0-9]+' | head -1)"
          echo "systemd version line: ${ver_line}"
          supported=0
          if [ -n "$ver" ] && [ "$ver" -ge 254 ] \
            && systemd-run --help 2>&1 | grep -q -- '--expand-environment'; then
            supported=1
          fi
          echo "supported=${supported}" >> "$GITHUB_OUTPUT"
          if [ "$supported" -eq 1 ]; then
            echo "systemd ${ver}: --expand-environment=no will be used"
          else
            echo "::notice::systemd ${ver_line}: --expand-environment not usable; script-file argv keeps expansion harmless"
          fi

      - name: Fixture — scope orphans, control outside, reap, no-op
        env:
          BB_FIXTURE_SECRET: "fixture-secret-value-must-not-appear-in-unit"
          EXPAND_SUPPORTED: ${{ steps.systemd_expand.outputs.supported }}
        run: |
          set -euo pipefail
          UNIT="bb-fixture-${{ github.run_id }}-${{ github.run_attempt }}"
          CTRL_PID_FILE="$(mktemp)"
          ORPHAN_PID_FILE="$(mktemp)"
          DAEMON_PID_FILE="$(mktemp)"
          SCOPE_MAIN_PID_FILE="$(mktemp)"
          INSIDE_ENV_FILE="$(mktemp)"
          SCRIPT="${RUNNER_TEMP}/bb-fixture-scope.sh"
          SECRET_VALUE='fixture-secret-value-must-not-appear-in-unit'

          # In-scope body lives in a script file (quoted heredoc) so
          # systemd-run argv never holds `$VAR` text for expansion, and the
          # secret is read from the inherited environment only.
          cat >"$SCRIPT" <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s' "${BB_FIXTURE_SECRET:-}" >"${INSIDE_ENV_FILE}"
          # (a) double-forked orphan reparented toward init
          (
            setsid bash -c 'sleep 600 & echo $! >"$ORPHAN_PID_FILE"' &
          )
          sleep 0.5
          # (b) setsid daemon whose cwd is /tmp
          (
            cd /tmp
            setsid sleep 600 </dev/null >/dev/null 2>&1 &
            echo $! >"$DAEMON_PID_FILE"
          )
          sleep 0.5
          # Scope main process (this script) — must die with the unit.
          echo $$ >"$SCOPE_MAIN_PID_FILE"
          sleep 600
          EOS
          chmod +x "$SCRIPT"

          # Control process OUTSIDE the unit — must survive reap.
          sleep 600 &
          echo $! >"$CTRL_PID_FILE"
          CTRL_PID="$(cat "$CTRL_PID_FILE")"

          EXPAND_ARGS=()
          if [ "${EXPAND_SUPPORTED}" = "1" ]; then
            EXPAND_ARGS=(--expand-environment=no)
          fi

          # Inherit env only — never --setenv/-E. Paths + secret travel via
          # sudo --preserve-env into the scope process environment.
          sudo --preserve-env=BB_FIXTURE_SECRET,PATH,INSIDE_ENV_FILE,ORPHAN_PID_FILE,DAEMON_PID_FILE,SCOPE_MAIN_PID_FILE \
            systemd-run --scope \
            "${EXPAND_ARGS[@]}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --unit="${UNIT}" \
            --collect \
            --quiet \
            -- "$SCRIPT" &
          SCOPE_WRAPPER_PID=$!
          # Give the scope time to spawn children and write PID files
          sleep 2

          # Env inheritance: secret visible inside scope via its own environ.
          if ! grep -q "$SECRET_VALUE" "$INSIDE_ENV_FILE"; then
            echo "::error::test env var not visible inside the scope" >&2
            exit 1
          fi

          # Recorded PIDs must exist before we assert cgroup membership.
          for f in "$ORPHAN_PID_FILE" "$DAEMON_PID_FILE" "$SCOPE_MAIN_PID_FILE"; do
            if [ ! -s "$f" ]; then
              echo "::error::expected PID file empty or missing: $f" >&2
              exit 1
            fi
          done
          ORPHAN_PID="$(cat "$ORPHAN_PID_FILE")"
          DAEMON_PID="$(cat "$DAEMON_PID_FILE")"
          SCOPE_MAIN_PID="$(cat "$SCOPE_MAIN_PID_FILE")"

          # BEFORE kill: cgroup.procs capture must have run, be non-empty,
          # contain orphan + daemon, and must NOT contain the control PID.
          # A silent skip of this capture fails the job.
          CG="$(systemctl show -p ControlGroup --value "${UNIT}.scope" 2>/dev/null \
            || systemctl show -p ControlGroup --value "${UNIT}" 2>/dev/null \
            || true)"
          if [ -z "$CG" ] || [ ! -f "/sys/fs/cgroup${CG}/cgroup.procs" ]; then
            echo "::error::in-unit cgroup.procs capture missing (cg='${CG}')" >&2
            exit 1
          fi
          PROCS="$(tr ' ' '\n' <"/sys/fs/cgroup${CG}/cgroup.procs" | grep -v '^$' || true)"
          if [ -z "$PROCS" ]; then
            echo "::error::in-unit cgroup.procs is empty — silent skip" >&2
            exit 1
          fi
          echo "$PROCS" | grep -qx "$ORPHAN_PID" || {
            echo "::error::orphan PID ${ORPHAN_PID} not in cgroup.procs" >&2
            exit 1
          }
          echo "$PROCS" | grep -qx "$DAEMON_PID" || {
            echo "::error::daemon PID ${DAEMON_PID} not in cgroup.procs" >&2
            exit 1
          }
          if echo "$PROCS" | grep -qx "$CTRL_PID"; then
            echo "::error::control PID ${CTRL_PID} unexpectedly in cgroup.procs" >&2
            exit 1
          fi

          # Must NOT appear in unit properties / systemctl show
          SHOW="$(sudo systemctl show "${UNIT}.scope" 2>/dev/null || sudo systemctl show "${UNIT}" 2>/dev/null || true)"
          if printf '%s' "$SHOW" | grep -q "$SECRET_VALUE"; then
            echo "::error::secret leaked into systemctl show output" >&2
            exit 1
          fi
          # Must NOT appear in any in-scope process cmdline
          while IFS= read -r pid; do
            [ -n "$pid" ] || continue
            if [ -r "/proc/${pid}/cmdline" ] \
              && tr '\0' ' ' <"/proc/${pid}/cmdline" | grep -q "$SECRET_VALUE"; then
              echo "::error::secret leaked into /proc/${pid}/cmdline" >&2
              exit 1
            fi
          done <<<"$PROCS"

          # Exact same reap commands as backlog-burn.yml (one unit only).
          if ! sudo -n true 2>/dev/null; then
            echo "::warning::sudo -n failed — skipping cgroup reaper for ${UNIT}"
            exit 1
          fi
          sudo systemctl kill --signal=SIGTERM "${UNIT}.scope" 2>/dev/null \
            || sudo systemctl kill --signal=SIGTERM "${UNIT}" 2>/dev/null \
            || true
          sleep 5
          sudo systemctl kill --signal=SIGKILL "${UNIT}.scope" 2>/dev/null \
            || sudo systemctl kill --signal=SIGKILL "${UNIT}" 2>/dev/null \
            || true
          sudo systemctl stop "${UNIT}.scope" 2>/dev/null \
            || sudo systemctl stop "${UNIT}" 2>/dev/null \
            || true

          sleep 1
          # Control outside must remain; each recorded in-unit PID must be dead.
          if kill -0 "$CTRL_PID" 2>/dev/null; then
            echo "control outside scope still alive (ok)"
          else
            echo "::error::control process outside the unit was killed" >&2
            exit 1
          fi
          for label_pid in "orphan:${ORPHAN_PID}" "daemon:${DAEMON_PID}" "scope_main:${SCOPE_MAIN_PID}"; do
            label="${label_pid%%:*}"
            pid="${label_pid##*:}"
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::in-unit ${label} PID ${pid} still alive after reap" >&2
              exit 1
            fi
          done
          kill -KILL "$CTRL_PID" 2>/dev/null || true
          wait "$CTRL_PID" 2>/dev/null || true

          # Reap on an already-gone unit succeeds as a no-op
          sudo systemctl kill --signal=SIGTERM "${UNIT}.scope" 2>/dev/null \
            || sudo systemctl kill --signal=SIGTERM "${UNIT}" 2>/dev/null \
            || true
          sleep 1
          sudo systemctl kill --signal=SIGKILL "${UNIT}.scope" 2>/dev/null \
            || sudo systemctl kill --signal=SIGKILL "${UNIT}" 2>/dev/null \
            || true
          sudo systemctl stop "${UNIT}.scope" 2>/dev/null \
            || sudo systemctl stop "${UNIT}" 2>/dev/null \
            || true
          echo "already-gone unit reap: ok (no-op)"

          rm -f "$CTRL_PID_FILE" "$ORPHAN_PID_FILE" "$DAEMON_PID_FILE" \
            "$SCOPE_MAIN_PID_FILE" "$INSIDE_ENV_FILE" "$SCRIPT"
          wait "$SCOPE_WRAPPER_PID" 2>/dev/null || true

      - name: Structural — deliverer does not depend on reap outcome
        run: |
          set -euo pipefail
          wf=".github/workflows/backlog-burn.yml"
          # Reap steps are continue-on-error and never gate Bundle/pending.
          grep -n 'Reap agent cgroup' "$wf" | head -5
          # Every reap step has continue-on-error: true
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path(".github/workflows/backlog-burn.yml").read_text()
          # Each reap block must have continue-on-error: true and no set -e
          for m in re.finditer(r"- name: Reap agent cgroup \(link (\d)\)\n(.*?)(?=\n      - name:|\Z)", text, re.S):
              body = m.group(2)
              assert "continue-on-error: true" in body, m.group(1)
              assert "set -e" not in body, f"link {m.group(1)} uses set -e"
              assert "systemctl kill" in body
              assert "pkill" not in body
          # Bundle must not reference reap step outcomes
          bundle = text.split("- name: Bundle the ship commits", 1)[1].split("\n      - name:", 1)[0]
          assert "reap" not in bundle.lower() or "cgroup" in bundle.lower()
          assert "steps.reap" not in bundle
          assert "pending=" in bundle
          # No pid-snap machinery left
          assert "pid_snap" not in text
          assert "backlog-burn-pid-snap" not in text
          assert "reap_agent_orphans" not in text
          print("structural checks ok")
          PY

      - name: actionlint (scoped paths)
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color \
            .github/workflows/backlog-burn.yml \
            .github/workflows/backlog-burn-cgroup-reap.yml
