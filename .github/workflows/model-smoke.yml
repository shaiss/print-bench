name: Model chain smoke

# Proof that a registry chain's links are actually CALLABLE, not just
# well-formed (issue #298). `model-registry check` and the drift guard prove
# the registry parses and matches the workflow; neither can prove a model id
# is servable by the key that would call it — the review chain's old
# claude-opus-4-8 backstop passed every static check and was rejected at $0 on
# its first live request. This workflow makes the live request: it walks a
# chain and sends a real 1-token Messages call per link whose provider secret
# is set. It fails ONLY on positive evidence of a registry defect — a model id
# the key genuinely cannot serve (404/not-found, permission denial, an
# invalid-model 400): the #298 failure. A rate limit, a "credit balance too
# low" billing rejection, or a network blip is INCONCLUSIVE, not a failure —
# external to the registry, so an automatic per-PR gate does not red on a key
# that is merely out of quota. (No secret configured at all still fails: a run
# that could attempt nothing proves nothing.)
#
# TWO WAYS IN:
#   • Automatically, on push to main that edits the registry, the
#     model-registry tool, or this workflow — smoking EVERY chain after the
#     change lands, so a registry edit cannot ship an unservable id unproven
#     (#298). Provider keys are available ONLY on that main push (issue
#     #869 / agent-head-secret-gate): the `trust` job gates materialization.
#   • On pull_request (same paths) and workflow_dispatch — the workflow still
#     RUNS so the trigger is visible, but the keyed smoke is skipped when
#     trust is false (PR / dispatch). A PR-time or dispatch-time live smoke
#     needs a Shai decision: Environment with required reviewers that checks
#     out base scripts.
#
# model-smoke is NOT one of ci-ok's required contexts, so a red smoke informs
# without blocking a merge until a maintainer promotes it in branch protection.
# Read-only permissions; the provider secrets are the only exposure.
#
# AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set to
# 'pulled' bypasses the smoke job (a real paid request per link, on both
# providers) with a single ::notice:: — grey, never red, no provider call,
# even on a manual dispatch. Dispatch again after release if a registry edit
# shipped unproven meanwhile.
#
# Each provider's secret is wired LITERALLY below (the Actions constraint the
# registry documents): a new provider stanza needs its secret line added here
# in the same PR, or its links report "secret not set" and are skipped.

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Registry chain to smoke-test (blank = every chain)"
        required: false
        default: review
  push:
    branches: [main]
    paths:
      - ".github/models/**"
      - "tools/model-registry/**"
      - ".github/workflows/model-smoke.yml"
  pull_request:
    paths:
      - ".github/models/**"
      - "tools/model-registry/**"
      - ".github/workflows/model-smoke.yml"

permissions:
  contents: read

jobs:
  # agent-head-secret-gate (issue #869): trust is computed with no checkout
  # so head code cannot forge it via $GITHUB_ENV. Secrets only on push to main.
  trust:
    name: Secret trust
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      trusted: ${{ steps.decide.outputs.trusted }}
    steps:
      - id: decide
        name: Decide whether secrets may materialize
        env:
          TRUSTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: echo "trusted=${TRUSTED}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke the registry chains
    needs: trust
    # Skip when the AI andon cord is pulled, or when trust is false (PR /
    # dispatch — no provider keys). Under the cord the job is skipped
    # outright (see andon-notice). The parentheses are load-bearing: &&
    # binds tighter than || in GitHub expressions. ANDON_JOB_LEG must stay
    # a top-level conjunct (tools/model-registry andon drift guard).
    if: >-
      vars.AI_ANDON_CORD != 'pulled' &&
      needs.trust.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ping every configured link with a real 1-token request
        env:
          PYTHONPATH: tools/model-registry/src
          EVENT: ${{ github.event_name }}
          CHAIN_INPUT: ${{ inputs.chain }}
          # Secrets only materialize when this job's if: already required
          # needs.trust.outputs.trusted == 'true' (main push).
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # Dispatch with a named chain smokes just that one (default `review`,
          # preserving the old behavior); a cleared dispatch input or any
          # non-dispatch trigger smokes EVERY chain the registry declares.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${CHAIN_INPUT:-}" ]; then
            chains="$CHAIN_INPUT"
          else
            # `|| true`: grep exits 1 when it matches nothing, which under
            # pipefail+errexit would abort the step BEFORE the empty-chains
            # diagnostic below. Swallow it so a chainless registry is reported,
            # not a bare non-zero exit.
            chains="$(grep -oE '^\[chain:[A-Za-z0-9_-]+\]' .github/models/registry.conf \
                        | sed -E 's/^\[chain:(.+)\]$/\1/' || true)"
          fi
          if [ -z "${chains//[[:space:]]/}" ]; then
            echo "::error::no chains found in .github/models/registry.conf"
            exit 1
          fi
          rc=0
          for c in $chains; do
            echo "== smoking chain: $c =="
            python3 -m model_registry smoke "$c" || rc=1
          done
          exit "$rc"

  andon-notice:
    # The visible no-op: a skipped gated job is mute, so a sibling with no
    # permissions and no secrets says why nothing ran.
    if: vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain why nothing ran
        run: echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — the model-chain smoke was not run; no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume; dispatch this workflow afterwards if a registry edit shipped unproven meanwhile — see docs/andon-cord.md."

  untrusted-notice:
    # PR / workflow_dispatch: trust is false, so the keyed smoke is skipped
    # (issue #869). Say why — a skipped job is mute.
    needs: trust
    if: >-
      vars.AI_ANDON_CORD != 'pulled' &&
      needs.trust.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain why the keyed smoke did not run
        run: |
          echo "::notice::model-chain smoke skipped — provider keys (ZAI_KEY / ANTHROPIC_API_KEY / OPENROUTER_API_KEY) materialize only on push to main (issue #869). Registry edits are smoked after merge on the main push. A PR-time or workflow_dispatch live smoke needs Shai decision: environment with required reviewers that checks out base scripts."
