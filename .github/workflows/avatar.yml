name: Regenerate avatar

# Re-roll (or restyle) one member's committed DiceBear avatar and open a
# DRAFT PR with the result for a human to approve. Avatars are member
# identity, so the committed people/<handle>.md header stays the one
# authority: this workflow edits that header's `avatar-style:`/`avatar-seed:`
# keys, regenerates site/assets/avatars/<handle>.svg from them with the
# pinned DiceBear packages (deterministic — same header, same bytes), and
# proves the drift gate passes before anyone reviews it.
#
# The browser avatar studio on /people/ is the exploratory half: it re-rolls
# locally (localStorage, your view only) and links here when a member wants a
# combination made official. See site/lib/avatars.mjs for the curated style
# sets and site/avatars.mjs for the generator this runs.
#
# Prerequisite (one-time, shared with the lifestyle workflows): Settings >
# Actions > General > Workflow permissions > "Allow GitHub Actions to create
# and approve pull requests" must be ON, or the final `gh pr create` is
# denied (the branch is still pushed; open the PR from it manually).
# Also recommended (shared with the lifestyle workflows and log-print-result):
# set the REGEN_TOKEN secret — a fine-grained PAT with contents + pull-requests
# write. Without it the draft PR is opened with GITHUB_TOKEN, which triggers no
# workflow, so the normal CI never auto-runs on it and its required checks never
# appear; with REGEN_TOKEN set, opening the PR triggers CI automatically.

on:
  workflow_dispatch:
    inputs:
      handle:
        description: Member handle (people/<handle>.md)
        required: true
        type: string
      style:
        description: >-
          DiceBear style. The list mixes both member kinds; the generator
          rejects a style that does not match the member's kind (people-like
          for humans, machine-like for agents). Keep "(unchanged)" to leave
          the current style as it is.
        required: false
        default: "(unchanged)"
        type: choice
        # The curated union from site/lib/avatars.mjs (ALL_AVATAR_STYLES).
        # A dropdown beats the old free-text field: no typos, and the valid
        # set is visible. Kind-specific validity (human vs agent) can't be
        # expressed in a static choice, so the generator still enforces it.
        options:
          - "(unchanged)"
          - notionists
          - adventurer
          - avataaars
          - lorelei
          - open-peeps
          - micah
          - bottts
          - bottts-neutral
          - shapes
          - rings
          - identicon
          - thumbs
      seed:
        description: Avatar seed. Leave empty for a fresh random roll.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate and open a draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: avatar-${{ github.event.inputs.handle }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inputs
        env:
          HANDLE: ${{ github.event.inputs.handle }}
          STYLE: ${{ github.event.inputs.style }}
          SEED: ${{ github.event.inputs.seed }}
        # handle and seed are free-form dispatch inputs: pin their SHAPE before
        # anything interpolates them (same rule as the lifestyle workflows).
        # [[ =~ ]] matches the whole string, so a smuggled newline cannot pass.
        # style is now a choice (GitHub restricts it to the options above), so
        # it needs no shape check beyond excepting the "(unchanged)" sentinel;
        # the curated-set-for-kind and handle-exists checks live in the
        # generator itself.
        run: |
          set -euo pipefail
          if ! [[ "$HANDLE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::'handle' must be a lowercase handle like the people/*.md filenames"
            exit 1
          fi
          if [ -n "$STYLE" ] && [ "$STYLE" != "(unchanged)" ] \
             && ! [[ "$STYLE" =~ ^[a-z]+(-[a-z]+)*$ ]]; then
            echo "::error::'style' must be a kebab-case DiceBear style name"
            exit 1
          fi
          if [ -n "$SEED" ] && ! [[ "$SEED" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::'seed' must be 1-64 characters of [A-Za-z0-9._-]"
            exit 1
          fi

      - name: Update the member header and regenerate the SVG
        env:
          HANDLE: ${{ github.event.inputs.handle }}
          STYLE: ${{ github.event.inputs.style }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -euo pipefail
          npm --prefix site ci
          args=(--set "$HANDLE")
          # "(unchanged)" is the choice sentinel for "keep the current style";
          # only pass --style for a real selection.
          [ -n "$STYLE" ] && [ "$STYLE" != "(unchanged)" ] && args+=(--style "$STYLE")
          [ -n "$SEED" ] && args+=(--seed "$SEED")
          node site/avatars.mjs "${args[@]}"

      - name: Prove the drift gate passes
        # Run the site suite here as a fast pre-check (it contains the avatar
        # drift test) so the header and SVG are proven before the PR is even
        # opened. When REGEN_TOKEN is set the full CI also runs on the opened
        # PR (see the token below); this early gate still fails the run first.
        run: npm --prefix site test

      - name: Open a draft PR with the new avatar
        env:
          # PAT if present so the opened PR triggers CI (a GITHUB_TOKEN-opened
          # PR runs no workflow — the documented REGEN_TOKEN reason); else the
          # ambient token, and the HAVE_PAT warning below flags that CI won't
          # auto-run. Used for both the branch push and `gh pr create`.
          GH_TOKEN: ${{ secrets.REGEN_TOKEN || github.token }}
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
          HANDLE: ${{ github.event.inputs.handle }}
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="avatar/${HANDLE}-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "people/${HANDLE}.md" "site/assets/avatars/${HANDLE}.svg"
          if git diff --cached --quiet; then
            echo "::error::generator produced no changes"
            exit 1
          fi
          git commit -m "Regenerate avatar: ${HANDLE}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          # Notify the member whose avatar this is: people/<handle>.md carries an
          # optional `github:` login and a `kind:`. @-mention humans in the body —
          # it never fails, unlike --assignee, which needs the login to be an
          # assignable collaborator. Approval otherwise depends on them happening
          # to watch the repo.
          gh_login="$(sed -n 's/^github:[[:space:]]*//p' "people/${HANDLE}.md" | head -1 | tr -d '[:space:]')"
          kind="$(sed -n 's/^kind:[[:space:]]*//p' "people/${HANDLE}.md" | head -1 | tr -d '[:space:]')"
          mention=""
          if [ "$kind" = "human" ] && [ -n "$gh_login" ]; then
            mention="@${gh_login} — this is your avatar; review the SVG and take it out of draft if you're happy with the face."
          fi
          body="$(cat <<EOF
          Automated avatar re-roll for \`${HANDLE}\`: the \`avatar-style:\` / \`avatar-seed:\` keys in \`people/${HANDLE}.md\` were updated and \`site/assets/avatars/${HANDLE}.svg\` regenerated from them with the pinned DiceBear packages (deterministic — the site's avatar drift test passed in the generating workflow).

          ${mention}

          **Review before merging:** open the SVG, confirm the member is happy with the face, then take this out of draft. Re-roll by re-running the *Regenerate avatar* workflow.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )"
          if url="$(gh pr create --draft --base "$BASE" --head "$branch" \
              --title "Regenerate avatar: ${HANDLE}" --body "$body")"; then
            {
              echo "## Avatar — ${HANDLE}"
              echo ""
              echo "Opened a draft PR with the regenerated avatar:"
              echo ""
              echo "**[${url}](${url})**"
              echo ""
              echo "_Review the SVG, then take the PR out of draft._"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # ::error:: not ::warning:: — the step exits 1, so the annotation
            # severity should match the failed job.
            echo "::error::Could not open the PR automatically. The branch '${branch}' IS pushed — enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', then open a PR from that branch into ${BASE}."
            exit 1
          fi
          # A GITHUB_TOKEN-opened PR triggers no workflow, so without the PAT
          # the required checks never run and the PR can't satisfy branch
          # protection. Say so loudly (mirrors log-print-result.yml).
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::warning::REGEN_TOKEN is not set, so this PR was created with GITHUB_TOKEN and CI will not auto-run on it. Push any commit (or set REGEN_TOKEN — a fine-grained PAT with contents + pull-requests write) to trigger the required checks."
          fi
