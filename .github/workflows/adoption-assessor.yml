name: Adoption-study assessor (scheduled advisory verdicts)

# The scheduled heartbeat for the adoption-study assessor
# (docs/adoption-study-assessor-proposal.md). On a daily cadence it reads the
# open `adoption-study` issues that carry no `disposition:*` label (the
# "awaiting a disposition" set — docs/adoption-studies.md) and posts ONE
# advisory split-verdict comment per study: the redundant / additive /
# where-integration reading plus qualifying questions, modelled on the worked
# example (issue #332). A human then applies the `disposition:*` label.
#
# Before the agent runs, a TRUSTED workflow step (scripts/assessor-context.sh)
# fetches each selected study's vendor repository into .assessor-context/<n>/ so
# the assessor compares the tool against the bench at a FEATURE and
# CODE/FUNCTIONAL level — against the vendor's actual source, not only the
# vendor's prose about it. The fetch is done here, in trusted bash, exactly the
# way oracle.yml assembles .oracle-context/: the agent has NO network, NO git,
# NO gh (all denied in the backstop) and only READS the fetched files, so this
# adds no tool and does not widen the prompt-injection blast radius.
#
# THE ONE BOUNDARY (docs/adoption-study-assessor-proposal.md): the assessor
# produces an advisory disposition a HUMAN acts on. It NEVER applies a label
# (not even the advisory `disposition:*` ones), never decides adoption, never
# crosses the license boundary (#160), and never merges / pushes / opens a PR.
# Its single write is the drafted split-verdict COMMENT, through the ambient
# GITHUB_TOKEN — which triggers no workflow, exactly right here: the assessor
# informs, it does not re-trigger anything.
#
# This is the SIBLING of backlog-burn.yml, design-run.yml, chunker.yml,
# labeler.yml and product-scout.yml. It shares their config parser, their
# two-key safety model and — since issue #544 Part B — their cross-provider
# chain walk (one run step per registry link, the GLM head then the Anthropic
# tail). Like the labeler it has a trusted Select step that hands the agent
# only a bounded set of issue numbers; unlike the labeler its one write is
# COMMENTING on an existing issue, never editing its labels.
#
# WHERE THE CONFIG LIVES (deliberate split, identical to the siblings):
#   * Policy → committed, git-tracked: .github/adoption-assessor.conf holds
#     `enabled`, the `provider` (the walk's HEAD) and the `cadence`. Change it
#     with a reviewed one-line PR; a clone carries it.
#   * Live arming / kill switch → the ADOPTION_ASSESSOR_ENABLED repo variable, a
#     fast human-only toggle (Settings → Secrets and variables → Actions →
#     Variables). Not in git on purpose: arming an agent that reads untrusted
#     issue text and writes a comment should be a conscious act a fresh
#     clone/fork can't inherit, and flipping it off halts the routine in seconds
#     without a PR. SHIPPED DISARMED — the variable is unset by default.
#   * Cadence → the `cron` literal below. Actions cannot read a file or variable
#     for on.schedule, so the schedule must be literal here — kept in sync with
#     the `cadence:` key in .github/adoption-assessor.conf.
#
# Safety properties (same as the siblings, plus the assessor's own bounds):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     ADOPTION_ASSESSOR_ENABLED == 'true'. Either off → inert.
#   * AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses this workflow's AI job with a single ::notice:: —
#     grey, never red, no provider call, no escalation. Orthogonal to the
#     arming variable: it overrides an armed routine without touching it.
#   * Advisory-only + bounded: the run's write surface is the MCP tool
#     post_adoption_disposition, which hardcodes the advisory framing, requires
#     the `adoption-study` label, applies NO label, and caps dispositions per
#     run. The agent is handed only the trusted Select step's bounded issue set.
#   * The assessor's deny backstop (.claude/adoption-assessor-settings.json, via
#     --settings) neutralizes the additive settings.json allows (chunk-helper,
#     label-helper AND scout-helper — none is the assessor's surface), kept
#     honest by scripts/adoption-assessor-perms-check.sh.
#   * Every link of the walk carries the SAME surface, backstop, bounded issue
#     set and prompt — only the model, secret and endpoint differ per step.

on:
  schedule:
    # Daily at 06:37 UTC — a filed study should not wait up to a week for its
    # draft verdict, so the assessor sweeps the awaiting set every morning; 06:37
    # stays the off-peak slot after Reeve's daily 05:53 bench-health report, so a
    # freshly-drafted disposition shows up in the next report. A daily sweep is
    # idempotent: the MCP write tool's duplicate guard makes an already-assessed
    # study a no-op. Cron must be a literal — Actions evaluates no files or
    # variables for on.schedule — so change the cadence by editing this line in a
    # one-line PR (and the `cadence:` key in .github/adoption-assessor.conf to
    # match). The two-key guard (ADOPTION_ASSESSOR_ENABLED + committed
    # `enabled: true`) keeps the schedule harmless until deliberately armed.
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log the awaiting studies, but do not invoke the assessor'
        type: boolean
        default: false

# Scoped to what the unattended assessor actually does: it reads the repo to run
# the skill (contents:read) and posts a comment on an issue (issues:write). It
# pushes no branch and opens no PR, so it needs NEITHER contents:write NOR
# pull-requests:write — the same deliberately tight grant as the labeler and
# scout. The provider-triage step's one escalation (a deduped needs-decision
# issue on a human-fixable provider failure) is an issue write too, so
# issues:write covers the whole job. The job is off unless
# ADOPTION_ASSESSOR_ENABLED is set AND the committed config says enabled, and
# the writing steps are skipped without a provider secret, so even these grants
# sit idle until the routine is deliberately switched on.
permissions:
  contents: read
  issues: write

# Never run two assessors at once — this group serializes THIS workflow with
# itself (the siblings use their own group strings, so it does not serialize
# against them). Do not cancel an in-flight run.
concurrency:
  group: adoption-assessor
  cancel-in-progress: false

jobs:
  assess:
    name: Draft advisory dispositions on awaiting adoption studies
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries a write scope and
    # a secret, and workflow_dispatch can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill code with the
    # secret. On schedule github.ref_name is already the default branch, so this
    # only ever blocks a hand-dispatch against a non-default ref.
    # Plus the AI andon cord (docs/andon-cord.md): AI_ANDON_CORD == 'pulled'
    # skips this job grey — the disarmed-notice sibling explains the pull.
    if: >-
      vars.ADOPTION_ASSESSOR_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Job budget 60 = head-step timeout (30) + one tail-step timeout (25)
    # + 5 min headroom. The GLM head keeps main's WHOLE pre-#544 job budget
    # (30): a per-step cap below it would kill a legitimately long
    # assessor run, read the kill as a failed link and re-run the whole
    # thing on the tail — the common path must not pay for the fallback. The
    # Anthropic tail links are budgeted shorter (25 each) on purpose (Part
    # A's "tail shorter than head" shape): they exist for the fast failures a
    # dead head produces, not for a second full run. So the budget fits
    # exactly ONE stalled head link (30 — a model stall, not the seconds a
    # quota/billing rejection takes) plus ONE full tail link (25) plus the
    # pre-run steps; two consecutive stalls are NOT budgeted — a second
    # stalled link dies with the job — because a stall is a provider-wide
    # symptom, and the tail exists for the fast failures. The walk is
    # three run steps in a row (the GLM head, then the two-link
    # Anthropic tail — issue #544 Part B); a run reads up to LIMIT studies
    # plus their fetched vendor trees at --effort high. The per-step timeouts are what keep a hung assessor
    # from holding a runner and a secret past its budget, unwatched.
    # Well inside GitHub's 360-minute hosted-job cap (the drift guard pins
    # <= 360 and >= head + tail + 5).
    timeout-minutes: 60
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's run steps gate on
      # their own) plus `key_present` = either one (the any-key gate the
      # context, triage, red and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed, merged
          # skill — never a dispatched branch's version. The agent reads
          # untrusted issue text, so it must run trusted base tooling.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the config parser
        # The assessor reuses the backlog burn's config parser verbatim (only the
        # `enabled`/`provider`/`cadence` keys — it has no selector).
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/adoption-assessor.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed or
        # typo'd config (bad key, unknown provider) fails this step loudly rather
        # than running on a policy nobody wrote. The conf's `provider:` is the
        # walk's HEAD provider (issue #544) — validated here, emitted for the
        # resolve step's shape check and the summary. Key presence is emitted
        # PER PROVIDER (each provider's run steps gate on their own, so the
        # tail can run when the head's key is absent) plus the any-key
        # `key_present` the context / triage / red / skip-notice gates read.
        # The model itself is NOT decided here — it comes from the registry
        # chain below.
        run: |
          set -euo pipefail
          conf=.github/adoption-assessor.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the assessor's model chain from the committed provider/model
      # registry (issue #206) — the same resolve step the scout and the labeler
      # run, stdlib-only so it needs no install in front of it. A malformed
      # registry, or one whose `adoption-assessor` chain went missing, fails
      # this step loudly BEFORE any key is spent — and is caught pre-merge by
      # the model-registry drift-guard tests, which fire on this workflow and
      # on registry.conf. `link<N>_model` is what the run steps below read; the
      # secret stays literal per step (the Actions constraint), so the registry
      # decides the model, never the auth.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal run steps
      # — its layout, one provider per step in file order (one Z.AI GLM step,
      # then two Anthropic steps), because Actions can only reference a secret
      # by its literal name — while the registry picks the MODEL each step
      # runs. A link on the wrong slot's provider (claude-* on the Z.AI step,
      # glm-* on an Anthropic step) would fail at request time with a key
      # already spent, and a chain longer or shorter than the walk leaves a
      # step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring.
      - name: Resolve the assessor model chain (issue #206)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve adoption-assessor --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/adoption-assessor.conf)"
          # One layout entry per run step below, in file order.
          python3 -m model_registry shape adoption-assessor --head "$conf_provider" \
            --conf .github/adoption-assessor.conf --layout zai,anthropic,anthropic

      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/adoption-assessor.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select awaiting adoption studies
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Cap the discovery list so a bad run touches a bounded set.
          LIMIT: '15'
        run: |
          set -euo pipefail
          # "Awaiting a disposition" = an OPEN `adoption-study` issue carrying
          # NEITHER disposition label (docs/adoption-studies.md). This runs in the
          # TRUSTED workflow context (github.token), not the agent — the agent is
          # handed only the resulting numbers, so a prompt-injected run cannot
          # widen its own candidate set. gh injects the repo + issue scope, so the
          # negative-only search is correct here.
          list="$(gh issue list \
            --state open \
            --label adoption-study \
            --search '-label:"disposition:worth-raising" -label:"disposition:declined"' \
            --limit "$LIMIT" \
            --json number \
            --jq '.[].number')"
          # Join the one-number-per-line list into a single space-separated
          # string, e.g. "332\n341" -> "332 341".
          nums="$(printf '%s\n' "$list" | sed '/^$/d' | tr '\n' ' ' | sed 's/ *$//')"
          echo "issues=$nums" >> "$GITHUB_OUTPUT"
          {
            echo "## Adoption-study assessor — selection"
            if [ -z "$nums" ]; then
              echo "- no awaiting adoption studies (every open \`adoption-study\` issue already carries a \`disposition:*\` label)"
            else
              # Prefix each space-separated number with '#' (nums is non-empty):
              # "332 341" -> "#332 #341".
              echo "- awaiting studies to assess: #${nums// / #}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Assemble the vendor context with TRUSTED bash, before any agent starts:
      # for each selected study, fetch the vendor repository it names into
      # .assessor-context/<n>/ (scripts/assessor-context.sh — GitHub-only,
      # shallow, hooks-disabled, size-capped, and NEVER installing or running the
      # vendor package; the URL parser has a --selftest negative control). The
      # assessor then READS that tree for its feature + code/functional
      # comparison; it has no tool to fetch anything itself. A repo that is
      # private / missing / oversized degrades to a manifest note and a
      # filed-text-only verdict — a bad fetch never fails the routine. Gated to
      # the exact conditions under which SOME link of the walk can run —
      # `key_present` is the any-key output, so a keyless head with a keyed
      # tail still gets its context — and nothing is cloned for a run that is
      # about to skip. Assembled once; every link of the walk reads the same
      # tree.
      - name: Assemble vendor context for each study
        id: context
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ steps.select.outputs.issues }}
        run: |
          set -uo pipefail
          for n in $ISSUES; do
            if scripts/assessor-context.sh assemble "$n" ".assessor-context/$n"; then
              :
            else
              echo "::notice::vendor context for #$n could not be assembled — the assessor will use the filed text only"
            fi
          done
          echo "assembled vendor context under .assessor-context/ for: ${ISSUES}"

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544 Part B): link 1 is the Z.AI GLM step, links 2-3
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `adoption-assessor`
      # chain (steps.chain.outputs) picks which MODEL each link runs —
      # swapping the assessor to another model is a registry edit, not a
      # workflow edit; the resolve step above refuses a chain that does not
      # fit this layout. The committed `provider:` label names the HEAD
      # provider (link 1 must sit on it); it no longer selects a whole block.
      # Each link is gated on EVERY earlier link NOT having succeeded — a
      # skipped step's outcome is 'skipped', not 'success', so the Anthropic
      # tail runs whether the GLM link failed or was skipped for want of
      # ZAI_KEY — so the first success short-circuits the rest and a dead
      # model, or a whole dead provider, falls through instead of killing the
      # run. Each provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain is a
      # same-PR pair: add the model to the registry AND the matching run step
      # here (and its slot in the resolve step's --layout) — the drift guard
      # fails either half shipped alone.
      #
      # Failure model: the assessor carries no SHIP-LOCK lifecycle, so the
      # non-terminal links (1-2) are continue-on-error so a dead id falls
      # through, and the TERMINAL link (3) keeps none — a total-walk failure
      # then fails the step, and the job, exactly as the single step did
      # before the tail existed. The "Turn an exhausted walk red" step at the
      # end covers the one case that rule misses: a walk exhausted with the
      # tail SKIPPED (only ZAI_KEY set, the GLM link dead) has no failed
      # non-coe step to fail the job. A link that fails after posting a
      # disposition cannot double-post on the next link: the MCP write tool's
      # duplicate guard makes a re-run over the same study a no-op.
      #
      # All three steps share the pin, the write permission, the `github_token`
      # that authenticates the wrapper's gh calls, the bounded issue set and
      # the same /adoption-assessor prompt. The default GITHUB_TOKEN is fine:
      # the assessor opens no PR (a GITHUB_TOKEN comment runs no CI), so the
      # PAT reasoning the burn and design run carry does not apply.
      #
      # Tool surface: WRITING is an MCP tool (mcp__assessor__post_adoption_-
      # disposition, served by assessor_mcp.py via --mcp-config) because a split
      # verdict is rich multi-line markdown (tables, newlines), and under
      # --permission-mode dontAsk the Bash matcher denies any command whose
      # argument reads as shell structure — a JSON tool argument never touches a
      # command line, so that class of denial disappears. READING stays on the
      # narrow wrapper assessor-helper.sh (both path spellings) — trivial args
      # that pass the matcher. Plus the read-only file tools (Read/Grep/Glob),
      # which also cover the trusted vendor tree the step above assembled under
      # .assessor-context/<n>/ — the agent reads that fetched source, it never
      # fetches; never Write, never a general Bash. --settings closes the additive allow leak from
      # settings.json with the assessor's OWN deny backstop
      # (.claude/adoption-assessor-settings.json — deny beats allow from every
      # source; it denies chunk-helper, label-helper AND scout-helper, none the
      # assessor's surface), kept honest by scripts/adoption-assessor-perms-
      # check.sh. The pin is the immutable commit behind the v1 tag.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # continue-on-error so the walk reaches the tail when this id or
        # provider is dead. The step timeout is main's whole pre-#544 job
        # budget — the head is never cut short on the common path — and a
        # stall past it is exactly what the shorter tail links are for.
        timeout-minutes: 30
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check. Turning an untrusted study into a careful verdict
        # is expensive-to-be-wrong, so the head is the frontier-class GLM tier
        # (not the cheap scout tier) — which model exactly is the registry's
        # `adoption-assessor` chain's call, not this step's.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          # The assessor's WRITE surface is an MCP tool (assessor_mcp.py),
          # launched by Claude Code over a stdio pipe and inheriting this step's
          # env. It authenticates to the GitHub REST API with this token
          # (issues:write is all the job grants), so it must be exported here.
          GITHUB_TOKEN: ${{ github.token }}
          # The trusted Select step's bounded issue set, bound into the agent's
          # environment so the MCP write tool can refuse any issue not in it.
          ASSESSOR_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          # Keep the full agent transcript OUT of the public Actions log. This
          # step holds the provider key + GITHUB_TOKEN and has issues:write, and a
          # public repo's Actions log is world-readable, so dumping the whole
          # transcript is more exposure than it is worth beyond secret masking. The
          # run-outcome summary and any permission denials still surface — enough
          # to diagnose a quiet run.
          show_full_output: "false"
          claude_args: --model ${{ steps.chain.outputs.link1_model }} --effort high --permission-mode dontAsk --settings .claude/adoption-assessor-settings.json --mcp-config .claude/skills/adoption-assessor/assessor-mcp.json --allowedTools "mcp__assessor__post_adoption_disposition,Bash(.claude/skills/adoption-assessor/assessor-helper.sh:*),Bash(./.claude/skills/adoption-assessor/assessor-helper.sh:*),Read,Grep,Glob"
          prompt: "/adoption-assessor ${{ steps.select.outputs.issues }}"

      # The cross-provider tail (issue #544 Part B): links 2 and 3 of the
      # registry's `adoption-assessor` chain on Anthropic's native endpoint,
      # reached only when the GLM link did not succeed (failed, or skipped for
      # want of ZAI_KEY) and gated on the Anthropic key's own presence. Claude
      # via api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permission, github_token, effort, bounded issue set, MCP write
      # tool, wrapper read verbs, backstop, transcript posture and prompt as
      # the GLM link — only the model, secret and endpoint differ. Which model
      # runs is the registry's call.
      - name: Run via Anthropic (Claude, chain link 2)
        id: run_anthropic_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 25
        continue-on-error: true
        env:
          # Same reason as the Z.AI step: the MCP write tool inherits this env
          # and authenticates with it, and refuses any issue outside the
          # trusted Select step's set.
          GITHUB_TOKEN: ${{ github.token }}
          ASSESSOR_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Same tool surface as the Z.AI step: MCP write tool + wrapper read
          # verbs + read-only file tools + assessor deny backstop + dontAsk. Full
          # transcript kept off the public Actions log for the same reason as the
          # Z.AI step above.
          show_full_output: "false"
          claude_args: --model ${{ steps.chain.outputs.link2_model }} --effort high --permission-mode dontAsk --settings .claude/adoption-assessor-settings.json --mcp-config .claude/skills/adoption-assessor/assessor-mcp.json --allowedTools "mcp__assessor__post_adoption_disposition,Bash(.claude/skills/adoption-assessor/assessor-helper.sh:*),Bash(./.claude/skills/adoption-assessor/assessor-helper.sh:*),Read,Grep,Glob"
          prompt: "/adoption-assessor ${{ steps.select.outputs.issues }}"

      - name: Run via Anthropic (Claude, chain link 3)
        id: run_anthropic_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_anthropic_2.outcome != 'success'
        # The TERMINAL link: no continue-on-error, so the last id dying fails
        # the step (and the job) — the walk is over.
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASSESSOR_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "false"
          claude_args: --model ${{ steps.chain.outputs.link3_model }} --effort high --permission-mode dontAsk --settings .claude/adoption-assessor-settings.json --mcp-config .claude/skills/adoption-assessor/assessor-mcp.json --allowedTools "mcp__assessor__post_adoption_disposition,Bash(.claude/skills/adoption-assessor/assessor-helper.sh:*),Bash(./.claude/skills/adoption-assessor/assessor-helper.sh:*),Read,Grep,Glob"
          prompt: "/adoption-assessor ${{ steps.select.outputs.issues }}"

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUES: ${{ steps.select.outputs.issues }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected awaiting studies (${ISSUES}) but did not invoke the assessor"
          else
            echo "::notice::no key is set for ANY provider in the adoption-assessor chain (ZAI_KEY for the zai link, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — selected (${ISSUES}) but skipping the unattended assessor run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issues == ''
        run: echo "::notice::no awaiting adoption studies — every open adoption-study issue already carries a disposition:* label; nothing to assess"

      # No SHIP-LOCK lifecycle here, so the terminal link failing IS the job
      # failure — but before that stands, recover WHY the chain exhausted (the
      # agent steps hide their provider error) and route the human-fixable causes
      # — out of credit / out of tokens / bad key — to ONE deduped needs-decision
      # issue, so a scheduled red nobody watches becomes an actionable ask. A bad
      # model id or a transient blip is only diagnosed in the log. Advisory: it
      # never fails the job. Fires (always()) only when studies were selected, a
      # key was present and the walk did not succeed — the same three-link
      # walk-outcome expression the record step reports as RUN. Both keys go in
      # so classify probes both halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: adoption-assessor
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the adoption-study assessor routine
          escalate: "true"

      - name: Record the run outcome
        if: always()
        env:
          ISSUES: ${{ steps.select.outputs.issues }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#544): 'success' if ANY of the three links
          # across both providers succeeded; otherwise the outcome of the
          # LAST LINK THAT ACTUALLY RAN — the nested tail walks backwards
          # over 'skipped' links, so 'skipped' means every link was skipped
          # (no key for any provider), never "the tail had no key" after the
          # head failed. The terminal link failing fails the job; the "Turn
          # an exhausted walk red" step below covers a walk exhausted with
          # the tail skipped.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_anthropic_2.outcome }}
          L3: ${{ steps.run_anthropic_3.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::the adoption-study assessor fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served — the run is green, but the head provider is down or keyless; check its quota/key"
              fi
              break
            fi
          done
          {
            echo "## Adoption-study assessor — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/adoption-assessor.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the select step failed; see the log"
            elif [ -z "${ISSUES}" ]; then
              echo "- selected: none (every open adoption-study issue already carries a disposition:* label)"
            else
              echo "- selected awaiting studies: #${ISSUES// / #}"
              echo "- provider: ${PROVIDER} (head)"
              echo "- run step: ${RUN:-skipped} (any drafted advisory dispositions are comments on each issue thread — a human applies the disposition:* label)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Turn an exhausted walk red
        # The terminal link (3) carries no continue-on-error, so its failure
        # fails the job — but a walk that exhausted with the tail SKIPPED
        # (only ZAI_KEY set and the GLM link dead) has no failed non-coe
        # step, and would leave the run green: exactly the silent-success
        # disguise the burn's red-on-death step exists for. Restore the
        # failure last, after the triage and the record have run. Same
        # walk-outcome expression as the triage gate and RUN above.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        env:
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
        run: |
          echo "::error::the assessor agent step did not succeed on any link of the adoption-assessor chain (walk outcome: ${RUN}); failing the job so the exhaustion is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `assess` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips it
    # silently. This sibling makes that legible. No secrets, no write perms.
    # A pulled AI andon cord (docs/andon-cord.md) skips the gated job the same
    # way, so this sibling explains that too — checked first, since the cord
    # overrides an armed routine.
    if: >-
      vars.ADOPTION_ASSESSOR_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
      || vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.ADOPTION_ASSESSOR_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          if [ "${ANDON:-}" = "true" ]; then
            echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — the adoption-study assessor did not run; no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume — see docs/andon-cord.md."
          elif [ "${ARMED:-}" != "true" ]; then
            echo "::notice::the adoption-study assessor is disarmed — set the ADOPTION_ASSESSOR_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/adoption-assessor.conf; both must agree before it runs."
          else
            echo "::notice::the adoption-study assessor only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
