            # hand GNU rm an empty operand and fail the step under set -e.
            [ -n "${blob:-}" ] && rm -f -- "$blob" || true
            [ -n "${secrets:-}" ] && rm -f -- "$secrets" || true
            [ -n "${diag_out:-}" ] && rm -f -- "$diag_out" || true
          }
          trap cleanup_capture EXIT
          if ! env -u GITHUB_TOKEN -u GH_TOKEN \
              -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN \
              -u ZAI_KEY -u OPENAI_API_KEY -u OPENROUTER_API_KEY -u REGEN_TOKEN \
              -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              SECRETS_FILE="$secrets" DIAG_OUT="$diag_out" \
              START_SHA="$START_SHA" DIAG_SHA256="$DIAG_SHA256" \
              PROV_ARCHIVE_SHA256="$PROV_ARCHIVE_SHA256" RUNNER_TEMP="$RUNNER_TEMP" \
              "$blob" 1; then
            echo "::error::capture helper failed for link 1" >&2
            exit 1
          fi
          # Drop the secrets file before sealing outputs — shrink the window.
          # Keep $secrets set so the EXIT trap's rm -f is a no-op on the path.
          rm -f -- "$secrets"
          if [ ! -f "$diag_out" ] || [ -L "$diag_out" ]; then
            echo "::error::capture helper did not produce DIAG_OUT" >&2
            exit 1
          fi
          # Seal into this step's outputs — later ship links cannot rewrite them.
          echo "present=1" >> "$GITHUB_OUTPUT"
          {
            echo "diag<<DIAG_EOF_1"
            cat -- "$diag_out"
            echo "DIAG_EOF_1"
          } >> "$GITHUB_OUTPUT"


