          PAGER: cat
          GH_FORCE_TTY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          SSL_CERT_FILE: ""
          SSL_CERT_DIR: ""
          CURL_CA_BUNDLE: ""
          REQUESTS_CA_BUNDLE: ""
          NODE_EXTRA_CA_CERTS: ""
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Blank REPO_OWNER: stop_trusted must not honor a GITHUB_ENV plant
          # of an attacker login (Agentic Security Review on #963). The
          # restored script also unsets it and derives owner only from
          # GITHUB_REPOSITORY.
          REPO_OWNER: ""
