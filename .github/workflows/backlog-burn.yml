        # job itself (settle still runs via always() for lock cleanup).
        # Bundle below also uses always(), so cleanup stays reachable.
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          JOB_WINDOW_START: ${{ steps.job_window.outputs.start }}
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          SHIP_CHECK_SHA256: ${{ steps.start_ref.outputs.ship_check_sha256 }}
