name: Backlog burn (scheduled /ship-issue)

# The scheduled heartbeat for /ship-issue (issue #95). On a fixed cadence (the
# `cron` literal below — hourly as currently configured) it picks ONE open
# issue and runs /ship-issue on it unattended, leaving a draft PR for human
# review. The skill already runs the same attended or unattended and declines
# when an issue needs a human's taste — this workflow just gives it a cadence.
#
# WHERE THE CONFIG LIVES (deliberate split):
#   * Policy → committed, git-tracked: .github/backlog-burn.conf holds
#     `enabled` and the opt-in `label`, the reproducible source of truth (the
#     same idea as .github/ci-gates/registry.conf). Change it with a reviewed
#     one-line PR; a clone carries it.
#   * Live arming / kill switch → the BACKLOG_BURN_ENABLED repo variable, a
#     fast human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that opens PRs should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or
#     variable for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR.
#
# Safety properties:
#   * TWO keys must agree to run: committed `enabled: true` AND
#     BACKLOG_BURN_ENABLED == 'true'. Either off → inert.
#   * AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses this workflow's AI job with a single ::notice:: —
#     grey, never red, no provider call, no escalation. Orthogonal to the
#     arming variable: it overrides an armed routine without touching it.
#   * Opt-in per issue: the selector only picks an issue carrying the `label`
#     from the config, so nothing ships until a human curates the backlog.
#   * One issue per firing: a hard cap in the selector means a bad night costs
#     one PR, not five.
#
# Auth: the agentic run walks the registry's `backlog-burn` chain across BOTH
# providers (issue #544) — the GLM links on ZAI_KEY first, then the Anthropic
# tail on ANTHROPIC_API_KEY (a plain API key is the right fit for an unattended
# bot — pay-per-token, no subscription seat). With one key unset that
# provider's links skip and the walk continues on the other; with NEITHER set
# the job still selects and logs its pick, then emits a ::notice:: and stops —
# exactly how ci.yml skips product-page drafting without the key. So this
# workflow is useful (and testable) before any secret exists.

on:
  schedule:
    # Hourly, at :17 past the hour. An off-peak minute (not :00) to avoid
    # Actions scheduler congestion. Cron must be a literal — Actions evaluates
    # no files or variables for on.schedule — so change the cadence by editing
    # this line in a one-line PR, or via `/backlog-burn set cadence <preset>`
    # which patches it and .github/backlog-burn.conf together. Presets:
    #   hourly:       '17 * * * *'
    #   4× per day:   '17 0,6,12,18 * * *'
    #   twice daily:  '17 6,18 * * *'
    #   daily once:   '17 6 * * *'
    #   weekly:       '17 6 * * 1'
    # The two-key guard (BACKLOG_BURN_ENABLED + committed `enabled: true`)
    # ensures the schedule is harmless until deliberately armed, so firing
    # more often is safe: idle firings cost nothing.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log an issue, but do not invoke /ship-issue'
        type: boolean
        default: false

# Scoped to what the unattended /ship-issue run actually does: it pushes a
# branch (contents:write) and opens a draft PR (pull-requests:write), and
# posts its SHIP-LOCK claim and outcome (issues:write). Selection alone only
# needs reads, but permissions are per-job not per-step, and this single job
# both selects and ships. The job is off unless BACKLOG_BURN_ENABLED is set
# AND the committed config says enabled, and the writing steps are skipped
# entirely without a provider secret, so these grants sit idle until the
# routine is deliberately switched on.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two burns at once; a second nightly firing while one is still
# working would risk two runs racing for the same issue. Do not cancel an
# in-flight burn — it may be mid-ship.
concurrency:
  group: backlog-burn
  cancel-in-progress: false

jobs:
  burn:
    name: Pick one issue and run /ship-issue
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries write scopes and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector
    # code with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref
    # (matches design-run.yml and chunker.yml, and the mitigation
    # docs/actions-security.md already credits this workflow with).
    # Plus the AI andon cord (docs/andon-cord.md): AI_ANDON_CORD == 'pulled'
    # skips this job grey — the disarmed-notice sibling explains the pull.
    if: >-
      vars.BACKLOG_BURN_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Job budget 225 = 2 × ship-step timeout (105) + 15 min headroom. The walk
    # below is five ship steps in a row (three GLM links, then the Anthropic
    # tail — issue #544), each with its own 105-minute timeout, and the budget
    # must let at least ONE full fallback link complete after a head link
    # STALLS to its step timeout (a model stall or tool loop, not the seconds
    # a quota/billing rejection takes): head 105 + one fallback 105 + the
    # pre-ship steps (checkout, pip, policy, select — low single-digit minutes
    # in practice) and the lock cleanup, all inside the job. A walk of two
    # stalls in a row is not budgeted — the third link and the tail then die
    # with the job — because a stall is a provider-wide symptom, not a
    # per-model one, and the fast failures the tail exists for (429 quota,
    # 400 billing) reject in seconds. 225 sits well inside GitHub's 360-minute
    # hosted-job cap (the drift guard pins job budget <= 360 and >= longest
    # head step + longest tail step + 5 for every routine).
    # A job-level kill cancels every remaining step, so a run that died after
    # posting its SHIP-LOCK left the claim standing and starved the issue
    # (issue #312) — the ship STEP timeout dies first on purpose, keeping the
    # cleanup reachable while a hung /ship-issue (model stall, tool loop)
    # still never holds a runner and a provider-key secret for the 6-hour
    # default, unwatched, every hour.
    timeout-minutes: 225
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's ship steps gate on
      # their own) plus `key_present` = either one (the any-key gate the lock
      # cleanup, triage, red-on-death and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
      # Surfaced the same way so a step can note when the CI-triggering PAT is
      # absent — see the note on the ship steps below.
      HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill + selector — never a dispatched branch's version
          # (matches design-run.yml and chunker.yml).
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the selector
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/backlog-burn.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed
        # or typo'd config (bad key, unknown provider) fails this step loudly
        # rather than running on a policy nobody wrote. The conf's `provider:`
        # is the walk's HEAD provider (issue #544) — validated here, emitted
        # for the resolve step's shape check and the summary. Key presence is
        # emitted PER PROVIDER (each provider's ship steps gate on their own,
        # so the tail can run when the head's key is absent) plus the any-key
        # `key_present` the lock cleanup / triage / red-on-death / skip-notice
        # gates read. HAS_ANTHROPIC_KEY / HAS_ZAI_KEY come from the job env.
        run: |
          set -euo pipefail
          enabled="$(backlog-burn config --get enabled)"
          label="$(backlog-burn config --get label)"
          provider="$(backlog-burn config --get provider)"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "label=$label"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the burn's model from the committed provider/model registry
      # (issue #326) — the same resolve step auto-review.yml and
      # product-scout.yml run, stdlib-only so it needs no install in front of
      # it. A malformed registry, or one whose `backlog-burn` chain went
      # missing, fails this step loudly BEFORE any key is spent; the same
      # mismatch is caught pre-merge by the model-registry drift-guard tests,
      # which fire on this workflow and on registry.conf.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal ship steps
      # — its layout, one provider per step in file order (three Z.AI GLM
      # steps, then two Anthropic steps), because Actions can only reference a
      # secret by its literal name — while the registry picks the MODEL each
      # step runs. A link on the wrong slot's provider (claude-* on a Z.AI
      # step, glm-* on an Anthropic step) would fail at request time with a
      # key already spent, and a chain longer or shorter than the walk leaves
      # a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be ship step N's — `model-registry shape` applies
      # the same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the ship steps' actual wiring. Saying so HERE,
      # loudly, beats discovering it in the hourly run's logs.
      - name: Resolve the burn's model chain (issue #326)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve backlog-burn --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider)"
          # One layout entry per ship step below, in file order.
          python3 -m model_registry shape backlog-burn --head "$conf_provider" \
            --conf .github/backlog-burn.conf --layout zai,zai,zai,anthropic,anthropic

      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/backlog-burn.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select one eligible issue
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.policy.outputs.label }}
        run: |
          set -euo pipefail
          # `run` gathers the live snapshot (open issues + their comment
          # threads, open PRs, remote branches) and applies the policy. It
          # writes `issue=<n>` (empty when nothing is eligible) to
          # $GITHUB_OUTPUT and a markdown block to $GITHUB_STEP_SUMMARY.
          backlog-burn run --repo "$GITHUB_REPOSITORY" --label "$LABEL"

      # One explicit ship step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544): links 1-3 are the Z.AI GLM steps, links 4-5
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `backlog-burn` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # burn to another model is a registry edit, not a workflow edit (#326);
      # the resolve step above refuses a chain that does not fit this layout.
      # The committed `provider:` label names the HEAD provider (link 1 must
      # sit on it); it no longer selects a whole block. Each link is
      # continue-on-error and gated on EVERY earlier link NOT having succeeded
      # — a skipped step's outcome is 'skipped', not 'success', so the
      # Anthropic tail runs whether the GLM links failed or were skipped for
      # want of ZAI_KEY — so the first success short-circuits the rest and a
      # dead model, or a whole dead provider, falls through instead of killing
      # the run; the job goes red on the agent only when EVERY link failed —
      # the red-on-death step fires unless the walk produced a success.
      # Each provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's, so a missing key skips that
      # provider's links rather than spending an empty credential.
      # Deepening the chain (#327) is still a same-PR pair: add the model to
      # the registry AND the matching ship step here (and its slot in the
      # resolve step's --layout) in the same PR — the drift guard fails either
      # half shipped alone.
      #
      # All five steps share the pin, the write permissions, the `github_token`
      # that authenticates the action's own git push / PR creation, and the
      # same /ship-issue prompt. github_token is wired to the GH_TOKEN secret
      # (a PAT) with a fallback: a PR opened with the default GITHUB_TOKEN does
      # not itself trigger CI (the reason regen uses REGEN_TOKEN), so with
      # GH_TOKEN set the drafted PR's checks run automatically and the
      # SHIP-LOCK/PR use a token with the needed scopes; without it the routine
      # falls back to GITHUB_TOKEN exactly as before (the "Note a checkless
      # draft PR" step below says so). GH_TOKEN is the same secret
      # design-run.yml uses for this.
      #
      # The pin is the immutable commit behind the v1 tag; a moved tag must not
      # silently change what runs with write perms + a secret. Re-pin
      # deliberately to adopt a new release.

      - name: Ship via Z.AI (GLM, chain link 1)
        id: ship_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # The step must die inside a live job (step timeout < job timeout) so
        # the lock cleanup below runs as a normal step, not in a cancellation
        # grace window; continue-on-error keeps the job alive for it (the
        # "Turn a dead agentic run red" step restores the failure) and lets
        # the walk reach the next link.
        timeout-minutes: 105
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check (the endpoint uses whichever header it validates).
        # Best-effort: Anthropic doesn't officially support routing Claude Code
        # to non-Claude models, and /ship-issue is a Claude Code skill, so
        # quality may vary. Which model runs is the registry's call.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link1_model }} --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      # The GLM tail (#327): links 2 and 3 of the registry's `backlog-burn`
      # chain, reached only when every earlier link did not succeed — the
      # same env/secret/pin/prompt as link 1, only the model differs.
      - name: Ship via Z.AI (GLM, chain link 2)
        id: ship_zai_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.ship_zai_1.outcome != 'success'
        timeout-minutes: 105
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link2_model }} --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      - name: Ship via Z.AI (GLM, chain link 3)
        id: ship_zai_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.ship_zai_1.outcome != 'success'
          && steps.ship_zai_2.outcome != 'success'
        timeout-minutes: 105
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link3_model }} --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      # The cross-provider tail (issue #544): links 4 and 5 of the registry's
      # `backlog-burn` chain on Anthropic's native endpoint, reached only when
      # EVERY GLM link did not succeed (failed, or skipped for want of
      # ZAI_KEY) and gated on the Anthropic key's own presence. Claude via
      # api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permissions, github_token, effort and prompt as the GLM links —
      # only the model, secret and endpoint differ. Which model runs is the
      # registry's call (the cheap Anthropic tier, since a GLM outage shifts
      # this hourly routine's whole spend here).
      - name: Ship via Anthropic (Claude, chain link 4)
        id: ship_anthropic_4
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.ship_zai_1.outcome != 'success'
          && steps.ship_zai_2.outcome != 'success'
          && steps.ship_zai_3.outcome != 'success'
        timeout-minutes: 105
        continue-on-error: true
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link4_model }} --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      - name: Ship via Anthropic (Claude, chain link 5)
        id: ship_anthropic_5
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.ship_zai_1.outcome != 'success'
          && steps.ship_zai_2.outcome != 'success'
          && steps.ship_zai_3.outcome != 'success'
          && steps.ship_anthropic_4.outcome != 'success'
        timeout-minutes: 105
        continue-on-error: true
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link5_model }} --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      - name: Withdraw a dead run's SHIP-LOCK
        id: lock_cleanup
        # The agent posts the SHIP-LOCK claim on the selected issue but cannot
        # withdraw it when killed — the orphaned claim then excludes the issue
        # from every later selection (issue #312). The script mirrors the
        # selector's semantics and leaves a claim alone when a branch or
        # closing PR corroborates it. Ambient github.token ON PURPOSE, not the
        # GH_TOKEN PAT: GITHUB_TOKEN-authored comments never trigger
        # issue_comment workflows (decide.yml, backlog-burn-config.yml,
        # ci-gate-approve.yml) — a PAT here would.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          # .outcome, never .conclusion — continue-on-error rewrites a failed
          # step's conclusion to success; outcome keeps the real result.
          # The walk's outcome (#327, #544): 'success' if ANY of the five
          # links across both providers succeeded; otherwise the outcome of
          # the LAST LINK THAT ACTUALLY RAN. The nested tail walks backwards
          # over 'skipped' links (a provider's links are skipped when its key
          # is absent), so the walk reads 'skipped' only when EVERY link was
          # skipped — no key for any provider, the agent never ran. That
          # distinction is load-bearing: routine-lock-cleanup.sh treats
          # 'skipped' as "nothing ran, nothing to release" and no-ops. A bare
          # last-link read (`|| steps.<link5>.outcome`) reported 'skipped'
          # whenever only ZAI_KEY was set and the three GLM links FAILED
          # while the keyless Anthropic tail was skipped — so a dead run's
          # SHIP-LOCK was left standing and the issue starved, the #312
          # orphan-claim livelock through a different door. The drift guard
          # (test_routine_walk_outcome_covers_every_link) simulates every
          # outcome combination against the chain's link count and pins the
          # last-ran rule, with the bare-tail form as its negative control.
          AGENT_OUTCOME: ${{ steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_anthropic_5.outcome == 'skipped' && (steps.ship_anthropic_4.outcome == 'skipped' && (steps.ship_zai_3.outcome == 'skipped' && (steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_1.outcome || steps.ship_zai_2.outcome) || steps.ship_zai_3.outcome) || steps.ship_anthropic_4.outcome) || steps.ship_anthropic_5.outcome) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/routine-lock-cleanup.sh --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --agent-outcome "$AGENT_OUTCOME" --run-url "$RUN_URL" --routine backlog-burn

      - name: Note a checkless draft PR (no CI-triggering PAT)
        # A /ship-issue draft PR opened with the default GITHUB_TOKEN does not
        # auto-run CI, so a reviewer can't see whether the work passes. Fires
        # only when we actually shipped and GH_TOKEN was not set — the ship
        # outcome guard matters now that continue-on-error keeps the job alive
        # past a dead ship step, which opened no PR to note.
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && env.HAS_GH_TOKEN != 'true'
          && (steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_anthropic_5.outcome == 'skipped' && (steps.ship_anthropic_4.outcome == 'skipped' && (steps.ship_zai_3.outcome == 'skipped' && (steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_1.outcome || steps.ship_zai_2.outcome) || steps.ship_zai_3.outcome) || steps.ship_anthropic_4.outcome) || steps.ship_anthropic_5.outcome)) == 'success'
        run: |
          echo "::notice::the draft PR for #${{ steps.select.outputs.issue }} was opened with GITHUB_TOKEN, so CI will not auto-run on it — push any commit, or set the GH_TOKEN repo secret (a PAT with contents + pull-requests + issues write) so future ships trigger checks automatically."

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected #${ISSUE} but did not invoke /ship-issue"
          else
            echo "::notice::no key is set for ANY provider in the backlog-burn chain (ZAI_KEY for the zai links, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — selected #${ISSUE} but skipping the unattended /ship-issue run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issue == ''
        env:
          LABEL: ${{ steps.policy.outputs.label }}
        run: echo "::notice::no issue is currently eligible (nothing carrying the '${LABEL}' opt-in label is unclaimed) — nothing to ship"

      - name: Record the run outcome
        # Runs on success, failure or skip so the job summary always shows what
        # happened. This reports the *run* disposition; the authoritative
        # shipped/declined verdict and the draft-PR link are posted by
        # /ship-issue onto the issue thread itself (its §7 — the thread is the
        # only durable log), which this summary links back to.
        if: always()
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          # Distinguish a policy-step failure, a disabled routine and a failed
          # selection from a genuine empty selection — otherwise all four read
          # as "nothing eligible" (CodeRabbit review on #165).
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#327, #544) — the same five-link walk
          # expression as AGENT_OUTCOME (any link's success is the run's;
          # otherwise the last link that actually ran).
          SHIP: ${{ steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_anthropic_5.outcome == 'skipped' && (steps.ship_anthropic_4.outcome == 'skipped' && (steps.ship_zai_3.outcome == 'skipped' && (steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_1.outcome || steps.ship_zai_2.outcome) || steps.ship_zai_3.outcome) || steps.ship_anthropic_4.outcome) || steps.ship_anthropic_5.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.ship_zai_1.outcome }}
          L2: ${{ steps.ship_zai_2.outcome }}
          L3: ${{ steps.ship_zai_3.outcome }}
          L4: ${{ steps.ship_anthropic_4.outcome }}
          L5: ${{ steps.ship_anthropic_5.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          M4: ${{ steps.chain.outputs.link4_model }}
          M5: ${{ steps.chain.outputs.link5_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
          P4: ${{ steps.chain.outputs.link4_provider }}
          P5: ${{ steps.chain.outputs.link5_provider }}
          LOCK_WITHDRAWN: ${{ steps.lock_cleanup.outputs.withdrawn }}
          # $GITHUB_STEP_SUMMARY does not auto-link a bare #N, so build a real
          # link to the issue holding the authoritative verdict.
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3 4 5; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::backlog burn fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served #${ISSUE} — the run is green, but the head provider is down or keyless; check its quota/key (a provider-wide failure shifts this hourly routine's spend to the tail while it lasts)"
              fi
              break
            fi
          done
          {
            echo "## Backlog burn — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/backlog-burn.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the selector failed; see the log"
            elif [ -z "${ISSUE}" ]; then
              echo "- selected: none (nothing eligible)"
            else
              echo "- selected: [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE})"
              echo "- provider: ${PROVIDER} (head)"
              echo "- ship step: ${SHIP:-skipped} (see [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE}) for the /ship-issue verdict and any draft PR)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
              if [ "${LOCK_WITHDRAWN}" = "true" ]; then
                echo "- lock cleanup: withdrew the dead run's SHIP-LOCK on #${ISSUE} so the next firing can re-select it"
              fi
            fi
            echo ""
            echo "**Steer this routine** — comment \`/backlog-burn set <key> <value>\` (\`enabled\` · \`label\` · \`provider\` · \`cadence\`) on any issue or PR to change policy without a PR (write access required); flip the \`BACKLOG_BURN_ENABLED\` repo variable to arm or disarm it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Before failing the run, recover WHY the chain exhausted — the ship steps
      # hide their provider error — and route it: out of credit / out of tokens /
      # bad key escalate to ONE deduped needs-decision issue (so a scheduled red
      # nobody is watching becomes a human-actionable ask), a bad model id or a
      # transient blip is just diagnosed in the log. Advisory — it never fails the
      # job; the red gate below still fails it, and the lock cleanup above already
      # released the SHIP-LOCK. Same walk-exhaustion condition as that gate.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_anthropic_5.outcome == 'skipped' && (steps.ship_anthropic_4.outcome == 'skipped' && (steps.ship_zai_3.outcome == 'skipped' && (steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_1.outcome || steps.ship_zai_2.outcome) || steps.ship_zai_3.outcome) || steps.ship_anthropic_4.outcome) || steps.ship_anthropic_5.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: backlog-burn
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the backlog-burn routine (issue #${{ steps.select.outputs.issue }})
          escalate: "true"

      - name: Turn a dead agentic run red
        # continue-on-error on the ship steps keeps the cleanup above
        # reachable, but alone it would leave a dead run green — and
        # green/cancelled starvation looking like health is exactly the
        # livelock's disguise (issue #312). Restore the failure last, after
        # the cleanup and the record have run.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_anthropic_5.outcome == 'skipped' && (steps.ship_anthropic_4.outcome == 'skipped' && (steps.ship_zai_3.outcome == 'skipped' && (steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_1.outcome || steps.ship_zai_2.outcome) || steps.ship_zai_3.outcome) || steps.ship_anthropic_4.outcome) || steps.ship_anthropic_5.outcome)) != 'success'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          # The walk's outcome (#327, #544) — byte-identical to AGENT_OUTCOME
          # in the lock cleanup above (the drift guard pins that): any link's
          # success is the run's; otherwise the last link that actually ran.
          AGENT_OUTCOME: ${{ steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_anthropic_5.outcome == 'skipped' && (steps.ship_anthropic_4.outcome == 'skipped' && (steps.ship_zai_3.outcome == 'skipped' && (steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_1.outcome || steps.ship_zai_2.outcome) || steps.ship_zai_3.outcome) || steps.ship_anthropic_4.outcome) || steps.ship_anthropic_5.outcome) }}
        run: |
          echo "::error::the /ship-issue agent step for #${ISSUE} did not succeed (outcome: ${AGENT_OUTCOME}) — its SHIP-LOCK cleanup ran above; failing the job so the death is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `burn` job is gated at job level, so when the arming variable is unset
    # (the default clone/fork state) or a dispatch targets a non-default ref,
    # that job is skipped silently — no notice, no summary. This tiny sibling
    # makes the most common "why did nothing happen?" state legible. It holds no
    # secrets and no write permissions: it only annotates.
    # A pulled AI andon cord (docs/andon-cord.md) skips the gated job the same
    # way, so this sibling explains that too — checked first, since the cord
    # overrides an armed routine.
    if: >-
      vars.BACKLOG_BURN_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
      || vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.BACKLOG_BURN_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          if [ "${ANDON:-}" = "true" ]; then
            echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — the backlog burn did not run; no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume — see docs/andon-cord.md."
          elif [ "${ARMED:-}" != "true" ]; then
            echo "::notice::backlog burn is disarmed — set the BACKLOG_BURN_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/backlog-burn.conf; both must agree before it runs."
          else
            echo "::notice::backlog burn only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
