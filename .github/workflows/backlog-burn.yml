          # Reap dontAsk orphans before exec. Stricter than Bundle: a walk
          # can cd /tmp so cwd/argv filters alone miss the watcher
          # (Security Reviewer on #963). Kill ppid=1 / foreign session
          # leaders / run-*.scope after keep rules that do NOT trust:
          #   - comm (PR_SET_NAME / argv0 — spoofable, 15-byte truncated)
          #   - /home/runner/runners/*/bin/* (job-writable — plantable)
          # Keep only our process ancestors (the real Runner.Worker) and
          # root-owned system paths. Then seal + exec via unlinked O_RDONLY fd.
          # Optional 10th arg is exe path for selftests (no live /proc).
          reap_should_kill() {
            local pid="$1" ppid="$2" comm="$3" cwd="$4" cmd="$5" sid="$6" cgroup="$7" my_pgid="$8" self_pid="$9"
            local exe="${10:-}" anc
            [ -n "$pid" ] || return 1
            [ "$pid" = "$self_pid" ] && return 1
            case "$pid" in
              *[!0-9]*) return 1 ;;
            esac
            # Never kill ancestors of this shell (protects the real runner).
            anc="$self_pid"
            while [ -n "$anc" ] && [ "$anc" != "0" ] && [ "$anc" != "1" ]; do
              [ "$anc" = "$pid" ] && return 1
              anc="$(awk '/^PPid:/ { print $2; exit }' "/proc/${anc}/status" 2>/dev/null || true)"
            done
            if [ -z "$exe" ]; then
              exe="$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)"
            fi
            # Root-owned system paths only — never /home/runner (writable).
            case "$exe" in
              /usr/lib/systemd/*|/lib/systemd/*|/usr/lib/snapd/snapd)
                return 1 ;;
              /usr/bin/containerd|/usr/bin/containerd-shim*|/usr/bin/dockerd|\
              /usr/bin/dbus-daemon|/usr/sbin/dbus-daemon)
                return 1 ;;
            esac
            # ppid=1 orphan: kill even when cwd is outside workspace/temp
            # (a walk can cd /tmp and still rewrite RUNNER_TEMP by path).
            if [ "$ppid" = "1" ]; then
              return 0
            fi
            # Foreign session leader (setsid), regardless of cwd.
            if [ -n "$sid" ] && [ "$sid" = "$pid" ] && [ "$sid" != "$my_pgid" ] && [ "$sid" != "1" ] && [ "$sid" != "0" ]; then
              return 0
            fi
            case "$cgroup" in
              *run-*.scope*) return 0 ;;
            esac
            return 1
          }
          reap_agent_orphans() {
            local d pid ppid comm cwd cmd v pgid my_pgid sid cgroup exe
            local -a victims=()
            my_pgid="$(ps -o pgid= -p $$ | tr -d '[:space:]')"
            shopt -s nullglob
            for d in /proc/[0-9]*; do
              pid="${d#/proc/}"
              case "$pid" in
                *[!0-9]*) continue ;;
              esac
              ppid="$(awk '/^PPid:/ { print $2; exit }' "$d/status" 2>/dev/null || true)"
              comm="$(tr -d '\0' < "$d/comm" 2>/dev/null || true)"
              cwd="$(readlink "$d/cwd" 2>/dev/null || true)"
              cmd="$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null || true)"
              sid="$(ps -o sid= -p "$pid" 2>/dev/null | tr -d '[:space:]' || true)"
              cgroup="$(tr '\0' ' ' < "$d/cgroup" 2>/dev/null || true)"
              exe="$(readlink -f "$d/exe" 2>/dev/null || true)"
              if reap_should_kill "$pid" "$ppid" "$comm" "$cwd" "$cmd" "$sid" "$cgroup" "$my_pgid" "$$" "$exe"; then
                victims+=("$pid")
              fi
            done
            shopt -u nullglob
            if [ "${#victims[@]}" -eq 0 ]; then
              return 0
            fi
            for v in "${victims[@]}"; do
              pgid="$(ps -o pgid= -p "$v" 2>/dev/null | tr -d '[:space:]' || true)"
              if [ -n "$pgid" ] && [ "$pgid" != "$my_pgid" ] && [ "$pgid" != "1" ] && [ "$pgid" != "0" ]; then
                kill -TERM -- "-${pgid}" 2>/dev/null || true
              fi
              kill -TERM "$v" 2>/dev/null || true
            done
            sleep 1
            for v in "${victims[@]}"; do
              kill -KILL "$v" 2>/dev/null || true
            done
          }
          if [ -z "${START_SHA:-}" ]; then
            echo "::error::START_SHA is empty — the pin step did not run" >&2
            exit 1
          fi
          if [ -z "${SHIP_CHECK_SHA256:-}" ]; then
            echo "::error::SHIP_CHECK_SHA256 is empty — the pin step did not hash the script" >&2
            exit 1
          fi
          if [ -z "${SHIP_CHECK_WORKTREE:-}" ]; then
            echo "::error::SHIP_CHECK_WORKTREE is empty" >&2
            exit 1
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::RUNNER_TEMP is empty" >&2
            exit 1
          fi
          git_dir="$(/usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= rev-parse --git-dir)"
          if [ -e "${git_dir}/objects/info/alternates" ] || [ -L "${git_dir}/objects/info/alternates" ]; then
            echo "::error::refusing to restore backlog-burn-ship-check: git object alternates are present" >&2
            exit 1
          fi
          if [ -L scripts ] || [ -L scripts/backlog-burn-ship-check.sh ]; then
            echo "::error::refusing to restore backlog-burn-ship-check: scripts/ or the script is a symlink" >&2
            exit 1
          fi
          blob_tmp="$(mktemp "${RUNNER_TEMP}/backlog-burn-ship-check-blob.XXXXXX")"
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::refusing to restore backlog-burn-ship-check through a symlink" >&2
            exit 1
          fi
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:scripts/backlog-burn-ship-check.sh" > "$blob_tmp"; then
            rm -f "$blob_tmp"
            echo "::error::could not restore backlog-burn-ship-check.sh from ${START_SHA}" >&2
            exit 1
          fi
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::backlog-burn-ship-check restore did not leave a regular file" >&2
            exit 1
          fi
          restore_tmp="${RUNNER_TEMP}/backlog-burn-ship-check.sh"
          if [ -L "$restore_tmp" ]; then
            rm -f "$restore_tmp"
          fi
          mv -f "$blob_tmp" "$restore_tmp"
          if [ -L "$restore_tmp" ] || [ ! -f "$restore_tmp" ]; then
            echo "::error::backlog-burn-ship-check restore did not leave a regular file" >&2
            exit 1
          fi
          chmod +x "$restore_tmp"
          got="$(sha256sum "$restore_tmp" | awk '{print $1}')"
          if [ "$got" != "$SHIP_CHECK_SHA256" ]; then
            echo "::error::restored backlog-burn-ship-check.sh sha256 does not match the pre-agent pin" >&2
            exit 1
          fi
          reap_agent_orphans
          # Seal onto a private inode, open O_RDONLY, unlink the path, then
          # exec via the held fd. A path rewrite of restore_tmp cannot
          # redirect us; an in-place overwrite of a still-linked path also
          # cannot (Security Reviewer: /proc/self/fd/N tracks a live path
          # until unlinked). O_RDONLY so a peer opening our fd cannot write.
          sealed="$(mktemp "${RUNNER_TEMP}/backlog-burn-ship-check-sealed.XXXXXX")"
          if [ -L "$sealed" ] || [ ! -f "$sealed" ]; then
            echo "::error::refusing sealed ship-check through a symlink" >&2
            exit 1
          fi
          cp -f -- "$restore_tmp" "$sealed"
          chmod 400 "$sealed"
          got="$(sha256sum "$sealed" | awk '{print $1}')"
          if [ "$got" != "$SHIP_CHECK_SHA256" ]; then
            rm -f -- "$sealed"
            echo "::error::sealed backlog-burn-ship-check.sh sha256 does not match the pre-agent pin" >&2
            exit 1
          fi
          exec 3<"$sealed"
          rm -f -- "$sealed"
          got="$(sha256sum /proc/self/fd/3 | awk '{print $1}')"
          if [ "$got" != "$SHIP_CHECK_SHA256" ]; then
            echo "::error::sealed ship-check sha256 changed after unlink (possible orphan rewrite)" >&2
            exit 1
          fi
          exec /usr/bin/bash --noprofile --norc /proc/self/fd/3 \
            --issue "$ISSUE" \
            --run-started-at "$JOB_WINDOW_START" \
            --execution-log "${RUNNER_TEMP}/claude-execution-output.json"

      # The agent can append to GITHUB_PATH and GITHUB_ENV. Those files are
      # per-step: emptying them here would not undo PATH or BASH_ENV the
      # runner already applied. Later trusted steps in this job pin PATH
      # and the shell themselves. Label strip and lock cleanup run in the
      # settle job, on a fresh runner.
      #
      # The agent step exits 0 when the model ends its turn, even if it
      # never pushed (#538, #853). This step does not push and does not hold
      # the PAT. It restores design-run-deliver.sh (shared with design-run,
      # #861) from the commit pinned before the agent ran and runs that copy
      # with --write-bundle --routine backlog-burn. The bundle is the only
      # thing that leaves this runner. A fresh job checks the bundle and
      # pushes. The settle job leaves the SHIP-LOCK in place while that
      # metadata upload succeeded, so delivery can release it after the push.
      # A failed upload is not pending, and settle withdraws.
      #
      # The script is NOT the worktree copy. dontAsk denies cannot stop the
      # agent rewriting scripts/design-run-deliver.sh (or replacing it with a
      # symlink) before this step. Same rule as the #670 lock-cleanup
      # restore: read the blob from the commit pinned before the agent ran,
      # refuse a symlink, and execute a regular file. The copy lives in
      # $RUNNER_TEMP so a worktree symlink cannot redirect the write.
      - name: Bundle the ship commits
        id: bundle
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          DELIVER_SHA256: ${{ steps.start_ref.outputs.deliver_sha256 }}
          # The restored script lives in RUNNER_TEMP. It must operate on the
          # checkout, never on dirname($0)/.. (that is the runner work dir).
          DELIVER_WORKTREE: ${{ github.workspace }}
          # Step env wins over a GITHUB_ENV plant. The upload steps read
          # runner.temp, so the shell must write the bundle to that same path.
          RUNNER_TEMP: ${{ runner.temp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          # Step output, not GITHUB_ENV: the agent can append to GITHUB_ENV.
          # The hard-stop read uses this window and github.token, not the push PAT.
          JOB_WINDOW_START: ${{ steps.job_window.outputs.start }}
          ISSUE_READ_TOKEN: ${{ github.token }}
          # dontAsk can still see the agent append to GITHUB_ENV and
          # GITHUB_PATH (a denied tool call is not the only way it acts).
          # Step env wins over those files, and an absolute shell is looked
          # up before PATH. Empty LD_PRELOAD / BASH_ENV are ignored at
          # process start; unsetting them inside the script is too late.
          # GIT_DIR and GIT_WORK_TREE are blanked here and unset in the
          # script before git runs: an empty GIT_DIR is still set, and git
          # treats that as the git dir.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_BIN: /usr/bin/git
          GH_BIN: /usr/bin/gh
          JQ_BIN: /usr/bin/jq
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PYTHONPATH: ""
          GIT_SSH_COMMAND: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_DIR: ""
          GIT_WORK_TREE: ""
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_OBJECT_DIRECTORY: ""
          PATH: /usr/bin:/bin
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_CONFIG_PARAMETERS GIT_SSH_COMMAND GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_OBJECT_DIRECTORY || true
          if [ -z "${START_SHA:-}" ]; then
            echo "::error::START_SHA is empty — the pin step did not run" >&2
            exit 1
          fi
          if [ -z "${DELIVER_SHA256:-}" ]; then
            echo "::error::DELIVER_SHA256 is empty — the pin step did not hash the script" >&2
            exit 1
          fi
          if [ -z "${DELIVER_WORKTREE:-}" ]; then
            echo "::error::DELIVER_WORKTREE is empty" >&2
            exit 1
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::RUNNER_TEMP is empty" >&2
            exit 1
          fi
          git_dir="$(/usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= rev-parse --git-dir)"
          if [ -e "${git_dir}/objects/info/alternates" ] || [ -L "${git_dir}/objects/info/alternates" ]; then
            echo "::error::refusing to restore design-run-deliver: git object alternates are present" >&2
            exit 1
          fi
          if [ -L scripts ] || [ -L scripts/design-run-deliver.sh ]; then
            echo "::error::refusing to restore design-run-deliver: scripts/ or the script is a symlink" >&2
            exit 1
          fi
          blob_tmp="$(mktemp "${RUNNER_TEMP}/design-run-deliver-blob.XXXXXX")"
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::refusing to restore design-run-deliver through a symlink" >&2
            exit 1
          fi
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:scripts/design-run-deliver.sh" > "$blob_tmp"; then
            rm -f "$blob_tmp"
            echo "::error::could not restore design-run-deliver.sh from ${START_SHA}" >&2
            exit 1
          fi
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::design-run-deliver restore did not leave a regular file" >&2
            exit 1
          fi
          restore_tmp="${RUNNER_TEMP}/design-run-deliver.sh"
          if [ -L "$restore_tmp" ]; then
            rm -f "$restore_tmp"
          fi
          mv -f "$blob_tmp" "$restore_tmp"
          if [ -L "$restore_tmp" ] || [ ! -f "$restore_tmp" ]; then
            echo "::error::design-run-deliver restore did not leave a regular file" >&2
            exit 1
          fi
          chmod +x "$restore_tmp"
          got="$(sha256sum "$restore_tmp" | awk '{print $1}')"
          if [ "$got" != "$DELIVER_SHA256" ]; then
            echo "::error::restored design-run-deliver.sh sha256 does not match the pre-agent pin" >&2
            exit 1
          fi
          "$restore_tmp" --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --base "$START_SHA" --base-branch "$BASE_BRANCH" --run-url "$RUN_URL" \
            --routine backlog-burn --write-bundle "${RUNNER_TEMP}/backlog-burn.bundle"
          bundle_path="${RUNNER_TEMP}/backlog-burn.bundle"
          if [ -f "$bundle_path" ]; then
            captured="$(sha256sum "$bundle_path" | awk '{print $1}')"
          else
            captured=""
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            if [ -n "$captured" ] && [ -f "$bundle_path" ]; then
              echo "sha256=${captured}" >> "$GITHUB_OUTPUT"
              echo "pending=true" >> "$GITHUB_OUTPUT"
            else
              echo "sha256=" >> "$GITHUB_OUTPUT"
              echo "pending=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload the ship bundle
        if: steps.bundle.outputs.pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backlog-burn-bundle
          path: ${{ runner.temp }}/backlog-burn.bundle
          retention-days: 1
          if-no-files-found: error
        env:
          NODE_OPTIONS: ""

      - name: Record delivery metadata
        if: steps.bundle.outputs.pending == 'true'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          DELIVER_SHA256: ${{ steps.start_ref.outputs.deliver_sha256 }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          JOB_WINDOW_START: ${{ steps.job_window.outputs.start }}
          WALK_OUTCOME: ${{ steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_zai_1.outcome == 'skipped' && steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_3.outcome == 'skipped' && steps.ship_anthropic_4.outcome == 'skipped' && steps.ship_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
          RUNNER_TEMP: ${{ runner.temp }}
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          meta_dir="${RUNNER_TEMP}/backlog-burn-meta"
          mkdir -p "$meta_dir"
          meta="${meta_dir}/meta.json"
          /usr/bin/jq -n \
            --arg issue "$ISSUE" \
            --arg start_sha "$START_SHA" \
            --arg deliver_sha256 "$DELIVER_SHA256" \
            --arg bundle_sha256 "$BUNDLE_SHA256" \
            --arg job_window_start "$JOB_WINDOW_START" \
            --arg walk_outcome "$WALK_OUTCOME" \
            '{issue:$issue, start_sha:$start_sha, deliver_sha256:$deliver_sha256, bundle_sha256:$bundle_sha256, job_window_start:$job_window_start, walk_outcome:$walk_outcome}' \
            > "$meta"
          /usr/bin/jq -e '
            (.issue | test("^[0-9]+$"))
            and (.start_sha | test("^[0-9a-f]{40}$"))
            and (.deliver_sha256 | test("^[0-9a-f]{64}$"))
            and (.bundle_sha256 | test("^[0-9a-f]{64}$"))
            and (.job_window_start | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and (.walk_outcome == "success" or .walk_outcome == "failure" or .walk_outcome == "not-run")
          ' "$meta" >/dev/null

      - name: Upload the delivery metadata
        if: steps.bundle.outputs.pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backlog-burn-meta
          path: ${{ runner.temp }}/backlog-burn-meta/meta.json
          retention-days: 1
          if-no-files-found: error
        env:
          NODE_OPTIONS: ""

      - name: Note the delivery metadata upload
        id: meta_upload
        # Runs only when the upload step succeeded. Delivery treats this
        # step's success, read back from the jobs API, as the provenance
        # of backlog-burn-meta. An earlier upload by the agent makes the
        # trusted upload fail and this step does not run.
        if: steps.bundle.outputs.pending == 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Note the agent window end
        id: agent_window
        # After the bundle step's reap. The settle job strips opt-in labels
        # on the selected issue only when the bot added them inside
        # [job window start, this stamp].
        if: always()
        run: echo "end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected #${ISSUE} but did not invoke /ship-issue"
          else
            echo "::notice::no key is set for ANY provider in the backlog-burn chain (ZAI_KEY for the zai links, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — selected #${ISSUE} but skipping the unattended /ship-issue run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issue == ''
        env:
          LABEL: ${{ steps.policy.outputs.label }}
        run: echo "::notice::no issue is currently eligible (nothing carrying the '${LABEL}' opt-in label is unclaimed) — nothing to ship"

      - name: Record the run outcome
        # Runs on success, failure or skip so the job summary always shows what
        # happened. This reports the *run* disposition; the authoritative
        # shipped/declined verdict and the draft-PR link are posted by
        # /ship-issue onto the issue thread itself (its §7 — the thread is the
        # only durable log), which this summary links back to.
        if: always()
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          # Distinguish a policy-step failure, a disabled routine and a failed
          # selection from a genuine empty selection — otherwise all four read
          # as "nothing eligible" (CodeRabbit review on #165).
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#327, #544, #538) — diagnostic only. The
          # settle job reads the same value as walk_outcome. What the run
          # actually DID is that job's lock cleanup.
          SHIP: ${{ steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_zai_1.outcome == 'skipped' && steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_3.outcome == 'skipped' && steps.ship_anthropic_4.outcome == 'skipped' && steps.ship_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.ship_zai_1.outcome }}
          L2: ${{ steps.ship_zai_2.outcome }}
          L3: ${{ steps.ship_zai_3.outcome }}
          L4: ${{ steps.ship_anthropic_4.outcome }}
          L5: ${{ steps.ship_anthropic_5.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          M4: ${{ steps.chain.outputs.link4_model }}
          M5: ${{ steps.chain.outputs.link5_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
          P4: ${{ steps.chain.outputs.link4_provider }}
          P5: ${{ steps.chain.outputs.link5_provider }}
          BUNDLE_FILE: ${{ steps.bundle.outputs.pending }}
          META_UPLOADED: ${{ steps.meta_upload.outputs.ready }}
          # $GITHUB_STEP_SUMMARY does not auto-link a bare #N, so build a real
          # link to the issue holding the authoritative verdict.
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3 4 5; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::backlog burn fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served #${ISSUE} — the run is green, but the head provider is down or keyless; check its quota/key (a provider-wide failure shifts this hourly routine's spend to the tail while it lasts)"
              fi
              break
            fi
          done
          {
            echo "## Backlog burn — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/backlog-burn.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the selector failed; see the log"
            elif [ -z "${ISSUE}" ]; then
              echo "- selected: none (nothing eligible)"
            else
              echo "- selected: [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE})"
              echo "- provider: ${PROVIDER} (head)"
              echo "- ship walk: ${SHIP:-skipped} (diagnostic only)"
              if [ "${META_UPLOADED}" = "true" ]; then
                echo "- disposition: handed to the delivery workflow — the trusted metadata upload succeeded; delivery verifies the bundle and pushes"
              elif [ "${BUNDLE_FILE}" = "true" ]; then
                echo "- disposition: bundle written but the trusted metadata upload did not succeed — the settle job releases the SHIP-LOCK and fails the run"
              else
                echo "- disposition: no bundle — the settle job releases a dead SHIP-LOCK or records a decline"
              fi
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
            fi
            echo ""
            echo "**Steer this routine** — comment \`/backlog-burn set <key> <value>\` (\`enabled\` · \`label\` · \`provider\` · \`cadence\`) on any issue or PR to change policy without a PR (write access required); flip the \`BACKLOG_BURN_ENABLED\` repo variable to arm or disarm it."
          } >> "$GITHUB_STEP_SUMMARY"


  # Fresh runner: materialize sealed diag.json from burn job outputs and
  # upload. No ship orphan shares this filesystem, so the verify→upload
  # race on the agent runner cannot apply. Schema-check before upload;
  # only link-N/diag.json paths are published. Best-effort like the old
  # in-job capture path — a diag glitch must not fail a successful ship.
  upload-diag:
    name: Upload agent denial diagnostic
    needs: burn
    if: >-
      always()
      && needs.burn.result != 'skipped'
      && needs.burn.outputs.issue != ''
      && (
        needs.burn.outputs.diag_present_1 == '1'
        || needs.burn.outputs.diag_present_2 == '1'
        || needs.burn.outputs.diag_present_3 == '1'
        || needs.burn.outputs.diag_present_4 == '1'
        || needs.burn.outputs.diag_present_5 == '1'
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Materialize sealed diag.json
        id: materialize
        continue-on-error: true
        env:
          PRESENT_1: ${{ needs.burn.outputs.diag_present_1 }}
          DIAG_1: ${{ needs.burn.outputs.diag_1 }}
          PRESENT_2: ${{ needs.burn.outputs.diag_present_2 }}
          DIAG_2: ${{ needs.burn.outputs.diag_2 }}
          PRESENT_3: ${{ needs.burn.outputs.diag_present_3 }}
          DIAG_3: ${{ needs.burn.outputs.diag_3 }}
          PRESENT_4: ${{ needs.burn.outputs.diag_present_4 }}
          DIAG_4: ${{ needs.burn.outputs.diag_4 }}
          PRESENT_5: ${{ needs.burn.outputs.diag_present_5 }}
          DIAG_5: ${{ needs.burn.outputs.diag_5 }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          stage="$(mktemp -d "${RUNNER_TEMP}/backlog-burn-agent-diag-upload.XXXXXX")"
          staged=0
          for i in 1 2 3 4 5; do
            present_var="PRESENT_${i}"
            diag_var="DIAG_${i}"
            present="${!present_var-}"
            diag="${!diag_var-}"
            if [ "$present" != "1" ] || [ -z "$diag" ]; then
              continue
            fi
            mkdir -p -- "${stage}/link-${i}"
            printf '%s\n' "$diag" > "${stage}/link-${i}/diag.json"
            python3 -I -c "import json,sys; from pathlib import Path; ALLOWED={'label','log_note','denied_tools','final_assistant_message_truncated'}; p=Path(sys.argv[1]); raw=p.read_bytes(); assert len(raw)<=65536, 'diag too large'; obj=json.loads(raw.decode()); assert set(obj)==ALLOWED, 'bad keys'; assert isinstance(obj['denied_tools'], list); f=obj['final_assistant_message_truncated']; assert isinstance(f, str) and len(f)<=500" \
              "${stage}/link-${i}/diag.json"
            staged=$((staged + 1))
          done
          while IFS= read -r -d '' f; do
            rel="${f#"${stage}"/}"
            case "$rel" in
              link-[1-5]/diag.json) ;;
              *)
                echo "::error::refusing unexpected path in diag upload tree: $f" >&2
                exit 1
                ;;
            esac
          done < <(find "$stage" -type f -print0)
          if find "$stage" -type l | grep -q .; then
            echo "::error::refusing symlinks in diag upload tree" >&2
            exit 1
          fi
          if [ "$staged" -eq 0 ]; then
            echo "::error::no sealed diag.json to upload" >&2
            exit 1
          fi
          echo "stage_dir=${stage}" >> "$GITHUB_OUTPUT"
          echo "staged=${staged}" >> "$GITHUB_OUTPUT"
          echo "materialized ${staged} sealed diag.json file(s) on fresh runner"

      - name: Upload agent denial diagnostic
        if: >-
          steps.materialize.outcome == 'success'
          && steps.materialize.outputs.staged != ''
          && steps.materialize.outputs.staged != '0'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backlog-burn-agent-diag-${{ github.run_id }}
          path: |
            ${{ steps.materialize.outputs.stage_dir }}/link-1/diag.json
            ${{ steps.materialize.outputs.stage_dir }}/link-2/diag.json
            ${{ steps.materialize.outputs.stage_dir }}/link-3/diag.json
            ${{ steps.materialize.outputs.stage_dir }}/link-4/diag.json
            ${{ steps.materialize.outputs.stage_dir }}/link-5/diag.json
          if-no-files-found: ignore
          retention-days: 14


  settle:
    name: Release the SHIP-LOCK on a fresh runner
    needs: burn
    # Fresh runner. Nothing the agent wrote is on this machine, and this
    # job does not execute a worktree path. The script blob is read from
    # the run's start commit after that commit is shown to be in the
    # default-branch history.
    if: always() && needs.burn.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      delivered: ${{ steps.lock_cleanup.outputs.delivered }}
      declined: ${{ steps.lock_cleanup.outputs.declined }}
    steps:
      - name: Checkout the default branch
        if: needs.burn.outputs.start_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Strip bot-added opt-in labels
        # issues: write cannot be split into "comment" vs "labels". Deny
        # rules miss a request that does not spell the label name. This
        # step removes design-brief and autonomy-ok on the selected issue
        # only, and only when github-actions[bot] added them inside the
        # agent window — the #862 steering vector: an off-issue opt-in
        # label the agent added would steer the next firing of THIS or any
        # other label-reading routine. Other issues are left alone: every
        # workflow's GITHUB_TOKEN is that same bot, so a wider scan deletes
        # a wright sign-off. A label that was already on the selected issue
        # has an older event and stays. needs-decision is never removed.
        if: >-
          always()
          && needs.burn.outputs.enabled == 'true'
          && needs.burn.outputs.issue != ''
          && needs.burn.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          ISSUE: ${{ needs.burn.outputs.issue }}
          JOB_WINDOW_START: ${{ needs.burn.outputs.job_window_start }}
          AGENT_WINDOW_END: ${{ needs.burn.outputs.agent_window_end }}
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          # The burn job can die on its timeout before "Note the agent window
          # end" stamps AGENT_WINDOW_END. The agent cannot act after that job
          # ended, so this settle job's start is a safe upper bound.
          if [ -z "${AGENT_WINDOW_END:-}" ]; then
            AGENT_WINDOW_END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "::warning::agent window end missing — using settle start ${AGENT_WINDOW_END}"
          fi
          if [ -z "${JOB_WINDOW_START:-}" ] || [ -z "${ISSUE:-}" ]; then
            echo "::error::label strip is missing the issue or the agent window start" >&2
            exit 1
          fi
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue is not a number" >&2; exit 1 ;;
          esac
          events="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/events?per_page=100" | /usr/bin/jq -c 'add // []')"
          for label in design-brief autonomy-ok; do
            added="$(printf '%s\n' "$events" | /usr/bin/jq -r --arg label "$label" --arg since "$JOB_WINDOW_START" --arg until "$AGENT_WINDOW_END" '[.[] | select(.event=="labeled" and .label.name==$label and .actor.login=="github-actions[bot]" and .created_at >= $since and .created_at <= $until)] | length')"
            case "$added" in
              ''|*[!0-9]*) echo "::error::could not count ${label} events" >&2; exit 1 ;;
            esac
            if [ "$added" = "0" ]; then
              continue
            fi
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/labels/${label}" >/dev/null; then
              if gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/labels/${label}" --jq .name >/dev/null 2>&1; then
                echo "::error::failed to strip ${label} from #${ISSUE}" >&2
                exit 1
              fi
            fi
            echo "stripped ${label} from #${ISSUE} (bot-added during the agent window)"
          done

      - name: Withdraw a dead run's SHIP-LOCK
        id: lock_cleanup
        # The agent posts the SHIP-LOCK claim on the selected issue but cannot
        # withdraw it when killed — the orphaned claim then excludes the issue
        # from every later selection (issue #312). The script mirrors the
        # selector's semantics and leaves a claim alone when a branch or
        # closing PR corroborates it. Skipped when the trusted metadata
        # upload succeeded: delivery pushes, then releases the lock.
        # Withdrawing here would drop the claim before that push. A missing
        # upload, including a bundle the agent published under the artifact
        # name, is not pending: this step still runs. Ambient github.token ON
        # PURPOSE, not the GH_TOKEN PAT: GITHUB_TOKEN-authored comments never
        # trigger issue_comment workflows (decide.yml, backlog-burn-config.yml,
        # ci-gate-approve.yml) — a PAT here would.
        if: >-
          always()
          && needs.burn.outputs.enabled == 'true'
          && needs.burn.outputs.issue != ''
          && needs.burn.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && needs.burn.outputs.bundle_pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.burn.outputs.issue }}
          # .outcome, never .conclusion — continue-on-error rewrites a failed
          # step's conclusion to success; outcome keeps the real result.
          # The walk's three-valued outcome (#327, #544, #538), read from
          # the burn job's walk_outcome output: 'success' if ANY of the five
          # links across both providers succeeded; 'not-run' only when EVERY
          # link was skipped; 'failure' for everything else, INCLUDING an
          # exit-0 link that delivered nothing. That last fold is the #538
          # point: claude-code-action exits 0 whenever the agent ended its
          # turn without an API error, so the DISPOSITION is derived here in
          # routine-lock-cleanup.sh from what exists on GitHub (branch /
          # closing PR / stop comment), and this value is diagnostic only.
          AGENT_OUTCOME: ${{ needs.burn.outputs.walk_outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START_SHA: ${{ needs.burn.outputs.start_sha }}
          JOB_WINDOW_START: ${{ needs.burn.outputs.job_window_start }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_DIR: ""
          GIT_WORK_TREE: ""
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE || true
          if [ -z "${JOB_WINDOW_START:-}" ] || [ -z "${START_SHA:-}" ]; then
            echo "::error::JOB_WINDOW_START or START_SHA is empty" >&2
            exit 1
          fi
          case "$START_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::START_SHA is not a commit id" >&2; exit 1 ;;
          esac
          if ! /usr/bin/git --no-replace-objects cat-file -e "${START_SHA}^{commit}" 2>/dev/null; then
            echo "::error::START_SHA is not in the default-branch history — refusing to fetch it" >&2
            exit 1
          fi
          if [ "$START_SHA" != "$GITHUB_SHA" ]; then
            if ! /usr/bin/git --no-replace-objects merge-base --is-ancestor "$GITHUB_SHA" "$START_SHA"; then
              echo "::error::START_SHA is not the workflow commit or a descendant of it" >&2
              exit 1
            fi
            if ! /usr/bin/git --no-replace-objects merge-base --is-ancestor "$START_SHA" "origin/${BASE_BRANCH}"; then
              echo "::error::START_SHA is not on ${BASE_BRANCH}" >&2
              exit 1
            fi
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::RUNNER_TEMP is empty" >&2
            exit 1
          fi
          # mktemp→mv (same discipline as design-run-deliver restore): never
          # redirect onto a fixed path that may already be a symlink the
          # shell would follow. #923.
          blob_tmp="$(mktemp "${RUNNER_TEMP}/routine-lock-cleanup-blob.XXXXXX")"
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::refusing to restore lock-cleanup through a symlink" >&2
            exit 1
          fi
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:scripts/routine-lock-cleanup.sh" > "$blob_tmp"; then
            rm -f "$blob_tmp"
            echo "::error::could not restore routine-lock-cleanup.sh from ${START_SHA}" >&2
            exit 1
          fi
          script="${RUNNER_TEMP}/routine-lock-cleanup.sh"
          if [ -L "$script" ]; then
            rm -f "$script"
          fi
          mv -f "$blob_tmp" "$script"
          if [ -L "$script" ] || [ ! -f "$script" ]; then
            echo "::error::lock-cleanup restore did not leave a regular file" >&2
            exit 1
          fi
          chmod +x "$script"
          "$script" --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --agent-outcome "$AGENT_OUTCOME" --run-url "$RUN_URL" --routine backlog-burn \
            --run-started-at "$JOB_WINDOW_START"

      - name: Turn a dead agentic run red
        # continue-on-error on the ship steps keeps this job reachable,
        # but alone it would leave a dead run green — and green/cancelled
        # starvation looking like health is exactly the livelock's disguise
        # (issue #312). #538: the gate reads the lock cleanup's
        # artifact-derived disposition, never the walk's outcome string.
        # bundle_pending is the trusted metadata upload, so a bundle the
        # agent published without that upload still fails here.
        if: >-
          always()
          && needs.burn.outputs.enabled == 'true'
          && needs.burn.outputs.issue != ''
          && needs.burn.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.lock_cleanup.outputs.delivered != 'true'
          && steps.lock_cleanup.outputs.declined != 'true'
          && needs.burn.outputs.bundle_pending != 'true'
        env:
          ISSUE: ${{ needs.burn.outputs.issue }}
          AGENT_OUTCOME: ${{ needs.burn.outputs.walk_outcome }}
        run: |
          echo "::error::the /ship-issue run for #${ISSUE} neither delivered nor declined (ship walk: ${AGENT_OUTCOME} — diagnostic only) — its SHIP-LOCK cleanup ran above; failing the job so the death is visible"
          exit 1

  triage:
    name: Diagnose an exhausted chain (billing / tokens / technical)
    needs: [burn, settle]
    # Fresh runner. The agent's workspace is not on this machine. Checkout
    # is START_SHA, verified against this workflow's commit. The andon leg
    # is on the job: this step spends ZAI_KEY and ANTHROPIC_API_KEY.
    # Emptying GITHUB_PATH here would not undo an agent plant: those files
    # belong to the run job's runner, which this job does not share.
    if: >-
      always()
      && needs.burn.result != 'skipped'
      && needs.burn.outputs.enabled == 'true'
      && needs.burn.outputs.key_present == '1'
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.burn.outputs.start_sha }}

      - name: Verify the triage checkout
        id: verify_triage
        env:
          START_SHA: ${{ needs.burn.outputs.start_sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          BASH_ENV: ""
          ENV: ""
          GIT_DIR: ""
          GIT_WORK_TREE: ""
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE || true
          if [ -z "${START_SHA:-}" ]; then
            echo "::error::START_SHA is empty — provider-triage was not checked out" >&2
            exit 1
          fi
          case "$START_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::START_SHA is not a commit id" >&2; exit 1 ;;
          esac
          head_now="$(/usr/bin/git --no-replace-objects rev-parse HEAD)"
          if [ "$head_now" != "$START_SHA" ]; then
            echo "::error::checkout HEAD is not START_SHA" >&2
            exit 1
          fi
          if [ "$START_SHA" != "$GITHUB_SHA" ]; then
            if ! /usr/bin/git --no-replace-objects merge-base --is-ancestor "$GITHUB_SHA" "$START_SHA"; then
              echo "::error::START_SHA is not the workflow commit or a descendant of it" >&2
              exit 1
            fi
            if ! /usr/bin/git --no-replace-objects merge-base --is-ancestor "$START_SHA" "origin/${BASE_BRANCH}"; then
              echo "::error::START_SHA is not on ${BASE_BRANCH}" >&2
              exit 1
            fi
          fi
          if [ ! -f .github/actions/provider-triage/action.yml ]; then
            echo "::error::provider-triage action is missing from START_SHA" >&2
            exit 1
          fi

      # Before failing the run, recover WHY the chain exhausted — the ship steps
      # hide their provider error — and route it: out of credit / out of tokens /
      # bad key escalate to ONE deduped needs-decision issue (so a scheduled red
      # nobody is watching becomes a human-actionable ask), a bad model id or a
      # transient blip is just diagnosed in the log. Advisory — it never fails
      # the job; the red gate in the settle job still fails it, and the lock
      # cleanup there already released the SHIP-LOCK. Same disposition
      # condition as this gate.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && needs.burn.outputs.enabled == 'true'
          && needs.burn.outputs.issue != ''
          && needs.burn.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && needs.settle.outputs.delivered != 'true'
          && needs.settle.outputs.declined != 'true'
          && needs.burn.outputs.bundle_pending != 'true'
          && steps.verify_triage.outcome == 'success'
        uses: ./.github/actions/provider-triage
        env:
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PATH: /usr/bin:/bin
        with:
          chain: backlog-burn
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          # Quoted: unquoted, YAML reads " #" as a comment and the issue number
          # never reaches the escalation (#637 read "(issue —").
          context: "the backlog-burn routine (issue #${{ needs.burn.outputs.issue }})"
          escalate: "true"

  disarmed-notice:
    name: Explain a disarmed run
    # The `burn` job is gated at job level, so when the arming variable is unset
    # (the default clone/fork state) or a dispatch targets a non-default ref,
    # that job is skipped silently — no notice, no summary. This tiny sibling
    # makes the most common "why did nothing happen?" state legible. It holds no
    # secrets and no write permissions: it only annotates.
    # A pulled AI andon cord (docs/andon-cord.md) skips the gated job the same
    # way, so this sibling explains that too — checked first, since the cord
    # overrides an armed routine.
    if: >-
      vars.BACKLOG_BURN_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
      || vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.BACKLOG_BURN_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          if [ "${ANDON:-}" = "true" ]; then
            echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — the backlog burn did not run; no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume — see docs/andon-cord.md."
          elif [ "${ARMED:-}" != "true" ]; then
            echo "::notice::backlog burn is disarmed — set the BACKLOG_BURN_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/backlog-burn.conf; both must agree before it runs."
          else
            echo "::notice::backlog burn only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
