name: Backlog burn (scheduled /ship-issue)

# The scheduled heartbeat for /ship-issue (issue #95). On a fixed cadence (the
# `cron` literal below — hourly as currently configured) it picks ONE open
# issue and runs /ship-issue on it unattended, leaving a draft PR for human
# review. The skill already runs the same attended or unattended and declines
# when an issue needs a human's taste — this workflow just gives it a cadence.
#
# WHERE THE CONFIG LIVES (deliberate split):
#   * Policy → committed, git-tracked: .github/backlog-burn.conf holds
#     `enabled` and the opt-in `label`, the reproducible source of truth (the
#     same idea as .github/ci-gates/registry.conf). Change it with a reviewed
#     one-line PR; a clone carries it.
#   * Live arming / kill switch → the BACKLOG_BURN_ENABLED repo variable, a
#     fast human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that opens PRs should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or
#     variable for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR.
#
# Safety properties:
#   * TWO keys must agree to run: committed `enabled: true` AND
#     BACKLOG_BURN_ENABLED == 'true'. Either off → inert.
#   * Opt-in per issue: the selector only picks an issue carrying the `label`
#     from the config, so nothing ships until a human curates the backlog.
#   * One issue per firing: a hard cap in the selector means a bad night costs
#     one PR, not five.
#
# Auth: the agentic run uses the existing ANTHROPIC_API_KEY secret (a plain
# API key is the right fit for an unattended bot — pay-per-token, no
# subscription seat). With that secret unset the job still selects and logs
# its pick, then emits a ::notice:: and stops — exactly how ci.yml skips
# product-page drafting without the key. So this workflow is useful (and
# testable) before any secret exists.

on:
  schedule:
    # Hourly, at :17 past the hour. An off-peak minute (not :00) to avoid
    # Actions scheduler congestion. Cron must be a literal — Actions evaluates
    # no files or variables for on.schedule — so change the cadence by editing
    # this line in a one-line PR, or via `/backlog-burn set cadence <preset>`
    # which patches it and .github/backlog-burn.conf together. Presets:
    #   hourly:       '17 * * * *'
    #   4× per day:   '17 0,6,12,18 * * *'
    #   twice daily:  '17 6,18 * * *'
    #   daily once:   '17 6 * * *'
    #   weekly:       '17 6 * * 1'
    # The two-key guard (BACKLOG_BURN_ENABLED + committed `enabled: true`)
    # ensures the schedule is harmless until deliberately armed, so firing
    # more often is safe: idle firings cost nothing.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log an issue, but do not invoke /ship-issue'
        type: boolean
        default: false

# Scoped to what the unattended /ship-issue run actually does: it pushes a
# branch (contents:write) and opens a draft PR (pull-requests:write), and
# posts its SHIP-LOCK claim and outcome (issues:write). Selection alone only
# needs reads, but permissions are per-job not per-step, and this single job
# both selects and ships. The job is off unless BACKLOG_BURN_ENABLED is set
# AND the committed config says enabled, and the writing step is skipped
# entirely without the ANTHROPIC_API_KEY secret, so these grants sit idle
# until the routine is deliberately switched on.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two burns at once; a second nightly firing while one is still
# working would risk two runs racing for the same issue. Do not cancel an
# in-flight burn — it may be mid-ship.
concurrency:
  group: backlog-burn
  cancel-in-progress: false

jobs:
  burn:
    name: Pick one issue and run /ship-issue
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries write scopes and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector
    # code with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref
    # (matches design-run.yml and chunker.yml, and the mitigation
    # docs/actions-security.md already credits this workflow with).
    if: >-
      vars.BACKLOG_BURN_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Job budget 120 = ship step 105 + 15 min headroom: the pre-ship steps
    # (checkout, pip, policy, select — low single-digit minutes in practice)
    # and the lock cleanup must both fit inside it, so the job timeout can
    # never fire before the ship step's own timeout does.
    # A job-level kill cancels every remaining step, so a run that died after
    # posting its SHIP-LOCK left the claim standing and starved the issue
    # (issue #312) — the ship STEP timeout dies first on purpose, keeping the
    # cleanup reachable while a hung /ship-issue (model stall, tool loop)
    # still never holds a runner and a provider-key secret for the 6-hour
    # default, unwatched, every hour.
    timeout-minutes: 120
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these + the configured provider into a single
      # `key_present` output.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
      # Surfaced the same way so a step can note when the CI-triggering PAT is
      # absent — see the note on the ship steps below.
      HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill + selector — never a dispatched branch's version
          # (matches design-run.yml and chunker.yml).
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the selector
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/backlog-burn.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed
        # or typo'd config (bad key, unknown provider) fails this step loudly
        # rather than running on a policy nobody wrote. It also resolves the
        # configured provider to whether *that provider's* secret is present,
        # so the ship steps below gate on one `key_present` output.
        # HAS_ANTHROPIC_KEY / HAS_ZAI_KEY come from the job-level env above.
        run: |
          set -euo pipefail
          enabled="$(backlog-burn config --get enabled)"
          label="$(backlog-burn config --get label)"
          provider="$(backlog-burn config --get provider)"
          case "$provider" in
            anthropic) [ "$HAS_ANTHROPIC_KEY" = "true" ] && key=1 || key=0 ;;
            zai)       [ "$HAS_ZAI_KEY" = "true" ]       && key=1 || key=0 ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          {
            echo "enabled=$enabled"
            echo "label=$label"
            echo "provider=$provider"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/backlog-burn.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select one eligible issue
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.policy.outputs.label }}
        run: |
          set -euo pipefail
          # `run` gathers the live snapshot (open issues + their SHIP-LOCK
          # comments, open PRs, remote branches) and applies the policy. It
          # writes `issue=<n>` (empty when nothing is eligible) to
          # $GITHUB_OUTPUT and a markdown block to $GITHUB_STEP_SUMMARY.
          backlog-burn run --repo "$GITHUB_REPOSITORY" --label "$LABEL"

      # One explicit ship step per provider — a provider is a reviewed,
      # git-tracked step because GitHub Actions can only reference a secret by
      # its literal name (secrets can't be selected by a runtime variable). The
      # committed `provider:` label picks which one runs; adding a provider is
      # a new step here. Both share the pin, the write permissions, the
      # `github_token` that authenticates the action's own git push / PR
      # creation, and the same /ship-issue prompt. github_token is wired to the
      # GH_TOKEN secret (a PAT) with a fallback: a PR opened with the default
      # GITHUB_TOKEN does not itself trigger CI (the reason regen uses
      # REGEN_TOKEN), so with GH_TOKEN set the drafted PR's checks run
      # automatically and the SHIP-LOCK/PR use a token with the needed scopes;
      # without it the routine falls back to GITHUB_TOKEN exactly as before (the
      # "Note a checkless draft PR" step below says so). GH_TOKEN is the same
      # secret design-run.yml uses for this.
      #
      # The pin is the immutable commit behind the v1 tag; a moved tag must not
      # silently change what runs with write perms + a secret. Re-pin
      # deliberately to adopt a new release.

      - name: Ship via Anthropic (Claude)
        id: ship_anthropic
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.provider == 'anthropic'
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # The step must die inside a live job (step timeout < job timeout) so
        # the lock cleanup below runs as a normal step, not in a cancellation
        # grace window; continue-on-error keeps the job alive for it (the
        # "Turn a dead agentic run red" step restores the failure).
        timeout-minutes: 105
        continue-on-error: true
        # Claude via api.anthropic.com. A plain API key (pay-per-token) is the
        # right fit for an unattended bot — no OAuth token / subscription seat.
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          # Pin the model explicitly (Opus 4.8, the maintainer's pick — PR #172
          # review) and run at maximum reasoning effort: an unattended ship run
          # is exactly the correctness-over-cost case.
          claude_args: --permission-mode bypassPermissions --model claude-opus-4-8 --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      - name: Ship via Z.AI (GLM)
        id: ship_zai
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.provider == 'zai'
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # Same as the Anthropic step: die inside a live job so the lock
        # cleanup below runs as a normal step; continue-on-error keeps the
        # job alive for it (the red-on-death step restores the failure).
        timeout-minutes: 105
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the
        # same ZAI_KEY is also passed as anthropic_api_key to satisfy the
        # action's credential check (the endpoint uses whichever header it
        # validates). Best-effort: Anthropic doesn't officially support routing
        # Claude Code to non-Claude models, and /ship-issue is a Claude Code
        # skill, so quality may vary. Change the model on the --model line.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          claude_args: --permission-mode bypassPermissions --model glm-5.2 --effort max
          prompt: "/ship-issue ${{ steps.select.outputs.issue }}"

      - name: Withdraw a dead run's SHIP-LOCK
        id: lock_cleanup
        # The agent posts the SHIP-LOCK claim on the selected issue but cannot
        # withdraw it when killed — the orphaned claim then excludes the issue
        # from every later selection (issue #312). The script mirrors the
        # selector's semantics and leaves a claim alone when a branch or
        # closing PR corroborates it. Ambient github.token ON PURPOSE, not the
        # GH_TOKEN PAT: GITHUB_TOKEN-authored comments never trigger
        # issue_comment workflows (decide.yml, backlog-burn-config.yml,
        # ci-gate-approve.yml) — a PAT here would.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          # .outcome, never .conclusion — continue-on-error rewrites a failed
          # step's conclusion to success; outcome keeps the real result.
          AGENT_OUTCOME: ${{ steps.policy.outputs.provider == 'zai' && steps.ship_zai.outcome || steps.ship_anthropic.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/routine-lock-cleanup.sh --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --agent-outcome "$AGENT_OUTCOME" --run-url "$RUN_URL" --routine backlog-burn

      - name: Note a checkless draft PR (no CI-triggering PAT)
        # A /ship-issue draft PR opened with the default GITHUB_TOKEN does not
        # auto-run CI, so a reviewer can't see whether the work passes. Fires
        # only when we actually shipped and GH_TOKEN was not set — the ship
        # outcome guard matters now that continue-on-error keeps the job alive
        # past a dead ship step, which opened no PR to note.
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && env.HAS_GH_TOKEN != 'true'
          && (steps.policy.outputs.provider == 'zai' && steps.ship_zai.outcome || steps.ship_anthropic.outcome) == 'success'
        run: |
          echo "::notice::the draft PR for #${{ steps.select.outputs.issue }} was opened with GITHUB_TOKEN, so CI will not auto-run on it — push any commit, or set the GH_TOKEN repo secret (a PAT with contents + pull-requests + issues write) so future ships trigger checks automatically."

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected #${ISSUE} but did not invoke /ship-issue"
          else
            echo "::notice::the configured provider '${PROVIDER}' has no key set (ANTHROPIC_API_KEY for anthropic, ZAI_KEY for zai) — selected #${ISSUE} but skipping the unattended /ship-issue run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issue == ''
        env:
          LABEL: ${{ steps.policy.outputs.label }}
        run: echo "::notice::no issue is currently eligible (nothing carrying the '${LABEL}' opt-in label is unclaimed) — nothing to ship"

      - name: Record the run outcome
        # Runs on success, failure or skip so the job summary always shows what
        # happened. This reports the *run* disposition; the authoritative
        # shipped/declined verdict and the draft-PR link are posted by
        # /ship-issue onto the issue thread itself (its §7 — the thread is the
        # only durable log), which this summary links back to.
        if: always()
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          # Distinguish a policy-step failure, a disabled routine and a failed
          # selection from a genuine empty selection — otherwise all four read
          # as "nothing eligible" (CodeRabbit review on #165).
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # Only the step matching the configured provider runs; the other is
          # 'skipped'. Report the one that actually ran.
          SHIP: ${{ steps.policy.outputs.provider == 'zai' && steps.ship_zai.outcome || steps.ship_anthropic.outcome }}
          LOCK_WITHDRAWN: ${{ steps.lock_cleanup.outputs.withdrawn }}
          # $GITHUB_STEP_SUMMARY does not auto-link a bare #N, so build a real
          # link to the issue holding the authoritative verdict.
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Backlog burn — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/backlog-burn.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the selector failed; see the log"
            elif [ -z "${ISSUE}" ]; then
              echo "- selected: none (nothing eligible)"
            else
              echo "- selected: [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE})"
              echo "- provider: ${PROVIDER}"
              echo "- ship step: ${SHIP:-skipped} (see [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE}) for the /ship-issue verdict and any draft PR)"
              if [ "${LOCK_WITHDRAWN}" = "true" ]; then
                echo "- lock cleanup: withdrew the dead run's SHIP-LOCK on #${ISSUE} so the next firing can re-select it"
              fi
            fi
            echo ""
            echo "**Steer this routine** — comment \`/backlog-burn set <key> <value>\` (\`enabled\` · \`label\` · \`provider\` · \`cadence\`) on any issue or PR to change policy without a PR (write access required); flip the \`BACKLOG_BURN_ENABLED\` repo variable to arm or disarm it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Turn a dead agentic run red
        # continue-on-error on the ship steps keeps the cleanup above
        # reachable, but alone it would leave a dead run green — and
        # green/cancelled starvation looking like health is exactly the
        # livelock's disguise (issue #312). Restore the failure last, after
        # the cleanup and the record have run.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.policy.outputs.provider == 'zai' && steps.ship_zai.outcome || steps.ship_anthropic.outcome) != 'success'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          AGENT_OUTCOME: ${{ steps.policy.outputs.provider == 'zai' && steps.ship_zai.outcome || steps.ship_anthropic.outcome }}
        run: |
          echo "::error::the /ship-issue agent step for #${ISSUE} did not succeed (outcome: ${AGENT_OUTCOME}) — its SHIP-LOCK cleanup ran above; failing the job so the death is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `burn` job is gated at job level, so when the arming variable is unset
    # (the default clone/fork state) or a dispatch targets a non-default ref,
    # that job is skipped silently — no notice, no summary. This tiny sibling
    # makes the most common "why did nothing happen?" state legible. It holds no
    # secrets and no write permissions: it only annotates.
    if: >-
      vars.BACKLOG_BURN_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.BACKLOG_BURN_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${ARMED:-}" != "true" ]; then
            echo "::notice::backlog burn is disarmed — set the BACKLOG_BURN_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/backlog-burn.conf; both must agree before it runs."
          else
            echo "::notice::backlog burn only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
