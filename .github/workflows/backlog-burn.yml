      # versions + sha256, fail-closed via --require-hashes --no-deps. Local
      # printcheck/stylelift are then installed --no-deps so they cannot pull
      # unpinned transitive deps (-e rejects --require-hashes).
      - name: Install preflight Python tools after disabling sudo
        id: preflight_pip
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.disable_sudo.outcome == 'success'
