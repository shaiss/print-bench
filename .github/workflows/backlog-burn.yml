          secrets="$(mktemp "${RUNNER_TEMP}/backlog-burn-diag-secrets.XXXXXX")"
          : >"$secrets"
          chmod 600 -- "$secrets"
          diag_out="$(mktemp "${RUNNER_TEMP}/backlog-burn-diag-out.XXXXXX")"
          cleanup_capture() {
