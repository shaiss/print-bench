          # GITHUB_WORKSPACE (Security Reviewer on #963).
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
