            echo "::error::restored capture helper sha256 does not match the pre-agent pin" >&2
            exit 1
          fi
          chmod +x "$blob"
          # Do NOT decrypt provider/job tokens into this step (env blanks
          # above). Pattern scrub covers ghs_/JWT/sk-ant_/sk-or_/opaque 48+
          # Z.AI-shaped keys/AWS/Bearer/URL-creds. SECRETS_FILE stays empty —
          # never copy ACTIONS_* (JWT pattern covers them; copying would
          # re-materialize runner tokens onto disk for a leftover ship child).
