      # (show_full_output stays false; the artifact is redacted denial +
      # truncated assistant message only.)

      # #962: claude-code-action exits 0 with subtype=success whenever the
      # model ends its turn without an API error (#538). A green ship step
      # with HEAD still on main and no decline used to reach settle, which
      # then redded with "neither delivered nor declined". Fail clearly
      # here — after the walk, before the bundle — unless HEAD is on
      # claude/issue-<N>-* or the thread carries an explicit stop marker
      # settle already recognizes. Also print bounded redacted diag
      # (subtype, denial tool names only, final-message len+sha256 — no text).
      #
      # The script is NOT the worktree copy. Write/Edit are allowed in the
      # ship steps, and dontAsk denies cannot stop the agent rewriting
      # scripts/backlog-burn-ship-check.sh (or replacing it with a symlink)
      # before this step runs with GH_TOKEN. Same restore discipline as the
      # design-run-deliver / routine-lock-cleanup pins: read the blob from
      # START_SHA, refuse a symlink / alternates, hash-pin against the
      # pre-agent digest, execute a regular file in $RUNNER_TEMP.
      - name: Require ship branch or explicit decline
        id: ship_outcome
        # Bound the gate (incl. diag redact): pathological eyJ input was
        # quadratic in the #953 JWT pattern (MED-B on #963). 10 min leaves
        # room for gh comment fetch + reaper; the script also hard-caps
        # redact input at ~20 KiB before any regex.
        timeout-minutes: 10
