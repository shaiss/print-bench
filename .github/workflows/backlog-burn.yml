          GIT_WORK_TREE: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_CONFIG_PARAMETERS GIT_SSH_COMMAND \
            GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_OBJECT_DIRECTORY \
            GIT_EXEC_PATH \
            GH_ENTERPRISE_TOKEN GH_CONFIG_DIR GH_FORCE_TTY \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY \
            http_proxy https_proxy all_proxy \
            SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE REQUESTS_CA_BUNDLE \
            NODE_EXTRA_CA_CERTS \
