name: Backlog burn (scheduled /ship-issue)

# The scheduled heartbeat for /ship-issue (issue #95). On a fixed cadence (the
# `cron` literal below — hourly as currently configured) it picks ONE open
# issue and runs /ship-issue on it unattended, leaving a draft PR for human
# review. The skill already runs the same attended or unattended and declines
# when an issue needs a human's taste — this workflow just gives it a cadence.
#
# WHERE THE CONFIG LIVES (deliberate split):
#   * Policy → committed, git-tracked: .github/backlog-burn.conf holds
#     `enabled` and the opt-in `label`, the reproducible source of truth (the
#     same idea as .github/ci-gates/registry.conf). Change it with a reviewed
#     one-line PR; a clone carries it.
#   * Live arming / kill switch → the BACKLOG_BURN_ENABLED repo variable, a
#     fast human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that opens PRs should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or
#     variable for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR.
#
# Safety properties:
#   * TWO keys must agree to run: committed `enabled: true` AND
#     BACKLOG_BURN_ENABLED == 'true'. Either off → inert.
#   * AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses this workflow's AI jobs with a single ::notice:: —
#     grey, never red, no provider call, no escalation. Orthogonal to the
#     arming variable: it overrides an armed routine without touching it.
#   * Opt-in per issue: the selector only picks an issue carrying the `label`
#     from the config, so nothing ships until a human curates the backlog.
#   * One issue per firing: a hard cap in the selector means a bad night costs
#     one PR, not five.
#   * The push PAT never reaches the agent (issue #863, the #859/#861 pattern):
#     the agent job below runs on github.token — contents read, issues write,
#     pull-requests read; it cannot push and cannot open a PR. The agent
#     writes a git bundle, a fresh no-agent-code job (backlog-burn-deliver.yml,
#     a workflow_run workflow) verifies it against trusted state and is the
#     only place the PAT is decrypted.
#
# Auth: the agentic run walks the registry's `backlog-burn` chain across BOTH
# providers (issue #544) — the GLM links on ZAI_KEY first, then the Anthropic
# tail on ANTHROPIC_API_KEY (a plain API key is the right fit for an unattended
# bot — pay-per-token, no subscription seat). With one key unset that
# provider's links skip and the walk continues on the other; with NEITHER set
# the job still selects and logs its pick, then emits a ::notice:: and stops —
# exactly how ci.yml skips product-page drafting without the key. So this
# workflow is useful (and testable) before any secret exists.

on:
  schedule:
    # Hourly, at :17 past the hour. An off-peak minute (not :00) to avoid
    # Actions scheduler congestion. Cron must be a literal — Actions evaluates
    # no files or variables for on.schedule — so change the cadence by editing
    # this line in a one-line PR, or via `/backlog-burn set cadence <preset>`
    # which patches it and .github/backlog-burn.conf together. Presets:
    #   hourly:       '17 * * * *'
    #   4× per day:   '17 0,6,12,18 * * *'
    #   twice daily:  '17 6,18 * * *'
    #   daily once:   '17 6 * * *'
    #   weekly:       '17 6 * * 1'
    # The two-key guard (BACKLOG_BURN_ENABLED + committed `enabled: true`)
    # ensures the schedule is harmless until deliberately armed, so firing
    # more often is safe: idle firings cost nothing.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log an issue, but do not invoke /ship-issue'
        type: boolean
        default: false

# GITHUB_TOKEN does not push. The burn job posts the SHIP-LOCK (issues: write
# is the narrowest issues scope that can comment; GitHub has no comment-only
# scope). pull-requests is read, so this token cannot open a PR. The push PAT
# is not referenced in this file at all — backlog-burn-deliver.yml, a
# workflow_run workflow with no agent code, is the only job that decrypts it
# (issue #863, the same isolation #859 gave design-run). Artifact upload uses
# the runner's ACTIONS_RUNTIME_TOKEN; it does not need actions: write, and
# that grant would reach the agent.
# The jobs are off unless BACKLOG_BURN_ENABLED is set AND
# the committed config says enabled, and the writing steps are skipped
# entirely without a provider secret, so these grants sit idle until the
# routine is deliberately switched on.
permissions:
  contents: read
  issues: write
  pull-requests: read

# Never run two burns at once; a second nightly firing while one is still
# working would risk two runs racing for the same issue. Do not cancel an
# in-flight burn — it may be mid-ship.
concurrency:
  group: backlog-burn
  cancel-in-progress: false

jobs:
  burn:
    name: Pick one issue and run /ship-issue
    outputs:
      start_sha: ${{ steps.start_ref.outputs.sha }}
      deliver_sha256: ${{ steps.start_ref.outputs.deliver_sha256 }}
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
      # True only after the trusted metadata upload. A bundle file the agent
      # uploaded under the same artifact name does not count: that upload
      # makes this step's upload fail, and delivery refuses the artifact.
      bundle_pending: ${{ steps.meta_upload.outputs.ready == 'true' && 'true' || 'false' }}
      meta_uploaded: ${{ steps.meta_upload.outputs.ready }}
      lock_uploaded: ${{ steps.lock_uploaded.outputs.ready }}
      agent_window_end: ${{ steps.agent_window.outputs.end }}
      issue: ${{ steps.select.outputs.issue }}
      job_window_start: ${{ steps.job_window.outputs.start }}
      enabled: ${{ steps.policy.outputs.enabled }}
      key_present: ${{ steps.policy.outputs.key_present }}
      # Sealed denial diagnostics — uploaded on a FRESH runner (upload-diag
      # job) so a leftover ship orphan on this runner cannot race the artifact
      # tree. Only redacted schema-checked JSON crosses the job boundary.
      diag_present_1: ${{ steps.diag_1.outputs.present }}
      diag_1: ${{ steps.diag_1.outputs.diag }}
      diag_present_2: ${{ steps.diag_2.outputs.present }}
      diag_2: ${{ steps.diag_2.outputs.diag }}
      diag_present_3: ${{ steps.diag_3.outputs.present }}
      diag_3: ${{ steps.diag_3.outputs.diag }}
      diag_present_4: ${{ steps.diag_4.outputs.present }}
      diag_4: ${{ steps.diag_4.outputs.diag }}
      diag_present_5: ${{ steps.diag_5.outputs.present }}
      diag_5: ${{ steps.diag_5.outputs.diag }}
      # The settle job's two AGENT_OUTCOME reads are this output. The drift
      # guard counts the name AGENT_OUTCOME twice in the workflow file.
      walk_outcome: ${{ steps.ship_zai_1.outcome == 'success' && 'success' || steps.ship_zai_2.outcome == 'success' && 'success' || steps.ship_zai_3.outcome == 'success' && 'success' || steps.ship_anthropic_4.outcome == 'success' && 'success' || steps.ship_anthropic_5.outcome == 'success' && 'success' || (steps.ship_zai_1.outcome == 'skipped' && steps.ship_zai_2.outcome == 'skipped' && steps.ship_zai_3.outcome == 'skipped' && steps.ship_anthropic_4.outcome == 'skipped' && steps.ship_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries write scopes and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector
    # code with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref
    # (matches design-run.yml and chunker.yml, and the mitigation
    # docs/actions-security.md already credits this workflow with).
    # Plus the AI andon cord (docs/andon-cord.md): AI_ANDON_CORD == 'pulled'
    # skips this job grey — the disarmed-notice sibling explains the pull.
    if: >-
      vars.BACKLOG_BURN_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Job budget 225 = 2 × ship-step timeout (105) + 15 min headroom. The walk
    # below is five ship steps in a row (three GLM links, then the Anthropic
    # tail — issue #544), each with its own 105-minute timeout, and the budget
    # must let at least ONE full fallback link complete after a head link
    # STALLS to its step timeout (a model stall or tool loop, not the seconds
    # a quota/billing rejection takes): head 105 + one fallback 105 + the
    # pre-ship steps (checkout, pip, policy, select — low single-digit minutes
    # in practice) and the bundle step, all inside the job. A walk of two
    # stalls in a row is not budgeted — the third link and the tail then die
    # with the job — because a stall is a provider-wide symptom, not a
    # per-model one, and the fast failures the tail exists for (429 quota,
    # 400 billing) reject in seconds. 225 sits well inside GitHub's 360-minute
    # hosted-job cap (the drift guard pins job budget <= 360 and >= longest
    # head step + longest tail step + 5 for every routine).
    # A job-level kill cancels every remaining step, so a run that died after
    # posting its SHIP-LOCK left the claim standing and starved the issue
    # (issue #312) — the ship STEP timeout dies first on purpose, keeping the
    # cleanup reachable while a hung /ship-issue (model stall, tool loop)
    # still never holds a runner and a provider-key secret for the 6-hour
    # default, unwatched, every hour. The settle job (lock cleanup, red gate)
    # runs on its own fresh runner via needs:, so it is reachable even when
    # the burn job itself is guillotined.
    timeout-minutes: 225
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's ship steps gate on
      # their own) plus `key_present` = either one (the any-key gate the lock
      # cleanup, triage, red-on-death and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill + selector — never a dispatched branch's version
          # (matches design-run.yml and chunker.yml).
          ref: ${{ github.event.repository.default_branch }}

      - name: Pin the commit this job started from
        # #670: the settle job's lock-cleanup step must run THIS commit's
        # scripts/routine-lock-cleanup.sh, never whatever the agent's walk
        # leaves in the working tree — a walk may stack its branch on an
        # older feature branch whose pre-#538 copy reads 'success' as
        # delivered and no-ops, leaving a dead run's SHIP-LOCK standing
        # (#627). Captured here, before any agent step can move HEAD or the
        # remote-tracking refs.
        id: start_ref
        run: |
          set -euo pipefail
          sha="$(git --no-replace-objects rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # Digest of the delivery-script blob before any agent step. The
          # deliver step compares the restored file to this, so a replace
          # ref or an alternate object store cannot swap the bytes. The
          # script is shared with design-run (#861) and parameterized by
          # --routine; backlog-burn hashes the same file.
          deliver_sha256="$(git --no-replace-objects show "HEAD:scripts/design-run-deliver.sh" | sha256sum | awk '{print $1}')"
          echo "deliver_sha256=${deliver_sha256}" >> "$GITHUB_OUTPUT"
          # Same pin for the post-agent denial diagnostic: capture steps must
          # never execute a worktree copy (the agent has Write/Edit).
          diag_sha256="$(git --no-replace-objects show "HEAD:scripts/backlog-burn-agent-diag.sh" | sha256sum | awk '{print $1}')"
          echo "diag_sha256=${diag_sha256}" >> "$GITHUB_OUTPUT"
          # Capture bootstrap + provenance redactor archive — same pin discipline
          # as the diag script (never execute/import worktree copies after Write/Edit).
          capture_sha256="$(git --no-replace-objects show "HEAD:scripts/backlog-burn-agent-diag-capture.sh" | sha256sum | awk '{print $1}')"
          echo "capture_sha256=${capture_sha256}" >> "$GITHUB_OUTPUT"
          prov_archive_sha256="$(git --no-replace-objects archive HEAD tools/provenance/src | sha256sum | awk '{print $1}')"
          echo "prov_archive_sha256=${prov_archive_sha256}" >> "$GITHUB_OUTPUT"
          # Same pin for the #962 post-agent ship-outcome gate: that step
          # restores scripts/backlog-burn-ship-check.sh from START_SHA into
          # RUNNER_TEMP and refuses a digest mismatch (dontAsk cannot stop
          # the agent rewriting the worktree copy before the gate runs).
          ship_check_sha256="$(git --no-replace-objects show "HEAD:scripts/backlog-burn-ship-check.sh" | sha256sum | awk '{print $1}')"
          echo "ship_check_sha256=${ship_check_sha256}" >> "$GITHUB_OUTPUT"

      - name: Prove lock-cleanup restore leaves a regular file
        # #923: fail loudly BEFORE any agent work if the settle job's
        # restore path cannot materialize routine-lock-cleanup.sh as a
        # regular file (the same mktemp→mv pattern settle uses). A restore
        # that only fails after a 15-minute ship walk wastes the firing.
        env:
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          if [ -z "${START_SHA:-}" ]; then
            echo "::error::START_SHA is empty — the pin step did not run" >&2
            exit 1
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::RUNNER_TEMP is empty" >&2
            exit 1
          fi
          blob_tmp="$(mktemp "${RUNNER_TEMP}/routine-lock-cleanup-preflight-blob.XXXXXX")"
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::lock-cleanup preflight: mktemp did not leave a regular file" >&2
            exit 1
          fi
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:scripts/routine-lock-cleanup.sh" > "$blob_tmp"; then
            rm -f "$blob_tmp"
            echo "::error::lock-cleanup preflight: could not read scripts/routine-lock-cleanup.sh from ${START_SHA}" >&2
            exit 1
          fi
          script="${RUNNER_TEMP}/routine-lock-cleanup-preflight.sh"
          if [ -L "$script" ]; then
            rm -f "$script"
          fi
          mv -f "$blob_tmp" "$script"
          if [ -L "$script" ] || [ ! -f "$script" ]; then
            echo "::error::lock-cleanup restore did not leave a regular file" >&2
            exit 1
          fi
          rm -f "$script"
          echo "lock-cleanup restore preflight ok (regular file from ${START_SHA})"

      - name: Note the job window start
        id: job_window
        # Stamped before any ship step and passed to routine-lock-cleanup as
        # --run-started-at. A claimless stop (🚢 DEFERRED, 🚢 DECLINED or
        # 🚦 DECISION NEEDED) counts as this firing's decline only when the
        # comment is strictly newer than this instant and its author is a
        # GitHub Bot or the repository owner, so a later success that posts
        # nothing cannot reuse an older stop that is still the thread's
        # latest comment, and an outsider who comments during the window
        # cannot mint a stop and skip red-on-death. The output feeds the
        # settle job and the lock artifact. An agent step can rewrite
        # GITHUB_ENV, and it cannot rewrite this step's output after the
        # step has finished.
        run: |
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "JOB_WINDOW_START=${ts}" >> "$GITHUB_ENV"
          echo "start=${ts}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # No pip install for tools/backlog-burn: it is stdlib-only (empty
      # dependencies) and runs from the checkout via PYTHONPATH, same as
      # model_registry below. A pip -e here would pull unhashed setuptools
      # via PEP 517 isolation while sudo is still live (Cipher HOLD on #878).
      - name: Read policy (.github/backlog-burn.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed
        # or typo'd config (bad key, unknown provider) fails this step loudly
        # rather than running on a policy nobody wrote. The conf's `provider:`
        # is the walk's HEAD provider (issue #544) — validated here, emitted
        # for the resolve step's shape check and the summary. Key presence is
        # emitted PER PROVIDER (each provider's ship steps gate on their own,
        # so the tail can run when the head's key is absent) plus the any-key
        # `key_present` the lock cleanup / triage / red-on-death / skip-notice
        # gates read. HAS_ANTHROPIC_KEY / HAS_ZAI_KEY come from the job env.
        env:
          PYTHONPATH: tools/backlog-burn/src
        run: |
          set -euo pipefail
          enabled="$(python3 -m backlog_burn.cli config --get enabled)"
          label="$(python3 -m backlog_burn.cli config --get label)"
          provider="$(python3 -m backlog_burn.cli config --get provider)"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "label=$label"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the burn's model from the committed provider/model registry
      # (issue #326) — the same resolve step auto-review.yml and
      # product-scout.yml run, stdlib-only so it needs no install in front of
      # it. A malformed registry, or one whose `backlog-burn` chain went
      # missing, fails this step loudly BEFORE any key is spent; the same
      # mismatch is caught pre-merge by the model-registry drift-guard tests,
      # which fire on this workflow and on registry.conf.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal ship steps
      # — its layout, one provider per step in file order (three Z.AI GLM
      # steps, then two Anthropic steps), because Actions can only reference a
      # secret by its literal name — while the registry picks the MODEL each
      # step runs. A link on the wrong slot's provider (claude-* on a Z.AI
      # step, glm-* on an Anthropic step) would fail at request time with a
      # key already spent, and a chain longer or shorter than the walk leaves
      # a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be ship step N's — `model-registry shape` applies
      # the same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the ship steps' actual wiring. Saying so HERE,
      # loudly, beats discovering it in the hourly run's logs.
      - name: Resolve the burn's model chain (issue #326)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src:tools/backlog-burn/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve backlog-burn --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(python3 -m backlog_burn.cli config --get provider)"
          # One layout entry per ship step below, in file order.
          python3 -m model_registry shape backlog-burn --head "$conf_provider" \
            --conf .github/backlog-burn.conf --layout zai,zai,zai,anthropic,anthropic

      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/backlog-burn.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select one eligible issue
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.policy.outputs.label }}
          PYTHONPATH: tools/backlog-burn/src
        run: |
          set -euo pipefail
          # `run` gathers the live snapshot (open issues + their comment
          # threads, open PRs, remote branches) and applies the policy. It
          # writes `issue=<n>` (empty when nothing is eligible) to
          # $GITHUB_OUTPUT and a markdown block to $GITHUB_STEP_SUMMARY.
          python3 -m backlog_burn.cli run --repo "$GITHUB_REPOSITORY" --label "$LABEL"

      # One explicit ship step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544): links 1-3 are the Z.AI GLM steps, links 4-5
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `backlog-burn` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # burn to another model is a registry edit, not a workflow edit (#326);
      # the resolve step above refuses a chain that does not fit this layout.
      # The committed `provider:` label names the HEAD provider (link 1 must
      # sit on it); it no longer selects a whole block. Each link is
      # continue-on-error and gated on EVERY earlier link NOT having succeeded
      # — a skipped step's outcome is 'skipped', not 'success', so the
      # Anthropic tail runs whether the GLM links failed or were skipped for
      # want of ZAI_KEY — so the first success short-circuits the rest and a
      # dead model, or a whole dead provider, falls through instead of killing
      # the run; the job goes red on the agent only when EVERY link failed —
      # the red-on-death step fires unless the walk produced a success. Each
      # provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain (#327)
      # is still a same-PR pair: add the model to the registry AND the
      # matching ship step here (and its slot in the resolve step's --layout)
      # in the same PR — the drift guard fails either half shipped alone.
      #
      # All five steps share the pin, the workflow's github.token, and the
      # same /ship-issue prompt. That token is the job token: contents read,
      # issues write, pull-requests read. It cannot push and it cannot open
      # a PR (issue #863 — this is the exposure #859 removed from
      # design-run: the PAT used to ride these steps). The push PAT is not
      # decrypted in this workflow. backlog-burn-deliver.yml holds it, pushes,
      # and opens the draft, which is what makes CI fire on the PR.
      # .claude/backlog-burn-settings.json denies `git push`, `gh pr create`,
      # and commands that add `design-brief` or `autonomy-ok` (the #862
      # steering vector). The steps use dontAsk because a bypassPermissions
      # step ignores its own denies. The allow-list stays the whole toolchain
      # (Bash plus the file tools the skill edits with).
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB drops inherited secrets from
      # subprocesses the agent spawns. sudo is disabled in the step above
      # these five; each step requires that disable to have succeeded.
      #
      # The pin is the immutable commit behind the v1 tag; a moved tag must not
      # silently change what runs with write perms + a secret. Re-pin
      # deliberately to adopt a new release.

      - name: Upload the SHIP-LOCK context
        # Before any agent step. The artifact name is taken from here on, so
        # the agent cannot replace it. Delivery reads this file for the issue
        # number when the metadata artifact is missing or untrusted.
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          JOB_WINDOW_START: ${{ steps.job_window.outputs.start }}
          PATH: /usr/bin:/bin
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          lock_dir="${RUNNER_TEMP}/backlog-burn-lock"
          mkdir -p "$lock_dir"
          /usr/bin/jq -n \
            --arg issue "$ISSUE" \
            --arg start_sha "$START_SHA" \
            --arg job_window_start "$JOB_WINDOW_START" \
            '{issue:$issue, start_sha:$start_sha, job_window_start:$job_window_start}' \
            > "$lock_dir/lock.json"
          /usr/bin/jq -e '
            (.issue | test("^[0-9]+$"))
            and (.start_sha | test("^[0-9a-f]{40}$"))
            and (.job_window_start | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
          ' "$lock_dir/lock.json" >/dev/null

      - name: Publish the SHIP-LOCK context
