      # .claude/hooks/session-start.sh would pull in. Disable-sudo runs next
      # and strips setuid from sudo, so the SessionStart hook must not need
      # apt after this step. Pip installs (printcheck/stylelift) do not need
      # root and run in a later step after sudo is disabled (#870).
      - name: Install preflight toolchain before disabling sudo
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq openscad xvfb imagemagick prusa-slicer ffmpeg gifsicle jq
          for bin in openscad xvfb-run montage ffmpeg gifsicle prusa-slicer jq; do
            command -v "$bin" >/dev/null || {
              echo "::error::preflight toolchain missing ${bin} after install" >&2
              exit 1
            }
          done

