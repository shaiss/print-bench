      # five ship steps already set — do NOT add another YAML scrub env
      # entry; the deliverer selftest pins exactly five). Record ONLY exit
      # codes + logged-in yes/no. Never print a token, never run
      # `gh auth token`, never print headers or raw gh output.
      # show_full_output stays false on every ship step.
      - name: Probe gh auth as the agent subprocess sees it
        id: gh_probe
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
