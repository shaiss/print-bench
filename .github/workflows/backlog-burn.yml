          GH_TOKEN: ""
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          ZAI_KEY: ""
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          REGEN_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          PATH: /usr/bin:/bin
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          echo "present=0" >> "$GITHUB_OUTPUT"
          if [ -z "${START_SHA:-}" ] || [ -z "${CAPTURE_SHA256:-}" ] \
              || [ -z "${DIAG_SHA256:-}" ] || [ -z "${PROV_ARCHIVE_SHA256:-}" ]; then
            echo "::error::START_SHA or pin digests empty — pin step did not run" >&2
            exit 1
          fi
          # Restore capture helper to a mktemp path (no predictable name) and
          # exec it in-place after the digest check — closes TOCTOU on a
          # well-known $RUNNER_TEMP/backlog-burn-agent-diag-capture.sh.
          blob="$(mktemp "${RUNNER_TEMP}/backlog-burn-agent-diag-capture.XXXXXX")"
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              show "${START_SHA}:scripts/backlog-burn-agent-diag-capture.sh" > "$blob"; then
            echo "::error::could not restore backlog-burn-agent-diag-capture.sh from ${START_SHA}" >&2
            exit 1
          fi
          got="$(sha256sum "$blob" | awk '{print $1}')"
