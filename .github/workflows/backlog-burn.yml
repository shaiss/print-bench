          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.ship_zai_1.outcome == 'success'
              || steps.ship_zai_2.outcome == 'success'
              || steps.ship_zai_3.outcome == 'success'
              || steps.ship_anthropic_4.outcome == 'success'
              || steps.ship_anthropic_5.outcome == 'success'
              || steps.ship_zai_1.outcome == 'failure'
              || steps.ship_zai_2.outcome == 'failure'
              || steps.ship_zai_3.outcome == 'failure'
              || steps.ship_anthropic_4.outcome == 'failure'
              || steps.ship_anthropic_5.outcome == 'failure')
