name: Smart CI gate approval

# The human half of Smart CI, driven entirely by GitHub-native signals: a
# maintainer comments `/ci-gate approve <id>` (or decline / list) on a PR, and
# this workflow authorizes them by their real repository permission, flips the
# gate's state in the committed registry, and commits that one-line change to
# the PR branch. The decision lives in git — reproducible, diffable, carried by
# a clone — while GitHub supplies the interaction and the authorization.
#
# SECURITY — this is a privileged workflow. `issue_comment` runs in the base
# repository's context with access to secrets (REGEN_TOKEN), so it must NEVER
# check out or execute code from the PR head: a malicious PR could rewrite
# `tools/ci-gates` and have a maintainer's `/ci-gate` comment run it with the
# token (the "pwn request" / untrusted-checkout TOCTOU). So:
#   * the only code this job runs is the TRUSTED tooling from the base repo
#     (actions/checkout with no `ref` gets the default branch — for an
#     issue_comment event the workflow itself is the default-branch copy);
#   * the PR branch's registry.conf is read and written as DATA through the
#     Contents API, never by checking the head out and running from it;
#   * the comment body is only ever handled inside github-script as a JS
#     string and validated against a strict pattern — never interpolated into
#     a shell command.
#
# The registry commit is authored with REGEN_TOKEN (a fine-grained PAT with
# contents:write), the same secret and reason as the regen job: a commit
# authored by a PAT re-triggers CI so smart-ci runs the newly-enabled gate,
# where a GITHUB_TOKEN-authored commit would not.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write         # react to the command, reply with the result
  pull-requests: read

concurrency:
  # Serialize commands on one PR so two approvals cannot race the commit.
  group: ci-gate-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  REGISTRY_PATH: .github/ci-gates/registry.conf

jobs:
  approve:
    name: Apply a /ci-gate command
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ci-gate')
    runs-on: ubuntu-latest
    steps:
      - name: Authorize and parse the command
        id: parse
        uses: actions/github-script@v9
        env:
          # Surfaced as an output because secrets are not readable in step `if:`
          # conditions (the regen job exposes REGEN_TOKEN presence the same way).
          # The commit uses the PAT and nothing else: a GITHUB_TOKEN commit would
          # not re-trigger CI, so without the PAT there is no point committing.
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
        with:
          script: |
            const body = context.payload.comment.body.trim();
            // Gate ids are kebab-case; the strict pattern also keeps anything
            // shell-hostile out of the values that flow into later env vars.
            const m = body.match(/^\/ci-gate\s+(approve|decline|list)(?:\s+([a-z0-9][a-z0-9-]*))?\s*$/);
            const react = (content) => github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content,
            });
            const reply = (msg) => github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `${msg}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            if (!m) {
              await react('confused');
              await reply(
                '**/ci-gate** — usage:\n'
                + '```\n/ci-gate approve <id>\n/ci-gate decline <id>\n/ci-gate list\n```'
              );
              core.setOutput('valid', 'false');
              return;
            }
            const [, action, gateId] = m;
            if (action !== 'list' && !gateId) {
              await react('confused');
              await reply(`**/ci-gate ${action}** needs a gate id, e.g. \`/ci-gate ${action} shellcheck\`.`);
              core.setOutput('valid', 'false');
              return;
            }
            // Native authorization: the commenter's real permission on this
            // repo. write/maintain/admin may change what CI enforces; everyone
            // else is refused.
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              await react('-1');
              await reply(
                `@${context.payload.comment.user.login} — \`/ci-gate\` needs write access `
                + `to this repository (you have \`${perm.permission}\`).`
              );
              core.setOutput('valid', 'false');
              return;
            }
            // The registry lives on the PR head branch. We edit it via the
            // Contents API, so the head repo must be this repo (a fork's branch
            // isn't ours to commit to). list is unaffected by that limit but is
            // held to the same bar for simplicity.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            const sameRepo = pr.head.repo
              && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              await react('-1');
              await reply(
                'This PR is from a fork, so CI cannot commit the registry change to its '
                + 'branch. Edit `.github/ci-gates/registry.conf` in the PR to cross the gate instead.'
              );
              core.setOutput('valid', 'false');
              return;
            }
            await react('eyes');
            core.setOutput('valid', 'true');
            core.setOutput('action', action);
            core.setOutput('gate_id', gateId || '');
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('have_pat', process.env.HAVE_PAT === 'true' ? 'true' : 'false');

      # TRUSTED tooling only: no `ref`, so this is the base repo's default
      # branch — the code this workflow was launched from. The PR head is never
      # checked out.
      - name: Check out trusted tooling
        if: steps.parse.outputs.valid == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: steps.parse.outputs.valid == 'true'
        with:
          python-version: '3.12'

      - name: Fetch the PR branch's registry (as data)
        id: fetch
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v9
        env:
          HEAD_REF: ${{ steps.parse.outputs.head_ref }}
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              ...context.repo, path: process.env.REGISTRY_PATH, ref: process.env.HEAD_REF,
            });
            require('fs').writeFileSync('pr-registry.conf', Buffer.from(data.content, 'base64'));
            core.setOutput('sha', data.sha);

      - name: Edit the registry with trusted code
        id: apply
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.action != 'list'
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci-gates/src
          ACTION: ${{ steps.parse.outputs.action }}
          GATE_ID: ${{ steps.parse.outputs.gate_id }}
        run: |
          set -euo pipefail
          cp pr-registry.conf pr-registry.orig
          # Trusted ci_gates edits the PR's registry FILE (data); it never runs
          # anything from the PR. A non-zero exit (unknown gate, advisory parked
          # as proposed) is reported to the commenter by the reply step.
          if out="$(python -m ci_gates "$ACTION" "$GATE_ID" --registry pr-registry.conf 2>&1)"; then
            ok=true
          else
            ok=false
          fi
          changed=false
          if [ "$ok" = true ] && ! cmp -s pr-registry.orig pr-registry.conf; then
            changed=true
          fi
          {
            echo "ok=$ok"
            echo "changed=$changed"
            echo "result<<EOF"
            printf '%s\n' "$out"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: List gates
        id: list
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.action == 'list'
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/ci-gates/src
        run: |
          set -euo pipefail
          {
            echo 'summary<<EOF'
            python -m ci_gates list --registry pr-registry.conf
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit the registry change to the PR branch
        id: commit
        # Only with the PAT: the workflow keeps contents:read, so GITHUB_TOKEN
        # cannot write, and even if it could its commit would not re-trigger CI
        # (the documented REGEN_TOKEN reason). Without the secret the reply step
        # tells the maintainer the change was computed but not committed.
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.apply.outputs.ok == 'true' &&
          steps.apply.outputs.changed == 'true' &&
          steps.parse.outputs.have_pat == 'true'
        uses: actions/github-script@v9
        env:
          HEAD_REF: ${{ steps.parse.outputs.head_ref }}
          FILE_SHA: ${{ steps.fetch.outputs.sha }}
          ACTION: ${{ steps.parse.outputs.action }}
          GATE_ID: ${{ steps.parse.outputs.gate_id }}
        with:
          github-token: ${{ secrets.REGEN_TOKEN }}
          script: |
            const content = require('fs').readFileSync('pr-registry.conf');
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: process.env.REGISTRY_PATH,
              message: `ci-gate: ${process.env.ACTION} ${process.env.GATE_ID}`,
              content: content.toString('base64'),
              sha: process.env.FILE_SHA,
              branch: process.env.HEAD_REF,
            });
            core.setOutput('pushed', 'true');

      - name: Reply with the result
        if: steps.parse.outputs.valid == 'true' && !cancelled()
        uses: actions/github-script@v9
        env:
          ACTION: ${{ steps.parse.outputs.action }}
          GATE_ID: ${{ steps.parse.outputs.gate_id }}
          HAVE_PAT: ${{ steps.parse.outputs.have_pat }}
          LIST: ${{ steps.list.outputs.summary }}
          RESULT: ${{ steps.apply.outputs.result }}
          OK: ${{ steps.apply.outputs.ok }}
          CHANGED: ${{ steps.apply.outputs.changed }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        with:
          script: |
            const { ACTION, GATE_ID, HAVE_PAT, LIST, RESULT, OK, CHANGED, PUSHED } = process.env;
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const react = (content) => github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content,
            });
            let body;
            if (ACTION === 'list') {
              body = `**Smart CI gate registry**\n\n\`\`\`\n${LIST || '(empty)'}\n\`\`\``;
              await react('+1');
            } else if (OK !== 'true') {
              body = `Could not \`${ACTION}\` \`${GATE_ID}\`:\n\n\`\`\`\n${(RESULT || 'unknown error').trim()}\n\`\`\``;
              await react('-1');
            } else if (CHANGED !== 'true') {
              body = `\`${GATE_ID}\`: ${(RESULT || ACTION).trim()} — no change, the gate was already in that state.`;
              await react('+1');
            } else if (PUSHED === 'true') {
              body = `\`${GATE_ID}\`: ${(RESULT || ACTION).trim()}. Committed to this branch; CI will re-run and enforce the new selection.`;
              await react('+1');
            } else if (HAVE_PAT !== 'true') {
              body = `\`${GATE_ID}\`: ${(RESULT || ACTION).trim()} — computed, but \`REGEN_TOKEN\` is not configured, so I can't commit it (a \`GITHUB_TOKEN\` commit would not re-trigger CI). Set the secret, or edit \`.github/ci-gates/registry.conf\` in this PR to cross it.`;
              await react('confused');
            } else {
              body = `\`${GATE_ID}\`: ${ACTION} computed but the commit step did not complete — check the workflow run.`;
              await react('confused');
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body: body + footer,
            });
