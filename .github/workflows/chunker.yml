name: Chunker (scheduled issue splitter)

# The scheduled heartbeat for /chunk-issue. Once a day it picks ONE open issue
# carrying the `declined-too-big` label and runs /chunk-issue on it unattended:
# it files dependency-ordered sub-issues (each closeable by one PR), auto-arms
# the genuinely-small ones with the backlog burn's `autonomy-ok` label, and
# drops the parent's `declined-too-big` label so it is not re-chunked. The skill
# already runs the same attended or unattended and declines rather than forcing
# a bad split; this workflow just gives it a cadence.
#
# WHY THIS EXISTS: /ship-issue declines issues that are bigger than one
# reviewable PR (its §1) — a permanent property of a healthy backlog, not a bug
# to fix. The chunker turns those declines back into small, shippable issues the
# backlog burn can actually attack, closing the loop:
#   /ship-issue declines (labels `declined-too-big`)
#     → chunker files small sub-issues (labels `autonomy-ok`)
#       → backlog burn ships them.
#
# This is the SIBLING of backlog-burn.yml and design-run.yml and shares their
# selector: the selection policy (one issue per firing, oldest-first, skip
# anything already claimed by a SHIP-LOCK, an open closing PR, or a
# claude/issue-<N>-* branch) is identical — only the opt-in label differs
# (`declined-too-big` here). So this reuses `tools/backlog-burn` verbatim,
# pointed at a different config file and label. One tested selector, three
# routines.
#
# WHERE THE CONFIG LIVES (deliberate split, identical to the siblings):
#   * Policy → committed, git-tracked: .github/chunker.conf holds `enabled`,
#     the opt-in `label`, the `provider` and the `cadence`. Change it with a
#     reviewed one-line PR; a clone carries it.
#   * Live arming / kill switch → the CHUNKER_ENABLED repo variable, a fast
#     human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that files issues should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or variable
#     for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR. Keep it in sync with the
#     `cadence:` key in .github/chunker.conf.
#
# Safety properties (same as the siblings):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     CHUNKER_ENABLED == 'true'. Either off → inert.
#   * AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses this workflow's AI job with a single ::notice:: —
#     grey, never red, no provider call, no escalation. Orthogonal to the
#     arming variable: it overrides an armed routine without touching it.
#   * Opt-in per issue: the selector only picks an issue carrying the
#     `declined-too-big` label, so nothing runs until /ship-issue (or a human)
#     marks an issue oversized.
#   * One issue per firing: a hard cap in the selector means a bad day costs one
#     over-eager split, not five.
#
# Auth: the agentic run walks the registry's `chunker` chain across BOTH
# providers (issue #544) — the GLM links on ZAI_KEY first (the head provider
# .github/chunker.conf names), then the Anthropic tail on ANTHROPIC_API_KEY,
# so a whole-provider outage falls through instead of killing the daily run
# (the #347/#358 unfunded-account failure, and its GLM-quota mirror). A plain
# API key is the right fit for an unattended bot — pay-per-token, no
# subscription seat. With one key unset that provider's links skip and the walk
# continues on the other; with NEITHER set the job still selects and logs its
# pick, then emits a ::notice:: and stops — exactly how ci.yml skips
# product-page drafting without the key. So this workflow is useful (and
# testable) before any secret exists.

on:
  schedule:
    # Once a day at :29 past the hour — an off-peak minute (not :00) to avoid
    # Actions scheduler congestion, and offset from backlog-burn's :17 and
    # design-run's :23 so the three routines don't fire simultaneously. Chunking
    # only files issues, so it is light; running before the 06:17 backlog burn
    # means a freshly-chunked issue is available to the next burn. Cron must be
    # a literal — Actions evaluates no files or variables for on.schedule — so
    # change the cadence by editing this line in a one-line PR (and the
    # `cadence:` key in .github/chunker.conf to match), e.g.:
    #   twice daily:  '29 5,17 * * *'
    #   weekly:       '29 5 * * 1'
    # The two-key guard (CHUNKER_ENABLED + committed `enabled: true`) ensures the
    # schedule is harmless until deliberately armed, so firing daily is safe:
    # idle firings cost nothing.
    - cron: '29 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log an issue, but do not invoke /chunk-issue'
        type: boolean
        default: false

# Scoped to what the unattended /chunk-issue run actually does: it files
# sub-issues and (re)labels issues (issues:write), reads the repo to run the
# skill (contents:read), and the shared selector lists open PRs to skip issues
# already claimed by a closing PR (pull-requests:read — the selector's HTTP GET
# is uncaught, so a missing scope hard-fails the select step, not degrades it).
# It pushes no branch and opens no PR, so it needs NEITHER contents:write NOR
# pull-requests:write — still a deliberately tighter grant than the backlog burn
# / design run, which do push and open PRs. The job is off unless CHUNKER_ENABLED
# is set AND the committed config says enabled, and the writing step is skipped
# entirely without the provider's secret, so even these grants sit idle until the
# routine is deliberately switched on.
permissions:
  contents: read
  issues: write
  pull-requests: read

# Never run two chunkers at once — this group serializes THIS workflow with
# itself. It deliberately does NOT serialize against the backlog burn or design
# run: GitHub concurrency is shared across workflows only when the group STRING
# matches, and the siblings use their own names, so serializing them would queue
# for no benefit. Do not cancel an in-flight run — it may be mid-file.
concurrency:
  group: chunker
  cancel-in-progress: false

jobs:
  chunk:
    name: Pick one declined-too-big issue and run /chunk-issue
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries a write scope and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector code
    # with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref.
    # Plus the AI andon cord (docs/andon-cord.md): AI_ANDON_CORD == 'pulled'
    # skips this job grey — the disarmed-notice sibling explains the pull.
    if: >-
      vars.CHUNKER_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Job budget 45 = 2 × run-step timeout (20) + 5 min headroom. Chunking only
    # files issues (light), but the walk below is five run steps in a row
    # (three GLM links, then the Anthropic tail — issue #544), each with its
    # own 20-minute timeout, and the budget must let at least ONE full
    # fallback link complete after a head link STALLS to its step timeout (a
    # model stall, not the seconds a quota/billing rejection takes): head 20 +
    # one fallback 20 + the pre-run steps. The per-step timeout is what keeps
    # a hung /chunk-issue from holding a runner and a secret for the whole job
    # budget, unwatched — before #544 the single step could hold it for 30.
    # Two consecutive stalls are not budgeted — a second stalled link dies
    # with the job — because a stall is a provider-wide symptom, and the
    # fast failures the tail exists for reject in seconds. Well inside
    # GitHub's 360-minute hosted-job cap (the drift guard pins <= 360).
    timeout-minutes: 45
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's run steps gate on
      # their own) plus `key_present` = either one (the any-key gate the
      # triage, red and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill + selector — never a dispatched branch's version.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the selector
        # The chunker reuses the backlog burn's selector verbatim — same policy,
        # different label and config path. No second copy to drift.
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/chunker.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed or
        # typo'd config (bad key, unknown provider) fails this step loudly rather
        # than running on a policy nobody wrote. The conf's `provider:` is the
        # walk's HEAD provider (issue #544) — validated here, emitted for the
        # resolve step's shape check and the summary. Key presence is emitted
        # PER PROVIDER (each provider's run steps gate on their own, so the
        # tail can run when the head's key is absent) plus the any-key
        # `key_present` the triage / red / skip-notice gates read.
        # HAS_ANTHROPIC_KEY / HAS_ZAI_KEY come from the job-level env above.
        run: |
          set -euo pipefail
          conf=.github/chunker.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          label="$(backlog-burn config --get label --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "label=$label"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the chunker's model from the committed provider/model registry
      # (issue #326) — the same resolve step auto-review.yml and
      # product-scout.yml run, stdlib-only so it needs no install in front of
      # it. A malformed registry, or one whose `chunker` chain went missing,
      # fails this step loudly BEFORE any key is spent; the same mismatch is
      # caught pre-merge by the model-registry drift-guard tests, which fire on
      # this workflow and on registry.conf.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal run steps
      # — its layout, one provider per step in file order (three Z.AI GLM
      # steps, then two Anthropic steps), because Actions can only reference a
      # secret by its literal name — while the registry picks the MODEL each
      # step runs. A link on the wrong slot's provider (claude-* on a Z.AI
      # step, glm-* on an Anthropic step) would fail at request time with a
      # key already spent, and a chain longer or shorter than the walk leaves
      # a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring.
      - name: Resolve the chunker's model chain (issue #326)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve chunker --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/chunker.conf)"
          # One layout entry per run step below, in file order.
          python3 -m model_registry shape chunker --head "$conf_provider" \
            --conf .github/chunker.conf --layout zai,zai,zai,anthropic,anthropic


      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/chunker.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select one eligible issue
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.policy.outputs.label }}
        run: |
          set -euo pipefail
          # `run` gathers the live snapshot (open issues + their comment
          # threads, open PRs, remote branches) and applies the policy. It
          # writes `issue=<n>` (empty when nothing is eligible) to $GITHUB_OUTPUT
          # and a markdown block to $GITHUB_STEP_SUMMARY. Same selector the
          # backlog burn uses, pointed at the declined-too-big label.
          backlog-burn run --repo "$GITHUB_REPOSITORY" --label "$LABEL" --summary-title 'Chunker'

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544): links 1-3 are the Z.AI GLM steps, links 4-5
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `chunker` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # chunker to another model is a registry edit, not a workflow edit
      # (#326); the resolve step above refuses a chain that does not fit this
      # layout. The committed `provider:` label names the HEAD provider (link
      # 1 must sit on it); it no longer selects a whole block. Each link is
      # gated on EVERY earlier link NOT having succeeded — a skipped step's
      # outcome is 'skipped', not 'success', so the Anthropic tail runs
      # whether the GLM links failed or were skipped for want of ZAI_KEY — so
      # the first success short-circuits the rest and a dead model, or a
      # whole dead provider, falls through instead of killing the run. Each
      # provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain (#327)
      # is a same-PR pair: add the model to the registry AND the matching run
      # step here (and its slot in the resolve step's --layout) — the drift
      # guard fails either half shipped alone.
      #
      # Failure model: the chunker carries no SHIP-LOCK lifecycle (#326
      # constraint), so non-terminal links (1-4) are continue-on-error so a
      # dead id falls through, and the TERMINAL link (5) keeps none — a
      # total-walk failure then fails the step, and the job, exactly as a
      # single failing step did before the tail existed. The "Turn an
      # exhausted walk red" step at the end covers the one case that rule
      # misses: a walk exhausted with the tail SKIPPED (only ZAI_KEY set, all
      # three GLM links dead) has no failed non-coe step to fail the job.
      #
      # All five steps share the pin, the write permission, the `github_token`
      # that authenticates the action's own GitHub calls, and the same
      # /chunk-issue prompt. The default GITHUB_TOKEN is fine here: the chunker
      # opens no PR (issues alone run no CI), so the REGEN_TOKEN/PAT reasoning
      # that the backlog burn and design run carry does not apply.
      #
      # The pin is the immutable commit behind the v1 tag; a moved tag must not
      # silently change what runs with a write scope + a secret. Re-pin
      # deliberately to adopt a new release.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # continue-on-error so the walk reaches link 2 (and the tail) when
        # this id or provider is dead; the step timeout keeps a stalled model
        # from eating the job budget the fallback links need.
        timeout-minutes: 20
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check (the endpoint uses whichever header it validates).
        # Best-effort: Anthropic doesn't officially support routing Claude Code
        # to non-Claude models, and /chunk-issue is a Claude Code skill, so
        # quality may vary. Which model runs is the registry's call.
        #
        # Grant ONLY the tools /chunk-issue needs, through a single narrow
        # surface. The skill drives every GitHub read/write via one committed
        # wrapper, .claude/skills/chunk-issue/chunk-helper.sh (create issue +
        # link native sub-issue, comment, add/remove label, ensure label), so
        # the CLI allow-list is that wrapper plus the READ-ONLY file tools. It
        # is NOT unrestricted `Bash`, and deliberately does NOT grant `Write`:
        # the run reads untrusted issue text while holding provider-key
        # secrets, so a general shell — or a file-write tool that could
        # overwrite this very wrapper and then run it — would turn
        # prompt-injection into arbitrary commands / key exfiltration.
        #
        # But --allowedTools ADDS allows; it does not make the surface
        # exclusive. claude-code-action runs the SDK with
        # settingSources:[user,project,local] (visible in the run log), so it
        # ALSO loads this repo's .claude/settings.json permissions.allow —
        # which carries dev entries like Bash(xvfb-run:*) (arbitrary command
        # execution) needed by the interactive/backlog-burn/design-run agents.
        # Allow rules merge additively across sources, so those would leak into
        # this run and defeat the narrow list. --settings closes that: deny
        # rules beat allow rules from EVERY source (and even beat an
        # --allowedTools grant), so .claude/chunker-settings.json denies every
        # non-wrapper Bash allow from settings.json (kept in sync by
        # scripts/chunker-perms-check.sh). Net effect: the chunker's real tool
        # surface is exactly the wrapper + Read/Grep/Glob, regardless of
        # workspace trust. The quotes protect the `(...)` from the action's arg
        # parser. The job's issues:write token still bounds the effect. Every
        # link below carries the identical grant.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link1_model }} --effort max --settings .claude/chunker-settings.json --allowedTools "Bash(.claude/skills/chunk-issue/chunk-helper.sh:*),Read,Grep,Glob"
          prompt: "/chunk-issue ${{ steps.select.outputs.issue }}"

      # The GLM tail (#327): links 2 and 3, reached only when every earlier
      # link did not succeed — the same env/secret/grant/prompt as link 1,
      # only the model differs.
      - name: Run via Z.AI (GLM, chain link 2)
        id: run_zai_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link2_model }} --effort max --settings .claude/chunker-settings.json --allowedTools "Bash(.claude/skills/chunk-issue/chunk-helper.sh:*),Read,Grep,Glob"
          prompt: "/chunk-issue ${{ steps.select.outputs.issue }}"

      - name: Run via Z.AI (GLM, chain link 3)
        id: run_zai_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link3_model }} --effort max --settings .claude/chunker-settings.json --allowedTools "Bash(.claude/skills/chunk-issue/chunk-helper.sh:*),Read,Grep,Glob"
          prompt: "/chunk-issue ${{ steps.select.outputs.issue }}"

      # The cross-provider tail (issue #544): links 4 and 5 of the registry's
      # `chunker` chain on Anthropic's native endpoint, reached only when
      # EVERY GLM link did not succeed (failed, or skipped for want of
      # ZAI_KEY) and gated on the Anthropic key's own presence. Claude via
      # api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permission, github_token, effort, grant and prompt as the GLM
      # links — only the model, secret and endpoint differ. Which model runs
      # is the registry's call (the cheap Anthropic tier).
      - name: Run via Anthropic (Claude, chain link 4)
        id: run_anthropic_4
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link4_model }} --effort max --settings .claude/chunker-settings.json --allowedTools "Bash(.claude/skills/chunk-issue/chunk-helper.sh:*),Read,Grep,Glob"
          prompt: "/chunk-issue ${{ steps.select.outputs.issue }}"

      - name: Run via Anthropic (Claude, chain link 5)
        id: run_anthropic_5
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
          && steps.run_anthropic_4.outcome != 'success'
        # The TERMINAL link: no continue-on-error, so the last id dying fails
        # the step (and the job) — the walk is over, and that failure is the
        # correct verdict.
        timeout-minutes: 20
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link5_model }} --effort max --settings .claude/chunker-settings.json --allowedTools "Bash(.claude/skills/chunk-issue/chunk-helper.sh:*),Read,Grep,Glob"
          prompt: "/chunk-issue ${{ steps.select.outputs.issue }}"

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected #${ISSUE} but did not invoke /chunk-issue"
          else
            echo "::notice::no key is set for ANY provider in the chunker chain (ZAI_KEY for the zai links, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — selected #${ISSUE} but skipping the unattended /chunk-issue run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issue == ''
        env:
          LABEL: ${{ steps.policy.outputs.label }}
        run: echo "::notice::no issue is currently eligible (nothing carrying the '${LABEL}' label is unclaimed) — nothing to chunk"

      # No SHIP-LOCK lifecycle here, so the terminal link failing IS the job
      # failure — but before that stands, recover WHY the chain exhausted (the
      # agent steps hide their provider error) and route the human-fixable causes
      # — out of credit / out of tokens / bad key — to ONE deduped needs-decision
      # issue, so a scheduled red nobody watches becomes an actionable ask. A bad
      # model id or a transient blip is only diagnosed in the log. Advisory: it
      # never fails the job. Fires (always(), so it survives the terminal link's
      # failure) only when a key was present and the walk did not succeed — the
      # same five-link walk-outcome expression the record step reports as RUN.
      # Both keys go in so classify probes both halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: chunker
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the chunker routine (issue #${{ steps.select.outputs.issue }})
          escalate: "true"

      - name: Record the run outcome
        # Runs on success, failure or skip so the job summary always shows what
        # happened. This reports the *run* disposition; the authoritative
        # chunked/declined verdict and the filed sub-issues are posted by
        # /chunk-issue onto the issue thread itself, which this summary links to.
        if: always()
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          ENABLED: ${{ steps.policy.outputs.enabled }}
          # The policy step's own outcome, checked before ENABLED: if it failed
          # (unknown provider, malformed config), ENABLED is empty and would be
          # mislabelled "disabled by committed policy" (CodeRabbit review on #165).
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          # 'success' only when selection actually ran to completion; 'skipped'
          # when committed policy disabled the routine, 'failure' when the
          # selector step errored. Distinguishes those from a genuine empty
          # selection so the summary can't claim "nothing eligible" for a run
          # that never checked eligibility.
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#327, #544): 'success' if ANY of the five
          # links across both providers succeeded; otherwise the outcome of
          # the LAST LINK THAT ACTUALLY RAN — the nested tail walks backwards
          # over 'skipped' links, so 'skipped' means every link was skipped
          # (no key for any provider), never "the tail had no key" after the
          # head failed. The terminal link failing fails the job; the "Turn
          # an exhausted walk red" step below covers a walk exhausted with
          # the tail skipped.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_zai_2.outcome }}
          L3: ${{ steps.run_zai_3.outcome }}
          L4: ${{ steps.run_anthropic_4.outcome }}
          L5: ${{ steps.run_anthropic_5.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          M4: ${{ steps.chain.outputs.link4_model }}
          M5: ${{ steps.chain.outputs.link5_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
          P4: ${{ steps.chain.outputs.link4_provider }}
          P5: ${{ steps.chain.outputs.link5_provider }}
          # $GITHUB_STEP_SUMMARY does not auto-link a bare #N — build a real link.
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3 4 5; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::the chunker fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served #${ISSUE} — the run is green, but the head provider is down or keyless; check its quota/key"
              fi
              break
            fi
          done
          {
            echo "## Chunker — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/chunker.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the selector failed; see the log"
            elif [ -z "${ISSUE}" ]; then
              echo "- selected: none (nothing carrying \`declined-too-big\` was eligible)"
            else
              echo "- selected: [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE})"
              echo "- provider: ${PROVIDER} (head)"
              echo "- run step: ${RUN:-skipped} (see [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE}) for the /chunk-issue verdict and any filed sub-issues)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Turn an exhausted walk red
        # The terminal link (5) carries no continue-on-error, so its failure
        # fails the job — but a walk that exhausted with the tail SKIPPED
        # (only ZAI_KEY set and every GLM link dead) has no failed non-coe
        # step, and would leave the run green: exactly the silent-success
        # disguise the burn's red-on-death step exists for. Restore the
        # failure last, after the triage and the record have run. Same
        # walk-outcome expression as the triage gate and RUN above.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome)) != 'success'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
        run: |
          echo "::error::the /chunk-issue agent step for #${ISSUE} did not succeed on any link of the chunker chain (walk outcome: ${RUN}); failing the job so the exhaustion is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `chunk` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips it
    # silently. This sibling makes that legible. No secrets, no write perms.
    # A pulled AI andon cord (docs/andon-cord.md) skips the gated job the same
    # way, so this sibling explains that too — checked first, since the cord
    # overrides an armed routine.
    if: >-
      vars.CHUNKER_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
      || vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.CHUNKER_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          if [ "${ANDON:-}" = "true" ]; then
            echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — the chunker did not run; no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume — see docs/andon-cord.md."
          elif [ "${ARMED:-}" != "true" ]; then
            echo "::notice::the chunker is disarmed — set the CHUNKER_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/chunker.conf; both must agree before it runs."
          else
            echo "::notice::the chunker only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
