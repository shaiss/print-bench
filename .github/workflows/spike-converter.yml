name: Spike converter (scheduled design-brief conversion)

# The scheduled heartbeat for /spike-converter (#245 child C, issue #440; the
# skill is child B #439, the deterministic extractor beneath it child A #438).
# On a weekly cadence it takes the ONE decided research recommendation the
# brief-sources extractor picks (deterministically — the model never chooses)
# and reshapes it into a `design-brief` issue, every number cited to its
# source doc section or marked as an assumption. It is the TRANSCRIBER lane of
# the generative front — where /product-scout (Remy) ORIGINATES proposals from
# catalog signals, the converter transcribes a decision a research doc already
# records — feeding the same human-gated pipeline (/design-run, the backlog
# burn).
#
# This is the SIBLING of product-scout.yml, backlog-burn.yml, design-run.yml,
# chunker.yml and labeler.yml. It shares their config parser, their two-key
# safety model and — since issue #544 Part B — their cross-provider chain walk
# (one run step per registry link, the GLM head then the Anthropic tail). Like
# the scout it has no selector (the candidate is chosen by the extractor
# inside the run, not by a label), and its one write is CREATING a
# `design-brief` issue via the scout's REUSED MCP filing tool — one filing
# surface, one audit (#439's "do not copy the server" rule).
#
# WHERE THE CONFIG LIVES (deliberate split, identical to the siblings):
#   * Policy → committed, git-tracked: .github/spike-converter.conf holds
#     `enabled`, the `provider` (the walk's HEAD) and the `cadence`. Change it
#     with a reviewed one-line PR; a clone carries it.
#   * Live arming / kill switch → the SPIKE_CONVERTER_ENABLED repo variable, a
#     fast human-only toggle (Settings → Secrets and variables → Actions →
#     Variables). Not in git on purpose: arming an agent that WRITES issues
#     should be a conscious act a fresh clone/fork can't inherit, and flipping
#     it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or
#     variable for on.schedule, so the schedule must be literal here — kept in
#     sync with the `cadence:` key in .github/spike-converter.conf by
#     scripts/cadence-sync-check.sh.
#
# Safety properties (same as the siblings, plus the converter's own bounds):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     SPIKE_CONVERTER_ENABLED == 'true'. Either off → inert. Shipped DISARMED:
#     this workflow sets no repo variable (issue #440's acceptance) — arming is
#     a human decision after watched attended output, the #245 sequencing.
#   * Advisory-only + bounded: the run's only shell surface is the READ
#     wrapper .claude/skills/spike-converter/converter-helper.sh (select /
#     list-briefs / read-thread — GETs only), and its only write is the scout
#     MCP tool, whose server hardcodes the `design-brief` label, requires the
#     `Design brief:` title prefix and caps briefs per run at SCOUT_MAX_BRIEFS
#     (1 here — the extractor's one-candidate-per-firing rule made structural).
#     A prompt-injected run can at worst file one design-brief proposal —
#     noise a human closes.
#   * The converter's deny backstop (.claude/spike-converter-settings.json,
#     via --settings) neutralizes the additive settings.json allows
#     (chunk-helper, label-helper, assessor-helper AND the scout's own
#     scout-helper included — the converter files via MCP only), kept honest
#     by scripts/spike-converter-perms-check.sh.
#   * Every link of the walk carries the SAME surface, backstop, cap and
#     prompt — only the model, secret and endpoint differ per step.
#
# UNATTENDED FILING (the one place this sibling's semantics need saying out
# loud): the skill's step 4 is dry-run-by-default with "only when the human
# says file", because an attended run has a human to ask. This workflow has
# none — arming it IS that human's standing "file it": the same courtesy the
# scout's arming extends, watched attended output first (#245). The prompt
# below says so explicitly, and SCOUT_MAX_BRIEFS=1 plus the extractor's
# one-candidate rule bound what can be filed. A dry_run dispatch exists for
# the watched case: it skips the agentic run entirely with a notice.

on:
  schedule:
    # Weekly, Tuesday 05:59 UTC — an off-peak minute offset from the labeler's
    # :11, the backlog burn's :17, the design run's :23, the chunker's :29,
    # the groomer's :41, the product scout's :47 (Mondays) and Reeve's :53, so
    # the routines don't fire simultaneously; the day after the scout's Monday
    # run, so a human's proposal-culling load never stacks on one morning.
    # Cron must be a literal — Actions evaluates no files or variables for
    # on.schedule — so change the cadence by editing this line in a one-line PR
    # (and the `cadence:` key in .github/spike-converter.conf to match). The
    # two-key guard (SPIKE_CONVERTER_ENABLED + committed `enabled: true`)
    # keeps the schedule harmless until deliberately armed.
    - cron: '59 5 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log intent but do not invoke /spike-converter'
        type: boolean
        default: false

# Scoped to what the unattended /spike-converter run actually does: it reads
# the repo to run the skill (contents:read) and CREATES one design-brief issue
# (issues:write). It pushes no branch and opens no PR, so it needs NEITHER
# contents:write NOR pull-requests:write — the same tight grant as the scout,
# labeler and chunker. The provider-triage step's one escalation (a deduped
# needs-decision issue on a human-fixable provider failure) is an issue write
# too, so issues:write covers the whole job. The job is off unless
# SPIKE_CONVERTER_ENABLED is set AND the committed config says enabled, and
# the writing steps are skipped without a provider secret, so even these
# grants sit idle until the routine is armed.
permissions:
  contents: read
  issues: write

# Never run two converters at once — this group serializes THIS workflow with
# itself (the siblings use their own group strings, so it does not serialize
# against them). Do not cancel an in-flight run.
concurrency:
  group: spike-converter
  cancel-in-progress: false

jobs:
  convert:
    name: Convert one research recommendation with /spike-converter
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries a write scope
    # and a secret, and workflow_dispatch can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill code with
    # the secret. On schedule github.ref_name is already the default branch.
    if: >-
      vars.SPIKE_CONVERTER_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Job budget 65 = head-step timeout (40) + one tail-step timeout (20)
    # + 5 min headroom. The GLM head keeps main's WHOLE pre-#544 job budget
    # (40): a per-step cap below it would kill a legitimately long
    # /spike-converter run, read the kill as a failed link and re-run the whole
    # thing on the tail — the common path must not pay for the fallback. The
    # Anthropic tail links are budgeted shorter (20 each) on purpose (Part
    # A's "tail shorter than head" shape): they exist for the fast failures a
    # dead head produces, not for a second full run. So the budget fits
    # exactly ONE stalled head link (40 — a model stall, not the seconds a
    # quota/billing rejection takes) plus ONE full tail link (20) plus the
    # pre-run steps; two consecutive stalls are NOT budgeted — a second
    # stalled link dies with the job — because a stall is a provider-wide
    # symptom, and the tail exists for the fast failures. The walk is
    # three run steps in a row (the GLM head, then the two-link
    # Anthropic tail — issue #544 Part B). The per-step timeouts are what keep a hung /spike-converter
    # from holding a runner and a secret past its budget, unwatched.
    # Well inside GitHub's 360-minute hosted-job cap (the drift guard pins
    # <= 360 and >= head + tail + 5).
    timeout-minutes: 65
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's run steps gate on
      # their own) plus `key_present` = either one (the any-key gate the
      # triage, red and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
      # The per-run filing cap, enforced by the reused scout MCP server. The
      # extractor emits ONE candidate per firing, so 1 is the structural
      # ceiling — set explicitly (not omitted) so a future widening is a
      # visible diff, the product-scout.yml pattern.
      SCOUT_MAX_BRIEFS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill — never a dispatched branch's version.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the config parser
        # The converter reuses the backlog burn's config parser verbatim (only
        # the `enabled`/`provider`/`cadence` keys — it has no selector).
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/spike-converter.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed
        # or typo'd config (bad key, unknown provider) fails this step loudly
        # rather than running on a policy nobody wrote. The conf's `provider:`
        # is the walk's HEAD provider (issue #544) — validated here, emitted
        # for the resolve step's shape check and the summary. Key presence is
        # emitted PER PROVIDER (each provider's run steps gate on their own,
        # so the tail can run when the head's key is absent) plus the any-key
        # `key_present` the triage / red / skip-notice gates read. The model
        # itself is NOT decided here — it comes from the registry chain below.
        run: |
          set -euo pipefail
          conf=.github/spike-converter.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the converter's model chain from the committed provider/model
      # registry (issue #206) — the same resolve step product-scout.yml and
      # the labeler run, stdlib-only so it needs no install in front of it. A
      # malformed registry, or one whose `spike-converter` chain went missing,
      # fails this step loudly BEFORE any key is spent — and is caught
      # pre-merge by the model-registry drift-guard tests, which fire on this
      # workflow and on registry.conf. `link<N>_model` is what the run steps
      # below read; the secret stays literal per step (the Actions
      # constraint), so the registry decides the model, never the auth.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal run steps
      # — its layout, one provider per step in file order (one Z.AI GLM step,
      # then two Anthropic steps), because Actions can only reference a secret
      # by its literal name — while the registry picks the MODEL each step
      # runs. A link on the wrong slot's provider (claude-* on the Z.AI step,
      # glm-* on an Anthropic step) would fail at request time with a key
      # already spent, and a chain longer or shorter than the walk leaves a
      # step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring.
      - name: Resolve the converter model chain (issue #206)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve spike-converter --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/spike-converter.conf)"
          # One layout entry per run step below, in file order.
          python3 -m model_registry shape spike-converter --head "$conf_provider" \
            --conf .github/spike-converter.conf --layout zai,anthropic,anthropic

      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/spike-converter.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544 Part B): link 1 is the Z.AI GLM step, links 2-3
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `spike-converter`
      # chain (steps.chain.outputs) picks which MODEL each link runs —
      # swapping the converter to another model is a registry edit, not a
      # workflow edit; the resolve step above refuses a chain that does not
      # fit this layout. The committed `provider:` label names the HEAD
      # provider (link 1 must sit on it); it no longer selects a whole block.
      # Each link is gated on EVERY earlier link NOT having succeeded — a
      # skipped step's outcome is 'skipped', not 'success', so the Anthropic
      # tail runs whether the GLM link failed or was skipped for want of
      # ZAI_KEY — so the first success short-circuits the rest and a dead
      # model, or a whole dead provider, falls through instead of killing the
      # run. Each provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain is a
      # same-PR pair: add the model to the registry AND the matching run step
      # here (and its slot in the resolve step's --layout) — the drift guard
      # fails either half shipped alone.
      #
      # Failure model: the converter carries no SHIP-LOCK lifecycle, so the
      # non-terminal links (1-2) are continue-on-error so a dead id falls
      # through, and the TERMINAL link (3) keeps none — a total-walk failure
      # then fails the step, and the job, exactly as the single step did
      # before the tail existed. The "Turn an exhausted walk red" step at the
      # end covers the one case that rule misses: a walk exhausted with the
      # tail SKIPPED (only ZAI_KEY set, the GLM link dead) has no failed
      # non-coe step to fail the job.
      #
      # All three steps share the pin, the write permission, the
      # `github_token` that authenticates the wrapper's gh reads and the MCP
      # filing server, and the same /spike-converter prompt. The default
      # GITHUB_TOKEN is fine: the converter opens no PR (issue writes run no
      # CI), so the PAT reasoning the burn and design run carry does not
      # apply.
      #
      # Tool surface: the skill drives every GitHub read through ONE committed
      # wrapper, .claude/skills/spike-converter/converter-helper.sh
      # (select-candidate / list-briefs / read-thread), so the CLI allow-list
      # is that wrapper plus the READ-ONLY file tools. It is NOT unrestricted
      # `Bash` and NOT `Write`: the run reads untrusted issue text while
      # holding a provider key, so a general shell — or a file-write that
      # could overwrite the wrapper and run it — would turn prompt-injection
      # into arbitrary commands / key exfiltration. FILING is the scout's
      # REUSED MCP tool (mcp__scout__file_design_brief, served by scout_mcp.py
      # via --mcp-config) — one filing surface, one audit (#439): the brief
      # body is rich multi-line markdown a JSON tool argument carries where no
      # shell command line can. `--permission-mode dontAsk` makes the surface
      # exclusive; --settings .claude/spike-converter-settings.json closes the
      # additive allow leak from .claude/settings.json (deny beats allow from
      # every source; it denies chunk-helper, label-helper, assessor-helper
      # AND scout-helper — none is the converter's surface), kept in sync by
      # scripts/spike-converter-perms-check.sh. The pin is the immutable
      # commit behind the v1 tag.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # continue-on-error so the walk reaches the tail when this id or
        # provider is dead. The step timeout is main's whole pre-#544 job
        # budget — the head is never cut short on the common path — and a
        # stall past it is exactly what the shorter tail links are for.
        timeout-minutes: 40
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the
        # same ZAI_KEY is also passed as anthropic_api_key to satisfy the
        # action's credential check. Reshaping human-vetted research text is
        # the cheap-to-be-wrong case, so the cheap GLM tier is the right head
        # — which model exactly is the registry's `spike-converter` chain's
        # call, not this step's.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          # The converter's WRITE surface is the reused scout MCP tool
          # (scout_mcp.py), launched by Claude Code over a stdio pipe and
          # inheriting this step's env. It authenticates to the GitHub REST
          # API with this token (issues:write is all the job grants), and the
          # READ wrapper's `gh issue list`/`view` GETs use it too — so it must
          # be exported here. GITHUB_REPOSITORY / GITHUB_RUN_ID are set by
          # Actions automatically, SCOUT_MAX_BRIEFS from the job env.
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          # show_full_output surfaces the agent's tool calls and any permission
          # denials in the (public-repo) Actions log — the converter reads
          # only public committed docs and public issue threads and writes one
          # public design-brief issue, so its transcript carries nothing
          # sensitive, and seeing it is what turns "filed zero, no error" from
          # a guess into a diagnosis.
          show_full_output: "true"
          claude_args: --model ${{ steps.chain.outputs.link1_model }} --effort medium --permission-mode dontAsk --settings .claude/spike-converter-settings.json --mcp-config .claude/skills/product-scout/scout-mcp.json --allowedTools "mcp__scout__file_design_brief,Bash(.claude/skills/spike-converter/converter-helper.sh:*),Bash(./.claude/skills/spike-converter/converter-helper.sh:*),Read,Grep,Glob"
          prompt: |
            /spike-converter

            Unattended scheduled run (issue #440): nobody is watching, and there is no human to show a dry-run brief to. Arming this routine — SPIKE_CONVERTER_ENABLED, set by a human after watched attended output — IS the skill's step-4 "the human says file". So run the skill's procedure exactly as written: select the candidate via the wrapper (a printed NONE means stop and say so — quote it and end the run), read the source section it names, check the declined lane, then compose the brief and FILE it with mcp__scout__file_design_brief. SCOUT_MAX_BRIEFS=1 bounds the run to one brief; a human curates what was filed after the fact. Nothing else is yours to do: no labels but the tool's own, no comments elsewhere, no markers added or edited.

      # The cross-provider tail (issue #544 Part B): links 2 and 3 of the
      # registry's `spike-converter` chain on Anthropic's native endpoint,
      # reached only when the GLM link did not succeed (failed, or skipped for
      # want of ZAI_KEY) and gated on the Anthropic key's own presence. Claude
      # via api.anthropic.com: a plain API key (pay-per-token) is the right
      # fit for an unattended bot — no OAuth token / subscription seat. The
      # same pin, permission, github_token, effort, cap, reused MCP filing
      # tool, wrapper read verbs, backstop, transcript posture and prompt as
      # the GLM link — only the model, secret and endpoint differ. Which model
      # runs is the registry's call (the cheap Anthropic tier).
      - name: Run via Anthropic (Claude, chain link 2)
        id: run_anthropic_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          # Same reason as the Z.AI step: the MCP filing tool and the read
          # wrapper's gh GETs inherit this env and authenticate with it.
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Same tool surface, prompt and backstop as the Z.AI step (see its
          # comments for why each is exactly this).
          show_full_output: "true"
          claude_args: --model ${{ steps.chain.outputs.link2_model }} --effort medium --permission-mode dontAsk --settings .claude/spike-converter-settings.json --mcp-config .claude/skills/product-scout/scout-mcp.json --allowedTools "mcp__scout__file_design_brief,Bash(.claude/skills/spike-converter/converter-helper.sh:*),Bash(./.claude/skills/spike-converter/converter-helper.sh:*),Read,Grep,Glob"
          prompt: |
            /spike-converter

            Unattended scheduled run (issue #440): nobody is watching, and there is no human to show a dry-run brief to. Arming this routine — SPIKE_CONVERTER_ENABLED, set by a human after watched attended output — IS the skill's step-4 "the human says file". So run the skill's procedure exactly as written: select the candidate via the wrapper (a printed NONE means stop and say so — quote it and end the run), read the source section it names, check the declined lane, then compose the brief and FILE it with mcp__scout__file_design_brief. SCOUT_MAX_BRIEFS=1 bounds the run to one brief; a human curates what was filed after the fact. Nothing else is yours to do: no labels but the tool's own, no comments elsewhere, no markers added or edited.

      - name: Run via Anthropic (Claude, chain link 3)
        id: run_anthropic_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_anthropic_2.outcome != 'success'
        # The TERMINAL link: no continue-on-error, so the last id dying fails
        # the step (and the job) — the walk is over.
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "true"
          claude_args: --model ${{ steps.chain.outputs.link3_model }} --effort medium --permission-mode dontAsk --settings .claude/spike-converter-settings.json --mcp-config .claude/skills/product-scout/scout-mcp.json --allowedTools "mcp__scout__file_design_brief,Bash(.claude/skills/spike-converter/converter-helper.sh:*),Bash(./.claude/skills/spike-converter/converter-helper.sh:*),Read,Grep,Glob"
          prompt: |
            /spike-converter

            Unattended scheduled run (issue #440): nobody is watching, and there is no human to show a dry-run brief to. Arming this routine — SPIKE_CONVERTER_ENABLED, set by a human after watched attended output — IS the skill's step-4 "the human says file". So run the skill's procedure exactly as written: select the candidate via the wrapper (a printed NONE means stop and say so — quote it and end the run), read the source section it names, check the declined lane, then compose the brief and FILE it with mcp__scout__file_design_brief. SCOUT_MAX_BRIEFS=1 bounds the run to one brief; a human curates what was filed after the fact. Nothing else is yours to do: no labels but the tool's own, no comments elsewhere, no markers added or edited.

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — did not invoke /spike-converter"
          else
            echo "::notice::no key is set for ANY provider in the spike-converter chain (ZAI_KEY for the zai link, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — skipping the unattended /spike-converter run"
          fi

      # No SHIP-LOCK lifecycle here, so the terminal link failing IS the job
      # failure — but before that stands, recover WHY the chain exhausted (the
      # agent steps hide their provider error) and route the human-fixable
      # causes — out of credit / out of tokens / bad key — to ONE deduped
      # needs-decision issue, so a scheduled red nobody watches becomes an
      # actionable ask. A bad model id or a transient blip is only diagnosed
      # in the log. Advisory: it never fails the job. Fires (always()) only
      # when a key was present and the walk did not succeed — the same
      # three-link walk-outcome expression the record step reports as RUN.
      # Both keys go in so classify probes both halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: spike-converter
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the spike converter routine
          escalate: "true"

      - name: Record the run outcome
        if: always()
        env:
          PROVIDER: ${{ steps.policy.outputs.provider }}
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          # The walk's outcome (#544): 'success' if ANY of the three links
          # across both providers succeeded; otherwise the outcome of the
          # LAST LINK THAT ACTUALLY RAN — the nested tail walks backwards
          # over 'skipped' links, so 'skipped' means every link was skipped
          # (no key for any provider), never "the tail had no key" after the
          # head failed. The terminal link failing fails the job; the "Turn
          # an exhausted walk red" step below covers a walk exhausted with
          # the tail skipped.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_anthropic_2.outcome }}
          L3: ${{ steps.run_anthropic_3.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::the spike converter fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served — the run is green, but the head provider is down or keyless; check its quota/key"
              fi
              break
            fi
          done
          {
            echo "## Spike converter — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/spike-converter.conf \`enabled\` != true) — nothing ran"
            else
              echo "- provider: ${PROVIDER} (head)"
              echo "- run step: ${RUN:-skipped} (any filed brief is on the issue tracker, labelled \`design-brief\`; a \`NONE\` from the extractor is a clean run, not a failure)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Turn an exhausted walk red
        # The terminal link (3) carries no continue-on-error, so its failure
        # fails the job — but a walk that exhausted with the tail SKIPPED
        # (only ZAI_KEY set and the GLM link dead) has no failed non-coe
        # step, and would leave the run green: exactly the silent-success
        # disguise the burn's red-on-death step exists for. Restore the
        # failure last, after the triage and the record have run. Same
        # walk-outcome expression as the triage gate and RUN above.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        env:
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
        run: |
          echo "::error::the /spike-converter agent step did not succeed on any link of the spike-converter chain (walk outcome: ${RUN}); failing the job so the exhaustion is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `convert` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips
    # it silently. This sibling makes that legible. No secrets, no write perms.
    if: >-
      vars.SPIKE_CONVERTER_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.SPIKE_CONVERTER_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${ARMED:-}" != "true" ]; then
            echo "::notice::the spike converter is disarmed — set the SPIKE_CONVERTER_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/spike-converter.conf; both must agree before it runs."
          else
            echo "::notice::the spike converter only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
