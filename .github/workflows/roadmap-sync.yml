name: Sync issues onto the roadmap board

# Slice 2 (parts 2-3) of the autonomy roadmap board (issue #148): when an issue
# that carries one of the autonomy-loop labels is filed (by /chunk-issue,
# /intake, or a human), add it to the "print-bench autonomy" GitHub Project so
# the board reflects the backlog. If the issue also carries a single `points-<n>`
# label (Fibonacci 1/2/3/5/8), its Story points are set from that label too. It
# runs the committed, idempotent `add-item` recipe (scripts/gh-project.sh, from
# slice 2 part 1), so the board's schema stays the git-native source of truth and
# this workflow is just the trigger.
#
# GATED, off by default: GitHub Projects v2 needs a token with the `project`
# scope, which neither GITHUB_TOKEN nor the repo's REGEN_TOKEN/GH_TOKEN carries.
# So the board write only happens when a PROJECT_TOKEN secret (a classic PAT with
# `project`, or a fine-grained PAT with Account -> Projects: read/write) is set;
# without it the workflow logs a ::notice:: and does nothing. See
# docs/roadmap-board.md.
#
# SECURITY: `issues` events run in the base repo's context from the default
# branch — there is no PR head to execute, and this job checks out only the
# trusted default-branch `scripts/`. The board write uses PROJECT_TOKEN (Projects
# scope only, no repo write); the ambient GITHUB_TOKEN stays contents:read. The
# issue URL is a GitHub-controlled value and is re-validated by `add-item` before
# use. Listed in docs/actions-security.md.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read   # checkout the trusted default-branch scripts/ only

concurrency:
  # Serialize per issue so a rapid opened+labeled pair can't race the board.
  group: roadmap-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Add the issue to the board
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to sync
        id: guard
        uses: actions/github-script@v8
        env:
          # Secrets aren't readable in a step `if:`, so surface presence here.
          HAVE_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
        with:
          script: |
            // The autonomy-loop labels the board is meant to triage. An issue is
            // synced only if it carries at least one; everything else is ignored
            // so the board stays the autonomy backlog, not every issue.
            const TRACKED = ['autonomy-ok', 'design-brief', 'declined-too-big', 'needs-decision'];
            const labels = (context.payload.issue.labels || []).map((l) => l.name);
            const matched = labels.filter((n) => TRACKED.includes(n));
            if (matched.length === 0) {
              core.notice(`#${context.issue.number} carries no tracked label (${TRACKED.join(', ')}); not syncing.`);
              core.setOutput('act', 'false');
              return;
            }
            if (process.env.HAVE_TOKEN !== 'true') {
              core.notice('PROJECT_TOKEN is not set — roadmap-board sync is off. '
                + 'Add a classic PAT with the `project` scope as PROJECT_TOKEN to enable (see docs/roadmap-board.md).');
              core.setOutput('act', 'false');
              return;
            }
            // Story points: a single `points-<n>` label (Fibonacci 1/2/3/5/8,
            // the board's convention) is mirrored to the Story points field.
            // The label is the estimate's source of truth — see the run step's
            // comment for why points always-sets while Stage is set-if-new.
            const ALLOWED_POINTS = ['1', '2', '3', '5', '8'];
            const pts = labels
              .map((n) => (/^points-(\d+)$/.exec(n) || [])[1])
              .filter((v) => v && ALLOWED_POINTS.includes(v));
            let points = '';
            if (pts.length === 1) {
              points = pts[0];
            } else if (pts.length > 1) {
              core.notice(`#${context.issue.number} carries multiple points-* labels `
                + `(${pts.join(', ')}); leaving Story points unset until it has exactly one.`);
            }
            // Add to the board; `add-item --stage-if-new Backlog` sets the
            // initial Stage only when the item is newly created, so the Stage is
            // bound to item creation — not to which of a racing opened/labeled
            // pair runs — and a re-add never clobbers a card a human moved.
            core.setOutput('act', 'true');
            core.setOutput('url', context.payload.issue.html_url);
            core.setOutput('points', points);

      - name: Check out trusted tooling
        if: steps.guard.outputs.act == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Add the issue to the board
        if: steps.guard.outputs.act == 'true'
        env:
          # gh authenticates from GH_TOKEN; the add-item recipe's env-token guard
          # then skips `gh auth refresh` and relies on this token's project scope.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          URL: ${{ steps.guard.outputs.url }}
          POINTS: ${{ steps.guard.outputs.points }}
        run: |
          set -euo pipefail
          # Two deliberately-different write policies in one add-item call:
          #  * --stage-if-new: place a first-added issue at Backlog, but never
          #    reset the Stage of a card already on the board — Stage is the
          #    workflow position a human drags on the board, so the board owns it.
          #  * --points (always): mirror the points-<n> LABEL to Story points.
          #    The label is the estimate's git-native source of truth, so the card
          #    follows it — re-estimate by changing the label, not the card. This
          #    also means a points-<n> label added AFTER the issue first hit the
          #    board still lands (every eligible event re-reads and re-sets it).
          if [ -n "$POINTS" ]; then
            scripts/gh-project.sh add-item "$URL" --stage-if-new Backlog --points "$POINTS" | bash
          else
            scripts/gh-project.sh add-item "$URL" --stage-if-new Backlog | bash
          fi
