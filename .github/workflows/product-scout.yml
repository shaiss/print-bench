name: Product scout (scheduled design-brief proposals)

# The scheduled heartbeat for /product-scout (issues #241/#242). On a weekly
# cadence it reads the repo's committed signals (telemetry, field-test logs, the
# design catalog, open issues) and files `design-brief` issues proposing new
# designs and improvements against a standing product mandate. It is the
# GENERATIVE front of the autonomy loop — where the labeler ROUTES existing
# issues, the scout ORIGINATES them — feeding the same human-gated pipeline
# (/design-run, the backlog burn). The skill runs the same attended or
# unattended and is advisory-only by construction (it proposes; it never
# approves, arms an issue for autonomy, or merges); this workflow just gives it a
# cadence.
#
# This is the SIBLING of backlog-burn.yml, design-run.yml, chunker.yml and
# labeler.yml. It shares their config parser, their two-key safety model and —
# since issue #544 Part B — their cross-provider chain walk (one run step per
# registry link, the GLM head then the Anthropic tail). Like the labeler it has
# no selector (it does not pick an issue by a label); unlike the labeler its one
# write is CREATING a `design-brief` issue, never editing an existing one's
# labels.
#
# WHERE THE CONFIG LIVES (deliberate split, identical to the siblings):
#   * Policy → committed, git-tracked: .github/product-scout.conf holds
#     `enabled`, the `provider` (the walk's HEAD) and the `cadence`. Change it
#     with a reviewed one-line PR; a clone carries it.
#   * Live arming / kill switch → the PRODUCT_SCOUT_ENABLED repo variable, a fast
#     human-only toggle (Settings → Secrets and variables → Actions → Variables).
#     Not in git on purpose: arming an agent that WRITES issues should be a
#     conscious act a fresh clone/fork can't inherit, and flipping it off halts
#     the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or variable
#     for on.schedule, so the schedule must be literal here — kept in sync with
#     the `cadence:` key in .github/product-scout.conf.
#
# Safety properties (same as the siblings, plus the scout's own bounds):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     PRODUCT_SCOUT_ENABLED == 'true'. Either off → inert.
#   * Advisory-only + bounded: the run's ONLY shell surface is
#     .claude/skills/product-scout/scout-helper.sh, whose file-brief verb
#     hardcodes the `design-brief` label (never `autonomy-ok` &c.) and caps
#     briefs per run at SCOUT_MAX_BRIEFS. A prompt-injected run can at worst file
#     a bounded number of design-brief proposals — noise a human closes.
#   * The scout's deny backstop (.claude/scout-settings.json, via --settings)
#     neutralizes the additive settings.json allows (chunk-helper AND
#     label-helper included), kept honest by scripts/scout-perms-check.sh.
#   * Every link of the walk carries the SAME surface, backstop, cap and
#     prompt — only the model, secret and endpoint differ per step.

on:
  schedule:
    # Weekly, Monday 05:47 UTC — an off-peak minute offset from the labeler's
    # :11, the backlog burn's :17, the design run's :23, the chunker's :29 and
    # the groomer's :41, so the routines don't fire simultaneously. Cron must be
    # a literal — Actions evaluates no files or variables for on.schedule — so
    # change the cadence by editing this line in a one-line PR (and the
    # `cadence:` key in .github/product-scout.conf to match). The two-key guard
    # (PRODUCT_SCOUT_ENABLED + committed `enabled: true`) keeps the schedule
    # harmless until deliberately armed.
    - cron: '47 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log intent but do not invoke /product-scout'
        type: boolean
        default: false

# Scoped to what the unattended /product-scout run actually does: it reads the
# repo to run the skill (contents:read) and CREATES design-brief issues
# (issues:write). It pushes no branch and opens no PR, so it needs NEITHER
# contents:write NOR pull-requests:write — the same tight grant as the labeler
# and chunker. The provider-triage step's one escalation (a deduped
# needs-decision issue on a human-fixable provider failure) is an issue write
# too, so issues:write covers the whole job. The job is off unless
# PRODUCT_SCOUT_ENABLED is set AND the committed config says enabled, and the
# writing steps are skipped without a provider secret, so even these grants sit
# idle until the routine is armed.
permissions:
  contents: read
  issues: write

# Never run two scouts at once — this group serializes THIS workflow with itself
# (the siblings use their own group strings, so it does not serialize against
# them). Do not cancel an in-flight run.
concurrency:
  group: product-scout
  cancel-in-progress: false

jobs:
  scout:
    name: Propose design briefs with /product-scout
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries a write scope and
    # a secret, and workflow_dispatch can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill code with the
    # secret. On schedule github.ref_name is already the default branch.
    if: >-
      vars.PRODUCT_SCOUT_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Job budget 45 = 2 × run-step timeout (20) + 5 min headroom. A scout run
    # is a read of committed signals plus at most SCOUT_MAX_BRIEFS filings, but
    # the walk below is three run steps in a row (the GLM head, then the
    # Anthropic tail — issue #544 Part B), each with its own 20-minute timeout,
    # and the budget must let at least ONE full fallback link complete after a
    # head link STALLS to its step timeout (a model stall, not the seconds a
    # quota/billing rejection takes): head 20 + one fallback 20 + the pre-run
    # steps. The per-step timeout is what keeps a hung /product-scout from
    # holding a runner and a secret for the whole job budget, unwatched —
    # before #544 the single step could hold it for 40. Two consecutive stalls
    # are not budgeted — a second stalled link dies with the job — because a
    # stall is a provider-wide symptom, and the fast failures the tail exists
    # for reject in seconds. Well inside GitHub's 360-minute hosted-job cap
    # (the drift guard pins <= 360).
    timeout-minutes: 45
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's run steps gate on
      # their own) plus `key_present` = either one (the any-key gate the
      # triage, red and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
      # The per-run brief cap, enforced by scout-helper.sh's file-brief verb. Bump
      # it to let one run seed more of the backlog; the human still culls.
      SCOUT_MAX_BRIEFS: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed, merged
          # skill — never a dispatched branch's version.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the config parser
        # The scout reuses the backlog burn's config parser verbatim (only the
        # `enabled`/`provider`/`cadence` keys — it has no selector).
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/product-scout.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed or
        # typo'd config (bad key, unknown provider) fails this step loudly rather
        # than running on a policy nobody wrote. The conf's `provider:` is the
        # walk's HEAD provider (issue #544) — validated here, emitted for the
        # resolve step's shape check and the summary. Key presence is emitted
        # PER PROVIDER (each provider's run steps gate on their own, so the
        # tail can run when the head's key is absent) plus the any-key
        # `key_present` the triage / red / skip-notice gates read. The model
        # itself is NOT decided here — it comes from the registry chain below.
        run: |
          set -euo pipefail
          conf=.github/product-scout.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the scout's model chain from the committed provider/model
      # registry (issue #206; the migration itself is #243) — the same resolve
      # step the labeler and auto-review.yml run, stdlib-only so it needs no
      # install in front of it. A malformed registry, or one whose `scout`
      # chain went missing, fails this step loudly BEFORE any key is spent — and
      # is caught pre-merge by the model-registry drift-guard tests, which fire
      # on this workflow and on registry.conf. `link<N>_model` is what the run
      # steps below read; the secret stays literal per step (the Actions
      # constraint), so the registry decides the model, never the auth.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal run steps
      # — its layout, one provider per step in file order (one Z.AI GLM step,
      # then two Anthropic steps), because Actions can only reference a secret
      # by its literal name — while the registry picks the MODEL each step
      # runs. A link on the wrong slot's provider (claude-* on the Z.AI step,
      # glm-* on an Anthropic step) would fail at request time with a key
      # already spent, and a chain longer or shorter than the walk leaves a
      # step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring.
      - name: Resolve the scout model chain (issue #206)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve scout --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/product-scout.conf)"
          # One layout entry per run step below, in file order.
          python3 -m model_registry shape scout --head "$conf_provider" \
            --conf .github/product-scout.conf --layout zai,anthropic,anthropic

      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/product-scout.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544 Part B): link 1 is the Z.AI GLM step, links 2-3
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `scout` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # scout to another model is a registry edit, not a workflow edit (#243);
      # the resolve step above refuses a chain that does not fit this layout.
      # The committed `provider:` label names the HEAD provider (link 1 must
      # sit on it); it no longer selects a whole block. Each link is gated on
      # EVERY earlier link NOT having succeeded — a skipped step's outcome is
      # 'skipped', not 'success', so the Anthropic tail runs whether the GLM
      # link failed or was skipped for want of ZAI_KEY — so the first success
      # short-circuits the rest and a dead model, or a whole dead provider,
      # falls through instead of killing the run. Each provider's steps gate
      # on THEIR OWN key (zai_key_present / anthropic_key_present), never the
      # other's. Deepening the chain is a same-PR pair: add the model to the
      # registry AND the matching run step here (and its slot in the resolve
      # step's --layout) — the drift guard fails either half shipped alone.
      #
      # Failure model: the scout carries no SHIP-LOCK lifecycle, so the
      # non-terminal links (1-2) are continue-on-error so a dead id falls
      # through, and the TERMINAL link (3) keeps none — a total-walk failure
      # then fails the step, and the job, exactly as the single step did
      # before the tail existed. The "Turn an exhausted walk red" step at the
      # end covers the one case that rule misses: a walk exhausted with the
      # tail SKIPPED (only ZAI_KEY set, the GLM link dead) has no failed
      # non-coe step to fail the job.
      #
      # All three steps share the pin, the write permission, the `github_token`
      # that authenticates the wrapper's gh calls, and the same /product-scout
      # prompt. The default GITHUB_TOKEN is fine: the scout opens no PR (issue
      # writes run no CI), so the PAT reasoning the burn and design run carry
      # does not apply.
      #
      # Tool surface: the skill drives every GitHub write through ONE committed
      # wrapper, .claude/skills/product-scout/scout-helper.sh (list-briefs /
      # read-thread / ensure-label / file-brief), so the CLI allow-list is that
      # wrapper plus the READ-ONLY file tools. It is NOT unrestricted `Bash` and
      # NOT `Write`: the run reads untrusted issue text while holding a provider
      # key, so a general shell — or a file-write that could overwrite the wrapper
      # and run it — would turn prompt-injection into arbitrary commands / key
      # exfiltration. `--permission-mode dontAsk` makes that surface exclusive: any
      # tool not on the allow-list is DENIED (never prompted — no human in an
      # unattended run). --settings .claude/scout-settings.json closes the additive
      # allow leak from .claude/settings.json (deny beats allow from every source;
      # it denies chunk-helper AND label-helper — neither is the scout's surface),
      # kept in sync by scripts/scout-perms-check.sh. The pin is the immutable
      # commit behind the v1 tag.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # continue-on-error so the walk reaches the tail when this id or
        # provider is dead; the step timeout keeps a stalled model from eating
        # the job budget the fallback links need.
        timeout-minutes: 20
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check. Generation is the cheap-to-be-wrong case, so the cheap
        # GLM tier is the right head — which model exactly is the registry's
        # `scout` chain's call, not this step's.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          # The scout's WRITE surface is an MCP tool (scout_mcp.py), launched by
          # Claude Code over a stdio pipe and inheriting this step's env. It
          # authenticates to the GitHub REST API with this token (issues:write is
          # all the job grants), so it must be exported here — GITHUB_REPOSITORY /
          # GITHUB_RUN_ID are set by Actions automatically, SCOUT_MAX_BRIEFS from
          # the job env.
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          # show_full_output surfaces the agent's tool calls and any permission
          # denials in the (public-repo) Actions log — the scout reads only public
          # signals and writes only public design-brief issues, so its transcript
          # carries nothing sensitive, and seeing it is what turned "filed zero, no
          # error" from a guess into a diagnosis.
          #
          # Tool surface (why exactly this): FILING is an MCP tool
          # (mcp__scout__file_design_brief, served by scout_mcp.py via
          # --mcp-config) because the brief body is rich multi-line markdown, and
          # under --permission-mode dontAsk the Bash matcher denies any command
          # whose argument reads as shell structure — a table pipe or an embedded
          # newline in --body was enough, no quoting fixed it (proven from a run's
          # verbatim permission_denials). An MCP tool takes its arguments as JSON
          # over a pipe, never on a command line, so that whole class of denial
          # disappears. The scout's READ verbs stay on the wrapper (both path
          # spellings) — their args are trivial and pass the matcher fine. Plus the
          # read-only file tools; never Write, never a general Bash. The scout deny
          # backstop (--settings) still neutralises any Bash allow that leaks from
          # settings.json.
          show_full_output: "true"
          claude_args: --model ${{ steps.chain.outputs.link1_model }} --effort medium --permission-mode dontAsk --settings .claude/scout-settings.json --mcp-config .claude/skills/product-scout/scout-mcp.json --allowedTools "mcp__scout__file_design_brief,Bash(.claude/skills/product-scout/scout-helper.sh:*),Bash(./.claude/skills/product-scout/scout-helper.sh:*),Read,Grep,Glob"
          prompt: "/product-scout"

      # The cross-provider tail (issue #544 Part B): links 2 and 3 of the
      # registry's `scout` chain on Anthropic's native endpoint, reached only
      # when the GLM link did not succeed (failed, or skipped for want of
      # ZAI_KEY) and gated on the Anthropic key's own presence. Claude via
      # api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permission, github_token, effort, cap, MCP filing tool, wrapper
      # read verbs, backstop, transcript posture and prompt as the GLM link —
      # only the model, secret and endpoint differ. Which model runs is the
      # registry's call (the cheap Anthropic tier).
      - name: Run via Anthropic (Claude, chain link 2)
        id: run_anthropic_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          # Same reason as the Z.AI step: the MCP filing tool inherits this env
          # and authenticates with it.
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Same tool surface as the Z.AI step: MCP filing tool + wrapper read
          # verbs + read-only file tools + scout deny backstop + dontAsk +
          # show_full_output (see its comment for why it is exactly this).
          show_full_output: "true"
          claude_args: --model ${{ steps.chain.outputs.link2_model }} --effort medium --permission-mode dontAsk --settings .claude/scout-settings.json --mcp-config .claude/skills/product-scout/scout-mcp.json --allowedTools "mcp__scout__file_design_brief,Bash(.claude/skills/product-scout/scout-helper.sh:*),Bash(./.claude/skills/product-scout/scout-helper.sh:*),Read,Grep,Glob"
          prompt: "/product-scout"

      - name: Run via Anthropic (Claude, chain link 3)
        id: run_anthropic_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_anthropic_2.outcome != 'success'
        # The TERMINAL link: no continue-on-error, so the last id dying fails
        # the step (and the job) — the walk is over.
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "true"
          claude_args: --model ${{ steps.chain.outputs.link3_model }} --effort medium --permission-mode dontAsk --settings .claude/scout-settings.json --mcp-config .claude/skills/product-scout/scout-mcp.json --allowedTools "mcp__scout__file_design_brief,Bash(.claude/skills/product-scout/scout-helper.sh:*),Bash(./.claude/skills/product-scout/scout-helper.sh:*),Read,Grep,Glob"
          prompt: "/product-scout"

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — did not invoke /product-scout"
          else
            echo "::notice::no key is set for ANY provider in the scout chain (ZAI_KEY for the zai link, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — skipping the unattended /product-scout run"
          fi

      # No SHIP-LOCK lifecycle here, so the terminal link failing IS the job
      # failure — but before that stands, recover WHY the chain exhausted (the
      # agent steps hide their provider error) and route the human-fixable causes
      # — out of credit / out of tokens / bad key — to ONE deduped needs-decision
      # issue, so a scheduled red nobody watches becomes an actionable ask. A bad
      # model id or a transient blip is only diagnosed in the log. Advisory: it
      # never fails the job. Fires (always()) only when a key was present and the
      # walk did not succeed — the same three-link walk-outcome expression the
      # record step reports as RUN. Both keys go in so classify probes both
      # halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: scout
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the product scout routine
          escalate: "true"

      - name: Record the run outcome
        if: always()
        env:
          PROVIDER: ${{ steps.policy.outputs.provider }}
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          # The walk's outcome (#544): 'success' if ANY of the three links
          # across both providers succeeded; otherwise the outcome of the
          # LAST LINK THAT ACTUALLY RAN — the nested tail walks backwards
          # over 'skipped' links, so 'skipped' means every link was skipped
          # (no key for any provider), never "the tail had no key" after the
          # head failed. The terminal link failing fails the job; the "Turn
          # an exhausted walk red" step below covers a walk exhausted with
          # the tail skipped.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_anthropic_2.outcome }}
          L3: ${{ steps.run_anthropic_3.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::the product scout fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served — the run is green, but the head provider is down or keyless; check its quota/key"
              fi
              break
            fi
          done
          {
            echo "## Product scout — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/product-scout.conf \`enabled\` != true) — nothing ran"
            else
              echo "- provider: ${PROVIDER} (head)"
              echo "- run step: ${RUN:-skipped} (any filed design-brief issues are on the issue tracker, labelled \`design-brief\`)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Turn an exhausted walk red
        # The terminal link (3) carries no continue-on-error, so its failure
        # fails the job — but a walk that exhausted with the tail SKIPPED
        # (only ZAI_KEY set and the GLM link dead) has no failed non-coe
        # step, and would leave the run green: exactly the silent-success
        # disguise the burn's red-on-death step exists for. Restore the
        # failure last, after the triage and the record have run. Same
        # walk-outcome expression as the triage gate and RUN above.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        env:
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
        run: |
          echo "::error::the /product-scout agent step did not succeed on any link of the scout chain (walk outcome: ${RUN}); failing the job so the exhaustion is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `scout` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips it
    # silently. This sibling makes that legible. No secrets, no write perms.
    if: >-
      vars.PRODUCT_SCOUT_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.PRODUCT_SCOUT_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${ARMED:-}" != "true" ]; then
            echo "::notice::the product scout is disarmed — set the PRODUCT_SCOUT_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/product-scout.conf; both must agree before it runs."
          else
            echo "::notice::the product scout only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
