  docs-standards:
    # The standards gate for the architecture docs and the How-it-works site
    # page (scripts/docs-standards-check.sh): the three architecture docs exist
    # and cross-link, the page is exported/emitted/in the nav and traces back to
    # the docs, and its four diagrams are authored inline and used. Pure
    # presence/wiring — grep and test, no OpenSCAD, no toolchain — so a docs-only
    # PR runs THIS and nothing heavy. Selected by ci-classify.sh's
    # docs_standards output only when the docs, the page's source, or the gate
    # itself change; skipped otherwise (ci-ok treats a classifier-skip as OK,
    # the same as every other selective job here).
    name: Docs and page standards
    needs: changes
    if: needs.changes.outputs.docs_standards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove the gate still fires, then run it
        # --selftest first: the gate is presence-only, so a weakened assertion
        # would pass everything silently. The selftest plants each failure and
        # requires the gate to catch it, then the real check gates the tree.
        run: |
          ./scripts/docs-standards-check.sh --selftest
          ./scripts/docs-standards-check.sh

  style-gate:
    # Every style pack must stay internally consistent (style.scad and
    # STYLE.md generated from style.json) and its swatch must still satisfy
    # its own rules — plus any design that declares a style in style.conf.
    name: Style packs and conformance
    needs: changes
    if: needs.changes.outputs.styles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # No ImageMagick: style-check.sh refreshes the swatch preview only
          # when montage is present, and this job is here to judge conformance.
          # Postinst-free packages only (no update-alternatives) — a cache
          # restore skips postinst, see issue #85; docs-check.sh enforces.
          packages: xvfb
          # cache key; bump to pull fresh package versions (see scad-check)
          version: "2026-08"
      - name: Install OpenSCAD nightly (cached)
        # Same engine as render-gate, so a swatch measures the same here as
        # it does in the gate that judges the printable parts.
