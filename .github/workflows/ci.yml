name: CI

# push covers direct pushes to the default branch; pull_request covers PR
# branches — scoping push this way avoids double-running every PR commit.
#
# The `changes` job decides what actually runs: docs/skills-only PRs skip
# the expensive render jobs, and design-only PRs gate just the designs they
# touch. Downstream jobs are skipped via `if:` on the changes outputs rather
# than workflow-level `paths:` filters, because a paths-filtered workflow
# reports nothing at all and leaves required checks pending forever, while an
# `if:`-skipped job at least reports a check run. Keep the job `name:` strings
# stable: they are what branch protection matches on.
#
# CAUTION, learned the hard way on PR #50: a check run reported as *skipped*
# does NOT satisfy a required status check here. That PR had all 13 checks
# reported and a mergeable_state of "clean", and the merge API still refused
# it with "5 of 5 required status checks are expected", because three of the
# five required contexts had been skipped. So any path that reaches merge
# must actually RUN the five required jobs — Detect changed paths, Lint
# scripts and workflows, OpenSCAD syntax/geometry check, printcheck unit
# tests, and Render designs, gate STLs, test-slice. Adding a top-level
# directory without adding it to the classifier below makes every PR that
# touches only that directory permanently unmergeable.
#
# That is also why the `regen` job is ungated and why the two jobs that
# `needs:` it — design-docs and site-build — carry `if: !cancelled()`: a
# skipped `regen` would skip both, and design-docs judges the product pages
# regen may have just drafted. regen always runs and decides internally
# whether it has any work. render-gate is NOT among them: it gates STLs,
# which no regenerated preview can affect, so it keeps `needs: changes` and
# starts in parallel. The scad-check jobs used to wait on regen too, for one
# reason only — check.sh's docs-check asserts the README gallery is fresh,
# and regen is what refreshes it — and that wait roughly doubled the wall
# time of every PR run. They now run docs-check with DOCS_CHECK_GALLERY=skip
# and start at t=0; design-docs re-asserts gallery freshness against the
# post-regen tree with `docs-check.sh --gallery-only`, so the check itself
# never went away, it just moved to the one job already waiting there.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same PR are wasted minutes; cancel them. Default-
# branch pushes always run to completion so the branch's status is trustworthy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; the exceptions are job-level on render-gate:
# pull-requests:write to upsert the sticky printcheck comment, and
# contents:write for the telemetry roll-up commit on default-branch pushes.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      scad: ${{ steps.filter.outputs.scad }}
      printcheck_tests: ${{ steps.filter.outputs.printcheck_tests }}
      stylelift_tests: ${{ steps.filter.outputs.stylelift_tests }}
      lineage_tests: ${{ steps.filter.outputs.lineage_tests }}
      backlog_burn_tests: ${{ steps.filter.outputs.backlog_burn_tests }}
      backlog_groomer_tests: ${{ steps.filter.outputs.backlog_groomer_tests }}
      telemetry_tests: ${{ steps.filter.outputs.telemetry_tests }}
      ci_gates_tests: ${{ steps.filter.outputs.ci_gates_tests }}
      model_registry_tests: ${{ steps.filter.outputs.model_registry_tests }}
      reeve_tests: ${{ steps.filter.outputs.reeve_tests }}
      brief_sources_tests: ${{ steps.filter.outputs.brief_sources_tests }}
      styles: ${{ steps.filter.outputs.styles }}
      gate: ${{ steps.filter.outputs.gate }}
      gate_designs: ${{ steps.filter.outputs.gate_designs }}
      regen: ${{ steps.filter.outputs.regen }}
      regen_designs: ${{ steps.filter.outputs.regen_designs }}
      docs_standards: ${{ steps.filter.outputs.docs_standards }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The classification decision lives in scripts/ci-classify.sh — the
          # single source of truth /preflight also runs, so the local mirror
          # cannot drift from this job. This step only computes the changed-
          # file list and the event mode; the script decides what runs and
          # over which designs.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Command substitution so a git failure fails the step: piping
            # `git diff` straight into the classifier would let a git error
            # fail open — empty list, every job skipped, PR green having tested
            # nothing.
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          else
            # Non-PR (default-branch push): the classifier gates everything and
            # ignores the list, so there is nothing to compute.
            changed=""
          fi
          CI_CLASSIFY_EVENT="$GITHUB_EVENT_NAME" \
            ./scripts/ci-classify.sh <<<"$changed" >> "$GITHUB_OUTPUT"

  regen:
    # Everything in the tree that is DERIVED from a design rather than
    # authored: preview PNGs (previews/cameras.conf), animation GIFs
    # (animations.conf), studio product shots (shots.conf), the README
    # gallery, and — when a product page is missing or too thin to pass its
    # gate — an AI-drafted README.md.
    #
    # These used to be run by hand and committed. Every gate on them is
    # presence-only *because* a human committed them, which is exactly the
    # hole issue #69 describes: a geometry change staled three
    # desiccant-capsule previews and readme-gate passed them clean, still
    # showing a thread profile the design no longer had. Regenerating here
    # closes that at the root — the committed image cannot depict older
    # geometry than the source beside it, because one run produces both.
    #
    # Ungated on purpose. The job always RUNS (skipping only its own
    # expensive installs when the classifier says no design moved), because
    # four jobs `needs:` it — design-docs, site-build, scad-check and
    # scad-check-nightly — and a job skipped via `if:` would skip all four.
    # One of them, scad-check, is a required context, and one is enough to
    # strand a PR (see the CAUTION at the top of this file).
    #
    # Cost note: the classifier's regen_designs says which designs to
    # CONSIDER (a lib/ or generator-script edit says ALL, because such a
    # change can move any design's derived artifacts, which is precisely
    # when a stale image is most misleading). Which of those actually
    # re-render is then decided per design by an input fingerprint
    # (scripts/regen-stamp.sh) against the committed
    # previews/.regen-stamp: re-rendering a Cycles shot to discover it is
    # byte-identical costs minutes, the hash comparison costs milliseconds,
    # and the stamp is written in the same commit as the artifacts, so it
    # can never claim freshness the artifacts don't have. A missing or
    # mismatching stamp always regenerates — staleness in a stamp costs
    # time, never correctness.
    name: Regenerate previews and product pages
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      # The one job in this workflow that writes.
      contents: write
    env:
      # One definition, used to write the commit AND to recognise it on the
      # next run (see the loop guard in the commit step). Drift between the
      # two would silently disarm that guard.
      REGEN_SUBJECT: "CI: regenerate previews and product pages"
    outputs:
      # The commit this job pushed, or "" when it pushed nothing. Downstream
      # jobs pass it straight to actions/checkout's `ref`, where the empty
      # string means "the default ref for this event" — so an idle run keeps
      # the normal PR merge-ref checkout, and only a run that actually
      # committed redirects them onto the updated head.
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the push credential in .git/config: between checkout
          # and push this job runs five generators out of the PR branch, and
          # a same-repo PR could read a contents:write token straight out of
          # the config (ANTHROPIC_API_KEY is exposed to the same code, but
          # only for the one step that needs it). The push below supplies the
          # token explicitly instead — the same shape lifestyle-shot.yml uses.
          # Fork PRs were never exposed: their token is read-only and they get
          # no secrets.
          persist-credentials: false
          # The branch itself, not the PR merge ref: a merge ref is not a
          # branch and cannot be pushed back to.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.ref
                || github.ref_name }}
          repository: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name
                || github.repository }}
          # REGEN_TOKEN (a fine-grained PAT with contents:write) rather than
          # GITHUB_TOKEN, because of a rule with teeth: a push made with
          # GITHUB_TOKEN does not trigger any workflow. Check runs attach to
          # the commit the run started on, so committing back with it moves
          # the PR head to a commit carrying NONE of the required contexts,
          # and nothing will ever come along to add them — the PR is then
          # permanently unmergeable, the exact trap the CAUTION at the top of
          # this file describes. A PAT push does trigger a run, so the
          # required checks land on the commit that actually ships.
          #
          # Falls back to GITHUB_TOKEN when the secret is absent so a fork or
          # a not-yet-configured repo still regenerates; the commit step says
          # loudly what that costs. (With persist-credentials off this only
          # authenticates the clone; the push re-supplies it explicitly.)
          token: ${{ secrets.REGEN_TOKEN || github.token }}

      - name: Decide what needs regenerating
        id: plan
        env:
          REGEN: ${{ needs.changes.outputs.regen }}
          REGEN_DESIGNS: ${{ needs.changes.outputs.regen_designs }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
        run: |
          set -euo pipefail
          designs=""
          if [ "$REGEN" = "true" ]; then
            if [ "$REGEN_DESIGNS" = "ALL" ]; then
              for d in designs/*/; do
                n=${d#designs/}; n=${n%/}
                [ -f "designs/$n/$n.scad" ] || continue
                # A design frozen at v0.1 (designs/<n>/ARCHIVED) is retired
                # from full-catalog regeneration — this is the ALL branch, the
                # main-push and infra-change path, and the whole point of the
                # freeze is that a frozen design stops re-rendering forever. A
                # PR that edits the design's own files arrives via the explicit
                # GATE_DESIGNS list below, so reviving it still regenerates it.
                [ -f "designs/$n/ARCHIVED" ] && { echo "regen: skip archived $n"; continue; }
                designs="$designs $n"
              done
            else
              designs="$REGEN_DESIGNS"
            fi
          fi
          # Normalize to a single-space-separated list: regen_designs arrives
          # space-separated and the ALL branch above builds one with a leading
          # space, and the emptiness test below has to see "" for "nothing".
          # shellcheck disable=SC2086  # splitting the name list is the point
          set -- $designs
          designs="$*"
          # Input-fingerprint short-circuit (see the cost note above): a
          # candidate design re-renders only when its fingerprint no longer
          # matches the committed stamp. The full candidate list still feeds
          # the gallery rebuild and the product-page draft step — both read
          # prose the fingerprint deliberately ignores, and both are cheap.
          render_designs=""
          for n in $designs; do
            stamp="designs/$n/previews/.regen-stamp"
            if [ -f "$stamp" ] \
               && [ "$(./scripts/regen-stamp.sh "$n")" = "$(cat "$stamp")" ]; then
              echo "skip $n: inputs unchanged since the committed stamp"
            else
              render_designs="$render_designs $n"
            fi
          done
          # shellcheck disable=SC2086  # splitting the name list is the point
          set -- $render_designs
          render_designs="$*"
          # Which toolchains this run actually needs. bpy is a ~1 GB wheel and
          # Cycles is minutes per shot, so it is installed only when some
          # design that will actually re-render ships a shots.conf — not on
          # every design change.
          shots=false
          for n in $render_designs; do
            [ -f "designs/$n/shots.conf" ] && shots=true
          done
          # OpenSCAD is needed when something re-renders: previews and GIFs
          # render through it, and gallery.sh renders a missing contact
          # sheet.
          render=false
          [ -n "$render_designs" ] && render=true
          gallery=false
          [ -n "$designs" ] && gallery=true
          # The gallery rebuild usually needs no toolchain (it reads the
          # committed sheets) — but gallery.sh renders a missing contact
          # sheet itself, for ANY design's row, not just a candidate's, and
          # a deleted sheet does not invalidate any stamp (previews/ outputs
          # are excluded from the fingerprint on purpose). So when the
          # gallery will run without any candidate rendering, check every
          # design's sheet and force the toolchain install if one is absent,
          # rather than letting gallery.sh die on a missing openscad.
          if [ "$gallery" = true ] && [ "$render" = false ]; then
            for d in designs/*/; do
              n=${d#designs/}; n=${n%/}
              [ -f "designs/$n/$n.scad" ] || continue
              if [ ! -f "designs/$n/previews/contact-sheet.png" ]; then
                echo "contact sheet missing for $n — installing the render toolchain for gallery.sh's fallback"
                render=true
              fi
            done
          fi
          # A fork PR's GITHUB_TOKEN is read-only, so there is nothing to push
          # back to. The commit step turns that into a clear failure with the
          # file list rather than a permissions error nobody can act on.
          can_push=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
             && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            can_push=false
          fi
          # LOOP GUARD. Pushing with a PAT re-triggers this workflow, so a
          # regeneration that is not byte-stable would push, re-trigger,
          # push again, forever. It is not a hypothetical: tools/photoshot
          # documents that Cycles selects an SSE4.2 or AVX2 kernel by what
          # the host CPU supports and that their rounding differs, and
          # nothing pins a run to one runner model.
          #
          # So allow at most ONE regen commit per chain: if HEAD is already
          # one of ours, this is the verification pass. It still regenerates
          # and the gates still judge the result — it just refuses to push
          # again, which bounds the cycle at two runs no matter how unstable
          # the renderer is.
          already=false
          if [ "$(git log -1 --format=%s)" = "$REGEN_SUBJECT" ] \
             && [ "$(git log -1 --format=%ae)" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            already=true
            echo "::notice::HEAD is already a regen commit — this pass verifies it and will not push again"
          fi
          {
            echo "designs=$designs"
            echo "render_designs=$render_designs"
            echo "shots=$shots"
            echo "render=$render"
            echo "gallery=$gallery"
            echo "can_push=$can_push"
            echo "already=$already"
            echo "have_pat=$HAVE_PAT"
          } >> "$GITHUB_OUTPUT"
          echo "candidates: ${designs:-(nothing — no design moved)}"
          echo "re-rendering: ${render_designs:-(nothing — no candidate has changed inputs)}"

      - name: Install OpenSCAD nightly (cached)
        if: steps.plan.outputs.render == 'true'
        # openscad-nightly is the same engine render-gate uses, so a preview is
        # rendered by the build that gates the STL sitting next to it. The
        # composite action caches the OBS .debs — five jobs in this workflow
        # need the nightly engine and each used to pay the OBS fetch on every
        # run.
        #
        # NOTE this job checks out the PR HEAD BRANCH, not the merge ref, so
        # the action file must exist on that branch: a PR whose branch predates
        # .github/actions/setup-openscad-nightly fails here until it merges in
        # the default branch.
        uses: ./.github/actions/setup-openscad-nightly
      - name: Install the render toolchain (xvfb, ImageMagick, gifsicle)
        if: steps.plan.outputs.render == 'true'
        # Deliberately plain apt-get rather than awalsh128/cache-apt-pkgs-action,
        # which the other jobs use: ImageMagick's `convert` and `montage` are
        # update-alternatives symlinks (/usr/bin/montage -> /etc/alternatives/
        # montage -> /usr/bin/montage-im6.q16), and that symlink farm is built
        # by the package's postinst, not shipped in its file list. A cache
        # restore replays the files without the postinst, so `montage` comes
        # back dangling and render.sh dies on "montage: command not found".
        # It fails exactly one run late — the cold run saves the cache and
        # passes, the next one restores it and breaks — which is worth the ~20s
        # this costs. The jobs that do cache apt only need xvfb and openscad,
        # neither of which uses alternatives. (lifestyle-shot.yml already
        # installs ImageMagick this way, for what is presumably this reason.)
        #
        # gifsicle is optional to animate.sh (palette shrink) but keeps GIFs
        # inside the size budget readme-gate enforces.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick gifsicle
          # Prove the alternatives-backed binaries actually resolve, so a
          # packaging regression fails here with a clear message instead of
          # halfway through a design's previews.
          montage --version | head -1
          convert --version | head -1

      - name: Set up Python 3.11 (the interpreter bpy ships wheels for)
        if: steps.plan.outputs.shots == 'true'
        uses: actions/setup-python@v7
        with:
          # 3.11 exactly: bpy 4.5 publishes wheels for 3.11 only, which is the
          # same constraint .claude/hooks/session-start.sh documents. The
          # runner's default 3.12 finds no wheel and the install fails.
          python-version: '3.11'
          cache: pip

      - name: Install bpy
        if: steps.plan.outputs.shots == 'true'
        run: |
          python3 -m pip install -q 'bpy~=4.5.0'
          python3 -c 'import bpy; print("bpy", bpy.app.version_string)'

      - name: Regenerate previews, animations, product shots and the gallery
        # gallery, not render: this step also runs when every candidate was
        # stamp-skipped, because the gallery scrapes prose (NOTES.md) the
        # stamps deliberately ignore — its own rebuild is seconds and needs
        # no toolchain when every contact sheet is committed.
        if: steps.plan.outputs.gallery == 'true'
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
          RENDER_DESIGNS: ${{ steps.plan.outputs.render_designs }}
          SHOTS: ${{ steps.plan.outputs.shots }}
        run: |
          set -euo pipefail
          for n in $RENDER_DESIGNS; do
            # Each generator errors out when its manifest is absent, so ask
            # first — a design with no frozen cameras is not a failure.
            [ -f "designs/$n/previews/cameras.conf" ] && ./scripts/render.sh "$n" --previews
            [ -f "designs/$n/animations.conf" ]       && ./scripts/animate.sh "$n"
            if [ "$SHOTS" = "true" ] && [ -f "designs/$n/shots.conf" ]; then
              ./scripts/product-shot.sh "$n"
            fi
            [ -f "designs/$n/assembly.conf" ]          && ./scripts/assembly.sh "$n"
            # Stamp AFTER the generators, and only for a design that has any
            # manifest at all: the stamp lands in the same commit as the
            # artifacts it fingerprints, so it can never claim a freshness
            # the artifacts don't have.
            if [ -f "designs/$n/previews/cameras.conf" ] \
               || [ -f "designs/$n/animations.conf" ] \
               || [ -f "designs/$n/shots.conf" ] \
               || [ -f "designs/$n/assembly.conf" ]; then
              mkdir -p "designs/$n/previews"
              ./scripts/regen-stamp.sh "$n" > "designs/$n/previews/.regen-stamp"
            fi
          done
          # Last, and unconditional within this step: the gallery is ordered by
          # the lineage resolver and scrapes each design's NOTES.md and contact
          # sheet, so it has to be rebuilt after the sheets above are current.
          ./scripts/gallery.sh

      - name: Draft product pages that do not pass their gate (Claude API)
        if: steps.plan.outputs.designs != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESIGNS: ${{ steps.plan.outputs.designs }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping product-page drafting"
            exit 0
          fi
          for n in $DESIGNS; do
            # product-page.sh no-ops when the page already passes, and restores
            # the previous README when a draft fails the gate. A failure here
            # is deliberately not fatal: "Design product pages" is the job that
            # judges the page and will report the real problem first-hand,
            # rather than this job reporting it second-hand and masking it.
            ./scripts/product-page.sh "$n" \
              || echo "::warning::could not draft a product page for ${n} — see the 'Design product pages' job"
          done

      - name: Commit and push what changed
        id: commit
        env:
          CAN_PUSH: ${{ steps.plan.outputs.can_push }}
          ALREADY: ${{ steps.plan.outputs.already }}
          HAVE_PAT: ${{ steps.plan.outputs.have_pat }}
          # Scoped to this step alone — see persist-credentials on the
          # checkout. Actions masks it in the log.
          PUSH_TOKEN: ${{ secrets.REGEN_TOKEN || github.token }}
          BRANCH: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.ref
                || github.ref_name }}
        run: |
          set -euo pipefail
          # Precise adds: only the two places a generator writes. `git add -A`
          # over the whole tree would sweep in anything else a step left behind.
          git add -A designs README.md
          if git diff --cached --quiet; then
            echo "nothing regenerated — the committed artifacts already match their sources"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "regenerated:"
          git diff --cached --name-only | sed 's/^/  /'
          if [ "$ALREADY" = "true" ]; then
            # Second pass, and the output STILL differs from what the first
            # pass committed. The sources didn't move, so this is the
            # renderer disagreeing with itself across runners — real, but not
            # something to fix by pushing again. Report it and stop: the
            # committed artifacts are the first pass's, which the gates in
            # this very run have judged.
            echo "::warning::Regenerating produced a different result than the regen commit already on this branch, with no source change in between. That means a generator is not reproducible across runners — the files above differ only by rendering noise. Committed artifacts are left as they are; the loop guard stops here rather than pushing again."
            echo "sha=" >> "$GITHUB_OUTPUT"
            git reset >/dev/null
            exit 0
          fi
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::Committed artifacts are stale and CI cannot push to a fork. Regenerate the files listed above locally (./scripts/render.sh <name> --previews, ./scripts/animate.sh <name>, ./scripts/product-shot.sh <name>, ./scripts/assembly.sh <name>, ./scripts/gallery.sh) and commit them, or re-open this PR from a branch in this repository."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$REGEN_SUBJECT"
          # Credential supplied here rather than persisted in .git/config, so
          # the generators that ran above never had it in reach.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH}"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$HAVE_PAT" != "true" ]; then
            # Without a PAT this push cannot trigger a run, so the required
            # contexts stay on the commit we just replaced and the PR becomes
            # unmergeable with no failing check to explain why. Say so where
            # someone will see it, rather than leaving them to work it out.
            echo "::error::Regenerated artifacts were committed as ${sha}, but the REGEN_TOKEN secret is not set, so this push used GITHUB_TOKEN and will NOT trigger a run. The required status checks are still attached to the previous commit and this PR cannot merge until something re-runs CI on ${sha} (push any commit, or re-run this workflow). Fix permanently by adding REGEN_TOKEN — a fine-grained PAT with contents:write on this repository."
          fi
          {
            echo "### Regenerated artifacts"
            echo
            echo "Committed as \`${sha}\` on \`${BRANCH}\`:"
            echo
            git show --pretty=format: --name-only HEAD | while IFS= read -r f; do
              [ -n "$f" ] && printf -- "- \`%s\`\n" "$f"
            done
            echo
            echo "A product page drafted by \`scripts/product-page.sh\` carries an"
            echo "\`AI-drafted\` marker comment — read it before merging and delete the marker."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        # warning+: style-level nits (SC2001 etc.) don't fail the build
        run: shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh
      - name: Python syntax check
        # tools/photoshot/* matches no case in the `changes` classifier, so a
        # PR touching only photoshot.py would otherwise run no verification
        # at all. This job is ungated, so a syntax check here covers every
        # first-party .py (photoshot, gate-summary, printcheck) on every PR
        # without re-gating designs a renderer change cannot affect.
        # ast.parse rather than py_compile: py_compile writes __pycache__ next
        # to each source, which is gitignored but still litters the tree (and
        # trips docs-check's scripts/ glob locally). This only parses.
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(git ls-files '*.py' | grep -v '^lib/BOSL2/')
          printf 'checking %s\n' "${pyfiles[@]}"
          # feature_version pins the grammar to the oldest interpreter the repo
          # supports (tools/printcheck/pyproject.toml: requires-python >=3.10),
          # so syntax that only a newer runner default would accept still
          # fails here rather than at a 3.10 user's install.
          python3 -c '
          import ast, sys
          for f in sys.argv[1:]:
              with open(f, encoding="utf-8") as fh:
                  ast.parse(fh.read(), filename=f, feature_version=(3, 10))
          print(f"{len(sys.argv)-1} file(s) parsed clean against Python 3.10 syntax")
          ' "${pyfiles[@]}"
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: sca2d (report-only)
        # Static analysis of first-party .scad files. lint-scad.sh always
        # exits 0 while we build confidence in the signal — the step exists
        # to surface findings in the log, not to gate (yet).
        run: |
          pip install sca2d
          ./scripts/lint-scad.sh

