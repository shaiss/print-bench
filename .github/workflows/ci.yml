          OPENSCAD_ARGS: --backend=manifold
        run: ./scripts/style-check.sh

  design-docs:
    # Deliberately not gated behind `changes`: it needs no installs, runs in
    # seconds, and always reporting keeps it usable as a required check.
    #
    # It does wait on `regen`, because regen is what makes the artifacts this
    # job checks current — judging the pre-regen tree would fail on exactly
    # the staleness regen just fixed. `!cancelled()` keeps it reporting even
    # when regen fails, so a regen problem shows up as a red regen rather
    # than as a check that never reports.
    name: Design product pages
    needs: regen
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.regen.outputs.sha }}
      - name: Every design ships a product-page README
        run: ./scripts/readme-gate.sh
      - name: README gallery is current (post-regen)
        # The one docs-check assertion that judges a regen OUTPUT rather than
        # the sources: it lives here, after regen, so the scad-check jobs can
        # run docs-check with DOCS_CHECK_GALLERY=skip and start at t=0
        # instead of waiting out the regen job (see the note at the top of
        # this file).
        run: ./scripts/docs-check.sh --gallery-only
      - name: Lifestyle disclosure guards still fire
        # No lifestyle-*.png or lifestyle-*.gif exists in the tree yet, so the
        # per-design gate above never exercises requirement 9. The selftest
        # builds throwaway fixtures and proves each disclosure guard (missing
        # embed / label / note / over-budget, for stills and motion clips
        # alike) still refuses what it exists to refuse.
        run: ./scripts/readme-gate.sh --selftest

  site-build:
    # The same generator Vercel runs (vercel.json pins it), so this catches a
    # broken deploy on the PR instead of after merge. It also link-checks every
    # product page: the build fails on any local reference that does not
    # resolve. Ungated for the same reason design-docs is — one small npm
    # install, seconds to run, and always reporting keeps it usable as a
    # required check. It waits on `regen` for the same reason design-docs
    # does: the site renders the product pages and previews regen produces,
    # and a link check against the pre-regen tree would fail on artifacts
    # that exist by the time the run ends.
    name: Static site builds
    needs: regen
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.regen.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm --prefix site ci
      # Runs before the build so a lineage disagreement is reported as what it
      # is, rather than as whatever the index happens to render. These tests
      # cross-check site/lib/lineage.mjs against tools/lineage by running both
      # over the same fixture trees — the site cannot call the Python resolver
      # (Vercel installs npm deps only), so it ports it, and nothing else
      # notices when a port drifts. python3 is preinstalled on this runner.
      - name: Run the site unit tests
        run: npm --prefix site test
      - name: Build the site (fails on any broken local reference)
        run: node site/build.mjs --out build/site
      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site
          if-no-files-found: error

  scad-check:
    name: OpenSCAD syntax/geometry check
    # No longer waits on regen: everything check.sh judges is authored
    # source, except docs-check's gallery-freshness assertion — which is
    # skipped here (DOCS_CHECK_GALLERY=skip) and asserted post-regen by
    # design-docs instead. Waiting on regen for that one line serialized
    # this job behind the slowest job in the workflow and roughly doubled
    # every PR run's wall time.
    needs: changes
    if: needs.changes.outputs.scad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install OpenSCAD (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # Postinst-free packages only (no update-alternatives) — a cache
          # restore skips postinst, see issue #85; docs-check.sh enforces.
          packages: openscad openscad-mcad xvfb
          # cache key; bump to pull fresh package versions (e.g. after a
          # runner-image rollover or when apt security updates matter)
          version: "2026-08"
      - name: Run check.sh
        env:
          DOCS_CHECK_GALLERY: skip
        run: ./scripts/check.sh

  # Same checks against the OpenSCAD dev snapshot with the Manifold
  # backend — the engine render-gate uses. The stable job above stays the
  # compatibility baseline (2021.01 is what most users run); this job
  # catches nightly-only regressions before they surprise the gate.
  scad-check-nightly:
    name: OpenSCAD syntax/geometry check (nightly, manifold)
    # Same regen decoupling as scad-check above.
    needs: changes
    if: needs.changes.outputs.scad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # Postinst-free packages only (no update-alternatives) — a cache
          # restore skips postinst, see issue #85; docs-check.sh enforces.
          packages: xvfb
          version: "2026-08"
      - name: Install OpenSCAD nightly (cached)
        uses: ./.github/actions/setup-openscad-nightly
      - name: Run check.sh (manifold backend)
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
          DOCS_CHECK_GALLERY: skip
        run: ./scripts/check.sh

  render-gate:
    name: Render designs, gate STLs, test-slice
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    permissions:
      # contents:write only for the telemetry roll-up on default-branch
      # pushes (the checkout itself is persist-credentials: false, so the
      # gate scripts never hold the token; the push step is handed it via
      # env). pull-requests:write is for the sticky printcheck comment.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # "Run but gate nothing" mode: gate=true with an EMPTY gate_designs is
      # the classifier's soft-infra verdict — the change cannot move an
      # exported STL, but this is a required context and a skipped job does
      # not satisfy one (PR #50). Every substantive step below carries the
      # gate_designs guard so the job reports success in seconds without
      # installing a toolchain it will not use. Once branch protection is
      # switched to a single summary context, this mode can become a real
      # `if:` skip on the job.
      - name: Nothing to gate on this change
        if: needs.changes.outputs.gate_designs == ''
        run: |
          echo "No geometry-affecting path changed and no design is in scope."
          echo "This required context runs as a formality — see the soft-infra"
          echo "note in the 'Detect changed paths' job."
      - name: Install xvfb, PrusaSlicer and f3d (cached)
        if: needs.changes.outputs.gate_designs != ''
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # PrusaSlicer stays on the Ubuntu package: upstream stopped
          # shipping Linux binaries after 2.9.0 (Flatpak-only now), so
          # apt 2.7.x is the newest CI-practical build. f3d likewise uses
          # the Ubuntu package (2.2.x; upstream 3.x ships .debs if we ever
          # need newer) — it only renders artifact previews here.
          # Postinst-free packages only (no update-alternatives) — a cache
          # restore skips postinst, see issue #85; docs-check.sh enforces.
          packages: xvfb prusa-slicer f3d
          # cache key; bump to pull fresh package versions (see scad-check)
          version: "2026-08"
      - name: Install OpenSCAD nightly (cached)
        # Dev snapshots render with the Manifold backend — order-of-
        # magnitude faster than 2021.01's CGAL on these models. The stable
        # binary remains covered by the scad-check job.
        if: needs.changes.outputs.gate_designs != ''
        uses: ./.github/actions/setup-openscad-nightly
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.gate_designs != ''
        with:
          python-version: '3.12'
          cache: pip
      - name: Install printcheck
        if: needs.changes.outputs.gate_designs != ''
        run: pip install -e tools/printcheck
      - name: Prove the derivative gate can still fire
        # The gate's derivative check rests entirely on two undocumented
        # OpenSCAD behaviours: a redefinition that binds nothing is reported
        # nowhere, and the mesh it leaves behind is byte-identical to the
        # parent's. Both were measured on 2021.01; this job renders on the
        # dev snapshot with the Manifold backend, where neither is promised.
        # The selftest renders fixtures carrying a working override and a
        # typo'd one and asserts the comparison still separates them.
        #
        # Ahead of the gate, and blocking, because a gate that has silently
        # stopped firing is indistinguishable from a gate with nothing to
        # report — every derivative below would pass by saying nothing. It
        # costs seconds: four small fixtures, no printcheck, no slicer.
        if: needs.changes.outputs.gate_designs != ''
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        run: ./scripts/lineage.sh selftest
      - name: Render, gate with printcheck, test-slice with PrusaSlicer
        if: needs.changes.outputs.gate_designs != ''
        env:
          GATE_DESIGNS: ${{ needs.changes.outputs.gate_designs }}
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        # pipefail: the default Actions shell is `bash -e` WITHOUT pipefail,
        # so without it tee would mask gate.sh failures.
        run: |
          set -o pipefail
          if [ "$GATE_DESIGNS" = ALL ]; then
            ./scripts/gate.sh --slice | tee gate.log
          else
            echo "gating changed designs only: $GATE_DESIGNS"
            # word splitting of the design list is intended
            # shellcheck disable=SC2086
            ./scripts/gate.sh --slice $GATE_DESIGNS | tee gate.log
          fi
      - name: Write job summary
        if: always() && needs.changes.outputs.gate_designs != ''
        run: |
          python3 scripts/gate-summary.py gate.log > gate-summary.md \
            || echo '_no gate output captured_' > gate-summary.md
          cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Capture telemetry record
        # One JSON line per gate run (issue #93): scores, per-design wall
        # time, budget headroom, what was skipped. always(): a failed gate is
        # telemetry too — the outcome is exactly what the record is for.
        if: always() && needs.changes.outputs.gate_designs != ''
        env:
          GATE_DESIGNS: ${{ needs.changes.outputs.gate_designs }}
        run: |
          set -euo pipefail
          if [ ! -f gate.log ]; then
            echo "no gate.log — the run died before the gate step, nothing to capture"
            exit 0
          fi
          ./scripts/telemetry.sh capture --gate-log gate.log \
            --out telemetry-record.ndjson \
            --meta "event=$GITHUB_EVENT_NAME" \
            --meta "run_id=$GITHUB_RUN_ID" \
            --meta "sha=$GITHUB_SHA" \
            --meta "designs=$GATE_DESIGNS"
          cat telemetry-record.ndjson
      - name: Upload telemetry record
        # Every run's record is inspectable as an artifact; only default-
        # branch pushes also land in the committed log below, so PR noise
        # never accumulates in history.
        if: always() && needs.changes.outputs.gate_designs != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-record
          path: telemetry-record.ndjson
          if-no-files-found: warn
      - name: Roll the record into the committed telemetry log
        # Default-branch pushes only, and pushed with GITHUB_TOKEN ON
        # PURPOSE — the opposite of the regen job's REGEN_TOKEN rule, for
        # the same underlying fact: a GITHUB_TOKEN push triggers no
        # workflow. Here that is the feature, not the trap. A telemetry
        # commit that re-triggered CI would gate the whole catalog again,
        # capture a new record, and commit forever; and unlike regen's PR
        # commits, nothing needs checks to attach to a main commit after
        # the fact. The retry loop covers the one same-run race: regen can
        # push its own commit to main while this job runs.
        if: >-
          always() && github.event_name == 'push' &&
          needs.changes.outputs.gate_designs != ''
        env:
          # Scoped to this step alone — see persist-credentials on the
          # checkout. Actions masks it in the log.
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f telemetry-record.ndjson ]; then
            echo "no record captured — nothing to roll up"
            exit 0
          fi
          cat telemetry-record.ndjson >> telemetry/log.ndjson
          ./scripts/telemetry.sh report --out telemetry/REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry/log.ndjson telemetry/REPORT.md
          git commit -m "Telemetry: record gate run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — the branch moved, rebasing"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          # Non-fatal by design: the record survives as the artifact above,
          # and the next default-branch run appends its own record anyway —
          # failing the required gate context over bookkeeping would be
          # backwards.
          echo "::warning::could not push the telemetry record after 3 attempts — it is still available in the telemetry-record artifact"
      - name: Upsert sticky PR comment
        # Same-repo PRs only: fork PR tokens are read-only and the comment
        # would fail; this repo's PRs all come from session branches anyway.
        #
        # !cancelled() rather than always(): a run superseded by the next
        # push (concurrency cancels it mid-gate) would otherwise overwrite a
        # complete report with a truncated one — the log stops mid-part, so
        # the table renders the in-flight part as "no printcheck score" and
        # silently drops every part after it. Leave the previous comment
        # standing; the superseding run posts the real result.
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.changes.outputs.gate_designs != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- printcheck-gate-report -->';
            let report;
            try {
              report = fs.readFileSync('gate-summary.md', 'utf8');
            } catch {
              report = '_gate produced no summary (job failed before printcheck ran)_';
            }
            // !cancelled() on the step is evaluated before the step starts,
            // so it cannot stop a run cancelled (or simply overtaken) once
            // this script is already in flight — that run would finish its
            // API calls and overwrite the newer run's report with stale
            // output. Check we are still the PR head twice: once up front to
            // skip the listComments call entirely, and again immediately
            // before the write, since a push during the (paginated) list is
            // the wider window of the two.
            //
            // This shrinks the race, it cannot remove it: there is no
            // conditional-write primitive on the comments API, so some gap
            // between the last check and the write always remains. The body
            // carries the SHA it was built from, and the next run rewrites
            // the comment, so a lost race is visible and self-correcting.
            const built = context.payload.pull_request.head.sha;
            const stillCurrent = async () => {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.issue.number,
              });
              if (pr.head.sha === built) return true;
              core.info(`superseded: PR head is ${pr.head.sha.slice(0, 7)}, `
                + `this run built ${built.slice(0, 7)} — leaving the comment alone`);
              return false;
            };
            if (!await stillCurrent()) return;
            const sha = built.slice(0, 7);
            // Name the artifacts: the f3d renders are the only view of the
            // exported meshes these numbers describe, and an artifact nobody
            // is pointed at may as well not exist (geo-diff's comment names
            // its own renders for the same reason).
            // "when f3d succeeded": this step runs BEFORE the f3d render and
            // its upload, and that upload is if-no-files-found: warn, so a
            // render that produced nothing leaves no stl-renders artifact.
            // Hedged wording beats reordering the steps to find out.
            const body = `${marker}\n${report}\n`
              + `_The meshes behind these numbers are in the \`stls\` artifact, `
              + `and their renders in \`stl-renders\` when f3d succeeded. `
              + `Automated report for ${sha}._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (!await stillCurrent()) return;
            if (prev) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
      - name: Render gated STLs with f3d
        # Previews of the exported STLs — the meshes printcheck and the
        # slicer actually see — as opposed to the OpenSCAD source-level
        # contact sheets (which show modifier colors and assembled poses,
        # not export artifacts). Non-blocking while f3d proves itself in
        # this pipeline (issue #22).
        if: always() && needs.changes.outputs.gate_designs != ''
        continue-on-error: true
        run: |
          mkdir -p stl-renders
          shopt -s nullglob
          for stl in build/*.stl; do
            base="$(basename "${stl%.stl}")"
            xvfb-run -a f3d "$stl" --output="stl-renders/${base}.png" \
              --resolution=1200,900 2>/dev/null \
              || echo "f3d failed on ${stl} (non-blocking)"
          done
      - name: Upload STL renders
        if: always() && needs.changes.outputs.gate_designs != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: stl-renders
          path: stl-renders/*.png
          if-no-files-found: warn
      - name: Upload STLs
        # The gate_designs guard matters here beyond saving seconds: in the
        # "run but gate nothing" mode no STL exists, and if-no-files-found:
        # error would fail the job for having correctly done nothing.
        if: always() && needs.changes.outputs.gate_designs != ''
        uses: actions/upload-artifact@v7
        with:
          name: stls
          path: build/*.stl
          if-no-files-found: error

  # Geometric diff of the rendered STLs, base vs head, on design PRs:
  # bodies added/removed/modified, volume/mass deltas, interference —
  # posted as a second sticky comment. argus-diff is v0.1.x (weeks old at
  # adoption), so the whole job is continue-on-error and gates nothing;
  # revisit --fail-on-interference once it proves stable (issue #21).
  geo-diff:
    name: Geometric STL diff (argus-diff, non-blocking)
    needs: changes
    # gate_designs != '' as well as gate: this job is advisory and not a
    # required context, so unlike render-gate it can honestly skip in the
    # soft-infra "run but gate nothing" mode instead of rendering base and
    # head of every part to report no delta.
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.gate == 'true' &&
      needs.changes.outputs.gate_designs != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # full history so the merge base with the base branch is reachable
          fetch-depth: 0
      - name: Check out the merge base for comparison renders
        # Deliberately the merge base, not `ref: github.base_ref` — that
        # resolves to the base branch's MOVING TIP, so once main advances
        # past this PR's fork point the diff would attribute other people's
        # merges to this PR. The merge base is what `git diff main...HEAD`
        # compares against, and what the `changes` job above already uses.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_sha="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "diffing against merge base ${base_sha}"
          git worktree add base "$base_sha"
      - name: Install xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # Postinst-free packages only (no update-alternatives) — a cache
          # restore skips postinst, see issue #85; docs-check.sh enforces.
          packages: xvfb
          version: "2026-08"
      - name: Install OpenSCAD nightly (cached)
        # Same engine as render-gate so base and head render identically.
        uses: ./.github/actions/setup-openscad-nightly
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install argus-diff
        run: pip install 'argus-diff[render]'
      - name: Render base + head parts, diff each
        env:
          GATE_DESIGNS: ${{ needs.changes.outputs.gate_designs }}
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
        run: |
          set -o pipefail
          mkdir -p argus-renders head-stl base-stl
          : > argus-report.md
          read -ra osc_args <<<"$OPENSCAD_ARGS"

          render_part() {  # root name part outdir -> 0/1
            local root="$1" name="$2" part="$3" outdir="$4"
            local src="${root}/designs/${name}/${name}.scad"
            [ -f "$src" ] || return 1
            local dargs=()
            [ -n "$part" ] && dargs=(-D "part=\"${part}\"")
            # same search path the scripts export: lib/ for shared modules,
            # the tree root for `include <styles/<name>/style.scad>`
            OPENSCADPATH="${root}/lib:${root}" xvfb-run -a "$OPENSCAD_BIN" \
              "${osc_args[@]}" -o "${outdir}/${name}${part:+-$part}.stl" \
              "${dargs[@]}" "$src"
          }

          if [ "$GATE_DESIGNS" = ALL ] || [ -z "$GATE_DESIGNS" ]; then
            designs="$(for d in designs/*/; do
              n="$(basename "$d")"
              [ -f "designs/$n/$n.scad" ] || continue
              # Skip designs frozen at v0.1 (designs/<n>/ARCHIVED) in the
              # full-catalog branch, matching gate.sh and the regen job: a
              # frozen design is not re-rendered for a base-vs-head diff it
              # can no longer move. A PR editing an archived design lands in
              # the explicit GATE_DESIGNS list below and is still diffed.
              [ -f "designs/$n/ARCHIVED" ] && continue
              echo "$n"
            done)"
          else
            designs="$(tr ' ' '\n' <<<"$GATE_DESIGNS")"
          fi

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f "designs/${name}/ci.parts" ]; then
              # `|| true`: grep exits 1 on a comment-only file, and the
              # default Actions shell is `bash -e` (same guard gate.sh uses)
              parts="$(grep -vE '^(#|$)' "designs/${name}/ci.parts" || true)"
            else
              parts=""
            fi
            # empty part = the design's default render
            printf '%s\n' "${parts:-''}" | while IFS= read -r part; do
              [ "$part" = "''" ] && part=""
              label="${name}${part:+-$part}"
              if ! render_part . "$name" "$part" head-stl; then
                echo "skip ${label}: head render failed"; continue
              fi
              # A missing base source is a genuinely new design; a base
              # source that fails to render is a signal worth reporting, not
              # something to mislabel as new.
              if [ ! -f "base/designs/${name}/${name}.scad" ]; then
                {
                  echo "### \`${label}\`"
                  echo
                  echo "_new on this PR (no base version to diff against)_"
                  echo
                } >> argus-report.md
                continue
              fi
              if ! render_part base "$name" "$part" base-stl; then
                {
                  echo "### \`${label}\`"
                  echo
                  echo "_base render failed — no diff produced (see job log)_"
                  echo
                } >> argus-report.md
                continue
              fi
              out="$(xvfb-run -a argus diff \
                "base-stl/${label}.stl" "head-stl/${label}.stl" \
                --density 1.24 --render "argus-renders/${label}.png" \
                2>&1)" || true
              {
                echo "### \`${label}\`"
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
              } >> argus-report.md
            done
          done <<<"$designs"
      - name: Upload diff renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: argus-diff-renders
          path: argus-renders/*.png
          if-no-files-found: ignore
      - name: Upsert sticky PR comment
        # Same-repo PRs only, same reason as render-gate's sticky comment.
        # !cancelled() for the same reason too: a cancelled run has no
        # argus-report.md, so always() would replace a good geometric diff
        # with "job failed before diffing" every time a push supersedes a
        # run in flight.
        if: >-
          !cancelled() &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- argus-diff-report -->';
            let report;
            try {
              report = fs.readFileSync('argus-report.md', 'utf8');
            } catch {
              report = '_argus-diff produced no report (job failed before diffing)_';
            }
            if (!report.trim()) {
              report = '_no gated parts to diff on this PR_';
            }
            // Same stale-run guard as render-gate's sticky comment, with the
            // same two call sites and the same caveat: the step-level
            // !cancelled() cannot stop an already-running script, and no
            // conditional-write primitive exists, so this narrows the race
            // rather than closing it.
            const built = context.payload.pull_request.head.sha;
            const stillCurrent = async () => {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.issue.number,
              });
              if (pr.head.sha === built) return true;
              core.info(`superseded: PR head is ${pr.head.sha.slice(0, 7)}, `
                + `this run built ${built.slice(0, 7)} — leaving the comment alone`);
              return false;
            };
            if (!await stillCurrent()) return;
            const sha = built.slice(0, 7);
            const body = `${marker}\n### Geometric diff vs base (non-blocking)\n` +
              `${report}\n_Before/after/overlay renders are in the ` +
              `argus-diff-renders artifact. Automated report for ${sha}._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (!await stillCurrent()) return;
            if (prev) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

  # Smart CI, layer two. The `changes` classifier above selects which of the
  # EXISTING gates run. This job selects gates that do NOT exist yet: it reads
  # the PR's changed files, asks the registry (.github/ci-gates/registry.conf)
  # which candidate gates apply, RUNS the ones already approved, and posts a
  # sticky comment proposing the rest with the one command each takes to cross.
  #
  # Runs on every PR and every push, with no `changes` gate and no early
  # skip, for the required-context reason spelled out for ci-ok: a job that
  # can be skipped cannot satisfy branch protection. It is cheap by
  # construction — stdlib-only selector, and by default the only active gate
  # is the advisory classifier-coverage detector (pure Python, never blocks).
  # A gating gate runs only once a human has crossed it (state=on), so this
  # job cannot start failing PRs on its own.
  smart-ci:
    name: Smart CI gate selection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # upsert the sticky selection comment
    env:
      # The selector is stdlib-only precisely so it runs before any install —
      # point Python at src/ instead of pip-installing it, exactly as the
      # classifier calls tools/lineage uninstalled.
      PYTHONPATH: ${{ github.workspace }}/tools/ci-gates/src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # need the merge base (PR) / previous commit (push)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compute the changed-file list
        # Same merge-base diff the classifier and geo-diff use on a PR; on a
        # push, the range the push actually moved. Written to changed.txt for
        # the selector and for the gates it runs (exported as CI_GATES_CHANGED).
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "${BEFORE}...${GITHUB_SHA}" > changed.txt
          else
            # New branch or unreachable before-sha: fall back to the last commit.
            git diff --name-only 'HEAD~1...HEAD' > changed.txt || : > changed.txt
          fi
          echo "changed files:"; sed 's/^/  /' changed.txt
      - name: Select gates
        id: select
        run: |
          python -m ci_gates select \
            --changed-from changed.txt \
            --sha "$(git rev-parse --short HEAD)" \
            --plan plan.json --comment comment.md
      - name: Upsert sticky selection comment
        # Same-repo PRs only (fork tokens are read-only), and the same
        # supersede-guarded upsert render-gate uses. Posted BEFORE the gates
        # run, so the selection is reported whether or not a gating gate then
        # fails.
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          # 'true' when the selector has something to say (a gate active,
          # proposed or declined), 'false' when it ran and found nothing, '' if
          # it never ran (crashed before emitting). Used below to skip the empty
          # "no gates active" comment that otherwise lands on nearly every PR.
          HAS_COMMENT: ${{ steps.select.outputs.has_comment }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- smart-ci-gate-selection -->';
            const val = process.env.HAS_COMMENT;          // 'true' | 'false' | ''
            const selectRan = val === 'true' || val === 'false';
            const hasComment = val === 'true';
            let body;
            try {
              body = fs.readFileSync('comment.md', 'utf8');
            } catch {
              body = `${marker}\n_smart-ci produced no selection (job failed before select ran)_`;
            }
            const built = context.payload.pull_request.head.sha;
            const stillCurrent = async () => {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.issue.number,
              });
              if (pr.head.sha === built) return true;
              core.info(`superseded: PR head is ${pr.head.sha.slice(0, 7)}, `
                + `this run built ${built.slice(0, 7)} — leaving the comment alone`);
              return false;
            };
            if (!await stillCurrent()) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (!await stillCurrent()) return;
            // Nothing to propose or report (the selector ran and found no gate
            // active/proposed/declined): don't post the low-value "no gates
            // active" comment on the majority of PRs, and delete a stale one
            // left by an earlier push that did have something to say. When the
            // selector never ran (val === ''), fall through and post the
            // failure notice so a broken selector stays visible.
            if (selectRan && !hasComment) {
              if (prev) {
                await github.rest.issues.deleteComment({
                  ...context.repo, comment_id: prev.id,
                });
                core.info('smart-ci: nothing to report — removed the stale selection comment');
              } else {
                core.info('smart-ci: nothing to report — no comment posted');
              }
              return;
            }
            if (prev) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
      - name: Run the approved gates
        # Blocking (gating, state=on) failures fail this job; advisory gates
        # only warn. run-plan runs each gate's own `setup` first, so a gate
        # that needs a tool the runner lacks installs it on demand.
        run: |
          python -m ci_gates run-plan plan.json --changed-from changed.txt

  # Single summary context, so branch protection can require ONE check
  # ("CI OK") instead of matching five job names. The point: a required
  # context must actually RUN to satisfy protection (PR #50), which is why
  # this workflow carries always-run formality modes (render-gate's "gate
  # nothing" mode, ptests=true on soft-infra paths). Once branch protection
  # requires only this job, every other job can be honestly skipped via
  # `if:` and those modes can be retired — and docs-only PRs, which today
  # run no required context at all, become mergeable.
  #
  # Skipped counts as OK here BY DESIGN: a skip is the classifier's verdict
  # that the job had nothing to judge. The trade is real — a classifier bug
  # that wrongly skips a job now merges green instead of stranding the PR —
  # which is why the classifier's fail-closed constructs (the command
  # substitution capture, the unguarded blast-radius call) matter more once
  # this is the required context, not less.
  #
  # geo-diff is deliberately not in `needs`: it is advisory
  # (continue-on-error) and its verdict must not gate a merge.
  #
  # Every gating job belongs in this list. A job missing from `needs` can
  # fail without blocking the merge, and nothing detects the omission — add
  # new jobs here in the same change that creates them.
  ci-ok:
    name: CI OK
    needs:
      - changes
      - lint
      - regen
      - printcheck-tests
      - stylelift-tests
      - lineage-tests
      - backlog-burn-tests
      - backlog-groomer-tests
      - model-registry-tests
      - reeve-tests
      - brief-sources-tests
      - telemetry-tests
      - ci-gates-tests
      - docs-standards
      - style-gate
      - design-docs
      - site-build
      - scad-check
      - scad-check-nightly
      - render-gate
      - smart-ci
    # !cancelled(): run and report even when a needed job failed or was
    # skipped — the default would skip this job the moment any dependency
    # was, which as a required context is exactly the PR #50 trap.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every gating job succeeded or was skipped by the classifier
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          for job, info in sorted(needs.items()):
              print(f"{info['result']:>9}  {job}")
          bad = [j for j, i in needs.items()
                 if i["result"] not in ("success", "skipped")]
          if bad:
              print(f"\nnot green: {', '.join(sorted(bad))}")
              sys.exit(1)
          print("\nCI OK")
          EOF
