name: Release bundles

# The "ship it" half of publishing (issue #102, build side): turn gated STL
# exports into downloadable, self-describing release bundles and attach them to
# a tagged GitHub Release, so a stranger can get the file without cloning the
# repo and rendering.
#
# Two triggers:
#   - push a version tag (v*): release every active design at that version.
#   - workflow_dispatch: release one design (or all) at a chosen version.
#
# The gate runs first (scripts/gate.sh --slice), so a part that does not pass
# printcheck + the test-slice never reaches a release — only gated geometry
# ships. Then scripts/release-bundle.sh assembles, per design, a zip of the
# STLs + a manifest.json (per-part SHA-256 checksums, byte sizes, and the
# machine-readable print settings from the README). Archived designs are frozen
# and skipped (they keep their last release). The site consumption of these
# manifests — per-part download links on product pages — is the deferred
# follow-up half of #102.

on:
  workflow_dispatch:
    inputs:
      design:
        description: 'Design name, or "all" for every active design'
        required: true
        default: all
        type: string
      version:
        description: 'Version for the bundle, e.g. v0.2 (defaults to v0.1)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

# Creating a GitHub Release and uploading assets needs contents:write; the
# default GITHUB_TOKEN carries it. No commit is pushed back to a branch, so —
# unlike regen — no PAT is needed: a Release is a terminal artifact, not a
# change that has to re-trigger CI.
permissions:
  contents: write

concurrency:
  # One release build per ref; never cancel a publish mid-upload.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build gated STL bundles and publish a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A tag push (push event) builds the tagged commit — that is the whole
          # point of a release. A manual workflow_dispatch, by contrast, must
          # build the reviewed default branch, never whatever ref the dispatcher
          # happened to pick, so a release cannot be cut from unreviewed branch
          # code (Qodo review on #140; same posture as log-print-result.yml and
          # docs/actions-security.md, issue #113).
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.repository.default_branch
                || github.ref }}

      - name: Install xvfb and PrusaSlicer (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # Postinst-free packages only (docs-check.sh enforces the allowlist):
          # a cache restore skips postinst, so alternatives-managed binaries
          # would come back dangling (issue #85).
          packages: xvfb prusa-slicer
          version: "2026-08"

      - name: Install OpenSCAD nightly (cached)
        # The Manifold backend — the same engine render-gate uses, an order of
        # magnitude faster than 2021.01's CGAL on these models.
        uses: ./.github/actions/setup-openscad-nightly

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install printcheck
        run: pip install -e tools/printcheck

      - name: Resolve target and version
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          IN_DESIGN: ${{ github.event.inputs.design }}
          IN_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            # tag push: the tag name is the version, release everything active.
            design=all
            version="$REF_NAME"
          else
            design="${IN_DESIGN:-all}"
            version="${IN_VERSION:-v0.1}"
          fi
          # The commit actually built (the checked-out ref: the tag for a push,
          # the default branch for a dispatch), so the release targets what was
          # built and the tag/assets cannot diverge (Qodo review on #140).
          sha="$(git rev-parse HEAD)"
          {
            echo "design=$design"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing '$design' at '$version' from $sha."

      - name: Gate the parts (only gated geometry ships)
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
          DESIGN: ${{ steps.cfg.outputs.design }}
        run: |
          set -o pipefail
          if [ "$DESIGN" = all ]; then
            ./scripts/gate.sh --slice
          else
            ./scripts/gate.sh --slice "$DESIGN"
          fi

      - name: Assemble the release bundle(s)
        env:
          OPENSCAD_BIN: openscad-nightly
          OPENSCAD_ARGS: --backend=manifold
          DESIGN: ${{ steps.cfg.outputs.design }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DESIGN" = all ]; then
            ./scripts/release-bundle.sh --all --version "$VERSION"
          else
            ./scripts/release-bundle.sh "$DESIGN" --version "$VERSION"
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cfg.outputs.version }}
          SHA: ${{ steps.cfg.outputs.sha }}
          DESIGN: ${{ steps.cfg.outputs.design }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Three asset kinds, so the site (issue #139) can link either the whole
          # bundle or one part, and read checksums/sizes/print settings without
          # unzipping: the individual gated STLs (build/release/<name>-<ver>/*.stl,
          # name-prefixed so basenames are unique), the per-design zips, and the
          # standalone manifests.
          assets=(build/release/*/*.stl build/release/*.zip build/release/*.manifest.json)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no release bundles were produced (an archived design, or nothing matched)"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --target "$SHA" \
              --title "$VERSION" \
              --notes "Per-design STL bundles with per-part SHA-256 checksums and machine-readable print settings, built from gated exports by .github/workflows/release.yml (issue #102)."
          fi

          # Hand a human who dispatched this a one-click link to the Release and
          # a legible per-run summary, instead of the URL living only in the log.
          rel_url="$(gh release view "$VERSION" --json url -q .url 2>/dev/null || true)"
          {
            echo "## Release bundles — ${VERSION}"
            echo ""
            echo "- target: \`${DESIGN}\` at commit \`$(printf '%.8s' "$SHA")\`"
            echo "- published ${#assets[@]} asset(s): per-part STLs, per-design zips, and standalone manifests"
            if [ -n "$rel_url" ]; then
              echo ""
              echo "**[${rel_url}](${rel_url})**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
