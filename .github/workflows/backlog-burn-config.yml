name: Backlog-burn config update

# The human interface for changing backlog-burn policy without a full PR.
# A maintainer comments `/backlog-burn set <key> <value>` on any issue or PR,
# or uses workflow_dispatch, and this workflow authorises them by their real
# repository permission, validates the change with the trusted backlog-burn
# tool, and commits the result to the default branch (or the PR branch if
# called from a PR comment) via the Contents API with REGEN_TOKEN — exactly the
# same pattern as ci-gate-approve.yml.
#
# Supported commands (leading slash required in a comment):
#   /backlog-burn set enabled true|false
#   /backlog-burn set label <label-name>
#   /backlog-burn set provider anthropic|zai
#   /backlog-burn set cadence hourly|4x|2x|daily|weekly|<raw-5-field-cron>
#
# For `cadence`, both .github/backlog-burn.conf and the cron literal in
# .github/workflows/backlog-burn.yml are patched in one commit so they stay
# in sync (Actions can't read a file for on.schedule.cron).
#
# SECURITY — this is a privileged workflow (issue_comment runs in the base
# repository's context with REGEN_TOKEN available).  It must NEVER check out
# or execute code from the PR head.  So:
#   * The only code that runs is the TRUSTED base-branch tooling (actions/checkout
#     with no `ref` gets the default branch, the same copy the workflow lives on).
#   * The config files are read/written as DATA through the Contents API, never
#     by checking out the head branch.
#   * The comment body is handled inside github-script as a JS string and
#     validated against a strict pattern before anything else runs — never
#     interpolated into a shell command.
#
# The commit uses REGEN_TOKEN (a fine-grained PAT with contents:write) for the
# same reason as regen and ci-gate-approve: a PAT-authored commit re-triggers
# CI so the tool's tests run on the updated config; a GITHUB_TOKEN commit would
# not.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      key:
        description: 'Config key to set (enabled, label, provider, cadence)'
        required: true
        type: choice
        options: [enabled, label, provider, cadence]
      value:
        description: 'New value'
        required: true
        type: string
      ref:
        description: 'Branch to commit to (default: the repo default branch)'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  # Only reads PRs (pulls.get for the head ref); PR/issue comments and reactions
  # are covered by issues:write, and the config commit uses REGEN_TOKEN via the
  # Contents API — so GITHUB_TOKEN needs no pull-requests:write (matches the
  # mirror workflow ci-gate-approve.yml).
  pull-requests: read

concurrency:
  # Serialize commands so two simultaneous set calls cannot race on the same file.
  group: backlog-burn-config
  cancel-in-progress: false

env:
  CONF_PATH: .github/backlog-burn.conf
  WORKFLOW_PATH: .github/workflows/backlog-burn.yml

jobs:
  apply:
    name: Apply a /backlog-burn set command
    # For issue_comment: only fire on the /backlog-burn prefix.
    # For workflow_dispatch: always run (the inputs are already validated by GitHub).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/backlog-burn')
    runs-on: ubuntu-latest
    # A privileged command handler should fail fast, not sit on the 6-hour
    # default if a GitHub API call hangs.
    timeout-minutes: 10
    steps:
      - name: Authorize and parse the command
        id: parse
        uses: actions/github-script@v8
        env:
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            const react = async (content) => {
              if (!isDispatch) {
                await github.rest.reactions.createForIssueComment({
                  ...context.repo, comment_id: context.payload.comment.id, content,
                });
              }
            };
            const reply = async (msg) => {
              if (!isDispatch) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: context.issue.number,
                  body: `${msg}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
                });
              } else {
                core.notice(msg);
              }
            };

            // Parse command: from comment body or workflow_dispatch inputs.
            let key, value;
            if (isDispatch) {
              key   = context.payload.inputs.key;
              value = context.payload.inputs.value;
            } else {
              const body = context.payload.comment.body.trim();
              // Strict pattern: key is one of the known identifiers; value is
              // everything after it (trimmed), allowing spaces in cron literals.
              // No shell metacharacters are allowed in the value.
              const m = body.match(
                /^\/backlog-burn\s+set\s+(enabled|label|provider|cadence)\s+([^\n<>&|;`$\\]{1,128})\s*$/
              );
              if (!m) {
                await react('confused');
                await reply(
                  '**`/backlog-burn set`** — usage:\n'
                  + '```\n'
                  + '/backlog-burn set enabled true|false\n'
                  + '/backlog-burn set label <label-name>\n'
                  + '/backlog-burn set provider anthropic|zai\n'
                  + '/backlog-burn set cadence hourly|4x|2x|daily|weekly|<cron>\n'
                  + '```'
                );
                core.setOutput('valid', 'false');
                return;
              }
              key   = m[1];
              value = m[2].trim();
            }

            // Native authorization: commenter's real permission on this repo.
            // workflow_dispatch is already restricted to users who can trigger workflows (write+).
            if (!isDispatch) {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: context.payload.comment.user.login,
              });
              if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
                await react('-1');
                await reply(
                  `@${context.payload.comment.user.login} — \`/backlog-burn set\` needs write `
                  + `access to this repository (you have \`${perm.permission}\`).`
                );
                core.setOutput('valid', 'false');
                return;
              }
            }

            // Determine the target branch.  For PR comments use the PR head
            // (same repo only — same fork restriction as ci-gate-approve);
            // for issue comments and dispatch, use the repo default branch.
            let targetRef = '';
            let issueNumber = 0;

            if (!isDispatch && context.payload.issue.pull_request) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.issue.number,
              });
              const sameRepo = pr.head.repo
                && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
              if (!sameRepo) {
                await react('-1');
                await reply(
                  'This PR is from a fork — I cannot commit to its branch. '
                  + 'Edit `.github/backlog-burn.conf` in the PR instead.'
                );
                core.setOutput('valid', 'false');
                return;
              }
              targetRef   = pr.head.ref;
              issueNumber = context.issue.number;
            } else if (isDispatch && context.payload.inputs.ref) {
              targetRef = context.payload.inputs.ref;
            } else {
              // Default branch.  Get it from the repo metadata.
              const { data: repo } = await github.rest.repos.get({ ...context.repo });
              targetRef = repo.default_branch;
              issueNumber = context.issue ? context.issue.number : 0;
            }

            await react('eyes');
            core.setOutput('valid', 'true');
            core.setOutput('key', key);
            core.setOutput('value', value);
            core.setOutput('target_ref', targetRef);
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('have_pat', process.env.HAVE_PAT === 'true' ? 'true' : 'false');

      # TRUSTED tooling only: no `ref` = the base repo's default branch.
      # The PR head is never checked out.
      - name: Check out trusted tooling
        if: steps.parse.outputs.valid == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        if: steps.parse.outputs.valid == 'true'
        with:
          python-version: '3.12'

      - name: Install the backlog-burn tool
        if: steps.parse.outputs.valid == 'true'
        run: pip install -e tools/backlog-burn -q

      # Fetch the current versions of the files we may edit, via the Contents
      # API (data only — no checkout of the target branch).
      - name: Fetch target files (as data)
        id: fetch
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v8
        env:
          TARGET_REF: ${{ steps.parse.outputs.target_ref }}
          KEY: ${{ steps.parse.outputs.key }}
        with:
          script: |
            const ref  = process.env.TARGET_REF;
            const key  = process.env.KEY;
            const fs   = require('fs');

            // Always fetch backlog-burn.conf.
            const conf = await github.rest.repos.getContent({
              ...context.repo, path: process.env.CONF_PATH, ref,
            });
            fs.writeFileSync('pr-backlog-burn.conf', Buffer.from(conf.data.content, 'base64'));
            core.setOutput('conf_sha', conf.data.sha);

            // Also fetch backlog-burn.yml when we're setting cadence (we need to
            // patch its cron literal too).
            if (key === 'cadence') {
              const wf = await github.rest.repos.getContent({
                ...context.repo, path: process.env.WORKFLOW_PATH, ref,
              });
              fs.writeFileSync('pr-backlog-burn.yml', Buffer.from(wf.data.content, 'base64'));
              core.setOutput('wf_sha', wf.data.sha);
            }

      - name: Apply the change with trusted code
        id: apply
        if: steps.parse.outputs.valid == 'true'
        env:
          KEY:   ${{ steps.parse.outputs.key }}
          VALUE: ${{ steps.parse.outputs.value }}
        run: |
          set -euo pipefail
          cp pr-backlog-burn.conf pr-backlog-burn.orig

          # For cadence, also save the original workflow so we can detect changes.
          if [ -f pr-backlog-burn.yml ]; then
            cp pr-backlog-burn.yml pr-backlog-burn-wf.orig
          fi

          if out="$(backlog-burn config set "$KEY" "$VALUE" \
                    --path pr-backlog-burn.conf \
                    --workflow-path pr-backlog-burn.yml 2>&1)"; then
            ok=true
          else
            ok=false
          fi

          conf_changed=false
          if $ok && ! cmp -s pr-backlog-burn.orig pr-backlog-burn.conf; then
            conf_changed=true
          fi

          wf_changed=false
          if $ok && [ -f pr-backlog-burn-wf.orig ] && ! cmp -s pr-backlog-burn-wf.orig pr-backlog-burn.yml; then
            wf_changed=true
          fi

          {
            echo "ok=$ok"
            echo "conf_changed=$conf_changed"
            echo "wf_changed=$wf_changed"
            echo "result<<EOF"
            printf '%s\n' "$out"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit the config change to the target branch
        id: commit
        if: >-
          steps.parse.outputs.valid == 'true' &&
          steps.apply.outputs.ok == 'true' &&
          steps.apply.outputs.conf_changed == 'true' &&
          steps.parse.outputs.have_pat == 'true'
        uses: actions/github-script@v8
        env:
          TARGET_REF:  ${{ steps.parse.outputs.target_ref }}
          KEY:         ${{ steps.parse.outputs.key }}
          VALUE:       ${{ steps.parse.outputs.value }}
          CONF_SHA:    ${{ steps.fetch.outputs.conf_sha }}
          WF_SHA:      ${{ steps.fetch.outputs.wf_sha }}
          WF_CHANGED:  ${{ steps.apply.outputs.wf_changed }}
        with:
          github-token: ${{ secrets.REGEN_TOKEN }}
          script: |
            const fs  = require('fs');
            const ref = process.env.TARGET_REF;

            // When only the conf changed (non-cadence key), one PUT is enough.
            // When cadence changed, both files must change atomically — we use
            // the Git Trees API (create tree → create commit → update ref) so
            // they land in a single commit.
            const confContent = fs.readFileSync('pr-backlog-burn.conf');

            if (process.env.WF_CHANGED !== 'true') {
              // Single-file update via the Contents API.
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,
                path:    process.env.CONF_PATH,
                message: `backlog-burn: set ${process.env.KEY} to ${process.env.VALUE}`,
                content: confContent.toString('base64'),
                sha:     process.env.CONF_SHA,
                branch:  ref,
              });
            } else {
              // Two-file update via the Trees API (atomic multi-file commit).
              const wfContent = fs.readFileSync('pr-backlog-burn.yml');

              // Get the current HEAD SHA for the branch.
              const { data: refData } = await github.rest.git.getRef({
                ...context.repo, ref: `heads/${ref}`,
              });
              const parentSha = refData.object.sha;

              // Get the tree SHA of the HEAD commit.
              const { data: commitData } = await github.rest.git.getCommit({
                ...context.repo, commit_sha: parentSha,
              });

              // Create a new tree with both changed blobs.
              const { data: tree } = await github.rest.git.createTree({
                ...context.repo,
                base_tree: commitData.tree.sha,
                tree: [
                  { path: process.env.CONF_PATH,     mode: '100644', type: 'blob',
                    content: confContent.toString('utf-8') },
                  { path: process.env.WORKFLOW_PATH, mode: '100644', type: 'blob',
                    content: wfContent.toString('utf-8') },
                ],
              });

              // Create the commit.
              const { data: newCommit } = await github.rest.git.createCommit({
                ...context.repo,
                message: `backlog-burn: set cadence to ${process.env.VALUE}`,
                tree:    tree.sha,
                parents: [parentSha],
              });

              // Fast-forward the branch ref.
              await github.rest.git.updateRef({
                ...context.repo,
                ref:  `heads/${ref}`,
                sha:  newCommit.sha,
                force: false,
              });
            }

            core.setOutput('pushed', 'true');

      - name: Reply with the result
        if: steps.parse.outputs.valid == 'true' && !cancelled()
        uses: actions/github-script@v8
        env:
          KEY:          ${{ steps.parse.outputs.key }}
          VALUE:        ${{ steps.parse.outputs.value }}
          TARGET_REF:   ${{ steps.parse.outputs.target_ref }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          HAVE_PAT:     ${{ steps.parse.outputs.have_pat }}
          OK:           ${{ steps.apply.outputs.ok }}
          CONF_CHANGED: ${{ steps.apply.outputs.conf_changed }}
          WF_CHANGED:   ${{ steps.apply.outputs.wf_changed }}
          RESULT:       ${{ steps.apply.outputs.result }}
          PUSHED:       ${{ steps.commit.outputs.pushed }}
        with:
          script: |
            const { KEY, VALUE, TARGET_REF, ISSUE_NUMBER, HAVE_PAT,
                    OK, CONF_CHANGED, WF_CHANGED, RESULT, PUSHED } = process.env;
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const isDispatch = context.eventName === 'workflow_dispatch';

            const react = async (content) => {
              if (!isDispatch) {
                await github.rest.reactions.createForIssueComment({
                  ...context.repo, comment_id: context.payload.comment.id, content,
                });
              }
            };

            let body;
            if (OK !== 'true') {
              body = `Could not set \`${KEY}\` to \`${VALUE}\`:\n\n\`\`\`\n${(RESULT || 'unknown error').trim()}\n\`\`\``;
              await react('-1');
            } else if (CONF_CHANGED !== 'true') {
              body = `\`${KEY}\` is already \`${VALUE}\` — no change.`;
              await react('+1');
            } else if (PUSHED === 'true') {
              const extra = WF_CHANGED === 'true'
                ? ' (also patched the workflow cron literal)'
                : '';
              body = `\`${KEY}\` set to \`${VALUE}\`${extra}. Committed to \`${TARGET_REF}\`; CI will re-run the config tests.`;
              await react('+1');
            } else if (HAVE_PAT !== 'true') {
              body = `Change validated but \`REGEN_TOKEN\` is not configured, so I can't commit it. `
                   + `Set the secret, or edit \`.github/backlog-burn.conf\` on \`${TARGET_REF}\` directly.`;
              await react('confused');
            } else {
              body = `Change validated but the commit step did not complete — check the workflow run.`;
              await react('confused');
            }

            if (isDispatch) {
              core.notice(body.replace(/`/g, ''));
            } else if (ISSUE_NUMBER) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: parseInt(ISSUE_NUMBER),
                body: body + footer,
              });
            }
