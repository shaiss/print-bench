name: Design run (scheduled idea→PR pipeline)

# The scheduled heartbeat for /design-run (issue #96, Stage 3 — the flagship
# idea→PR pipeline). On each firing it picks ONE open `design-brief` issue and runs
# /design-run on it unattended: scaffold → iterate-to-gates-green → gated draft
# PR, with the same decline discipline /ship-issue uses when a design needs a
# human's taste. The skill already runs the same attended or unattended; this
# workflow just gives it a cadence.
#
# This is the SIBLING of backlog-burn.yml and shares its selector: the
# selection policy (one issue per firing, oldest-first, skip anything already
# claimed by a SHIP-LOCK, an open closing PR, or a claude/issue-<N>-* branch) is
# identical — only the opt-in label differs (`design-brief` here, `autonomy-ok`
# there). So this reuses `tools/backlog-burn` verbatim, pointed at a different
# config file and label. That reuse is the whole idea→PR thesis: orchestration
# of what already exists, not new machinery.
#
# WHERE THE CONFIG LIVES (deliberate split, identical to backlog-burn):
#   * Policy → committed, git-tracked: .github/design-run.conf holds `enabled`,
#     the opt-in `label`, the `provider` and the `cadence`. Change it with a
#     reviewed one-line PR; a clone carries it.
#   * Live arming / kill switch → the DESIGN_RUN_ENABLED repo variable, a fast
#     human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that opens design PRs should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or variable
#     for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR. Keep it in sync with the
#     `cadence:` key in .github/design-run.conf.
#
# Safety properties (same as backlog-burn):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     DESIGN_RUN_ENABLED == 'true'. Either off → inert.
#   * Opt-in per issue: the selector only picks an issue carrying the
#     `design-brief` label, so nothing runs until a human curates a brief.
#   * One issue per firing: a hard cap in the selector means a bad day costs one
#     stalled PR, not five.
#
# Auth: the agentic run walks the registry's `design-run` chain across BOTH
# providers (issue #544) — the GLM links on ZAI_KEY first, then the Anthropic
# tail on CLAUDE_KEY (this workflow's historical alias for the same credential
# as ANTHROPIC_API_KEY; a plain API key is the right fit for an unattended bot
# — pay-per-token, no subscription seat). With one key unset that provider's
# links skip and the walk continues on the other; with NEITHER set the job
# still selects and logs its pick, then emits a ::notice:: and stops — exactly
# how ci.yml skips product-page drafting without the key. So this workflow is
# useful (and testable) before any secret exists.

on:
  schedule:
    # Hourly, at :23 past the hour (an off-peak minute, not :00, to avoid
    # Actions scheduler congestion — and offset from backlog-burn's :17 so the
    # two routines don't fire simultaneously). A full design run renders,
    # slices and iterates, so it is heavier than a /ship-issue burn — but the
    # two-key arming guard plus the `design-run` concurrency group (no
    # cancel-in-progress) keep hourly safe: a run still in progress just queues
    # the next firing rather than overlapping it, and an idle firing (no
    # eligible brief) costs nothing. Cron must be a literal — Actions evaluates
    # no files or variables for on.schedule — so change the cadence by editing
    # this line in a one-line PR (and the `cadence:` key in
    # .github/design-run.conf to match), e.g.:
    #   4× per day:   '23 0,6,12,18 * * *'
    #   once a day:   '23 6 * * *'
    #   weekly:       '23 6 * * 1'
    # The two-key guard (DESIGN_RUN_ENABLED + committed `enabled: true`) still
    # keeps the schedule inert until deliberately armed.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log a brief, but do not invoke /design-run'
        type: boolean
        default: false

# Scoped to what the unattended /design-run run actually does: it pushes a
# branch (contents:write) and opens a draft PR (pull-requests:write), and posts
# its SHIP-LOCK claim and outcome (issues:write). Selection alone only needs
# reads, but permissions are per-job not per-step, and this single job both
# selects and runs. The job is off unless DESIGN_RUN_ENABLED is set AND the
# committed config says enabled, and the writing steps are skipped entirely
# without a provider secret, so these grants sit idle until the routine is
# deliberately switched on.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two design runs at once — this group serializes THIS workflow with
# itself. It deliberately does NOT serialize against the backlog burn: GitHub
# concurrency is shared across workflows only when the group STRING matches, and
# backlog-burn uses `group: backlog-burn`, so the names differ on purpose —
# serializing a heavy design run with the /ship-issue burn (cancel-in-progress
# off) would queue burns behind a long design run for no benefit here. The one
# case where the two could collide is an issue carrying BOTH opt-in labels
# (`design-brief` and `autonomy-ok`), which both selectors read from a snapshot.
# That race is closed where it must be — at the claim, not the schedule: both
# skills post a `🚢 SHIP-LOCK` and then RE-READ (design-run §0.5 / ship-issue
# §0.5), and the later timestamp yields, so at most one proceeds to real work
# regardless of interleaving. Coupling the schedules would add nothing the
# re-read doesn't already guarantee. Do not cancel an in-flight run — mid-ship.
concurrency:
  group: design-run
  cancel-in-progress: false

jobs:
  run:
    name: Pick one design-brief and run /design-run
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries write scopes and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector
    # code with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref.
    if: >-
      vars.DESIGN_RUN_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Job budget 360 — GitHub's hard cap on a hosted job (a larger value is
    # silently clamped to 360, so a 460 here budgeted nothing). The
    # constraint runs the other way: the walk below is five agent steps in a
    # row (three GLM links, then the Anthropic tail — issue #544), and the
    # job must let at least ONE full fallback link complete after a head
    # link STALLS to its step timeout (a model stall or tool loop, not the
    # seconds a quota/billing rejection takes). So the head links keep 220,
    # the tail links are budgeted SHORTER on purpose at 120, and 220 (one
    # stalled head) + 120 (one full tail link) + 20 headroom for the
    # pre-agent steps (checkout, pip, policy, select — low single-digit
    # minutes in practice) and the lock cleanup = 360 exactly. Two
    # consecutive stalls are NOT budgeted — a second stalled link dies with
    # the job, guillotining the cleanup — because a stall is a provider-wide
    # symptom, and the fast failures the tail exists for reject in seconds.
    # The drift guard pins job budget <= 360 and >= longest head step +
    # longest tail step + 5 for every routine.
    # The old 60 was the livelock's guillotine (issue #312): it killed the
    # agent after it posted its SHIP-LOCK on the selected brief but before it
    # could deliver or withdraw, and the orphaned claim made every later
    # firing a green no-op. The agent STEP timeout dies first on purpose, so
    # a hung run still never holds the runner (and a secret) for the 6-hour
    # default while the cleanup stays reachable inside a live job.
    timeout-minutes: 360
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's agent steps gate on
      # their own) plus `key_present` = either one (the any-key gate the lock
      # cleanup, triage, red-on-death and skip-notice steps read). The
      # Anthropic credential here is CLAUDE_KEY (see the auth note above).
      HAS_ANTHROPIC_KEY: ${{ secrets.CLAUDE_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
      # The github_token PAT is effectively required here (without it the draft
      # PR won't trigger CI and readme-gate has no preview) — surfaced so a step
      # can warn before the agentic run when it is missing.
      HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill + selector — never a dispatched branch's version.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the selector
        # The idea→PR pipeline reuses the backlog burn's selector verbatim —
        # same policy, different label and config path. No second copy to drift.
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/design-run.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed or
        # typo'd config (bad key, unknown provider) fails this step loudly rather
        # than running on a policy nobody wrote. The conf's `provider:` is the
        # walk's HEAD provider (issue #544) — validated here, emitted for the
        # resolve step's shape check and the summary. Key presence is emitted
        # PER PROVIDER (each provider's agent steps gate on their own, so the
        # tail can run when the head's key is absent) plus the any-key
        # `key_present` the lock cleanup / triage / red-on-death / skip-notice
        # gates read. HAS_ANTHROPIC_KEY / HAS_ZAI_KEY come from the job env.
        run: |
          set -euo pipefail
          conf=.github/design-run.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          label="$(backlog-burn config --get label --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "label=$label"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the design run's model from the committed provider/model
      # registry (issue #326) — the same resolve step auto-review.yml and
      # product-scout.yml run, stdlib-only so it needs no install in front of
      # it. A malformed registry, or one whose `design-run` chain went missing,
      # fails this step loudly BEFORE any key is spent; the same mismatch is
      # caught pre-merge by the model-registry drift-guard tests, which fire on
      # this workflow and on registry.conf.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal agent
      # steps — its layout, one provider per step in file order (three Z.AI
      # GLM steps, then two Anthropic steps), because Actions can only
      # reference a secret by its literal name — while the registry picks the
      # MODEL each step runs. A link on the wrong slot's provider (claude-* on
      # a Z.AI step, glm-* on an Anthropic step) would fail at request time
      # with a key already spent, and a chain longer or shorter than the walk
      # leaves a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring. Saying so HERE, loudly,
      # beats discovering it in the hourly run's logs.
      - name: Resolve the design run's model chain (issue #326)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve design-run --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/design-run.conf)"
          # One layout entry per agent step below, in file order.
          python3 -m model_registry shape design-run --head "$conf_provider" \
            --conf .github/design-run.conf --layout zai,zai,zai,anthropic,anthropic


      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/design-run.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select one eligible brief
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.policy.outputs.label }}
        run: |
          set -euo pipefail
          # `run` gathers the live snapshot (open issues + their SHIP-LOCK
          # comments, open PRs, remote branches) and applies the policy. It
          # writes `issue=<n>` (empty when nothing is eligible) to $GITHUB_OUTPUT
          # and a markdown block to $GITHUB_STEP_SUMMARY. Same selector the
          # backlog burn uses, pointed at the design-brief label.
          backlog-burn run --repo "$GITHUB_REPOSITORY" --label "$LABEL" --summary-title 'Design run'

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544): links 1-3 are the Z.AI GLM steps, links 4-5
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `design-run` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # design run to another model is a registry edit, not a workflow edit
      # (#326); the resolve step above refuses a chain that does not fit this
      # layout. The committed `provider:` label names the HEAD provider (link
      # 1 must sit on it); it no longer selects a whole block. Each link is
      # continue-on-error and gated on EVERY earlier link NOT having succeeded
      # — a skipped step's outcome is 'skipped', not 'success', so the
      # Anthropic tail runs whether the GLM links failed or were skipped for
      # want of ZAI_KEY — so the first success short-circuits the rest and a
      # dead model, or a whole dead provider, falls through instead of killing
      # the run; the job goes red on the agent only when EVERY link failed —
      # the red-on-death step fires unless the walk produced a success. Each
      # provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain (#327)
      # is still a same-PR pair: add the model to the registry AND the
      # matching run step here (and its slot in the resolve step's --layout)
      # — the drift guard fails either half shipped alone.
      #
      # All five steps share the pin, the write permissions, the `github_token`
      # that authenticates the action's own git push / PR creation, and the
      # same /design-run prompt. The `github_token` is wired to the GH_TOKEN
      # secret (a PAT) ON PURPOSE — and it matters MORE here than for the
      # backlog burn: a PR opened with the default GITHUB_TOKEN does not itself
      # trigger CI (the reason regen uses REGEN_TOKEN), so `regen` would not
      # fire and the design's previews wouldn't be generated — and a design
      # page WITHOUT its previews fails readme-gate.sh. With the PAT the draft
      # PR triggers CI and the product shots regenerate. So for this pipeline a
      # PAT as `github_token` is effectively required, to reach a mergeable
      # state unattended: readme-gate needs a preview, and a path-traced
      # product shot only comes from CI regen. Without a PAT, /design-run first
      # generates what it can locally (cameras.conf previews via `render.sh
      # --previews`); if the gate still needs a CI-only shot it stops and
      # reports rather than opening an image-less PR that fails its own gate
      # (see its §5 regen handoff).
      #
      # The pin is the immutable commit behind the v1 tag; a moved tag must not
      # silently change what runs with write perms + a secret. Re-pin
      # deliberately to adopt a new release.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # The step must die inside a live job (step timeout < job timeout) so
        # the lock cleanup below runs as a normal step, not in a cancellation
        # grace window; continue-on-error keeps the job alive for it (the
        # "Turn a dead agentic run red" step restores the failure) and lets
        # the walk reach the next link.
        timeout-minutes: 220
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check (the endpoint uses whichever header it validates).
        # Best-effort: Anthropic doesn't officially support routing Claude Code
        # to non-Claude models, and /design-run is a Claude Code skill, so
        # quality may vary. Which model runs is the registry's call.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link1_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      # The GLM tail (#327): links 2 and 3 of the registry's `design-run`
      # chain, reached only when every earlier link did not succeed — the
      # same env/secret/pin/prompt as link 1, only the model differs.
      - name: Run via Z.AI (GLM, chain link 2)
        id: run_zai_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 220
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link2_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      - name: Run via Z.AI (GLM, chain link 3)
        id: run_zai_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
        timeout-minutes: 220
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link3_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      # The cross-provider tail (issue #544): links 4 and 5 of the registry's
      # `design-run` chain on Anthropic's native endpoint, reached only when
      # EVERY GLM link did not succeed (failed, or skipped for want of
      # ZAI_KEY) and gated on the Anthropic key's own presence. Claude via
      # api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permissions, github_token, effort and prompt as the GLM links —
      # only the model, secret and endpoint differ. Which model runs is the
      # registry's call (the cheap Anthropic tier, since a GLM outage shifts
      # this routine's whole spend here).
      - name: Run via Anthropic (Claude, chain link 4)
        id: run_anthropic_4
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
        timeout-minutes: 120
        continue-on-error: true
        # registry-secret-alias: CLAUDE_KEY=ANTHROPIC_API_KEY — design-run's
        # anthropic links wire secrets.CLAUDE_KEY, a historical alias for the
        # same credential as the registry's ANTHROPIC_API_KEY (both exist as
        # repo secrets; the motivating run 31967535913 authenticated with
        # CLAUDE_KEY). The drift guard reads <alias>=<registry-secret> here and
        # pins the step to that provider's endpoint.
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link4_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      - name: Run via Anthropic (Claude, chain link 5)
        id: run_anthropic_5
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
          && steps.run_anthropic_4.outcome != 'success'
        timeout-minutes: 120
        continue-on-error: true
        # registry-secret-alias: CLAUDE_KEY=ANTHROPIC_API_KEY — same alias as
        # link 4 (the marker must sit inside every step chunk the drift guard
        # reads).
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          claude_args: --permission-mode bypassPermissions --model ${{ steps.chain.outputs.link5_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      - name: Withdraw a dead run's SHIP-LOCK
        id: lock_cleanup
        # The agent posts the SHIP-LOCK claim on the selected issue but cannot
        # withdraw it when killed — the orphaned claim then excludes the issue
        # from every later selection (issue #312). The script mirrors the
        # selector's semantics and leaves a claim alone when a branch or
        # closing PR corroborates it. Ambient github.token ON PURPOSE, not the
        # GH_TOKEN PAT: GITHUB_TOKEN-authored comments never trigger
        # issue_comment workflows (decide.yml, backlog-burn-config.yml,
        # ci-gate-approve.yml) — a PAT here would.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          # .outcome, never .conclusion — continue-on-error rewrites a failed
          # step's conclusion to success; outcome keeps the real result.
          # The walk's outcome (#327, #544): 'success' if ANY of the five
          # links across both providers succeeded; otherwise the outcome of
          # the LAST LINK THAT ACTUALLY RAN. The nested tail walks backwards
          # over 'skipped' links (a provider's links are skipped when its key
          # is absent), so the walk reads 'skipped' only when EVERY link was
          # skipped — no key for any provider, the agent never ran. That
          # distinction is load-bearing: routine-lock-cleanup.sh treats
          # 'skipped' as "nothing ran, nothing to release" and no-ops. A bare
          # last-link read (`|| steps.<link5>.outcome`) reported 'skipped'
          # whenever only ZAI_KEY was set and the three GLM links FAILED
          # while the keyless Anthropic tail was skipped — so a dead run's
          # SHIP-LOCK was left standing and the issue starved, the #312
          # orphan-claim livelock through a different door. The drift guard
          # (test_routine_walk_outcome_covers_every_link) simulates every
          # outcome combination against the chain's link count and pins the
          # last-ran rule, with the bare-tail form as its negative control.
          AGENT_OUTCOME: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/routine-lock-cleanup.sh --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --agent-outcome "$AGENT_OUTCOME" --run-url "$RUN_URL" --routine design-run

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected #${ISSUE} but did not invoke /design-run"
          else
            echo "::notice::no key is set for ANY provider in the design-run chain (ZAI_KEY for the zai links, CLAUDE_KEY for the anthropic tail; head provider '${PROVIDER}') — selected #${ISSUE} but skipping the unattended /design-run run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issue == ''
        env:
          LABEL: ${{ steps.policy.outputs.label }}
        run: echo "::notice::no brief is currently eligible (nothing carrying the '${LABEL}' opt-in label is unclaimed) — nothing to run"

      - name: Record the run outcome
        # Runs on success, failure or skip so the job summary always shows what
        # happened. This reports the *run* disposition; the authoritative
        # shipped/declined verdict and the draft-PR link are posted by
        # /design-run onto the issue thread itself (its §8 — the thread is the
        # only durable log), which this summary links back to.
        if: always()
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          # Distinguish a policy-step failure, a disabled routine and a failed
          # selection from a genuine empty selection — otherwise all four read
          # as "nothing eligible" (CodeRabbit review on #165).
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#327, #544) — the same five-link walk
          # expression as AGENT_OUTCOME (any link's success is the run's;
          # otherwise the last link that actually ran).
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_zai_2.outcome }}
          L3: ${{ steps.run_zai_3.outcome }}
          L4: ${{ steps.run_anthropic_4.outcome }}
          L5: ${{ steps.run_anthropic_5.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          M4: ${{ steps.chain.outputs.link4_model }}
          M5: ${{ steps.chain.outputs.link5_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
          P4: ${{ steps.chain.outputs.link4_provider }}
          P5: ${{ steps.chain.outputs.link5_provider }}
          LOCK_WITHDRAWN: ${{ steps.lock_cleanup.outputs.withdrawn }}
          # $GITHUB_STEP_SUMMARY does not auto-link a bare #N — build a real link.
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3 4 5; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::design run fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served #${ISSUE} — the run is green, but the head provider is down or keyless; check its quota/key (a provider-wide failure shifts this routine's spend to the tail while it lasts)"
              fi
              break
            fi
          done
          {
            echo "## Design run — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/design-run.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the selector failed; see the log"
            elif [ -z "${ISSUE}" ]; then
              echo "- selected: none (nothing eligible)"
            else
              echo "- selected: [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE})"
              echo "- provider: ${PROVIDER} (head)"
              echo "- run step: ${RUN:-skipped} (see [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE}) for the /design-run verdict and any draft PR)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
              if [ "${LOCK_WITHDRAWN}" = "true" ]; then
                echo "- lock cleanup: withdrew the dead run's SHIP-LOCK on #${ISSUE} so the next firing can re-select it"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Before failing the run, recover WHY the chain exhausted — the agent steps
      # hide their provider error — and route it: out of credit / out of tokens /
      # bad key escalate to ONE deduped needs-decision issue (so a scheduled red
      # nobody is watching becomes a human-actionable ask), a bad model id or a
      # transient blip is just diagnosed in the log. Advisory — it never fails the
      # job; the red gate below still fails it, and the lock cleanup above already
      # released the SHIP-LOCK. Same walk-exhaustion condition as that gate. The
      # Anthropic key is the CLAUDE_KEY alias (as the run_anthropic_4/5 steps
      # wire); both keys go in so classify probes both halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: design-run
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.CLAUDE_KEY }}
          github-token: ${{ github.token }}
          context: the design-run routine (issue #${{ steps.select.outputs.issue }})
          escalate: "true"

      - name: Turn a dead agentic run red
        # continue-on-error on the agent steps keeps the cleanup above
        # reachable, but alone it would leave a dead run green — and
        # green/cancelled starvation looking like health is exactly the
        # livelock's disguise (issue #312). Restore the failure last, after
        # the cleanup and the record have run.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome)) != 'success'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          # The walk's outcome (#327, #544) — byte-identical to AGENT_OUTCOME
          # in the lock cleanup above (the drift guard pins that): any link's
          # success is the run's; otherwise the last link that actually ran,
          # so cleanup and this gate agree on what "the agent step
          # succeeded" — and "never ran" — mean across the walk.
          AGENT_OUTCOME: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
        run: |
          echo "::error::the /design-run agent step for #${ISSUE} did not succeed (outcome: ${AGENT_OUTCOME}) — its SHIP-LOCK cleanup ran above; failing the job so the death is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `run` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips it
    # silently. This sibling makes that legible. No secrets, no write perms.
    if: >-
      vars.DESIGN_RUN_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.DESIGN_RUN_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${ARMED:-}" != "true" ]; then
            echo "::notice::design run is disarmed — set the DESIGN_RUN_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/design-run.conf; both must agree before it runs."
          else
            echo "::notice::design run only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
