name: Design run (scheduled idea→PR pipeline)

# The scheduled heartbeat for /design-run (issue #96, Stage 3 — the flagship
# idea→PR pipeline). On each firing it picks ONE open `design-brief` issue and runs
# /design-run on it unattended: scaffold → iterate-to-gates-green → gated draft
# PR, with the same decline discipline /ship-issue uses when a design needs a
# human's taste. The skill already runs the same attended or unattended; this
# workflow just gives it a cadence.
#
# This is the SIBLING of backlog-burn.yml and shares its selector: the
# selection policy (one issue per firing, oldest-first, skip anything already
# claimed by a SHIP-LOCK, an open closing PR, or a claude/issue-<N>-* branch) is
# identical — only the opt-in label differs (`design-brief` here, `autonomy-ok`
# there). So this reuses `tools/backlog-burn` verbatim, pointed at a different
# config file and label. That reuse is the whole idea→PR thesis: orchestration
# of what already exists, not new machinery.
#
# WHERE THE CONFIG LIVES (deliberate split, identical to backlog-burn):
#   * Policy → committed, git-tracked: .github/design-run.conf holds `enabled`,
#     the opt-in `label`, the `provider` and the `cadence`. Change it with a
#     reviewed one-line PR; a clone carries it.
#   * Live arming / kill switch → the DESIGN_RUN_ENABLED repo variable, a fast
#     human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that opens design PRs should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or variable
#     for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR. Keep it in sync with the
#     `cadence:` key in .github/design-run.conf.
#
# Safety properties (same as backlog-burn):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     DESIGN_RUN_ENABLED == 'true'. Either off → inert.
#   * AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses this workflow's AI job with a single ::notice:: —
#     grey, never red, no provider call, no escalation. Orthogonal to the
#     arming variable: it overrides an armed routine without touching it.
#   * Opt-in per issue: the selector only picks an issue carrying the
#     `design-brief` label, so nothing runs until a human curates a brief.
#   * One issue per firing: a hard cap in the selector means a bad day costs one
#     stalled PR, not five.
#
# Auth: the agentic run walks the registry's `design-run` chain across BOTH
# providers (issue #544) — the GLM links on ZAI_KEY first, then the Anthropic
# tail on CLAUDE_KEY (this workflow's historical alias for the same credential
# as ANTHROPIC_API_KEY; a plain API key is the right fit for an unattended bot
# — pay-per-token, no subscription seat). With one key unset that provider's
# links skip and the walk continues on the other; with NEITHER set the job
# still selects and logs its pick, then emits a ::notice:: and stops — exactly
# how ci.yml skips product-page drafting without the key. So this workflow is
# useful (and testable) before any secret exists.

on:
  schedule:
    # Hourly, at :23 past the hour (an off-peak minute, not :00, to avoid
    # Actions scheduler congestion — and offset from backlog-burn's :17 so the
    # two routines don't fire simultaneously). A full design run renders,
    # slices and iterates, so it is heavier than a /ship-issue burn — but the
    # two-key arming guard plus the `design-run` concurrency group (no
    # cancel-in-progress) keep hourly safe: a run still in progress just queues
    # the next firing rather than overlapping it, and an idle firing (no
    # eligible brief) costs nothing. Cron must be a literal — Actions evaluates
    # no files or variables for on.schedule — so change the cadence by editing
    # this line in a one-line PR (and the `cadence:` key in
    # .github/design-run.conf to match), e.g.:
    #   4× per day:   '23 0,6,12,18 * * *'
    #   once a day:   '23 6 * * *'
    #   weekly:       '23 6 * * 1'
    # The two-key guard (DESIGN_RUN_ENABLED + committed `enabled: true`) still
    # keeps the schedule inert until deliberately armed.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log a brief, but do not invoke /design-run'
        type: boolean
        default: false

# GITHUB_TOKEN does not push. The run job posts the SHIP-LOCK (issues). The
# deliver job opens the draft PR (pull-requests) and pushes with the GH_TOKEN
# PAT, not with this token, so contents stays read. Artifact upload and
# download use the runner's ACTIONS_RUNTIME_TOKEN; they do not need
# actions: write, and that grant would reach the bypassPermissions agent.
# The jobs are off unless DESIGN_RUN_ENABLED is set AND
# the committed config says enabled, and the writing steps are skipped
# entirely without a provider secret, so these grants sit idle until the
# routine is deliberately switched on.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Never run two design runs at once — this group serializes THIS workflow with
# itself. It deliberately does NOT serialize against the backlog burn: GitHub
# concurrency is shared across workflows only when the group STRING matches, and
# backlog-burn uses `group: backlog-burn`, so the names differ on purpose —
# serializing a heavy design run with the /ship-issue burn (cancel-in-progress
# off) would queue burns behind a long design run for no benefit here. The one
# case where the two could collide is an issue carrying BOTH opt-in labels
# (`design-brief` and `autonomy-ok`), which both selectors read from a snapshot.
# That race is closed where it must be — at the claim, not the schedule: both
# skills post a `🚢 SHIP-LOCK` and then RE-READ (design-run §0.5 / ship-issue
# §0.5), and the later timestamp yields, so at most one proceeds to real work
# regardless of interleaving. Coupling the schedules would add nothing the
# re-read doesn't already guarantee. Do not cancel an in-flight run — mid-ship.
concurrency:
  group: design-run
  cancel-in-progress: false

jobs:
  run:
    name: Pick one design-brief and run /design-run
    outputs:
      start_sha: ${{ steps.start_ref.outputs.sha }}
      deliver_sha256: ${{ steps.start_ref.outputs.deliver_sha256 }}
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
      bundle_pending: ${{ steps.bundle.outputs.pending }}
      issue: ${{ steps.select.outputs.issue }}
      job_window_start: ${{ steps.job_window.outputs.start }}
      # Same walk expression as AGENT_OUTCOME. The name is not AGENT_OUTCOME:
      # the drift guard counts that name twice, in the run job only.
      walk_outcome: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_zai_1.outcome == 'skipped' && steps.run_zai_2.outcome == 'skipped' && steps.run_zai_3.outcome == 'skipped' && steps.run_anthropic_4.outcome == 'skipped' && steps.run_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries write scopes and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector
    # code with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref.
    # Plus the AI andon cord (docs/andon-cord.md): AI_ANDON_CORD == 'pulled'
    # skips this job grey — the disarmed-notice sibling explains the pull.
    if: >-
      vars.DESIGN_RUN_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Job budget 360 — GitHub's hard cap on a hosted job (a larger value is
    # silently clamped to 360, so a 460 here budgeted nothing). The
    # constraint runs the other way: the walk below is five agent steps in a
    # row (three GLM links, then the Anthropic tail — issue #544), and the
    # job must let at least ONE full fallback link complete after a head
    # link STALLS to its step timeout (a model stall or tool loop, not the
    # seconds a quota/billing rejection takes). So the head links keep 220,
    # the tail links are budgeted SHORTER on purpose at 120, and 220 (one
    # stalled head) + 120 (one full tail link) + 20 headroom for the
    # pre-agent steps (checkout, pip, policy, select — low single-digit
    # minutes in practice) and the lock cleanup = 360 exactly. Two
    # consecutive stalls are NOT budgeted — a second stalled link dies with
    # the job, guillotining the cleanup — because a stall is a provider-wide
    # symptom, and the fast failures the tail exists for reject in seconds.
    # The drift guard pins job budget <= 360 and >= longest head step +
    # longest tail step + 5 for every routine.
    # The old 60 was the livelock's guillotine (issue #312): it killed the
    # agent after it posted its SHIP-LOCK on the selected brief but before it
    # could deliver or withdraw, and the orphaned claim made every later
    # firing a green no-op. The agent STEP timeout dies first on purpose, so
    # a hung run still never holds the runner (and a secret) for the 6-hour
    # default while the cleanup stays reachable inside a live job.
    timeout-minutes: 360
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's agent steps gate on
      # their own) plus `key_present` = either one (the any-key gate the lock
      # cleanup, triage, red-on-death and skip-notice steps read). The
      # Anthropic credential here is CLAUDE_KEY (see the auth note above).
      HAS_ANTHROPIC_KEY: ${{ secrets.CLAUDE_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
      # The push PAT is not given to the agent (#859). Deliver is the only
      # job that can open a draft PR that triggers CI. Surfaced here so a
      # missing PAT is visible before a long agent run that cannot be delivered.
      HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill + selector — never a dispatched branch's version.
          ref: ${{ github.event.repository.default_branch }}

      - name: Pin the commit this job started from
        # #670: the lock-cleanup step below must run THIS commit's
        # scripts/routine-lock-cleanup.sh, never whatever the agent's walk
        # leaves in the working tree — a walk may stack its branch on an
        # older feature branch whose pre-#538 copy reads 'success' as
        # delivered and no-ops, leaving a dead run's SHIP-LOCK standing
        # (#627). Captured here, before any agent step can move HEAD or the
        # remote-tracking refs.
        id: start_ref
        run: |
          set -euo pipefail
          sha="$(git --no-replace-objects rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # Digest of the delivery-script blob before any agent step. The
          # deliver step compares the restored file to this, so a replace
          # ref or an alternate object store cannot swap the bytes.
          deliver_sha256="$(git --no-replace-objects show "HEAD:scripts/design-run-deliver.sh" | sha256sum | awk '{print $1}')"
          echo "deliver_sha256=${deliver_sha256}" >> "$GITHUB_OUTPUT"

      - name: Note the job window start
        id: job_window
        # Stamped before any agent step and passed to routine-lock-cleanup as
        # --run-started-at. A claimless stop (🚢 DEFERRED, 🚢 DECLINED or
        # 🚦 DECISION NEEDED — the #675 §1 decline never claims) counts as
        # this firing's decline only when the comment is strictly newer than
        # this instant and its author is a GitHub Bot or the repository owner,
        # so a later success that posts nothing cannot reuse an older stop
        # that is still the thread's latest comment, and an outsider who
        # comments during the window cannot mint a stop and skip red-on-death.
        # GITHUB_ENV feeds the lock cleanup in THIS job. The output feeds the
        # deliver job: an agent step can rewrite GITHUB_ENV, and it cannot
        # rewrite this step's output after the step has finished.
        run: |
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "JOB_WINDOW_START=${ts}" >> "$GITHUB_ENV"
          echo "start=${ts}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the selector
        # The idea→PR pipeline reuses the backlog burn's selector verbatim —
        # same policy, different label and config path. No second copy to drift.
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/design-run.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed or
        # typo'd config (bad key, unknown provider) fails this step loudly rather
        # than running on a policy nobody wrote. The conf's `provider:` is the
        # walk's HEAD provider (issue #544) — validated here, emitted for the
        # resolve step's shape check and the summary. Key presence is emitted
        # PER PROVIDER (each provider's agent steps gate on their own, so the
        # tail can run when the head's key is absent) plus the any-key
        # `key_present` the lock cleanup / triage / red-on-death / skip-notice
        # gates read. HAS_ANTHROPIC_KEY / HAS_ZAI_KEY come from the job env.
        run: |
          set -euo pipefail
          conf=.github/design-run.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          label="$(backlog-burn config --get label --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "label=$label"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the design run's model from the committed provider/model
      # registry (issue #326) — the same resolve step auto-review.yml and
      # product-scout.yml run, stdlib-only so it needs no install in front of
      # it. A malformed registry, or one whose `design-run` chain went missing,
      # fails this step loudly BEFORE any key is spent; the same mismatch is
      # caught pre-merge by the model-registry drift-guard tests, which fire on
      # this workflow and on registry.conf.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal agent
      # steps — its layout, one provider per step in file order (three Z.AI
      # GLM steps, then two Anthropic steps), because Actions can only
      # reference a secret by its literal name — while the registry picks the
      # MODEL each step runs. A link on the wrong slot's provider (claude-* on
      # a Z.AI step, glm-* on an Anthropic step) would fail at request time
      # with a key already spent, and a chain longer or shorter than the walk
      # leaves a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring. Saying so HERE, loudly,
      # beats discovering it in the hourly run's logs.
      - name: Resolve the design run's model chain (issue #326)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve design-run --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/design-run.conf)"
          # One layout entry per agent step below, in file order.
          python3 -m model_registry shape design-run --head "$conf_provider" \
            --conf .github/design-run.conf --layout zai,zai,zai,anthropic,anthropic


      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/design-run.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select one eligible brief
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.policy.outputs.label }}
        run: |
          set -euo pipefail
          # `run` gathers the live snapshot (open issues + their comment
          # threads, open PRs, remote branches) and applies the policy. It
          # writes `issue=<n>` (empty when nothing is eligible) to $GITHUB_OUTPUT
          # and a markdown block to $GITHUB_STEP_SUMMARY. Same selector the
          # backlog burn uses, pointed at the design-brief label.
          backlog-burn run --repo "$GITHUB_REPOSITORY" --label "$LABEL" --summary-title 'Design run'

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544): links 1-3 are the Z.AI GLM steps, links 4-5
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `design-run` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # design run to another model is a registry edit, not a workflow edit
      # (#326); the resolve step above refuses a chain that does not fit this
      # layout. The committed `provider:` label names the HEAD provider (link
      # 1 must sit on it); it no longer selects a whole block. Each link is
      # continue-on-error and gated on EVERY earlier link NOT having succeeded
      # — a skipped step's outcome is 'skipped', not 'success', so the
      # Anthropic tail runs whether the GLM links failed or were skipped for
      # want of ZAI_KEY — so the first success short-circuits the rest and a
      # dead model, or a whole dead provider, falls through instead of killing
      # the run; the job goes red on the agent only when EVERY link failed —
      # the red-on-death step fires unless the walk produced a success. Each
      # provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain (#327)
      # is still a same-PR pair: add the model to the registry AND the
      # matching run step here (and its slot in the resolve step's --layout)
      # — the drift guard fails either half shipped alone.
      #
      # All five steps share the pin, the workflow's github.token, and the
      # same /design-run prompt. That token is the job token: contents read,
      # issues write, pull-requests write. It cannot push. A PR opened with
      # it does not trigger CI (the reason regen uses REGEN_TOKEN), so these
      # steps must not open the PR either. The deliver job holds the
      # GH_TOKEN PAT, pushes, and opens the draft, which is what makes
      # `regen` fire. .claude/design-run-settings.json denies `git push` and
      # `gh pr create`. The steps use dontAsk because a bypassPermissions
      # step ignores its own denies. The allow-list stays the whole
      # toolchain (Bash plus the file tools the skill edits with); the deny
      # file only carves out those two commands.
      #
      # The pin is the immutable commit behind the v1 tag; a moved tag must not
      # silently change what runs with write perms + a secret. Re-pin
      # deliberately to adopt a new release.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # The step must die inside a live job (step timeout < job timeout) so
        # the lock cleanup below runs as a normal step, not in a cancellation
        # grace window; continue-on-error keeps the job alive for it (the
        # "Turn a dead agentic run red" step restores the failure) and lets
        # the walk reach the next link.
        timeout-minutes: 220
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check (the endpoint uses whichever header it validates).
        # Best-effort: Anthropic doesn't officially support routing Claude Code
        # to non-Claude models, and /design-run is a Claude Code skill, so
        # quality may vary. Which model runs is the registry's call.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --permission-mode dontAsk --settings .claude/design-run-settings.json --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill" --model ${{ steps.chain.outputs.link1_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      # The GLM tail (#327): links 2 and 3 of the registry's `design-run`
      # chain, reached only when every earlier link did not succeed — the
      # same env/secret/pin/prompt as link 1, only the model differs.
      - name: Run via Z.AI (GLM, chain link 2)
        id: run_zai_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 220
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --permission-mode dontAsk --settings .claude/design-run-settings.json --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill" --model ${{ steps.chain.outputs.link2_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      - name: Run via Z.AI (GLM, chain link 3)
        id: run_zai_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
        timeout-minutes: 220
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --permission-mode dontAsk --settings .claude/design-run-settings.json --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill" --model ${{ steps.chain.outputs.link3_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      # The cross-provider tail (issue #544): links 4 and 5 of the registry's
      # `design-run` chain on Anthropic's native endpoint, reached only when
      # EVERY GLM link did not succeed (failed, or skipped for want of
      # ZAI_KEY) and gated on the Anthropic key's own presence. Claude via
      # api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permissions, github_token, effort and prompt as the GLM links —
      # only the model, secret and endpoint differ. Which model runs is the
      # registry's call (the cheap Anthropic tier, since a GLM outage shifts
      # this routine's whole spend here).
      - name: Run via Anthropic (Claude, chain link 4)
        id: run_anthropic_4
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
        timeout-minutes: 120
        continue-on-error: true
        # registry-secret-alias: CLAUDE_KEY=ANTHROPIC_API_KEY — design-run's
        # anthropic links wire secrets.CLAUDE_KEY, a historical alias for the
        # same credential as the registry's ANTHROPIC_API_KEY (both exist as
        # repo secrets; the motivating run 31967535913 authenticated with
        # CLAUDE_KEY). The drift guard reads <alias>=<registry-secret> here and
        # pins the step to that provider's endpoint.
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9  # v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_KEY }}
          github_token: ${{ github.token }}
          claude_args: --permission-mode dontAsk --settings .claude/design-run-settings.json --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill" --model ${{ steps.chain.outputs.link4_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      - name: Run via Anthropic (Claude, chain link 5)
        id: run_anthropic_5
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
          && steps.run_anthropic_4.outcome != 'success'
        timeout-minutes: 120
        continue-on-error: true
        # registry-secret-alias: CLAUDE_KEY=ANTHROPIC_API_KEY — same alias as
        # link 4 (the marker must sit inside every step chunk the drift guard
        # reads).
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9  # v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_KEY }}
          github_token: ${{ github.token }}
          claude_args: --permission-mode dontAsk --settings .claude/design-run-settings.json --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill" --model ${{ steps.chain.outputs.link5_model }} --effort max
          prompt: "/design-run ${{ steps.select.outputs.issue }}"

      # The agent step exits 0 when the model ends its turn, even if it
      # never pushed (#538, #853). This step does not push and does not hold
      # the PAT. It restores design-run-deliver.sh from the commit pinned
      # before the agent ran and runs that copy with --write-bundle. The
      # bundle is the only thing that leaves this runner. A fresh job checks
      # the bundle and pushes. Lock cleanup in this job is skipped while a
      # bundle is pending, so it does not withdraw the SHIP-LOCK before that
      # push.
      #
      # The script is NOT the worktree copy. bypassPermissions lets the agent
      # rewrite scripts/design-run-deliver.sh (or replace it with a symlink)
      # before this step. Same rule as the #670 lock-cleanup restore: read
      # the blob from the commit pinned before the agent ran, refuse a
      # symlink, and execute a regular file. The copy lives in $RUNNER_TEMP
      # so a worktree symlink cannot redirect the write.
      - name: Bundle the design commits
        id: bundle
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          DELIVER_SHA256: ${{ steps.start_ref.outputs.deliver_sha256 }}
          # The restored script lives in RUNNER_TEMP. It must operate on the
          # checkout, never on dirname($0)/.. (that is the runner work dir).
          DELIVER_WORKTREE: ${{ github.workspace }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          # Step output, not GITHUB_ENV: the agent can append to GITHUB_ENV.
          # The hard-stop read uses this window and github.token, not the push PAT.
          JOB_WINDOW_START: ${{ steps.job_window.outputs.start }}
          ISSUE_READ_TOKEN: ${{ github.token }}
          # bypassPermissions can append to GITHUB_ENV and GITHUB_PATH. Step
          # env wins over those files, and an absolute shell is looked up
          # before PATH. Empty LD_PRELOAD / BASH_ENV are ignored at process
          # start; unsetting them inside the script is too late. GIT_DIR and
          # GIT_WORK_TREE are blanked here and unset in the script before git
          # runs: an empty GIT_DIR is still set, and git treats that as the
          # git dir.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_BIN: /usr/bin/git
          GH_BIN: /usr/bin/gh
          JQ_BIN: /usr/bin/jq
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PYTHONPATH: ""
          GIT_SSH_COMMAND: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_DIR: ""
          GIT_WORK_TREE: ""
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_OBJECT_DIRECTORY: ""
          PATH: /usr/bin:/bin
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_CONFIG_PARAMETERS GIT_SSH_COMMAND GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_OBJECT_DIRECTORY || true
          # A detached child of the agent is reparented to init. Kill those
          # process groups before the bundle is judged, and again after
          # write_bundle returns, so a survivor cannot create the bundle
          # file once this step has decided it is absent. The runner's own
          # processes are not init's children and are excluded by comm.
          reap_agent_orphans() {
            local d pid ppid comm cwd cmd v pgid my_pgid
            local -a victims=()
            my_pgid="$(ps -o pgid= -p $$ | tr -d '[:space:]')"
            shopt -s nullglob
            for d in /proc/[0-9]*; do
              pid="${d#/proc/}"
              case "$pid" in
                *[!0-9]*) continue ;;
              esac
              [ "$pid" = "$$" ] && continue
              ppid="$(awk '/^PPid:/ { print $2; exit }' "$d/status" 2>/dev/null || true)"
              [ "$ppid" = "1" ] || continue
              comm="$(tr -d '\0' < "$d/comm" 2>/dev/null || true)"
              case "$comm" in
                Runner.*|Agent.*|systemd*|containerd*|dockerd*|dbus*) continue ;;
              esac
              cwd="$(readlink "$d/cwd" 2>/dev/null || true)"
              cmd="$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null || true)"
              case "$cwd" in
                "${GITHUB_WORKSPACE:-/nonexistent}"*|"${RUNNER_TEMP:-/nonexistent}"*) victims+=("$pid"); continue ;;
              esac
              case "$cmd" in
                *design-run.bundle*) victims+=("$pid") ;;
              esac
            done
            shopt -u nullglob
            if [ "${#victims[@]}" -eq 0 ]; then
              return 0
            fi
            for v in "${victims[@]}"; do
              pgid="$(ps -o pgid= -p "$v" 2>/dev/null | tr -d '[:space:]' || true)"
              if [ -n "$pgid" ] && [ "$pgid" != "$my_pgid" ] && [ "$pgid" != "1" ] && [ "$pgid" != "0" ]; then
                kill -TERM -- "-${pgid}" 2>/dev/null || true
              fi
              kill -TERM "$v" 2>/dev/null || true
            done
            sleep 1
            for v in "${victims[@]}"; do
              kill -KILL "$v" 2>/dev/null || true
            done
          }
          if [ -z "${START_SHA:-}" ]; then
            echo "::error::START_SHA is empty — the pin step did not run" >&2
            exit 1
          fi
          if [ -z "${DELIVER_SHA256:-}" ]; then
            echo "::error::DELIVER_SHA256 is empty — the pin step did not hash the script" >&2
            exit 1
          fi
          if [ -z "${DELIVER_WORKTREE:-}" ]; then
            echo "::error::DELIVER_WORKTREE is empty" >&2
            exit 1
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::RUNNER_TEMP is empty" >&2
            exit 1
          fi
          git_dir="$(/usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= rev-parse --git-dir)"
          if [ -e "${git_dir}/objects/info/alternates" ] || [ -L "${git_dir}/objects/info/alternates" ]; then
            echo "::error::refusing to restore design-run-deliver: git object alternates are present" >&2
            exit 1
          fi
          if [ -L scripts ] || [ -L scripts/design-run-deliver.sh ]; then
            echo "::error::refusing to restore design-run-deliver: scripts/ or the script is a symlink" >&2
            exit 1
          fi
          blob_tmp="$(mktemp "${RUNNER_TEMP}/design-run-deliver-blob.XXXXXX")"
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::refusing to restore design-run-deliver through a symlink" >&2
            exit 1
          fi
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:scripts/design-run-deliver.sh" > "$blob_tmp"; then
            rm -f "$blob_tmp"
            echo "::error::could not restore design-run-deliver.sh from ${START_SHA}" >&2
            exit 1
          fi
          if [ -L "$blob_tmp" ] || [ ! -f "$blob_tmp" ]; then
            echo "::error::design-run-deliver restore did not leave a regular file" >&2
            exit 1
          fi
          restore_tmp="${RUNNER_TEMP}/design-run-deliver.sh"
          if [ -L "$restore_tmp" ]; then
            rm -f "$restore_tmp"
          fi
          mv -f "$blob_tmp" "$restore_tmp"
          if [ -L "$restore_tmp" ] || [ ! -f "$restore_tmp" ]; then
            echo "::error::design-run-deliver restore did not leave a regular file" >&2
            exit 1
          fi
          chmod +x "$restore_tmp"
          got="$(sha256sum "$restore_tmp" | awk '{print $1}')"
          if [ "$got" != "$DELIVER_SHA256" ]; then
            echo "::error::restored design-run-deliver.sh sha256 does not match the pre-agent pin" >&2
            exit 1
          fi
          reap_agent_orphans
          "$restore_tmp" --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --base "$START_SHA" --base-branch "$BASE_BRANCH" --run-url "$RUN_URL" \
            --write-bundle "${RUNNER_TEMP}/design-run.bundle"
          bundle_path="${RUNNER_TEMP}/design-run.bundle"
          if [ -f "$bundle_path" ]; then
            captured="$(sha256sum "$bundle_path" | awk '{print $1}')"
          else
            captured=""
          fi
          # write_bundle has returned. Anything still alive was not that
          # script. Reap, then accept the file only when its digest is the
          # one captured before the reap.
          reap_agent_orphans
          if [ -n "$captured" ] && [ -f "$bundle_path" ]; then
            now="$(sha256sum "$bundle_path" | awk '{print $1}')"
          else
            now=""
          fi
          if [ -z "$captured" ] || [ "$now" != "$captured" ]; then
            rm -f "$bundle_path"
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            if [ -n "$captured" ] && [ "$now" = "$captured" ] && [ -f "$bundle_path" ]; then
              echo "sha256=${now}" >> "$GITHUB_OUTPUT"
              echo "pending=true" >> "$GITHUB_OUTPUT"
            else
              echo "sha256=" >> "$GITHUB_OUTPUT"
              echo "pending=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload the design bundle
        if: steps.bundle.outputs.pending == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: design-run-bundle
          path: ${{ runner.temp }}/design-run.bundle
          retention-days: 1
          if-no-files-found: error
        env:
          NODE_OPTIONS: ""

      - name: Withdraw a dead run's SHIP-LOCK
        id: lock_cleanup
        # The agent posts the SHIP-LOCK claim on the selected issue but cannot
        # withdraw it when killed — the orphaned claim then excludes the issue
        # from every later selection (issue #312). The script mirrors the
        # selector's semantics and leaves a claim alone when a branch or
        # closing PR corroborates it. Ambient github.token ON PURPOSE, not the
        # GH_TOKEN PAT: GITHUB_TOKEN-authored comments never trigger
        # issue_comment workflows (decide.yml, backlog-burn-config.yml,
        # ci-gate-approve.yml) — a PAT here would.
        # Skipped while a bundle is pending: the deliver job pushes, then
        # runs lock cleanup. Withdrawing here would drop the claim before
        # that push and the red gate would fail a run that is still in flight.
        # A DECLINED / DECISION NEEDED / DEFERRED stop writes no bundle, so
        # pending stays false and this cleanup still runs.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.bundle.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          # .outcome, never .conclusion — continue-on-error rewrites a failed
          # step's conclusion to success; outcome keeps the real result.
          # The walk's three-valued outcome (#327, #544, #538): 'success' if
          # ANY of the five links across both providers succeeded;
          # 'not-run' only when EVERY link was skipped (no key for any
          # provider — the agent never ran); 'failure' for everything else,
          # INCLUDING an exit-0 link that delivered nothing. That last fold
          # is the #538 point: claude-code-action exits 0 whenever the agent
          # ended its turn without an API error, so a run link's 'success'
          # outcome is indistinguishable here from its real thing — the
          # DISPOSITION is derived downstream in routine-lock-cleanup.sh
          # from what exists on GitHub (branch / closing PR / stop comment),
          # and this value is diagnostic only. The not-run conjunction
          # reads every link (not just the last), so a walk where the head
          # links FAILED and only the keyless tail was skipped can never
          # read 'not-run' — the cleanup would no-op on a dead run and
          # leave its SHIP-LOCK standing, the #312 orphan-claim livelock
          # through a different door. The drift guard
          # (test_routine_walk_outcome_covers_every_link) simulates every
          # outcome combination against the chain's link count and pins all
          # three values, with a last-link-only not-run read as its
          # negative control.
          AGENT_OUTCOME: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_zai_1.outcome == 'skipped' && steps.run_zai_2.outcome == 'skipped' && steps.run_zai_3.outcome == 'skipped' && steps.run_anthropic_4.outcome == 'skipped' && steps.run_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The start commit the checkout step left, captured before any agent
          # step could move HEAD (#670).
          START_SHA: ${{ steps.start_ref.outputs.sha }}
        run: |
          # #670: the tree the walk leaves behind is untrusted for cleanup —
          # restore the script from the commit this job started on (the
          # default branch) and run THAT. The walk may have checked out a
          # stacked feature branch whose older copy predates #538 and no-ops
          # a dead 'success' (#627). git-show fallback for a tree whose index
          # a killed agent left locked; a restore that fails entirely fails
          # this step red — a cleanup that cannot run trusted code must not
          # fall back to running untrusted code.
          #
          # Symlink-safe: bypassPermissions lets the agent leave
          # scripts/routine-lock-cleanup.sh (or scripts/ itself) as a
          # symlink, and the index-lock case makes the checkout below fail.
          # Never open that path for write — a redirect follows the link and
          # truncates whatever it points at, and chmod would follow it too.
          # If scripts/ is a symlink, refuse (checkout and mv would write
          # outside the workspace). If the script path is a symlink, unlink
          # the link itself first (rm does not follow it) so checkout cannot
          # be aimed at the target. The fallback writes the blob to a temp
          # file outside the tree, unlinks a destination symlink again, then
          # mv -f replaces the path (mv replaces the directory entry and does
          # not follow a symlink). The result must be a regular file or this
          # step fails red.
          if [ -L scripts ]; then
            echo "::error::refusing to restore lock-cleanup: scripts/ is a symlink" >&2
            exit 1
          fi
          if [ -L scripts/routine-lock-cleanup.sh ]; then
            rm -f scripts/routine-lock-cleanup.sh
          fi
          if ! git --no-replace-objects -c core.hooksPath=/dev/null checkout "$START_SHA" -- scripts/routine-lock-cleanup.sh; then
            restore_tmp="$(mktemp)"
            if ! git --no-replace-objects -c core.hooksPath=/dev/null show "$START_SHA:scripts/routine-lock-cleanup.sh" > "$restore_tmp"; then
              rm -f "$restore_tmp"
              exit 1
            fi
            if [ -L scripts/routine-lock-cleanup.sh ]; then
              rm -f scripts/routine-lock-cleanup.sh
            fi
            mv -f "$restore_tmp" scripts/routine-lock-cleanup.sh
          fi
          if [ -L scripts/routine-lock-cleanup.sh ] || [ ! -f scripts/routine-lock-cleanup.sh ]; then
            echo "::error::lock-cleanup restore did not leave a regular file" >&2
            exit 1
          fi
          chmod +x scripts/routine-lock-cleanup.sh
          # JOB_WINDOW_START is stamped by "Note the job window start" into
          # GITHUB_ENV before any agent step. Do not drop it: without a window
          # a claimless DEFERRED cannot be attributed to this firing.
          if [ -z "${JOB_WINDOW_START:-}" ]; then
            echo "::error::JOB_WINDOW_START is empty — the job-window step did not run"
            exit 1
          fi
          ./scripts/routine-lock-cleanup.sh --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --agent-outcome "$AGENT_OUTCOME" --run-url "$RUN_URL" --routine design-run \
            --run-started-at "$JOB_WINDOW_START"

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected #${ISSUE} but did not invoke /design-run"
          else
            echo "::notice::no key is set for ANY provider in the design-run chain (ZAI_KEY for the zai links, CLAUDE_KEY for the anthropic tail; head provider '${PROVIDER}') — selected #${ISSUE} but skipping the unattended /design-run run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issue == ''
        env:
          LABEL: ${{ steps.policy.outputs.label }}
        run: echo "::notice::no brief is currently eligible (nothing carrying the '${LABEL}' opt-in label is unclaimed) — nothing to run"

      - name: Record the run outcome
        # Runs on success, failure or skip so the job summary always shows what
        # happened. This reports the *run* disposition; the authoritative
        # shipped/declined verdict and the draft-PR link are posted by
        # /design-run onto the issue thread itself (its §8 — the thread is the
        # only durable log), which this summary links back to.
        if: always()
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          # Distinguish a policy-step failure, a disabled routine and a failed
          # selection from a genuine empty selection — otherwise all four read
          # as "nothing eligible" (CodeRabbit review on #165).
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#327, #544, #538) — the same five-link
          # walk expression as AGENT_OUTCOME (byte-identical, diagnostic
          # only): success / not-run / failure. What the run actually DID
          # is the lock cleanup's artifact-derived disposition below.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_zai_1.outcome == 'skipped' && steps.run_zai_2.outcome == 'skipped' && steps.run_zai_3.outcome == 'skipped' && steps.run_anthropic_4.outcome == 'skipped' && steps.run_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_zai_2.outcome }}
          L3: ${{ steps.run_zai_3.outcome }}
          L4: ${{ steps.run_anthropic_4.outcome }}
          L5: ${{ steps.run_anthropic_5.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          M4: ${{ steps.chain.outputs.link4_model }}
          M5: ${{ steps.chain.outputs.link5_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
          P4: ${{ steps.chain.outputs.link4_provider }}
          P5: ${{ steps.chain.outputs.link5_provider }}
          LOCK_WITHDRAWN: ${{ steps.lock_cleanup.outputs.withdrawn }}
          # The artifact-derived disposition (#538) — what the run actually
          # did, as distinct from what the agent links' exit codes said.
          DELIVERED: ${{ steps.lock_cleanup.outputs.delivered }}
          DECLINED: ${{ steps.lock_cleanup.outputs.declined }}
          BUNDLE_PENDING: ${{ steps.bundle.outputs.pending }}
          # $GITHUB_STEP_SUMMARY does not auto-link a bare #N — build a real link.
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3 4 5; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::design run fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served #${ISSUE} — the run is green, but the head provider is down or keyless; check its quota/key (a provider-wide failure shifts this routine's spend to the tail while it lasts)"
              fi
              break
            fi
          done
          {
            echo "## Design run — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/design-run.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the selector failed; see the log"
            elif [ -z "${ISSUE}" ]; then
              echo "- selected: none (nothing eligible)"
            else
              echo "- selected: [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE})"
              echo "- provider: ${PROVIDER} (head)"
              echo "- agent walk: ${RUN:-skipped} (diagnostic only)"
              if [ "${DELIVERED}" = "true" ]; then
                echo "- disposition: delivered — a corroborating branch or an open closing PR exists (see [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE}) for the /design-run verdict and any draft PR)"
              elif [ "${DECLINED}" = "true" ]; then
                echo "- disposition: declined — the run stopped deliberately (see [#${ISSUE}](${SERVER}/${REPO}/issues/${ISSUE}))"
              elif [ "${BUNDLE_PENDING}" = "true" ]; then
                echo "- disposition: handed to the deliver job — the design commits are in a bundle; a fresh runner verifies it and pushes"
              else
                echo "- disposition: dead — nothing delivered, nothing declined; the red gate below fails this run"
              fi
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
              if [ "${LOCK_WITHDRAWN}" = "true" ]; then
                echo "- lock cleanup: withdrew the dead run's SHIP-LOCK on #${ISSUE} so the next firing can re-select it"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # provider-triage runs with ZAI_KEY, CLAUDE_KEY and github.token, and
      # its python is the worktree copy. The agent can rewrite that action
      # and tools/model-registry (and .github/models, which chooses the
      # probe URL the keys are sent to) before this step. Restore those
      # paths from START_SHA — blob by blob, no smudge filter — after the
      # agent's detached processes are dead. Same if: as the triage step:
      # a delivered run never reaches the secrets.
      - name: Restore provider-triage from the pinned commit
        id: restore_triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.lock_cleanup.outputs.delivered != 'true'
          && steps.lock_cleanup.outputs.declined != 'true'
          && steps.bundle.outputs.pending != 'true'
        env:
          START_SHA: ${{ steps.start_ref.outputs.sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PYTHONPATH: ""
          GIT_SSH_COMMAND: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_DIR: ""
          GIT_WORK_TREE: ""
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_OBJECT_DIRECTORY: ""
          PATH: /usr/bin:/bin
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_CONFIG_PARAMETERS GIT_SSH_COMMAND GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_OBJECT_DIRECTORY || true
          reap_agent_orphans() {
            local d pid ppid comm cwd cmd v pgid my_pgid
            local -a victims=()
            my_pgid="$(ps -o pgid= -p $$ | tr -d '[:space:]')"
            shopt -s nullglob
            for d in /proc/[0-9]*; do
              pid="${d#/proc/}"
              case "$pid" in
                *[!0-9]*) continue ;;
              esac
              [ "$pid" = "$$" ] && continue
              ppid="$(awk '/^PPid:/ { print $2; exit }' "$d/status" 2>/dev/null || true)"
              [ "$ppid" = "1" ] || continue
              comm="$(tr -d '\0' < "$d/comm" 2>/dev/null || true)"
              case "$comm" in
                Runner.*|Agent.*|systemd*|containerd*|dockerd*|dbus*) continue ;;
              esac
              cwd="$(readlink "$d/cwd" 2>/dev/null || true)"
              cmd="$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null || true)"
              case "$cwd" in
                "${GITHUB_WORKSPACE:-/nonexistent}"*|"${RUNNER_TEMP:-/nonexistent}"*) victims+=("$pid"); continue ;;
              esac
              case "$cmd" in
                *design-run.bundle*|*model_registry*) victims+=("$pid") ;;
              esac
            done
            shopt -u nullglob
            if [ "${#victims[@]}" -eq 0 ]; then
              return 0
            fi
            for v in "${victims[@]}"; do
              pgid="$(ps -o pgid= -p "$v" 2>/dev/null | tr -d '[:space:]' || true)"
              if [ -n "$pgid" ] && [ "$pgid" != "$my_pgid" ] && [ "$pgid" != "1" ] && [ "$pgid" != "0" ]; then
                kill -TERM -- "-${pgid}" 2>/dev/null || true
              fi
              kill -TERM "$v" 2>/dev/null || true
            done
            sleep 1
            for v in "${victims[@]}"; do
              kill -KILL "$v" 2>/dev/null || true
            done
          }
          if [ -z "${START_SHA:-}" ]; then
            echo "::error::START_SHA is empty — provider-triage was not restored" >&2
            exit 1
          fi
          reap_agent_orphans
          git_dir="$(/usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= rev-parse --git-dir)"
          if [ -e "${git_dir}/objects/info/alternates" ] || [ -L "${git_dir}/objects/info/alternates" ]; then
            echo "::error::refusing to restore provider-triage: git object alternates are present" >&2
            exit 1
          fi
          for p in .github .github/actions .github/actions/provider-triage .github/models tools tools/model-registry; do
            if [ -L "$p" ]; then
              echo "::error::refusing to restore provider-triage: ${p} is a symlink" >&2
              exit 1
            fi
          done
          rm -rf .github/actions/provider-triage .github/models tools/model-registry
          mkdir -p .github/actions .github tools
          installed=0
          while IFS= read -r -d '' line; do
            mode="${line%% *}"
            rest="${line#* }"
            type="${rest%% *}"
            rest="${rest#* }"
            sha="${rest%%$'\t'*}"
            path="${rest#*$'\t'}"
            case "$mode" in
              100644|100755) ;;
              *)
                echo "::error::refusing pinned path ${path} (mode ${mode})" >&2
                exit 1
                ;;
            esac
            if [ "$type" != "blob" ]; then
              echo "::error::pinned path ${path} is not a blob" >&2
              exit 1
            fi
            case "$path" in
              .github/actions/provider-triage/*|.github/models/*|tools/model-registry/*) ;;
              *)
                echo "::error::pinned path ${path} is outside the triage closure" >&2
                exit 1
                ;;
            esac
            parent="$(dirname "$path")"
            if [ -L "$parent" ]; then
              echo "::error::refusing to restore through symlink ${parent}" >&2
              exit 1
            fi
            mkdir -p "$parent"
            if [ -L "$path" ]; then
              rm -f "$path"
            fi
            blob_tmp="$(mktemp "${RUNNER_TEMP}/triage-blob.XXXXXX")"
            if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= cat-file blob "$sha" > "$blob_tmp"; then
              rm -f "$blob_tmp"
              echo "::error::could not read ${path} from ${START_SHA}" >&2
              exit 1
            fi
            mv -f "$blob_tmp" "$path"
            if [ "$mode" = "100755" ]; then
              chmod +x "$path"
            else
              chmod 644 "$path"
            fi
            installed=$((installed + 1))
          done < <(/usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= ls-tree -r -z "$START_SHA" -- .github/actions/provider-triage .github/models tools/model-registry)
          if [ "$installed" -lt 1 ] || [ ! -f .github/actions/provider-triage/action.yml ]; then
            echo "::error::provider-triage restore wrote nothing from ${START_SHA}" >&2
            exit 1
          fi
          got="$(sha256sum .github/actions/provider-triage/action.yml | awk '{print $1}')"
          want="$(/usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:.github/actions/provider-triage/action.yml" | sha256sum | awk '{print $1}')"
          if [ "$got" != "$want" ]; then
            echo "::error::restored provider-triage action.yml does not match ${START_SHA}" >&2
            exit 1
          fi

      # Before failing the run, recover WHY the chain exhausted — the agent steps
      # hide their provider error — and route it: out of credit / out of tokens /
      # bad key escalate to ONE deduped needs-decision issue (so a scheduled red
      # nobody is watching becomes a human-actionable ask), a bad model id or a
      # transient blip is just diagnosed in the log. Advisory — it never fails the
      # job; the red gate below still fails it, and the lock cleanup above already
      # released the SHIP-LOCK. Same disposition condition as that gate. The
      # Anthropic key is the CLAUDE_KEY alias (as the run_anthropic_4/5 steps
      # wire); both keys go in so classify probes both halves of the chain.
      # The step env wins over a GITHUB_ENV / GITHUB_PATH the agent appended:
      # system python, no preload, and PYTHONSAFEPATH so a planted module in
      # the workspace is not imported ahead of the restored tree.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.lock_cleanup.outputs.delivered != 'true'
          && steps.lock_cleanup.outputs.declined != 'true'
          && steps.bundle.outputs.pending != 'true'
          && steps.restore_triage.outcome == 'success'
        uses: ./.github/actions/provider-triage
        env:
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PATH: /usr/bin:/bin
        with:
          chain: design-run
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.CLAUDE_KEY }}
          github-token: ${{ github.token }}
          # Quoted: unquoted, YAML reads " #" as a comment and the issue number
          # never reaches the escalation (#637 read "(issue —").
          context: "the design-run routine (issue #${{ steps.select.outputs.issue }})"
          escalate: "true"

      - name: Turn a dead agentic run red
        # continue-on-error on the agent steps keeps the cleanup above
        # reachable, but alone it would leave a dead run green — and
        # green/cancelled starvation looking like health is exactly the
        # livelock's disguise (issue #312). #538: the gate reads the lock
        # cleanup's artifact-derived disposition (delivered / declined),
        # NEVER the walk's outcome string — claude-code-action exits 0
        # whenever the agent ends its turn without an API error, so gating
        # on `(walk) != 'success'` scored an exit-0 run that claimed but
        # pushed nothing as a success. Fires unless the run is provably
        # delivered or provably declined, whatever the exit codes said.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issue != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.lock_cleanup.outputs.delivered != 'true'
          && steps.lock_cleanup.outputs.declined != 'true'
          && steps.bundle.outputs.pending != 'true'
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          # The walk's outcome (#327, #544, #538) — byte-identical to
          # AGENT_OUTCOME in the lock cleanup above (the drift guard pins
          # that). Diagnostic only: the disposition above decides.
          AGENT_OUTCOME: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_zai_1.outcome == 'skipped' && steps.run_zai_2.outcome == 'skipped' && steps.run_zai_3.outcome == 'skipped' && steps.run_anthropic_4.outcome == 'skipped' && steps.run_anthropic_5.outcome == 'skipped') && 'not-run' || 'failure' }}
        run: |
          echo "::error::the /design-run run for #${ISSUE} neither delivered nor declined (agent walk: ${AGENT_OUTCOME} — diagnostic only) — its SHIP-LOCK cleanup ran above; failing the job so the death is visible"
          exit 1

  deliver:
    name: Verify the bundle and open the draft PR
    needs: run
    # Runs when the agent job produced a bundle, including when a later step
    # of that job failed after the output was set. Skipped when the agent
    # job itself was skipped (disarmed, wrong ref, andon cord).
    if: >-
      always()
      && needs.run.result != 'skipped'
      && needs.run.outputs.bundle_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
          # Full history. START_SHA must be a bundle prerequisite, and every
          # other prerequisite must pass merge-base --is-ancestor against
          # START_SHA. A depth-1 checkout cannot see those ancestors.
          fetch-depth: 0
          ref: ${{ needs.run.outputs.start_sha }}

      - name: Download the design bundle
        timeout-minutes: 2
        uses: actions/download-artifact@v7
        with:
          name: design-run-bundle
          path: ${{ runner.temp }}/design-run-bundle
        env:
          NODE_OPTIONS: ""

      # No agent code. The script is the fresh checkout of START_SHA, hashed
      # against the pre-agent pin. The bundle is data: it is verified and
      # fetched into a local ref, and nothing in it is executed. The PAT is
      # on this step only.
      - name: Verify the bundle and push
        id: deliver
        # Below the job's 15 minutes. A job timeout cancels later steps,
        # including the always() SHIP-LOCK cleanup. A step timeout fails
        # this step and still leaves that cleanup time to run.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.run.outputs.issue }}
          START_SHA: ${{ needs.run.outputs.start_sha }}
          DELIVER_SHA256: ${{ needs.run.outputs.deliver_sha256 }}
          BUNDLE_SHA256: ${{ needs.run.outputs.bundle_sha256 }}
          DELIVER_WORKTREE: ${{ github.workspace }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          JOB_WINDOW_START: ${{ needs.run.outputs.job_window_start }}
          ISSUE_READ_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_BIN: /usr/bin/git
          GH_BIN: /usr/bin/gh
          JQ_BIN: /usr/bin/jq
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PYTHONPATH: ""
          GIT_SSH_COMMAND: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_DIR: ""
          GIT_WORK_TREE: ""
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_OBJECT_DIRECTORY: ""
          PATH: /usr/bin:/bin
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_CONFIG_PARAMETERS GIT_SSH_COMMAND GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_OBJECT_DIRECTORY || true
          script="$GITHUB_WORKSPACE/scripts/design-run-deliver.sh"
          if [ -L "$script" ] || [ ! -f "$script" ]; then
            echo "::error::delivery script is not a regular file in the START_SHA checkout" >&2
            exit 1
          fi
          if [ -z "${DELIVER_SHA256:-}" ] || [ -z "${BUNDLE_SHA256:-}" ] || [ -z "${START_SHA:-}" ]; then
            echo "::error::deliver inputs are empty" >&2
            exit 1
          fi
          # The run job checks out the default branch by name and pins that
          # tip. A push to the default branch while this workflow is queued
          # makes that tip a descendant of github.sha; equality is the common
          # case. A rewritten output that names an older script, or a commit
          # that is not on the default branch, is refused.
          if [ "$START_SHA" != "$GITHUB_SHA" ]; then
            if ! /usr/bin/git --no-replace-objects merge-base --is-ancestor "$GITHUB_SHA" "$START_SHA"; then
              echo "::error::START_SHA is not the workflow commit or a descendant of it" >&2
              exit 1
            fi
            if ! /usr/bin/git --no-replace-objects merge-base --is-ancestor "$START_SHA" "origin/${BASE_BRANCH}"; then
              echo "::error::START_SHA is not on ${BASE_BRANCH}" >&2
              exit 1
            fi
          fi
          got="$(sha256sum "$script" | awk '{print $1}')"
          if [ "$got" != "$DELIVER_SHA256" ]; then
            echo "::error::checkout design-run-deliver.sh sha256 does not match the pre-agent pin" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/scripts/design-run-deliver.sh" \
            --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --base "$START_SHA" --base-branch "$BASE_BRANCH" --run-url "$RUN_URL" \
            --bundle "${RUNNER_TEMP}/design-run-bundle/design-run.bundle" \
            --bundle-sha256 "$BUNDLE_SHA256"

      - name: Release the SHIP-LOCK after delivery
        id: lock_cleanup
        # Short on purpose. The push step above is capped at 10 minutes and
        # this job at 15, so a hung cleanup must not consume the rest of the
        # job after that push has already timed out.
        timeout-minutes: 3
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.run.outputs.issue }}
          WALK_OUTCOME: ${{ needs.run.outputs.walk_outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START_SHA: ${{ needs.run.outputs.start_sha }}
          JOB_WINDOW_START: ${{ needs.run.outputs.job_window_start }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          PYTHONPATH: ""
          GIT_SSH_COMMAND: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_DIR: ""
          GIT_WORK_TREE: ""
          PATH: /usr/bin:/bin
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_CONFIG_PARAMETERS GIT_SSH_COMMAND || true
          if [ -z "${JOB_WINDOW_START:-}" ]; then
            echo "::error::JOB_WINDOW_START is empty — the job-window output did not arrive"
            exit 1
          fi
          if [ -L scripts ]; then
            echo "::error::refusing to restore lock-cleanup: scripts/ is a symlink" >&2
            exit 1
          fi
          if [ -L scripts/routine-lock-cleanup.sh ]; then
            rm -f scripts/routine-lock-cleanup.sh
          fi
          if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= checkout "$START_SHA" -- scripts/routine-lock-cleanup.sh; then
            restore_tmp="$(mktemp)"
            if ! /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.sshCommand= show "$START_SHA:scripts/routine-lock-cleanup.sh" > "$restore_tmp"; then
              rm -f "$restore_tmp"
              exit 1
            fi
            if [ -L scripts/routine-lock-cleanup.sh ]; then
              rm -f scripts/routine-lock-cleanup.sh
            fi
            mv -f "$restore_tmp" scripts/routine-lock-cleanup.sh
          fi
          if [ -L scripts/routine-lock-cleanup.sh ] || [ ! -f scripts/routine-lock-cleanup.sh ]; then
            echo "::error::lock-cleanup restore did not leave a regular file" >&2
            exit 1
          fi
          chmod +x scripts/routine-lock-cleanup.sh
          ./scripts/routine-lock-cleanup.sh --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --agent-outcome "$WALK_OUTCOME" --run-url "$RUN_URL" --routine design-run \
            --run-started-at "$JOB_WINDOW_START"

      - name: Fail a delivery that neither pushed nor declined
        if: >-
          always()
          && steps.lock_cleanup.outputs.delivered != 'true'
          && steps.lock_cleanup.outputs.declined != 'true'
        env:
          ISSUE: ${{ needs.run.outputs.issue }}
        run: |
          echo "::error::the design-run delivery for #${ISSUE} neither delivered nor declined"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `run` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips it
    # silently. This sibling makes that legible. No secrets, no write perms.
    # A pulled AI andon cord (docs/andon-cord.md) skips the gated job the same
    # way, so this sibling explains that too — checked first, since the cord
    # overrides an armed routine.
    if: >-
      vars.DESIGN_RUN_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
      || vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.DESIGN_RUN_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          if [ "${ANDON:-}" = "true" ]; then
            echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — the design run did not run; no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume — see docs/andon-cord.md."
          elif [ "${ARMED:-}" != "true" ]; then
            echo "::notice::design run is disarmed — set the DESIGN_RUN_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/design-run.conf; both must agree before it runs."
          else
            echo "::notice::design run only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
