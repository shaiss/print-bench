name: Labeler (scheduled issue triage)

# The scheduled heartbeat for /label-issues. Once a day it reads the OPEN issues
# that carry none of the routing labels and applies the one that routes each —
# chiefly `autonomy-ok`, which arms the backlog burn. It is the front door of
# the autonomy loop: /ship-issue, the chunker and the design run all wait on a
# routed issue, so the burn ships nothing until an issue is armed. The skill
# already runs the same attended or unattended and is conservative by
# construction (arms only confident single-PR work); this workflow just gives it
# a cadence.
#
# WHY THIS EXISTS: the backlog burn only picks issues labeled `autonomy-ok`. A
# backlog with zero armed issues leaves the burn firing hourly and shipping
# nothing (an empty selection every run). This routine keeps the queue armed
# without a human hand-labelling each issue, closing the gap AHEAD of the loop
# the chunker closes behind it:
#   labeler arms `autonomy-ok`      → backlog burn ships it.
#   labeler marks `declined-too-big`→ chunker splits it → burn ships the pieces.
#   labeler marks `design-brief`    → design run designs it.
#   labeler marks `needs-decision`  → parked for a human (autonomy blocked).
#
# This is the SIBLING of backlog-burn.yml, design-run.yml and chunker.yml. It
# shares their config parser and their two-key safety model, but NOT their
# selector: those pick ONE issue carrying an opt-in label; the labeler sweeps
# issues carrying NONE of the routing labels (the `-label:` search in the Select
# step below).
#
# WHERE THE CONFIG LIVES (deliberate split, identical to the siblings):
#   * Policy → committed, git-tracked: .github/labeler.conf holds `enabled`, the
#     `provider` and the `cadence`. Change it with a reviewed one-line PR; a
#     clone carries it.
#   * Live arming / kill switch → the LABELER_ENABLED repo variable, a fast
#     human-only toggle (Settings → Secrets and variables → Actions →
#     Variables, or `gh variable set`). Not in git on purpose: arming an agent
#     that writes to issues should be a conscious act a fresh clone/fork can't
#     inherit, and flipping it off halts the routine in seconds without a PR.
#   * Cadence → the `cron` literal below. Actions cannot read a file or variable
#     for `on.schedule`, so the schedule must be literal here — still
#     git-tracked, so changing it is a one-line PR. Keep it in sync with the
#     `cadence:` key in .github/labeler.conf.
#
# Safety properties (same as the siblings):
#   * TWO keys must agree to run: committed `enabled: true` AND
#     LABELER_ENABLED == 'true'. Either off → inert.
#   * Non-destructive: the routine only ADDS labels (never removes) and only to
#     issues that carry no routing label yet, so a re-run cannot re-route, and a
#     wrong label is one click for a human to remove.
#   * Bounded: the Select step caps the untriaged list, so a bad day costs a
#     capful of labels, not the whole backlog.

on:
  schedule:
    # Every 4 hours at :11 past the hour — an off-peak minute (not :00) to avoid
    # Actions scheduler congestion, and offset from backlog-burn's :17,
    # design-run's :23 and chunker's :29 so the routines don't fire
    # simultaneously. Firing 6× a day (01:11 / 05:11 / 09:11 / 13:11 / 17:11 /
    # 21:11 UTC) keeps the queue moving so a freshly-filed issue is routed within
    # hours instead of waiting for the next morning; the 05:11 fire still runs
    # BEFORE the 05:29 chunker and the 06:17 backlog burn, so an issue armed then
    # is available to that morning's chunk-and-ship. Cron must be a literal —
    # Actions evaluates no files or variables for on.schedule — so change the
    # cadence by editing this line in a one-line PR (and the `cadence:` key in
    # .github/labeler.conf to match), e.g.:
    #   twice daily:  '11 5,17 * * *'
    #   daily:        '11 5 * * *'
    # The two-key guard (LABELER_ENABLED + committed `enabled: true`) ensures the
    # schedule is harmless until deliberately armed, and the routine is bounded
    # (≤15 issues/run, add-only, no re-route), so firing 6×/day is cheap and
    # safe: an idle firing that finds nothing untriaged skips before any model call.
    - cron: '11 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and log the untriaged issues, but do not invoke /label-issues'
        type: boolean
        default: false

# Scoped to what the unattended /label-issues run actually does: it reads the
# repo to run the skill (contents:read) and adds labels + audit comments to
# issues (issues:write). It pushes no branch and opens no PR, so it needs
# NEITHER contents:write NOR pull-requests:write — the same deliberately tight
# grant as the chunker. The job is off unless LABELER_ENABLED is set AND the
# committed config says enabled, and the writing step is skipped entirely
# without the provider's secret, so even these grants sit idle until the routine
# is deliberately switched on.
permissions:
  contents: read
  issues: write

# Never run two labelers at once — this group serializes THIS workflow with
# itself. It deliberately does NOT serialize against the siblings: GitHub
# concurrency is shared across workflows only when the group STRING matches, and
# the siblings use their own names. Do not cancel an in-flight run.
concurrency:
  group: labeler
  cancel-in-progress: false

jobs:
  label:
    name: Triage untriaged issues with /label-issues
    # Key 1 of 2: the live arming / kill switch (repo variable). Unset or
    # anything but 'true' pauses the whole job in seconds without a commit.
    # Key 2 (committed `enabled: true`) is checked in the "Read policy" step.
    # Also pin the run to the DEFAULT BRANCH: this job carries a write scope and
    # a secret, and `workflow_dispatch` can target any in-repo branch — so a
    # dispatch against a PR branch must not run that branch's skill/selector code
    # with the secret. On `schedule` github.ref_name is already the default
    # branch, so this only ever blocks a hand-dispatch against a non-default ref.
    if: >-
      vars.LABELER_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Job budget 45 = 2 × run-step timeout (20) + 5 min headroom. Labelling is
    # light, but the walk below is five run steps in a row (three GLM links,
    # then the Anthropic tail — issue #544), each with its own 20-minute
    # timeout, and the budget must let at least ONE full fallback link
    # complete after a head link STALLS to its step timeout (a model stall,
    # not the seconds a quota/billing rejection takes): head 20 + one
    # fallback 20 + the pre-run steps. The per-step timeout is what keeps a
    # hung /label-issues from holding a runner and a secret for the whole job
    # budget, unwatched — before #544 the single step could hold it for 30.
    # Two consecutive stalls are not budgeted — a second stalled link dies
    # with the job — because a stall is a provider-wide symptom, and the
    # fast failures the tail exists for reject in seconds. Well inside
    # GitHub's 360-minute hosted-job cap (the drift guard pins <= 360).
    timeout-minutes: 45
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's run steps gate on
      # their own) plus `key_present` = either one (the any-key gate the
      # triage, red and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch, so the secret-bearing agent runs the reviewed,
          # merged skill — never a dispatched branch's version.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the config parser
        # The labeler reuses the backlog burn's config parser verbatim (only the
        # `enabled`/`provider`/`cadence` keys — it does not use the selector).
        run: pip install -e tools/backlog-burn

      - name: Read policy (.github/labeler.conf)
        id: policy
        # Key 2 of 2: the committed, git-tracked source of truth. A malformed or
        # typo'd config (bad key, unknown provider) fails this step loudly rather
        # than running on a policy nobody wrote. The conf's `provider:` is the
        # walk's HEAD provider (issue #544) — validated here, emitted for the
        # resolve step's shape check and the summary. Key presence is emitted
        # PER PROVIDER (each provider's run steps gate on their own, so the
        # tail can run when the head's key is absent) plus the any-key
        # `key_present` the triage / red / skip-notice gates read.
        run: |
          set -euo pipefail
          conf=.github/labeler.conf
          enabled="$(backlog-burn config --get enabled --path "$conf")"
          provider="$(backlog-burn config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          {
            echo "enabled=$enabled"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      # Resolve the labeler's model from the committed provider/model registry
      # (issue #326) — the same resolve step auto-review.yml and
      # product-scout.yml run, stdlib-only so it needs no install in front of
      # it. A malformed registry, or one whose `labeler` chain went missing,
      # fails this step loudly BEFORE any key is spent; the same mismatch is
      # caught pre-merge by the model-registry drift-guard tests, which fire on
      # this workflow and on registry.conf.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal run steps
      # — its layout, one provider per step in file order (three Z.AI GLM
      # steps, then two Anthropic steps), because Actions can only reference a
      # secret by its literal name — while the registry picks the MODEL each
      # step runs. A link on the wrong slot's provider (claude-* on a Z.AI
      # step, glm-* on an Anthropic step) would fail at request time with a
      # key already spent, and a chain longer or shorter than the walk leaves
      # a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and link
      # N's provider must be step N's — `model-registry shape` applies the
      # same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring.
      - name: Resolve the labeler's model chain (issue #326)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve labeler --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(backlog-burn config --get provider --path .github/labeler.conf)"
          # One layout entry per run step below, in file order.
          python3 -m model_registry shape labeler --head "$conf_provider" \
            --conf .github/labeler.conf --layout zai,zai,zai,anthropic,anthropic


      - name: Note when disabled by committed policy
        if: steps.policy.outputs.enabled != 'true'
        run: echo "::notice::.github/labeler.conf has enabled != true — the routine is armed (repo variable) but paused in git; nothing to do"

      - name: Select untriaged issues
        id: select
        if: steps.policy.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Cap the daily discovery list so a bad run touches a bounded set.
          LIMIT: '15'
        run: |
          set -euo pipefail
          # The helper's list-untriaged verb excludes every routing label with a
          # `-label:` search, so only issues carrying NONE of them come back.
          # This runs in the TRUSTED workflow context (github.token), not the
          # agent — the agent is handed only the resulting numbers.
          list="$(.claude/skills/label-issues/label-helper.sh list-untriaged --limit "$LIMIT")"
          # Extract the issue numbers into a single space-separated string, e.g.
          # "#204 Foo\n#206 Bar" -> "204 206".
          nums="$(printf '%s\n' "$list" | sed -n 's/^#\([0-9]\+\).*/\1/p' | tr '\n' ' ' | sed 's/ *$//')"
          echo "issues=$nums" >> "$GITHUB_OUTPUT"
          {
            echo "## Labeler — selection"
            if [ -z "$nums" ]; then
              echo "- no untriaged open issues (every open issue already carries a routing label)"
            else
              # Prefix each space-separated number with '#' via parameter
              # expansion (nums is non-empty here): "204 206" -> "#204 #206".
              echo "- untriaged issues to triage: #${nums// / #}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544): links 1-3 are the Z.AI GLM steps, links 4-5
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # GitHub Actions can only reference a secret by its literal name
      # (secrets can't be selected by a runtime variable), so the walk's
      # provider LAYOUT is fixed here and the registry's `labeler` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # labeler to another model is a registry edit, not a workflow edit
      # (#326); the resolve step above refuses a chain that does not fit this
      # layout. The committed `provider:` label names the HEAD provider (link
      # 1 must sit on it); it no longer selects a whole block. Each link is
      # gated on EVERY earlier link NOT having succeeded — a skipped step's
      # outcome is 'skipped', not 'success', so the Anthropic tail runs
      # whether the GLM links failed or were skipped for want of ZAI_KEY — so
      # the first success short-circuits the rest and a dead model, or a
      # whole dead provider, falls through instead of killing the run. Each
      # provider's steps gate on THEIR OWN key (zai_key_present /
      # anthropic_key_present), never the other's. Deepening the chain (#327)
      # is a same-PR pair: add the model to the registry AND the matching run
      # step here (and its slot in the resolve step's --layout) — the drift
      # guard fails either half shipped alone.
      #
      # Failure model: the labeler carries no SHIP-LOCK lifecycle (#326
      # constraint), so non-terminal links (1-4) are continue-on-error so a
      # dead id falls through, and the TERMINAL link (5) keeps none — a
      # total-walk failure then fails the step, and the job, exactly as a
      # single failing step did before the tail existed. The "Turn an
      # exhausted walk red" step at the end covers the one case that rule
      # misses: a walk exhausted with the tail SKIPPED (only ZAI_KEY set, all
      # three GLM links dead) has no failed non-coe step to fail the job.
      #
      # All five steps share the pin, the write permission, the `github_token`
      # that authenticates the action's own GitHub calls, and the same
      # /label-issues prompt. The default GITHUB_TOKEN is fine here: the labeler
      # opens no PR (issue writes run no CI), so the REGEN_TOKEN/PAT reasoning
      # the backlog burn and design run carry does not apply.
      #
      # Tool surface: the skill drives every GitHub write through ONE committed
      # wrapper, .claude/skills/label-issues/label-helper.sh (list/read/add-label
      # /ensure-label/comment), so the CLI allow-list is that wrapper plus the
      # READ-ONLY file tools. It is NOT unrestricted `Bash`, and NOT `Write`: the
      # run reads untrusted issue text while holding a provider key, so a general
      # shell — or a file-write tool that could overwrite the wrapper and run it —
      # would turn prompt-injection into arbitrary commands / key exfiltration.
      # `--permission-mode dontAsk` makes that surface exclusive: any tool not on
      # the allow-list is DENIED (never prompted — there is no human in an
      # unattended run), the recommended pairing for a locked-down CI session.
      #
      # But --allowedTools only ADDS allows; claude-code-action loads
      # .claude/settings.json (settingSources=project) whose dev allows leak in —
      # not just Bash(xvfb-run:*) (arbitrary execution) but
      # Bash(.claude/skills/chunk-issue/chunk-helper.sh:*), the CHUNKER's wrapper,
      # which can CREATE issues and comments (beyond the labeler's add-only
      # remit). --settings closes that with the labeler's OWN deny backstop,
      # .claude/labeler-settings.json: deny beats allow from every source. It is
      # deliberately NOT the chunker's backstop — that one must LEAVE chunk-helper
      # usable, whereas the labeler must DENY it — so the labeler ships its own,
      # gated by scripts/labeler-perms-check.sh (every settings.json Bash allow,
      # chunk-helper included, must be denied; the label-helper wrapper must never
      # be, or the labeler fails closed). The pin is the immutable commit behind
      # the v1 tag.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
        # continue-on-error so the walk reaches link 2 (and the tail) when
        # this id or provider is dead; the step timeout keeps a stalled model
        # from eating the job budget the fallback links need.
        timeout-minutes: 20
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint. Claude Code inherits
        # these env vars: ANTHROPIC_BASE_URL points at Z.AI (the /api/anthropic
        # path matters), ANTHROPIC_AUTH_TOKEN becomes the Bearer token; the same
        # ZAI_KEY is also passed as anthropic_api_key to satisfy the action's
        # credential check. Labelling is light and every label a human can
        # remove, so the cheap GLM tier is the right default here; which model
        # exactly is the registry's call.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          # The trusted workflow's selection, bound into the agent's environment.
          # label-helper.sh refuses to write to any issue not in this set, so a
          # prompt-injected agent cannot touch an issue it was never handed.
          LABELER_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link1_model }} --effort low --permission-mode dontAsk --settings .claude/labeler-settings.json --allowedTools "Bash(.claude/skills/label-issues/label-helper.sh:*),Read,Grep,Glob"
          prompt: "/label-issues ${{ steps.select.outputs.issues }}"

      # The GLM tail (#327): links 2 and 3 of the registry's `labeler` chain,
      # reached only when every earlier link did not succeed — the same
      # env/selection/pin/prompt as link 1, only the model differs.
      - name: Run via Z.AI (GLM, chain link 2)
        id: run_zai_2
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          LABELER_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link2_model }} --effort low --permission-mode dontAsk --settings .claude/labeler-settings.json --allowedTools "Bash(.claude/skills/label-issues/label-helper.sh:*),Read,Grep,Glob"
          prompt: "/label-issues ${{ steps.select.outputs.issues }}"

      - name: Run via Z.AI (GLM, chain link 3)
        id: run_zai_3
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.zai_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          LABELER_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link3_model }} --effort low --permission-mode dontAsk --settings .claude/labeler-settings.json --allowedTools "Bash(.claude/skills/label-issues/label-helper.sh:*),Read,Grep,Glob"
          prompt: "/label-issues ${{ steps.select.outputs.issues }}"

      # The cross-provider tail (issue #544): links 4 and 5 of the registry's
      # `labeler` chain on Anthropic's native endpoint, reached only when
      # EVERY GLM link did not succeed (failed, or skipped for want of
      # ZAI_KEY) and gated on the Anthropic key's own presence. Claude via
      # api.anthropic.com: a plain API key (pay-per-token) is the right fit
      # for an unattended bot — no OAuth token / subscription seat. The same
      # pin, permission, github_token, effort, selection bound, grant and
      # prompt as the GLM links — only the model, secret and endpoint differ.
      # Which model runs is the registry's call (the cheap Anthropic tier).
      - name: Run via Anthropic (Claude, chain link 4)
        id: run_anthropic_4
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          # Same trusted selection bound as the Z.AI steps (see link 1).
          LABELER_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Same narrow tool grant + labeler deny backstop + dontAsk as the Z.AI steps.
          claude_args: --model ${{ steps.chain.outputs.link4_model }} --effort low --permission-mode dontAsk --settings .claude/labeler-settings.json --allowedTools "Bash(.claude/skills/label-issues/label-helper.sh:*),Read,Grep,Glob"
          prompt: "/label-issues ${{ steps.select.outputs.issues }}"

      - name: Run via Anthropic (Claude, chain link 5)
        id: run_anthropic_5
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && steps.run_zai_1.outcome != 'success'
          && steps.run_zai_2.outcome != 'success'
          && steps.run_zai_3.outcome != 'success'
          && steps.run_anthropic_4.outcome != 'success'
        # The TERMINAL link: no continue-on-error, so the last id dying fails
        # the step (and the job) — the walk is over.
        timeout-minutes: 20
        env:
          LABELER_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: --model ${{ steps.chain.outputs.link5_model }} --effort low --permission-mode dontAsk --settings .claude/labeler-settings.json --allowedTools "Bash(.claude/skills/label-issues/label-helper.sh:*),Read,Grep,Glob"
          prompt: "/label-issues ${{ steps.select.outputs.issues }}"

      - name: Explain a skipped agentic run
        if: >-
          steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && (steps.policy.outputs.key_present != '1'
              || github.event.inputs.dry_run == 'true')
        env:
          ISSUES: ${{ steps.select.outputs.issues }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected untriaged issues (${ISSUES}) but did not invoke /label-issues"
          else
            echo "::notice::no key is set for ANY provider in the labeler chain (ZAI_KEY for the zai links, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — selected (${ISSUES}) but skipping the unattended /label-issues run"
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.enabled == 'true' && steps.select.outputs.issues == ''
        run: echo "::notice::no untriaged open issues — every open issue already carries a routing label; nothing to triage"

      # No SHIP-LOCK lifecycle here, so the terminal link failing IS the job
      # failure — but before that stands, recover WHY the chain exhausted (the
      # agent steps hide their provider error) and route the human-fixable causes
      # — out of credit / out of tokens / bad key — to ONE deduped needs-decision
      # issue, so a scheduled red nobody watches becomes an actionable ask. A bad
      # model id or a transient blip is only diagnosed in the log. Advisory: it
      # never fails the job. Fires (always()) only when a key was present and the
      # walk did not succeed — the same five-link walk-outcome expression the
      # record step reports as RUN. Both keys go in so classify probes both
      # halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: labeler
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the labeler routine
          escalate: "true"

      - name: Record the run outcome
        if: always()
        env:
          ISSUES: ${{ steps.select.outputs.issues }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          ENABLED: ${{ steps.policy.outputs.enabled }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          # The walk's outcome (#327, #544): 'success' if ANY of the five
          # links across both providers succeeded; otherwise the outcome of
          # the LAST LINK THAT ACTUALLY RAN — the nested tail walks backwards
          # over 'skipped' links, so 'skipped' means every link was skipped
          # (no key for any provider), never "the tail had no key" after the
          # head failed. The terminal link failing fails the job; the "Turn
          # an exhausted walk red" step below covers a walk exhausted with
          # the tail skipped.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_zai_2.outcome }}
          L3: ${{ steps.run_zai_3.outcome }}
          L4: ${{ steps.run_anthropic_4.outcome }}
          L5: ${{ steps.run_anthropic_5.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          M4: ${{ steps.chain.outputs.link4_model }}
          M5: ${{ steps.chain.outputs.link5_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
          P4: ${{ steps.chain.outputs.link4_provider }}
          P5: ${{ steps.chain.outputs.link5_provider }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3 4 5; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::the labeler fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served — the run is green, but the head provider is down or keyless; check its quota/key"
              fi
              break
            fi
          done
          {
            echo "## Labeler — run outcome"
            if [ "${POLICY_OUTCOME}" != "success" ]; then
              echo "- policy step did not complete (\`${POLICY_OUTCOME:-skipped}\`) — the config could not be read; see the log"
            elif [ "${ENABLED}" != "true" ]; then
              echo "- disabled by committed policy (.github/labeler.conf \`enabled\` != true) — nothing ran"
            elif [ "${SELECT_OUTCOME}" != "success" ]; then
              echo "- selection did not complete (\`${SELECT_OUTCOME:-skipped}\`) — the select step failed; see the log"
            elif [ -z "${ISSUES}" ]; then
              echo "- selected: none (every open issue already carries a routing label)"
            else
              echo "- selected untriaged issues: #${ISSUES// / #}"
              echo "- provider: ${PROVIDER} (head)"
              echo "- run step: ${RUN:-skipped} (the applied labels and one-line rationales are on each issue thread)"
              if [ -n "${served}" ]; then
                echo "- served by: ${served}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Turn an exhausted walk red
        # The terminal link (5) carries no continue-on-error, so its failure
        # fails the job — but a walk that exhausted with the tail SKIPPED
        # (only ZAI_KEY set and every GLM link dead) has no failed non-coe
        # step, and would leave the run green: exactly the silent-success
        # disguise the burn's red-on-death step exists for. Restore the
        # failure last, after the triage and the record have run. Same
        # walk-outcome expression as the triage gate and RUN above.
        if: >-
          always()
          && steps.policy.outputs.enabled == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && github.event.inputs.dry_run != 'true'
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome)) != 'success'
        env:
          ISSUES: ${{ steps.select.outputs.issues }}
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_zai_2.outcome == 'success' && 'success' || steps.run_zai_3.outcome == 'success' && 'success' || steps.run_anthropic_4.outcome == 'success' && 'success' || steps.run_anthropic_5.outcome == 'success' && 'success' || (steps.run_anthropic_5.outcome == 'skipped' && (steps.run_anthropic_4.outcome == 'skipped' && (steps.run_zai_3.outcome == 'skipped' && (steps.run_zai_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_zai_2.outcome) || steps.run_zai_3.outcome) || steps.run_anthropic_4.outcome) || steps.run_anthropic_5.outcome) }}
        run: |
          echo "::error::the /label-issues agent step for (${ISSUES}) did not succeed on any link of the labeler chain (walk outcome: ${RUN}); failing the job so the exhaustion is visible"
          exit 1

  disarmed-notice:
    name: Explain a disarmed run
    # The `label` job is gated at job level, so an unset arming variable (the
    # default clone/fork state) or a dispatch against a non-default ref skips it
    # silently. This sibling makes that legible. No secrets, no write perms.
    if: >-
      vars.LABELER_ENABLED != 'true'
      || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why the routine did not run
        env:
          ARMED: ${{ vars.LABELER_ENABLED }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${ARMED:-}" != "true" ]; then
            echo "::notice::the labeler is disarmed — set the LABELER_ENABLED repo variable to 'true' to arm it (Settings → Secrets and variables → Actions → Variables). It also needs 'enabled: true' in .github/labeler.conf; both must agree before it runs."
          else
            echo "::notice::the labeler only runs on the default branch (${DEFAULT_BRANCH}); this dispatch targeted '${REF}'. Re-dispatch from ${DEFAULT_BRANCH}."
          fi
