name: Auto design review (Jane / Drik / PM / coach)

# Fires once per review round — on PR open, ready-for-review, or a subsequent
# push that materially changes design files — and runs the reviewer personas
# (/jane-review, /drik-review), the PM triage gate (/pm, §8 of that skill) and
# the merge coach (/design-coach) as unattended Claude sessions.
#
# Division of labor (the recast reviewer scope): CI's gates check the numbers;
# Jane and Drik contribute tagged print/use-experience feedback; the design's
# PM rules on that feedback (act-now / queue / decline against the charter)
# before the next iteration acts on any of it. The reviewers are feedback,
# the PM is the gate.
#
# Reviewer-job cost envelope (measured, issue #450 — a reviewer job drifting
# materially above this is the contract regressing, so check against it before
# adding work to the reviewer skills):
#   * Jane review: ~19–25 min wall clock steady state (session 1107–1446 s,
#     31–37 turns). Drik review: ~11–16 min (session 611–826 s, 23–36 turns).
#     Measured on PRs #403 and #500 after the recast; the first two post-recast
#     rounds (#328, #341) still ran 35–42 min of Jane — transition residue
#     (in-session re-renders, provider-retry loops), not the envelope. The
#     pre-recast baseline (PR #321) was 36–50 min of Jane at 92 turns and one
#     45 min Drik round, with the reviewer apt-installing OpenSCAD/xvfb/
#     PrusaSlicer mid-session, running a duplicate 200 s `gate.sh --slice` and
#     re-rendering all five previews (Jane's #321 review documents all three).
#   * The invariant the recast (PR #322) bought: the reviewer jobs' own steps
#     are checkout/bun/claude-code-action only (plus Jane's and Drik's
#     git-only head-staging step) — nothing installs or runs the render
#     toolchain. The sessions consume CI's printcheck+slice sticky and
#     the committed previews instead of re-deriving. Regression signals: a
#     reviewer job above this envelope; `apt-get` / `openscad` / `xvfb-run` /
#     `prusa-slicer` / `scripts/gate.sh` / `scripts/render.sh` appearing in a
#     reviewer job log; a review comment claiming local renders or gate runs.
#     Caveat: claude-code-action runs the agent with its output hidden, so a
#     log grep proves the job scaffolding clean, not the session — the wall
#     time and the review comments are the behavioral evidence. Enforcement
#     is the deny backstop every ship step passes under --permission-mode
#     dontAsk (.claude/reviewer-settings.json for Jane/Drik/PM triage,
#     .claude/design-coach-settings.json for the coach; issue #451):
#     scripts/reviewer-perms-check.sh holds what they deny, and
#     tools/model-registry/tests/test_reviewer_backstop_wiring.py holds
#     every ship step here to its backstop. Cursor cloud-agent PRs initiate
#     this workflow as cursor[bot]; the pinned action defaults allowed_bots
#     empty and refuses that actor before any review runs (the error names
#     the slug `cursor`, not `cursor[bot]`). Every ship step sets
#     `allowed_bots: cursor`. Do not widen to '*' — on a public repo that
#     lets any GitHub App trigger the action. The deny backstop is unchanged.
#
# Posting surface (issue #764). A review body is rich multi-line markdown, and
# under --permission-mode dontAsk the Bash permission matcher denies any
# command whose argument carries shell structure — a table pipe or an embedded
# newline is enough, no quoting fixes it — so Jane and Drik had NO permitted
# write that could carry a review: every post attempt was denied, the agent
# ended its turn, claude-code-action still exited 0 (the #538 pattern), and no
# JANE/DRIK_SIGNOFF marker ever landed from the workflow — every sign-off on
# record was an attended local run, and reviewer-signoff (fail-closed) blocked
# every design PR. The fix is the oracle pattern: the reviewers' ONE write is
# the mcp__reviewer__post_review tool (served by .claude/reviewer-post/
# reviewer_mcp.py via --mcp-config), a JSON argument so the body may be any
# markdown. The tool assembles the sign-off marker server-side from typed
# fields (sha/verdict/fuse); REVIEWER_ID — step env, never an argument —
# selects JANE_ vs DRIK_ so a session cannot post as the other reviewer, and
# REVIEWER_PR pins the target. Exactly one post per run, counted across the
# whole chain walk via REVIEWER_POST_STATE (one shared runner.temp file: each
# link spawns a fresh server process, so an in-process counter would reset per
# link — the #549 class). Jane's and Drik's jobs check out
# pull_request.base.ref (the Oracle's trust boundary) so the MCP server,
# deny backstop and skills are never the PR's copy; design geometry is a
# trusted overlay of the head's designs/ dirs. First landing (the files
# absent on base) skips the review rather than executing a PR-controlled
# poster. Pinned by test_reviewer_backstop_wiring.py (the flags),
# test_reviewer_git_containment.py (the base checkout + head overlay),
# test_cap_state_wiring.py (the state wiring) and the server's own
# --selftest, which scripts/check.sh runs.
#
# Git containment (code-scanning finding on #760). A deny list cannot contain
# git: a subcommand option no prefix rule sees (`git fetch origin
# --upload-pack=<cmd>` runs <cmd> over the local file transport), an exec key
# in a repo config reached through a PR-committed bare-repository layout, a gh
# subcommand that spawns git. So, structurally:
#   * Jane / Drik / PM triage get NO git — their backstop denies Bash(git:*)
#     outright. Jane and Drik review the PR head's geometry from a BASE-branch
#     checkout (the posting MCP must not be PR-controlled), so a trusted step
#     fetches the head SHA (Oracle extraheader auth; persist-credentials is
#     false) and overlays the changed design directories before the agent
#     starts. PM triage reads the charter from the merge checkout and needs
#     nothing from git.
#   * The coach keeps git checkout/add/commit/push (it pushes its rounds) but
#     its backstop denies fetch/clone/pull/ls-remote and every global option;
#     its checkout is full history, so every branch head is already local.
#   * Every reviewer and coach job carries a job-level ENVIRONMENT lock that
#     holds whatever the option order: GIT_ALLOW_PROTOCOL=https (git refuses
#     the file/ext/ssh transports, so --upload-pack/--receive-pack/-u have
#     nothing local to run, while the coach's push to origin over https still
#     works) plus command-scope config via GIT_CONFIG_COUNT —
#     safe.bareRepository=explicit (no implicit discovery of a bare-repository
#     layout committed in the PR), core.fsmonitor=false, core.hooksPath=
#     /dev/null (no hooks run) and core.pager=cat. Command scope outranks any
#     repo config, and gh's own git calls inherit the lock too. An agent
#     cannot lift it: an env-prefixed command (`GIT_ALLOW_PROTOCOL=file git
#     …`) does not start with `git`, so the Bash(git:*) allow never grants it
#     under dontAsk. The lock and the staging step are pinned by
#     tools/model-registry/tests/test_reviewer_git_containment.py.
#
# Scope guard (prevents spurious runs on backend/infra-only PRs):
#   * The `design-changes` job checks whether the PR diff contains any file
#     under `designs/`. If it does not, every downstream review job is skipped.
#   * The `no-auto-review` label suppresses the whole workflow for trivial or
#     WIP PRs a human has already decided don't need it.
#
# Round deduplication:
#   * `opened` and `ready_for_review` always fire (first-round review).
#   * `synchronize` (new push) only fires when one or more design files changed
#     since the last reviewed commit; pure fixup pushes that touch only docs or
#     CI config are ignored.  The "last reviewed commit" is tracked by a sticky
#     comment the first round leaves on the PR (see `review-stamp` step).
#   * A regen commit-back opens no round when it touches only preview images
#     and .regen-stamp files AND carries `Preview-Diff: all-noise` (CI's
#     preview-diff rated every changed image noise) AND the last reviewed
#     round is current at its parent — the owner's option C on decision
#     regen-commitback-review-retrigger (issue #470) — AND the merge ref this
#     job checks out carries the same designs/ tree as the PR head (so a
#     base-branch design change is never skipped). Any content diff still
#     opens one. `scripts/reviewer-signoff.sh round` decides it, and the
#     sign-off currency below reads back past exactly those commits, so a
#     skipped round never leaves the sign-offs stale.
#   * `/design-coach` uses its own COACH-LOCK comment marker (documented in the
#     skill) to prevent a second coach session on the same PR regardless of how
#     many times this workflow fires.
#
# Safety properties mirror backlog-burn.yml:
#   * Off without any provider key — the jobs degrade to a ::notice:: log and
#     exit 0 so the PR is not blocked.
#   * The `no-auto-review` label is the human escape hatch; add it to any PR
#     that should not be auto-reviewed.
#   * AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses every reviewer job (Jane / Drik / PM / coach) with
#     one ::notice:: from the stamp job — grey, never red, no provider call,
#     no escalation. The required `reviewer-signoff` status then BLOCKS a
#     design PR that lacks two clean, current sign-offs until the cord is
#     released (push, or close-and-reopen) or `signoff-override` is applied;
#     sign-offs that already happened still pass. Orthogonal to the keys and
#     the label: it overrides a keyed, unlabeled round without touching them.
#
# Provider fallback chain (per reviewer job):
#   Z.AI GLM 5.3 → GLM 5.2 → GLM 5.1 → Anthropic Opus 4.8 → Sonnet 5 → Haiku 4.5.
#   The first provider that delivers the review wins; the rest are skipped. The
#   job fails only when every *configured* provider failed to deliver. The
#   order and model ids come from .github/models/registry.conf's `review` chain
#   (issue #206); the Anthropic tail is a chain of current public ids rather
#   than a single model (issue #298), so one unservable id cannot kill the
#   backstop.
#
# Reviewer outcome is derived from the ARTIFACT, not the exit code (issue
# #762): claude-code-action exits 0 whenever the agent ends its turn without
# an API error, so a link that posted nothing (a provider quota hit mid-run
# is one way — #757) still reports outcome 'success', which used to skip
# links 2–6 and let the stamp call the round reviewed with no review on the
# thread (PRs #755 / #756, run 37164379493). Every Jane/Drik ship step is
# followed by an artifact check (scripts/reviewer-posted.sh): did that
# reviewer's sign-off marker for the PR head sha land on the thread? The
# chain walk falls through on `served` (the check's output), the exhaustion
# gates fire when no link served, and the stamp confirms both markers before
# calling a round complete — the same disposition-by-artifact discipline as
# routine-lock-cleanup.sh (#538) for the ship routines. The PM triage and
# the design coach keep exit-code walks: no per-head completion marker is
# defined for either (the PM's PM_TRIAGE markers are per-design verdicts,
# the coach's COACH-LOCK is a dedupe lock, not a completion signal).
#
# Required secrets (at least one; the chain uses whichever are present):
#   ZAI_KEY          — Z.AI key, used via the Anthropic-compatible endpoint
#                      (https://api.z.ai/api/anthropic). Tried first.
#   ANTHROPIC_API_KEY — plain Anthropic API key (pay-per-token), the final
#                      fallback. Without either key the review sessions are
#                      skipped (graceful degradation), never fail-hard.

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

# Never run two review rounds on the same PR concurrently; if a new push lands
# while review is in flight, wait for it to finish — don't cancel.
concurrency:
  group: auto-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Scope guard: decide whether any design file changed in this PR.
  #    All downstream jobs gate on the `designs_changed` output.
  # ─────────────────────────────────────────────────────────────────────────────
  design-changes:
    name: Check for design file changes
    runs-on: ubuntu-latest
    # Honour the opt-out label before doing any work. Drafts are NOT skipped
    # (W2, the reviewer-signoff gate): the autonomy pipeline ships design PRs as
    # drafts (a human flips them ready to merge), so if reviewers skipped drafts
    # the sign-off gate could never be satisfied — and the sweetheart-hamster
    # fused hinge slipped in precisely because the reviewers never ran on the
    # draft. The is_new_round dedup still bounds cost to design-changing pushes.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-auto-review')
    outputs:
      designs_changed: ${{ steps.check.outputs.designs_changed }}
      changed_designs: ${{ steps.check.outputs.changed_designs }}
      is_new_round: ${{ steps.round.outputs.is_new_round }}
      # The reviewer fallback chain, sourced from .github/models/registry.conf
      # (issue #206) instead of hardcoded per job. Reordering or swapping a model
      # within the chain is now a registry edit; the drift-guard test
      # (tools/model-registry/tests/test_workflow_drift.py) pins these to the
      # registry so the two cannot diverge. The per-provider secret wiring stays
      # literal in each ship step below (the Actions constraint).
      model1: ${{ steps.chain.outputs.link1_model }}
      model2: ${{ steps.chain.outputs.link2_model }}
      model3: ${{ steps.chain.outputs.link3_model }}
      model4: ${{ steps.chain.outputs.link4_model }}
      model5: ${{ steps.chain.outputs.link5_model }}
      model6: ${{ steps.chain.outputs.link6_model }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Resolve the ordered model ids for the `review` chain from the committed
      # registry. Stdlib-only, so it runs straight from the checkout with no pip
      # step in front of the review pipeline; a malformed registry fails loudly
      # here (and is caught pre-merge by the model-registry tests + `check`).
      - name: Resolve the reviewer model chain (issue #206)
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          python3 -m model_registry resolve review --gh-output "$GITHUB_OUTPUT"

      - name: Detect design file changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          designs_changed=false
          changed_designs=""
          if echo "$changed" | grep -q '^designs/'; then
            designs_changed=true
            changed_designs="$(echo "$changed" | grep '^designs/' \
              | sed 's|^designs/||' | cut -d/ -f1 | sort -u | tr '\n' ' ' | sed 's/ $//')"
          fi
          echo "designs_changed=$designs_changed" >> "$GITHUB_OUTPUT"
          echo "changed_designs=$changed_designs" >> "$GITHUB_OUTPUT"
          echo "PR touches designs: $designs_changed"
          # if-block, not `[ -n ... ] && echo`: as the step's last command the
          # latter exits 1 when changed_designs is empty (no designs touched),
          # failing the scope-guard job on exactly the PRs it should pass.
          if [ -n "$changed_designs" ]; then echo "Designs: $changed_designs"; fi
          # Say why the reviewers won't run, so a design author who expected a
          # review isn't left with unexplained silence (the downstream jobs just
          # skip on designs_changed != true).
          if [ "$designs_changed" != "true" ]; then
            echo "::notice::auto-review did not run — this PR changes no files under designs/, so the design reviewers (Jane / Drik / PM / coach) have nothing to review."
          fi

      # For `synchronize` events we only want to fire a new review round when
      # design files actually changed since the last round, not on every push.
      # We track rounds with a sticky comment whose body starts with
      # AUTO_REVIEW_STAMP followed by the last-reviewed HEAD SHA.  If that SHA
      # matches HEAD we skip the round (already reviewed this commit).
      # Split in two so repo code never runs beside a token: this step holds
      # GH_TOKEN and only reads the stamp comment through gh; the next step,
      # which runs scripts/reviewer-signoff.sh from the checkout, holds none.
      - name: Read the last review stamp
        id: stamp
        if: steps.check.outputs.designs_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Find the stamp comment and extract the stamped SHA (40 hex or
          # nothing — the grep is the only thing that reaches the output).
          stamp_sha="$(gh api \
            "/repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- AUTO_REVIEW_STAMP"))] | last | .body' \
            2>/dev/null \
            | grep -oP '(?<=sha=)[0-9a-f]{40}' || true)"
          echo "sha=$stamp_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether this is a new round
        id: round
        if: steps.check.outputs.designs_changed == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LAST_REVIEWED: ${{ steps.stamp.outputs.sha }}
          SIGNOFF_TRUST_REGEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}
        run: |
          set -euo pipefail
          # opened / ready_for_review / reopened → always a new round
          if [[ "$ACTION" =~ ^(opened|ready_for_review|reopened)$ ]]; then
            echo "is_new_round=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # synchronize → new round only when design files changed since the
          # last stamp (read, token-side, by the step above).
          stamp_sha="$LAST_REVIEWED"
          if ! [[ "$stamp_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "is_new_round=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The stamped commit can be unreachable in this checkout — a rebase,
          # squash or force-push orphans it (a shallow fetch can also lack it).
          # `git diff <missing>..HEAD` then errors, and because it runs inside
          # the `if` below, that non-zero status falls through to
          # is_new_round=false — silently SKIPPING review exactly when the design
          # was rewritten. Treat an unreachable stamp like a missing one (above)
          # and review, matching reviewer-signoff.sh, which also fails safe (a
          # sign-off whose sha it cannot resolve is counted stale, not current).
          if ! git cat-file -e "${stamp_sha}^{commit}" 2>/dev/null; then
            echo "is_new_round=true" >> "$GITHUB_OUTPUT"
            echo "::notice::last review stamp ${stamp_sha} is unreachable (history rewritten) — treating as a new round"
            exit 0
          fi
          # Compare design files between stamp_sha and HEAD
          if git diff --name-only "${stamp_sha}..HEAD" | grep -q '^designs/'; then
            # Designs moved — unless every move since the stamp is a regen
            # commit-back the owner ruled needs no new round (issue #470,
            # decision regen-commitback-review-retrigger, option C): previews
            # and .regen-stamp only, `Preview-Diff: all-noise`, and the stamp
            # current at its parent. The rule and its selftest live in
            # reviewer-signoff.sh, beside the currency key the sign-off status
            # computes, so the two cannot disagree. `--merge HEAD` makes it
            # refuse to skip when this merge-ref checkout carries a designs/
            # tree the PR head does not (a base-branch design change). Any
            # non-zero exit (ROUND, or an error) opens the round: fail-closed.
            if guard="$(scripts/reviewer-signoff.sh round --head "$HEAD_SHA" --stamp "$stamp_sha" --merge HEAD)"; then
              echo "is_new_round=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${guard#SKIP }"
            else
              echo "is_new_round=true" >> "$GITHUB_OUTPUT"
              echo "regen review guard: ${guard:-no verdict}"
            fi
          else
            echo "is_new_round=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no design files changed since last review round — skipping"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Jane review (printability)
  # ─────────────────────────────────────────────────────────────────────────────
  jane-review:
    name: Jane review (printability)
    needs: design-changes
    if: >-
      needs.design-changes.outputs.designs_changed == 'true'
      && needs.design-changes.outputs.is_new_round == 'true'
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Provider fallback chain, sourced from .github/models/registry.conf's
    # `review` chain (issue #206). The order + model ids arrive as the
    # design-changes job's model1..model6 outputs — swapping or reordering a
    # model within a provider is a registry edit, not a change here. Each ship
    # step keeps its provider's secret wiring LITERAL (the Actions constraint),
    # so the slot→provider shape (slots 1–3 Z.AI, slots 4–6 Anthropic) is pinned
    # to the registry by the drift-guard test; changing that shape needs both.
    # Slot → provider shape (the model ids themselves come from the `review`
    # chain in .github/models/registry.conf — not repeated here, so a model swap
    # is a registry edit and this comment never goes stale):
    #   * model1..model3  Z.AI GLM  (secrets.ZAI_KEY, Anthropic-compatible endpoint)
    #   * model4..model6  Anthropic (secrets.ANTHROPIC_API_KEY; the Anthropic tail
    #                     is a chain of ids, issue #298, so one unservable id
    #                     can't kill the backstop)
    # Each attempt is continue-on-error and gated on the previous links NOT
    # having DELIVERED the review — the artifact check after each link (issue
    # #762, below), not the step's exit code — so the first link that lands
    # Jane's sign-off marker for this head short-circuits the rest. The
    # exhaustion gates fire when no link delivered. With neither key set the
    # job degrades to a notice (exit 0) — a missing secret never blocks a PR,
    # same as before.
    env:
      HAS_ZAI: ${{ secrets.ZAI_KEY != '' }}
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Git environment lock (code-scanning finding on #760; see the header).
      # Job-level so every step inherits it — every chain link of every
      # provider, and any link added later. Pinned per ship step by
      # tools/model-registry/tests/test_reviewer_git_containment.py.
      GIT_ALLOW_PROTOCOL: https
      GIT_CONFIG_COUNT: "4"
      GIT_CONFIG_KEY_0: safe.bareRepository
      GIT_CONFIG_VALUE_0: explicit
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_KEY_2: core.hooksPath
      GIT_CONFIG_VALUE_2: /dev/null
      GIT_CONFIG_KEY_3: core.pager
      GIT_CONFIG_VALUE_3: cat
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The BASE branch, not the merge ref: the secret-bearing agent runs
          # the reviewed posting MCP / settings / skills, never a PR's copy
          # (Oracle's trust boundary). Design geometry arrives as a trusted
          # overlay below.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Check the reviewer posting surface is on the base branch
        id: ready
        run: |
          set -euo pipefail
          if [ -f .claude/reviewer-post/reviewer_mcp.py ] \
             && [ -f .claude/reviewer-post/reviewer-mcp.json ] \
             && [ -f .claude/reviewer-settings.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the Jane/Drik posting surface is not on the base branch yet (first landing) — skipping the review rather than running a PR-controlled copy"
          fi

      # Trusted head staging (code-scanning finding on #760). This reviewer
      # runs with NO git — .claude/reviewer-settings.json denies Bash(git:*)
      # outright — so the PR head's design directories are staged into the
      # BASE checkout here, by workflow code, before any agent step starts;
      # the skill reads them with Read/Grep/Glob. The design names come from
      # the PR's own paths, so they are validated and never globbed before
      # they reach a path, and never echoed back unvalidated.
      - name: Stage the PR head's design directories (trusted, no agent)
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_DESIGNS: ${{ needs.design-changes.outputs.changed_designs }}
        run: |
          set -euo pipefail
          set -f   # PR-controlled names: no globbing
          # persist-credentials: false on the BASE branch, so HEAD is not
          # local. Authenticate this one fetch with the job token (Oracle's
          # pattern) so staging works on a private repo too.
          FETCH_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${FETCH_AUTH}"
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${FETCH_AUTH}" \
            fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}"
          for d in $CHANGED_DESIGNS; do
            if ! [[ "$d" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::warning::skipped a changed design directory whose name is not [A-Za-z0-9._-]"
              continue
            fi
            rm -rf -- "designs/${d}"
            if git cat-file -e "${HEAD_SHA}:designs/${d}" 2>/dev/null; then
              git checkout "$HEAD_SHA" -- "designs/${d}"
              echo "staged designs/${d} at ${HEAD_SHA}"
            else
              echo "designs/${d} is removed at the PR head; left absent"
            fi
          done

      - name: /jane-review via Z.AI GLM (chain link 1)
        id: p1
        if: steps.ready.outputs.ready == 'true' && env.HAS_ZAI == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
