          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
          && steps.p6.outcome != 'success'
