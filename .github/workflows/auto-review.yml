  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Drik review (fitness-for-purpose / customer)
  # ─────────────────────────────────────────────────────────────────────────────
  drik-review:
    name: Drik review (fitness for purpose)
    needs: design-changes
    if: >-
      needs.design-changes.outputs.designs_changed == 'true'
      && needs.design-changes.outputs.is_new_round == 'true'
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Provider fallback chain — see the jane-review job for the rationale and
    # ordering (Z.AI glm-5.3 → glm-5.2 → glm-5.1 → Anthropic claude-opus-4-8 →
    # claude-sonnet-5 → claude-haiku-4-5; the first link that DELIVERS the
    # review wins — the artifact check after each link, issue #762, not the
    # step's exit code; a missing key degrades gracefully). Issues #206, #298.
    env:
      HAS_ZAI: ${{ secrets.ZAI_KEY != '' }}
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Git environment lock (code-scanning finding on #760; see the header).
      # Job-level so every step inherits it — every chain link of every
      # provider, and any link added later. Pinned per ship step by
      # tools/model-registry/tests/test_reviewer_git_containment.py.
      GIT_ALLOW_PROTOCOL: https
      GIT_CONFIG_COUNT: "4"
      GIT_CONFIG_KEY_0: safe.bareRepository
      GIT_CONFIG_VALUE_0: explicit
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_KEY_2: core.hooksPath
      GIT_CONFIG_VALUE_2: /dev/null
      GIT_CONFIG_KEY_3: core.pager
      GIT_CONFIG_VALUE_3: cat
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The BASE branch, not the merge ref: the secret-bearing agent runs
          # the reviewed posting MCP / settings / skills, never a PR's copy
          # (Oracle's trust boundary). Design geometry arrives as a trusted
          # overlay below.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Check the reviewer posting surface is on the base branch
        id: ready
        run: |
          set -euo pipefail
          if [ -f .claude/reviewer-post/reviewer_mcp.py ] \
             && [ -f .claude/reviewer-post/reviewer-mcp.json ] \
             && [ -f .claude/reviewer-settings.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the Jane/Drik posting surface is not on the base branch yet (first landing) — skipping the review rather than running a PR-controlled copy"
          fi

      # Trusted head staging (code-scanning finding on #760). This reviewer
      # runs with NO git — .claude/reviewer-settings.json denies Bash(git:*)
      # outright — so the PR head's design directories are staged into the
      # BASE checkout here, by workflow code, before any agent step starts;
      # the skill reads them with Read/Grep/Glob. The design names come from
      # the PR's own paths, so they are validated and never globbed before
      # they reach a path, and never echoed back unvalidated.
      - name: Stage the PR head's design directories (trusted, no agent)
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_DESIGNS: ${{ needs.design-changes.outputs.changed_designs }}
        run: |
          set -euo pipefail
          set -f   # PR-controlled names: no globbing
          # persist-credentials: false on the BASE branch, so HEAD is not
          # local. Authenticate this one fetch with the job token (Oracle's
          # pattern) so staging works on a private repo too.
          FETCH_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${FETCH_AUTH}"
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${FETCH_AUTH}" \
            fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}"
          for d in $CHANGED_DESIGNS; do
            if ! [[ "$d" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::warning::skipped a changed design directory whose name is not [A-Za-z0-9._-]"
              continue
            fi
            rm -rf -- "designs/${d}"
            if git cat-file -e "${HEAD_SHA}:designs/${d}" 2>/dev/null; then
              git checkout "$HEAD_SHA" -- "designs/${d}"
              echo "staged designs/${d} at ${HEAD_SHA}"
            else
              echo "designs/${d} is removed at the PR head; left absent"
            fi
          done

      - name: /drik-review via Z.AI GLM (chain link 1)
