  #    findings AND the PM's verdict on them into the round it drives.
  #    Fires only on opened/ready_for_review — subsequent rounds are driven by
  #    the coach's own COACH-LOCK loop inside the skill.
  # ─────────────────────────────────────────────────────────────────────────────
  design-coach:
    name: Design coach
    needs: [design-changes, jane-review, drik-review, pm-triage]
    # Explicit condition, not the implicit success()-over-needs: pm-triage is
    # in `needs` for ORDERING only (the PM verdict should be on the thread when
    # the coach starts), but a failed triage must not cost the PR its coach —
    # the coach only ever fires on these three actions, so a skip here is
    # unrecoverable (retry rounds arrive as `synchronize`, which this guard
    # excludes, and the COACH-LOCK loop lives inside the session that would
    # never have started). Both reviewers must still have succeeded, as the
    # implicit success() required before pm-triage joined the needs.
    if: >-
      always()
      && needs.design-changes.outputs.designs_changed == 'true'
      && needs.jane-review.result == 'success'
      && needs.drik-review.result == 'success'
      && needs.pm-triage.result != 'cancelled'
