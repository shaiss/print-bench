          && env.HAS_ANTHROPIC == 'true'
          && steps.v1.outputs.served != 'true'
          && steps.v2.outputs.served != 'true'
          && steps.v3.outputs.served != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWER_ID: drik
          REVIEWER_PR: ${{ github.event.pull_request.number }}
          REVIEWER_POST_STATE: ${{ runner.temp }}/reviewer-posts
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --mcp-config .claude/reviewer-post/reviewer-mcp.json --allowedTools "mcp__reviewer__post_review,Read,Grep,Glob" --model ${{ needs.design-changes.outputs.model4 }}
          prompt: >-
            /drik-review ${{ github.event.pull_request.number }}

      - name: Artifact check after link 4 (did Drik's review land?)
        id: v4
        if: steps.p4.outcome == 'success' || steps.p4.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          served="$(scripts/reviewer-posted.sh check \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" --reviewer drik)"
          echo "link 4 artifact: served=$served"

      - name: /drik-review via Anthropic (chain link 5)
        id: p5
        if: >-
          steps.ready.outputs.ready == 'true'
          && env.HAS_ANTHROPIC == 'true'
          && steps.v1.outputs.served != 'true'
          && steps.v2.outputs.served != 'true'
          && steps.v3.outputs.served != 'true'
          && steps.v4.outputs.served != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWER_ID: drik
          REVIEWER_PR: ${{ github.event.pull_request.number }}
          REVIEWER_POST_STATE: ${{ runner.temp }}/reviewer-posts
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --mcp-config .claude/reviewer-post/reviewer-mcp.json --allowedTools "mcp__reviewer__post_review,Read,Grep,Glob" --model ${{ needs.design-changes.outputs.model5 }}
          prompt: >-
            /drik-review ${{ github.event.pull_request.number }}

      - name: Artifact check after link 5 (did Drik's review land?)
        id: v5
        if: steps.p5.outcome == 'success' || steps.p5.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          served="$(scripts/reviewer-posted.sh check \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" --reviewer drik)"
          echo "link 5 artifact: served=$served"

      - name: /drik-review via Anthropic (chain link 6)
        id: p6
        if: >-
          steps.ready.outputs.ready == 'true'
          && env.HAS_ANTHROPIC == 'true'
          && steps.v1.outputs.served != 'true'
          && steps.v2.outputs.served != 'true'
          && steps.v3.outputs.served != 'true'
          && steps.v4.outputs.served != 'true'
          && steps.v5.outputs.served != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWER_ID: drik
          REVIEWER_PR: ${{ github.event.pull_request.number }}
          REVIEWER_POST_STATE: ${{ runner.temp }}/reviewer-posts
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --mcp-config .claude/reviewer-post/reviewer-mcp.json --allowedTools "mcp__reviewer__post_review,Read,Grep,Glob" --model ${{ needs.design-changes.outputs.model6 }}
          prompt: >-
            /drik-review ${{ github.event.pull_request.number }}

      - name: Artifact check after link 6 (did Drik's review land?)
        id: v6
        if: steps.p6.outcome == 'success' || steps.p6.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          served="$(scripts/reviewer-posted.sh check \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" --reviewer drik)"
          echo "link 6 artifact: served=$served"

      - name: No provider key configured
        if: steps.ready.outputs.ready == 'true' && env.HAS_ZAI != 'true' && env.HAS_ANTHROPIC != 'true'
        run: |
          echo "::notice::Neither ZAI_KEY nor ANTHROPIC_API_KEY is set — skipping /drik-review for PR #${{ github.event.pull_request.number }}"

      # Classify-only (escalate: 'false'): the Jane review job carries the single
      # escalation for the shared review chain, so a parallel exhaustion here does
      # not double-file. The cause still drives this job's own failure message.
      # Fires when no link DELIVERED (artifact checks, issue #762) — same as Jane.
      - name: Diagnose the exhausted reviewer chain
        id: triage
        if: >-
          steps.ready.outputs.ready == 'true'
          && (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.v1.outputs.served != 'true'
          && steps.v2.outputs.served != 'true'
          && steps.v3.outputs.served != 'true'
          && steps.v4.outputs.served != 'true'
          && steps.v5.outputs.served != 'true'
          && steps.v6.outputs.served != 'true'
        uses: ./.github/actions/provider-triage
        with:
          chain: review
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the design-review chain (Jane / Drik / PM / coach)
          escalate: "false"

      - name: No chain link delivered the review
        if: >-
          steps.ready.outputs.ready == 'true'
          && (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.v1.outputs.served != 'true'
          && steps.v2.outputs.served != 'true'
          && steps.v3.outputs.served != 'true'
          && steps.v4.outputs.served != 'true'
          && steps.v5.outputs.served != 'true'
          && steps.v6.outputs.served != 'true'
        env:
          CLASS: ${{ steps.triage.outputs.class }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          case "$CLASS" in
            needs-human)
              echo "::error::/drik-review delivered no review — the review chain is unusable, cause '${REASON}' (out of credit / out of tokens / bad key). The Jane review job escalates this chain to a human (needs-decision). NOT a defect in this PR." ;;
            dead)
              echo "::error::/drik-review delivered no review — the review chain names a model id the key cannot serve (reason '${REASON}'): a registry defect (#298). Fix .github/models/registry.conf." ;;
            servable)
              echo "::error::/drik-review delivered no review — every provider link answered a live probe, so the chain is healthy; the review agent itself ended without posting Drik's sign-off marker (issue #762 — an exit-0 run that posts nothing). Inspect the link step logs above; a fresh push starts a new round." ;;
            *)
              echo "::error::/drik-review delivered no review — the review chain failed on every provider for a retryable reason ('${REASON:-unknown}': rate limit / outage); it retries on the next review round. See the failed step logs above." ;;
          esac
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. PM triage (the gate on reviewer feedback)
  #    Runs after Jane and Drik so the design's PM can rule on their tagged
  #    findings — act-now for this round, queue to the backlog, or decline with
  #    the charter line / CI evidence — before the next iteration acts on any
  #    of them. The reviewers provide feedback; the PM is the gate. Unlike the
  #    coach it runs on EVERY round: each new push's feedback gets a fresh
  #    verdict. The job is read-only on the repo (comments only, no pushes) —
  #    the /pm skill's §8 records any needed charter edit in the verdict
  #    comment for the next design session to commit.
  # ─────────────────────────────────────────────────────────────────────────────
  pm-triage:
    name: PM triage (reviewer-feedback gate)
    needs: [design-changes, jane-review, drik-review]
    # always(): triage what DID land — a failed Drik job must not cancel the
    # verdict on Jane's posted feedback (the stamp still marks such a round
    # incomplete, so it retries on the next design push). Skip only when
    # neither reviewer completed: then there is nothing to triage.
    if: >-
      always()
      && needs.design-changes.outputs.designs_changed == 'true'
      && needs.design-changes.outputs.is_new_round == 'true'
      && (needs.jane-review.result == 'success' || needs.drik-review.result == 'success')
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Provider fallback chain — see the jane-review job for the rationale and
    # ordering (Z.AI glm-5.3 → glm-5.2 → glm-5.1 → Anthropic claude-opus-4-8 →
    # claude-sonnet-5 → claude-haiku-4-5; first success wins; a missing key
    # degrades gracefully). Issues #206, #298. The PM shares the `review`
    # chain deliberately: the registry is where a future decision to give the
    # enforcement PM a frontier-first chain of its own belongs.
    #
    # NOTE (issue #762): this job KEEPS the exit-code walk the Jane/Drik jobs
    # dropped. Their artifact check keys on one per-head sign-off marker; the
    # PM's PM_TRIAGE markers are per-DESIGN verdicts (one per changed design,
    # so "all of them" is a count against a list, not one marker to find), and
    # no per-head completion marker is defined for this job.
    env:
      HAS_ZAI: ${{ secrets.ZAI_KEY != '' }}
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Git environment lock (code-scanning finding on #760; see the header).
      # Job-level so every step inherits it — every chain link of every
      # provider, and any link added later. Pinned per ship step by
      # tools/model-registry/tests/test_reviewer_git_containment.py.
      GIT_ALLOW_PROTOCOL: https
      GIT_CONFIG_COUNT: "4"
      GIT_CONFIG_KEY_0: safe.bareRepository
      GIT_CONFIG_VALUE_0: explicit
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_KEY_2: core.hooksPath
      GIT_CONFIG_VALUE_2: /dev/null
      GIT_CONFIG_KEY_3: core.pager
      GIT_CONFIG_VALUE_3: cat
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: /pm triage via Z.AI GLM (chain link 1)
        id: p1
        if: env.HAS_ZAI == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --model ${{ needs.design-changes.outputs.model1 }}
          prompt: >-
            /pm ${{ needs.design-changes.outputs.changed_designs }} —
            reviewer-feedback triage (skill §8) for PR
            #${{ github.event.pull_request.number }}: Jane and Drik have posted
            their tagged feedback on this PR. For each design named above
            (space-separated), load its charter per §0, triage every tagged
            finding per §8, and post one PM verdict comment per design on the
            PR. This job is read-only on repository content: post comments,
            and — only when §8 routes a blocking binary fork through the §7
            HITL gate — add the needs-decision label; never push or edit
            repository content.

      - name: /pm triage via Z.AI GLM (chain link 2)
        id: p2
        if: env.HAS_ZAI == 'true' && steps.p1.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --model ${{ needs.design-changes.outputs.model2 }}
          prompt: >-
            /pm ${{ needs.design-changes.outputs.changed_designs }} —
            reviewer-feedback triage (skill §8) for PR
            #${{ github.event.pull_request.number }}: Jane and Drik have posted
            their tagged feedback on this PR. For each design named above
            (space-separated), load its charter per §0, triage every tagged
            finding per §8, and post one PM verdict comment per design on the
            PR. This job is read-only on repository content: post comments,
            and — only when §8 routes a blocking binary fork through the §7
            HITL gate — add the needs-decision label; never push or edit
            repository content.

      - name: /pm triage via Z.AI GLM (chain link 3)
        id: p3
        if: env.HAS_ZAI == 'true' && steps.p1.outcome != 'success' && steps.p2.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --model ${{ needs.design-changes.outputs.model3 }}
          prompt: >-
            /pm ${{ needs.design-changes.outputs.changed_designs }} —
            reviewer-feedback triage (skill §8) for PR
            #${{ github.event.pull_request.number }}: Jane and Drik have posted
            their tagged feedback on this PR. For each design named above
            (space-separated), load its charter per §0, triage every tagged
            finding per §8, and post one PM verdict comment per design on the
            PR. This job is read-only on repository content: post comments,
            and — only when §8 routes a blocking binary fork through the §7
            HITL gate — add the needs-decision label; never push or edit
            repository content.

      - name: /pm triage via Anthropic (chain link 4)
        id: p4
        if: >-
          env.HAS_ANTHROPIC == 'true'
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --model ${{ needs.design-changes.outputs.model4 }}
          prompt: >-
            /pm ${{ needs.design-changes.outputs.changed_designs }} —
            reviewer-feedback triage (skill §8) for PR
            #${{ github.event.pull_request.number }}: Jane and Drik have posted
            their tagged feedback on this PR. For each design named above
            (space-separated), load its charter per §0, triage every tagged
            finding per §8, and post one PM verdict comment per design on the
            PR. This job is read-only on repository content: post comments,
            and — only when §8 routes a blocking binary fork through the §7
            HITL gate — add the needs-decision label; never push or edit
            repository content.

      - name: /pm triage via Anthropic (chain link 5)
        id: p5
        if: >-
          env.HAS_ANTHROPIC == 'true'
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --model ${{ needs.design-changes.outputs.model5 }}
          prompt: >-
            /pm ${{ needs.design-changes.outputs.changed_designs }} —
            reviewer-feedback triage (skill §8) for PR
            #${{ github.event.pull_request.number }}: Jane and Drik have posted
            their tagged feedback on this PR. For each design named above
            (space-separated), load its charter per §0, triage every tagged
            finding per §8, and post one PM verdict comment per design on the
            PR. This job is read-only on repository content: post comments,
            and — only when §8 routes a blocking binary fork through the §7
            HITL gate — add the needs-decision label; never push or edit
            repository content.

      - name: /pm triage via Anthropic (chain link 6)
        id: p6
        if: >-
          env.HAS_ANTHROPIC == 'true'
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/reviewer-settings.json --model ${{ needs.design-changes.outputs.model6 }}
          prompt: >-
            /pm ${{ needs.design-changes.outputs.changed_designs }} —
            reviewer-feedback triage (skill §8) for PR
            #${{ github.event.pull_request.number }}: Jane and Drik have posted
            their tagged feedback on this PR. For each design named above
            (space-separated), load its charter per §0, triage every tagged
            finding per §8, and post one PM verdict comment per design on the
            PR. This job is read-only on repository content: post comments,
            and — only when §8 routes a blocking binary fork through the §7
            HITL gate — add the needs-decision label; never push or edit
            repository content.

      - name: No provider key configured
        if: env.HAS_ZAI != 'true' && env.HAS_ANTHROPIC != 'true'
        run: |
          echo "::notice::Neither ZAI_KEY nor ANTHROPIC_API_KEY is set — skipping the PM triage for PR #${{ github.event.pull_request.number }}"

      # Classify-only (escalate: 'false'): the Jane review job owns the single
      # escalation for the shared review chain; this reuses the cause for its
      # own message.
      - name: Diagnose the exhausted reviewer chain
        id: triage
        if: >-
          (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
          && steps.p6.outcome != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: review
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the design-review chain (Jane / Drik / PM / coach)
          escalate: "false"

      - name: Every configured provider failed
        if: >-
          (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
          && steps.p6.outcome != 'success'
        env:
          CLASS: ${{ steps.triage.outputs.class }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          case "$CLASS" in
            needs-human)
              echo "::error::the PM triage could not run — the review chain is unusable, cause '${REASON}' (out of credit / out of tokens / bad key). The Jane review job escalates this chain to a human (needs-decision). NOT a defect in this PR." ;;
            dead)
              echo "::error::the PM triage could not run — the review chain names a model id the key cannot serve (reason '${REASON}'): a registry defect (#298). Fix .github/models/registry.conf." ;;
            servable)
              echo "::error::the PM triage could not run — every provider link answered a live probe, so the chain is healthy; the failure was in the review agent step itself (not the provider). Inspect the failed step logs above." ;;
            *)
              echo "::error::the PM triage could not run — the review chain failed on every provider for a retryable reason ('${REASON:-unknown}': rate limit / outage); it retries on the next review round. See the failed step logs above." ;;
          esac
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Design coach (drives review rounds until merge)
  #    Runs after Jane, Drik and the PM triage so it can synthesise the tagged
  #    findings AND the PM's verdict on them into the round it drives.
  #    Fires only on opened/ready_for_review — subsequent rounds are driven by
  #    the coach's own COACH-LOCK loop inside the skill.
  # ─────────────────────────────────────────────────────────────────────────────
  design-coach:
    name: Design coach
    needs: [design-changes, jane-review, drik-review, pm-triage]
    # Explicit condition, not the implicit success()-over-needs: pm-triage is
    # in `needs` for ORDERING only (the PM verdict should be on the thread when
    # the coach starts), but a failed triage must not cost the PR its coach —
    # the coach only ever fires on these three actions, so a skip here is
    # unrecoverable (retry rounds arrive as `synchronize`, which this guard
    # excludes, and the COACH-LOCK loop lives inside the session that would
    # never have started). Both reviewers must still have succeeded, as the
    # implicit success() required before pm-triage joined the needs.
    if: >-
      always()
      && needs.design-changes.outputs.designs_changed == 'true'
      && needs.jane-review.result == 'success'
      && needs.drik-review.result == 'success'
      && needs.pm-triage.result != 'cancelled'
      && vars.AI_ANDON_CORD != 'pulled'
      && (github.event.action == 'opened'
          || github.event.action == 'ready_for_review'
          || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    # Provider fallback chain — see the jane-review job for the rationale and
    # ordering (Z.AI glm-5.3 → glm-5.2 → glm-5.1 → Anthropic claude-opus-4-8 →
    # claude-sonnet-5 → claude-haiku-4-5; first success wins; a missing key
    # degrades gracefully). Issues #206, #298.
    #
    # NOTE (issue #762): this job KEEPS the exit-code walk the Jane/Drik jobs
    # dropped — the coach's only thread marker is COACH-LOCK, a dedupe lock
    # saying "a coach session exists", not a per-head completion signal, so
    # there is no artifact for a check to key on.
    env:
      HAS_ZAI: ${{ secrets.ZAI_KEY != '' }}
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Git environment lock (code-scanning finding on #760; see the header).
      # Job-level so every step inherits it — every chain link of every
      # provider, and any link added later. Pinned per ship step by
      # tools/model-registry/tests/test_reviewer_git_containment.py.
      GIT_ALLOW_PROTOCOL: https
      GIT_CONFIG_COUNT: "4"
      GIT_CONFIG_KEY_0: safe.bareRepository
      GIT_CONFIG_VALUE_0: explicit
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_KEY_2: core.hooksPath
      GIT_CONFIG_VALUE_2: /dev/null
      GIT_CONFIG_KEY_3: core.pager
      GIT_CONFIG_VALUE_3: cat
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: every branch head (the PR's included) is local, so
          # the coach loads and pushes its rounds without `git fetch`/`pull`,
          # which its backstop denies (code-scanning finding on #760).
          fetch-depth: 0

      - name: /design-coach via Z.AI GLM (chain link 1)
        id: p1
        if: env.HAS_ZAI == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/design-coach-settings.json --model ${{ needs.design-changes.outputs.model1 }}
          prompt: >-
            /design-coach ${{ github.event.pull_request.number }}

      - name: /design-coach via Z.AI GLM (chain link 2)
        id: p2
        if: env.HAS_ZAI == 'true' && steps.p1.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/design-coach-settings.json --model ${{ needs.design-changes.outputs.model2 }}
          prompt: >-
            /design-coach ${{ github.event.pull_request.number }}

      - name: /design-coach via Z.AI GLM (chain link 3)
        id: p3
        if: env.HAS_ZAI == 'true' && steps.p1.outcome != 'success' && steps.p2.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/design-coach-settings.json --model ${{ needs.design-changes.outputs.model3 }}
          prompt: >-
            /design-coach ${{ github.event.pull_request.number }}

      - name: /design-coach via Anthropic (chain link 4)
        id: p4
        if: >-
          env.HAS_ANTHROPIC == 'true'
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/design-coach-settings.json --model ${{ needs.design-changes.outputs.model4 }}
          prompt: >-
            /design-coach ${{ github.event.pull_request.number }}

      - name: /design-coach via Anthropic (chain link 5)
        id: p5
        if: >-
          env.HAS_ANTHROPIC == 'true'
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/design-coach-settings.json --model ${{ needs.design-changes.outputs.model5 }}
          prompt: >-
            /design-coach ${{ github.event.pull_request.number }}

      - name: /design-coach via Anthropic (chain link 6)
        id: p6
        if: >-
          env.HAS_ANTHROPIC == 'true'
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: cursor
          claude_args: --permission-mode dontAsk --settings .claude/design-coach-settings.json --model ${{ needs.design-changes.outputs.model6 }}
          prompt: >-
            /design-coach ${{ github.event.pull_request.number }}

      - name: No provider key configured
        if: env.HAS_ZAI != 'true' && env.HAS_ANTHROPIC != 'true'
        run: |
          echo "::notice::Neither ZAI_KEY nor ANTHROPIC_API_KEY is set — skipping /design-coach for PR #${{ github.event.pull_request.number }}"

      # Classify-only (escalate: 'false'): the Jane review job owns the single
      # escalation for the shared review chain; this reuses the cause for its
      # own message.
      - name: Diagnose the exhausted reviewer chain
        id: triage
        if: >-
          (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
          && steps.p6.outcome != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: review
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the design-review chain (Jane / Drik / PM / coach)
          escalate: "false"

      - name: Every configured provider failed
        if: >-
          (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.p1.outcome != 'success'
          && steps.p2.outcome != 'success'
          && steps.p3.outcome != 'success'
          && steps.p4.outcome != 'success'
          && steps.p5.outcome != 'success'
          && steps.p6.outcome != 'success'
        env:
          CLASS: ${{ steps.triage.outputs.class }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          case "$CLASS" in
            needs-human)
              echo "::error::/design-coach could not run — the review chain is unusable, cause '${REASON}' (out of credit / out of tokens / bad key). The Jane review job escalates this chain to a human (needs-decision). NOT a defect in this PR." ;;
            dead)
              echo "::error::/design-coach could not run — the review chain names a model id the key cannot serve (reason '${REASON}'): a registry defect (#298). Fix .github/models/registry.conf." ;;
            servable)
              echo "::error::/design-coach could not run — every provider link answered a live probe, so the chain is healthy; the failure was in the review agent step itself (not the provider). Inspect the failed step logs above." ;;
            *)
              echo "::error::/design-coach could not run — the review chain failed on every provider for a retryable reason ('${REASON:-unknown}': rate limit / outage); it retries on the next review round. See the failed step logs above." ;;
          esac
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Stamp this review round so future synchronize events can tell
  #    whether any design files changed since we last reviewed.
  # ─────────────────────────────────────────────────────────────────────────────
  review-stamp:
    name: Stamp review round
    needs: [design-changes, jane-review, drik-review, pm-triage, design-coach]
    # Run whenever we did a new round (design-coach is conditional so use
    # always() + check the designs_changed output ourselves).
    if: >-
      always()
      && needs.design-changes.outputs.designs_changed == 'true'
      && needs.design-changes.outputs.is_new_round == 'true'
    runs-on: ubuntu-latest
    steps:
      # The merge-ref checkout the artifact confirmation below runs from — the
      # same one-version-one-rule discipline as the signoff-status job: the
      # stamp and the reviewer jobs read markers through the same copy of
      # scripts/reviewer-posted.sh that round's links were checked with.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Post / update stamp comment
        # Outcome-aware: only mark a commit "reviewed" (and advance the stamped
        # SHA the round logic dedupes on) when a review ACTUALLY ran and none
        # failed. Without the secret the reviewer jobs "succeed" by only echoing
        # a notice, and a failed reviewer must not be recorded as reviewed —
        # advancing the SHA in either case silently strands the PR from
        # re-review. The non-reviewed cases post an honest comment WITHOUT a
        # `sha=` marker, so the round logic (which greps for a 40-hex sha) treats
        # the next push as a fresh round. The AI andon cord (docs/andon-cord.md)
        # is the same shape as the keyless case, checked first: with the cord
        # pulled every reviewer job was skipped at job level, so the stamp says
        # so honestly (not "incomplete"), emits the workflow's one ::notice::
        # for the cord, and leaves the sha off so the round retries once the
        # cord is released. ANDON_PULLED is computed in the expression layer so
        # GitHub's case-insensitive string compare stays authoritative.
        #
        # ARTIFACT-CONFIRMED (issue #762): even the all-green branch must not
        # trust the job results alone. claude-code-action exits 0 whenever the
        # agent ends its turn without an API error — on PRs #755/#756 every
        # reviewer job reported success and this stamp called the round
        # complete while neither reviewer had posted. So green jobs get their
        # evidence checked: both sign-off markers for THIS head sha must be on
        # the thread (scripts/reviewer-posted.sh) before the sha advances. A
        # green job with no marker is stamped incomplete — the round retries,
        # and the fail-closed reviewer-signoff status still blocks the merge.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DESIGNS: ${{ needs.design-changes.outputs.changed_designs }}
          HAS_SECRET: ${{ (secrets.ZAI_KEY != '' || secrets.ANTHROPIC_API_KEY != '') && 'true' || 'false' }}
          ANDON_PULLED: ${{ vars.AI_ANDON_CORD == 'pulled' }}
          JANE: ${{ needs.jane-review.result }}
          DRIK: ${{ needs.drik-review.result }}
          PM: ${{ needs.pm-triage.result }}
          COACH: ${{ needs.design-coach.result }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:8}"
          gen='_Generated by [Claude Code](https://claude.ai/code)_'
          # A reviewer result of 'success' means it ran clean; coach is allowed
          # to be 'skipped' (it only runs on opened/ready_for_review/reopened).
          # Anything else — failure, CANCELLED, or an unexpected state — is not a
          # completed review and must not advance the reviewed-SHA (Qodo review
          # on #165: a 'cancelled' round was falling into the success path).
          # The PM triage gets the same allowance as the coach: 'skipped' only
          # happens when neither reviewer completed (its own if-guard), and that
          # case is already caught below by JANE/DRIK not both being 'success' —
          # while a FAILED triage must not advance the SHA either, because a
          # round whose feedback carries no PM verdict is not a complete round.
          coach_ok=false
          if [ "$COACH" = "success" ] || [ "$COACH" = "skipped" ]; then coach_ok=true; fi
          pm_ok=false
          if [ "$PM" = "success" ] || [ "$PM" = "skipped" ]; then pm_ok=true; fi
          if [ "${ANDON_PULLED:-}" = "true" ]; then
            # The AI andon cord is pulled — every reviewer job was bypassed at
            # job level. Nothing ran, so do NOT advance the reviewed-SHA.
            body="$(printf '%s\n' \
              "<!-- AUTO_REVIEW_STAMP -->" \
              "⏸️ **Auto-review bypassed** — the AI andon cord is pulled (repo variable \`AI_ANDON_CORD=pulled\`), so no reviewer ran for \`${short}\` (designs: \`${DESIGNS}\`)." \
              "This round is **not** marked reviewed; once the cord is released it retries on the next push, or close-and-reopen the PR (the one gesture that also re-fires the design coach and the Oracle)." \
              "Add the \`no-auto-review\` label to suppress future rounds." \
              "" "---" "$gen")"
            echo "::notice::auto-review bypassed — AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled); no reviewer ran, no provider API call was made; reviewed-SHA not advanced so the round retries once the cord is released — see docs/andon-cord.md"
          elif [ "$HAS_SECRET" != "true" ]; then
            # Nothing actually ran — do NOT advance the reviewed-SHA.
            body="$(printf '%s\n' \
              "<!-- AUTO_REVIEW_STAMP -->" \
              "⏭️ **Auto-review skipped** — no provider key (\`ZAI_KEY\` or \`ANTHROPIC_API_KEY\`) is set, so no reviewer ran for \`${short}\` (designs: \`${DESIGNS}\`)." \
              "This round is **not** marked reviewed; it retries on the next push that changes a \`designs/\` file (or once a provider key is set)." \
              "Add the \`no-auto-review\` label to suppress future rounds." \
              "" "---" "$gen")"
            echo "::notice::auto-review skipped — no provider key (ZAI_KEY/ANTHROPIC_API_KEY) set; reviewed-SHA not advanced so the round will retry"
          elif [ "$JANE" = "success" ] && [ "$DRIK" = "success" ] && [ "$pm_ok" = "true" ] && [ "$coach_ok" = "true" ]; then
            # All jobs green — confirm the artifact before believing it
            # (issue #762): both reviewers' sign-off markers for THIS head
            # sha must be on the thread. A clean `false` is a decision
            # (stamped incomplete below); a failed read aborts the step and
            # reddens this job rather than guessing.
            jane_served="$(scripts/reviewer-posted.sh check \
              --pr "$PR_NUMBER" --sha "$HEAD_SHA" --reviewer jane)"
            drik_served="$(scripts/reviewer-posted.sh check \
              --pr "$PR_NUMBER" --sha "$HEAD_SHA" --reviewer drik)"
            if [ "$jane_served" = "true" ] && [ "$drik_served" = "true" ]; then
              # A real review ran clean AND landed — mark the commit reviewed.
              body="$(printf '%s\n' \
                "<!-- AUTO_REVIEW_STAMP sha=${HEAD_SHA} -->" \
                "🔍 **Auto-review round complete** — reviewed commit \`${short}\` (designs: \`${DESIGNS}\`). See the Jane / Drik / PM / coach comments on this thread." \
                "A new round fires automatically on the next push that changes a \`designs/\` file." \
                "Add the \`no-auto-review\` label to suppress future rounds." \
                "" "---" "$gen")"
            else
              # Green jobs, no review on the thread — the exit-0-without-
              # posting case this stamp used to call complete (issue #762).
              # Do NOT advance the reviewed-SHA.
              body="$(printf '%s\n' \
                "<!-- AUTO_REVIEW_STAMP -->" \
                "⚠️ **Auto-review incomplete** — the reviewer jobs finished green but a review never landed for \`${short}\` (jane sign-off marker for this head: \`${jane_served}\`, drik: \`${drik_served}\`)." \
                "This is the exit-0-without-posting case (issue #762): an agent can end its turn without an API error and without commenting. This round is **not** marked reviewed; it retries on the next push that changes a \`designs/\` file." \
                "Add the \`no-auto-review\` label to suppress future rounds." \
                "" "---" "$gen")"
              echo "::warning::auto-review incomplete — reviewer job(s) finished green without posting (jane_marker=$jane_served drik_marker=$drik_served, issue #762); reviewed-SHA not advanced so the round will retry"
            fi
          else
            # A reviewer did not complete successfully (failure / cancelled /
            # unexpected state) — do NOT advance the reviewed-SHA.
            body="$(printf '%s\n' \
              "<!-- AUTO_REVIEW_STAMP -->" \
              "⚠️ **Auto-review incomplete** — a reviewer job did not complete this round for \`${short}\` (jane: \`${JANE}\`, drik: \`${DRIK}\`, pm: \`${PM}\`, coach: \`${COACH}\`)." \
              "This round is **not** marked reviewed; it retries on the next push that changes a \`designs/\` file. See the job states above / the run log for details." \
              "Add the \`no-auto-review\` label to suppress future rounds." \
              "" "---" "$gen")"
            echo "::warning::auto-review incomplete — a reviewer did not complete (jane=$JANE drik=$DRIK pm=$PM coach=$COACH); reviewed-SHA not advanced so the round will retry"
          fi

          # Find an existing stamp comment to update rather than accumulating
          existing_id="$(gh api \
            "/repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("AUTO_REVIEW_STAMP"))] | last | .id' \
            2>/dev/null || true)"

          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            gh api --method PATCH \
              "/repos/$GITHUB_REPOSITORY/issues/comments/${existing_id}" \
              -f body="$body"
          else
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" \
              -f body="$body"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Reviewer-signoff status (W2). Post the `reviewer-signoff` commit status on
  #    the PR head — the SECOND required context (CI OK can't cross workflows, so
  #    enforcement of "reviewers ran and signed off" lives here). FAIL-CLOSED: a
  #    design PR without two clean, current sign-offs BLOCKS; a non-design PR and
  #    the human escape-hatch labels PASS (always-report, so a required check
  #    never strands a PR it was never meant to gate). The pass/block decision is
  #    scripts/reviewer-signoff.sh — a tested helper (--selftest, run by
  #    check.sh) — so the fail-closed policy is proven, not asserted in YAML.
  #
  #    Runs on EVERY PR event (always(), needs the reviewer jobs only so the
  #    sign-off markers are already posted when we read them). The only repo
  #    code it runs is reviewer-signoff.sh (`key`, which reads commits and
  #    trees with git, `fuse-warn`, and `decide`), from the same merge-ref
  #    checkout this workflow file and the design-changes job's round guard
  #    come from — so the skip, the fuse sticky, and the currency are always
  #    one version of one rule.
  #
  #    ARMING (the one manual step): this status only *blocks* a merge once an
  #    admin adds `reviewer-signoff` to the branch's required status checks.
  #    Until then it reports but does not gate — see the needs-decision issue.
  signoff-status:
    name: Reviewer sign-off status
    needs: [design-changes, jane-review, drik-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout + git rev-parse of design tree objects
      statuses: write     # post the reviewer-signoff commit status
      issues: read        # read the sign-off / gate-report comments
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: older head shas must resolve, and the currency key
          # walks the head's first-parent line. The default (merge) ref, not
          # head.sha: the head is one of its parents, and it carries the
          # reviewer-signoff.sh this workflow was written against — a branch
          # that predates the `key` verb would otherwise compute no keys and
          # stale every sign-off the round guard just carried forward.
          fetch-depth: 0
      - name: Compute and post the reviewer-signoff status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DESIGNS_CHANGED: ${{ needs.design-changes.outputs.designs_changed }}
          NO_AUTO_REVIEW: ${{ contains(github.event.pull_request.labels.*.name, 'no-auto-review') }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'signoff-override') }}
          SIGNOFF_TRUST_REGEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          set -euo pipefail

          # A reviewer's sign-off marker can land in any of three places
          # depending on how the session posted (a PR review body, an issue
          # comment, or a review line comment), so gather all three bodies.
          all_bodies() {
            gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].body' 2>/dev/null || true
            gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/reviews"   --jq '.[].body' 2>/dev/null || true
            gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/comments"  --jq '.[].body' 2>/dev/null || true
          }
          bodies="$(all_bodies)"
          # Prefer the marker stamped for THIS head (the current round); fall back
          # to the latest one seen (the currency check BLOCKs if its tree is stale).
          get_marker() {   # $1 = JANE_SIGNOFF | DRIK_SIGNOFF
            local all m
            all="$(grep -oiE "<!-- $1 [^>]*-->" <<<"$bodies" || true)"
            m="$(grep -iF "sha=$HEAD_SHA" <<<"$all" | tail -1 || true)"
            [[ -n "$m" ]] && { printf '%s' "$m"; return; }
            tail -1 <<<"$all" || true
          }
          jane="$(get_marker JANE_SIGNOFF)"
          drik="$(get_marker DRIK_SIGNOFF)"

          # Fuse warn live this round? The render-gate sticky (W1) renders a
          # fusecheck STRONG WARN when a print-in-place mechanism welds shut.
          # Select only a body that STARTS with the sticky marker — a review
          # comment that quotes `<!-- printcheck-gate-report -->` is not the
          # sticky (PR #634: `contains()` + last picked Drik's sign-off).
          # The STRONG WARN match lives in reviewer-signoff.sh fuse-warn so
          # "No fusecheck STRONG WARN" cannot trip it. Best-effort: if the
          # sticky isn't posted yet the flag is false and the reviewers' own
          # acknowledgement plus the visible warn carry it.
          sticky="$(gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select((.body // "") | startswith("<!-- printcheck-gate-report -->"))] | last | .body // empty' \
            2>/dev/null || true)"
          fuse_warn="$(printf '%s' "$sticky" | scripts/reviewer-signoff.sh fuse-warn || true)"
          [[ "$fuse_warn" == true ]] || fuse_warn=false

          # Currency key at the current head, and at each reviewer's sha, so a
          # sign-off survives a push that changed no designs/ file — or a
          # previews-only, all-noise regen commit-back (issue #470). Both sides
          # come from reviewer-signoff.sh's one `key`, never a rev-parse here,
          # so the posting and checking sides cannot drift. Empty = stale.
          tree_current="$(scripts/reviewer-signoff.sh key "$HEAD_SHA" 2>/dev/null || true)"
          tree_of() {   # echo the currency key at a marker's sha, or empty
            local sha; sha="$(grep -oiE 'sha=[0-9a-f]+' <<<"$1" | head -1 | cut -d= -f2)"
            if [[ -n "$sha" ]]; then
              scripts/reviewer-signoff.sh key "$sha" 2>/dev/null || true
            fi
          }
          jane_tree="$(tree_of "$jane")"
          drik_tree="$(tree_of "$drik")"

          set +e
          out="$(scripts/reviewer-signoff.sh decide \
            --head "$HEAD_SHA" \
            --designs-changed "${DESIGNS_CHANGED:-false}" \
            --no-auto-review "$NO_AUTO_REVIEW" \
            --override "$OVERRIDE" \
            --fuse-warn "$fuse_warn" \
            --andon "$ANDON" \
            --jane "$jane" --drik "$drik" \
            --tree-current "$tree_current" \
            --jane-tree "$jane_tree" --drik-tree "$drik_tree")"
          rc=$?
          set -e

          state=success
          [[ "$rc" != 0 ]] && state=failure
          desc="${out#* }"                     # strip the leading PASS/BLOCK
          desc="${desc:0:140}"                 # GitHub caps status descriptions
          echo "reviewer-signoff → ${state}: ${desc}"

          gh api --method POST "/repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="reviewer-signoff" \
            -f description="$desc" \
            -f target_url="$RUN_URL"
