          context: the design-review chain (Jane / Drik / PM / coach)
          escalate: "true"

      - name: No chain link delivered the review
        if: >-
          steps.ready.outputs.ready == 'true'
          && (env.HAS_ZAI == 'true' || env.HAS_ANTHROPIC == 'true')
          && steps.v1.outputs.served != 'true'
          && steps.v2.outputs.served != 'true'
          && steps.v3.outputs.served != 'true'
          && steps.v4.outputs.served != 'true'
          && steps.v5.outputs.served != 'true'
          && steps.v6.outputs.served != 'true'
        env:
          CLASS: ${{ steps.triage.outputs.class }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          case "$CLASS" in
            needs-human)
              echo "::error::/jane-review delivered no review — the review chain is unusable, cause '${REASON}' (an account/config problem: out of credit, out of tokens, or a bad/missing key). A needs-decision issue has been filed for a human to fund / rotate / configure the key. This is NOT a defect in this PR." ;;
            dead)
              echo "::error::/jane-review delivered no review — the review chain names a model id the key cannot serve (reason '${REASON}'): a registry defect (#298). Fix .github/models/registry.conf." ;;
            servable)
              echo "::error::/jane-review delivered no review — every provider link answered a live probe, so the chain is healthy; the review agent itself ended without posting Jane's sign-off marker (issue #762 — an exit-0 run that posts nothing). Inspect the link step logs above; a fresh push starts a new round." ;;
            *)
              echo "::error::/jane-review delivered no review — the review chain failed on every provider for a retryable reason ('${REASON:-unknown}': rate limit / outage / transient); it retries on the next review round. See the failed step logs above." ;;
          esac
