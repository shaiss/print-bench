    # Provider fallback chain — see the jane-review job for the rationale and
    # ordering (Z.AI glm-5.3 → glm-5.2 → glm-5.1 → Anthropic claude-opus-4-8 →
    # claude-sonnet-5 → claude-haiku-4-5; first success wins; a missing key
    # degrades gracefully). Issues #206, #298. The PM shares the `review`
    # chain deliberately: the registry is where a future decision to give the
    # enforcement PM a frontier-first chain of its own belongs.
