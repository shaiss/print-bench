name: Product still (tier-1.5, AI)

# Generate a tier-1.5 AI product still (a bare-part AI render) for a design and
# open a DRAFT PR with it for a human to approve. Fires automatically when a
# designs/*/product-still.conf lands on the default branch — writing the manifest
# is the request — and can also be dispatched by hand to re-roll a still or
# override the size. The image is GLM-Image image-to-image from a committed
# geometry-true tier-1 render, but the model follows the prompt rather than
# constraining the shape to the seed (issue #302), so the geometry is AI and
# approximate; it never merges itself — a person reviews the generation and the
# disclosure before it lands. Note the whole tier ships DISABLED via
# .github/ai-lifestyle.conf (issue #302). See scripts/lifestyle-shot.sh
# (run with --kind product-still) and #66.
#
# Draft-PR lifecycle (issue #420): one open draft per design+kind. The branch is
# STABLE — `product-still/<design>`, not per-run — so re-dispatching force-pushes
# the regenerated still and UPDATES the existing open draft in place instead of
# piling up a new PR each time; an end-of-run backstop closes any stale superseded
# drafts (with a pointer comment) so exactly one open draft remains. A draft a
# human has TAKEN OVER — promoted out of draft, or tagged `ai-shot-hold` — is
# never force-pushed or closed: the run forks a per-run branch and leaves it alone.
#
# Prerequisites (one-time):
#   1. Add the ZAI_KEY repository secret (Settings > Secrets and variables >
#      Actions).
#   2. Enable Settings > Actions > General > Workflow permissions >
#      "Allow GitHub Actions to create and approve pull requests" — OFF by
#      default. Without it the final `gh pr create` is denied even with the
#      pull-requests: write permission below, and the run fails AFTER spending
#      an API call (the branch is still pushed; open the PR from it manually).
#   3. (Recommended) Add the REGEN_TOKEN repository secret — a fine-grained
#      PAT with contents + pull-requests write. Without it the draft PR is
#      opened with GITHUB_TOKEN, and a GITHUB_TOKEN-opened PR triggers no
#      workflow, so the normal CI never auto-runs and the required "CI OK"
#      check never appears — the PR then cannot satisfy branch protection
#      until someone pushes a commit. With REGEN_TOKEN set, opening the PR
#      triggers CI automatically (the documented REGEN_TOKEN reason, shared
#      with the regen job and log-print-result.yml).
# Without ZAI_KEY an auto-triggered run skips with a notice rather than failing —
# the still is supplemental, so its absence must not redden every design change.
# A manual dispatch still fails loudly: someone pressed the button and is owed
# a reason. Dispatch from the default branch so the generated branch forks cleanly.

on:
  # Auto: writing or editing a design's product-still.conf IS the request for a
  # still, so landing one on the default branch generates it. Scoped to that
  # one path — the draft PR this workflow opens only touches README.md and
  # previews/, so merging it cannot re-trigger the workflow.
  push:
    branches: [main]
    paths:
      - 'designs/*/product-still.conf'
  # Manual: regenerate an existing still (an image-to-image result is not
  # reproducible, so re-rolling is a normal thing to want) or override the size.
  workflow_dispatch:
    inputs:
      design:
        description: Design directory under designs/ (must ship a product-still.conf)
        required: true
        # Must stay a LIVE (non-archived) design that ships a product-still.conf,
        # so the most obvious "open form → Run with defaults" path succeeds
        # instead of tripping the archived guard below (sushi-battleship is archived).
        default: calibration-cube
        type: string
      size:
        description: Image size WxH passed to GLM-Image (override if the API rejects the default)
        required: false
        default: 1280x1280
        type: string

# Read-only by default; the write grants live on the one job that pushes a
# branch and opens the PR — detect only diffs a checkout (mirrors
# lifestyle-shot.yml, which already scopes it this way).
permissions:
  contents: read

jobs:
  detect:
    name: Resolve which designs to render
    runs-on: ubuntu-latest
    outputs:
      # AI lifestyle imagery feature flag (issue #302). Off unless the committed
      # .github/ai-lifestyle.conf says enabled: true — force '[]' so the whole
      # generate matrix (the API call + PR) skips via its existing needs.detect
      # guard. Z.AI has no true image-to-image (seed) model, so the tier ships
      # disabled; flip the conf in a reviewed PR to re-enable it.
      designs: ${{ steps.gate.outputs.enabled == 'true' && steps.pick.outputs.designs || '[]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: a push can carry many commits, and the range below
          # has to reach whichever one touched the manifest.
          fetch-depth: 0
      - name: Off switch (.github/ai-lifestyle.conf)
        id: gate
        run: |
          set -euo pipefail
          # Fail-safe default-off: grep as the `if` condition is exempt from
          # `set -e`, so a missing file, no `enabled:` line, or a non-true value
          # all fall through to the else branch instead of aborting the step
          # (issue #302 contract: "missing / blank / typo all read as off").
          # Same regex as scripts/readme-gate.sh's ai_lifestyle_enabled().
          if grep -Eq '^[[:space:]]*enabled[[:space:]]*:[[:space:]]*true[[:space:]]*(#.*)?$' .github/ai-lifestyle.conf 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.github/ai-lifestyle.conf enabled != 'true' — AI lifestyle imagery is off (issue #302); nothing to generate. Flip the conf in a reviewed PR to enable."
          fi
      - name: List the designs whose product-still.conf this run is about
        id: pick
        if: steps.gate.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DESIGN: ${{ github.event.inputs.design }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          names=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # The design input is free-form text. Validate its SHAPE before
            # anything interpolates it: design directories here are kebab-case
            # (same rule lifestyle-shot.sh enforces later), and bash's [[ =~ ]]
            # matches the whole string, so a value smuggling a newline — which
            # would let a crafted input inject extra ::workflow::commands into
            # the log — cannot pass. After this check, interpolating the name
            # into messages below is provably safe.
            if ! [[ "$INPUT_DESIGN" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::the 'design' input is not a valid design-directory name (lowercase kebab-case, e.g. sushi-battleship)"
              exit 1
            fi
            # An archived design (designs/<n>/ARCHIVED) is frozen at v0.1 and
            # retired from active CI — see CLAUDE.md, "Archived designs
            # (v0.1 freeze)". Generating a new AI still for one would spend an
            # API call restyling a design nobody maintains. A dispatch fails
            # loudly rather than skipping: someone pressed the button and is
            # owed a reason (same rule as the missing-key case below).
            if [ -f "designs/$INPUT_DESIGN/ARCHIVED" ]; then
              echo "::error::designs/$INPUT_DESIGN is archived at v0.1 and retired from active CI — lift the ARCHIVED marker (or revive the design as a derivative) before generating new stills for it."
              exit 1
            fi
            names="$INPUT_DESIGN"
          else
            # A force-push or a first push leaves github.event.before pointing
            # at nothing. Fall back to the empty tree, which diffs the WHOLE
            # pushed tree: comparing only HEAD against its parent would miss a
            # manifest added by any earlier commit in a multi-commit push, and
            # the workflow would then report success having generated nothing.
            # Erring wide is the right way round — the path filter means this
            # only fires when a product-still.conf actually moved.
            range="${BEFORE}..${GITHUB_SHA}"
            if ! git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
              range="$(git hash-object -t tree /dev/null)..${GITHUB_SHA}"
            fi
            while IFS= read -r f; do
              case "$f" in
                designs/*/product-still.conf)
                  n=${f#designs/}; n=${n%%/*}
                  # A deleted manifest still shows up in the diff; only render
                  # designs whose manifest exists at this commit. Archived
                  # designs are skipped like every other CI path skips them
                  # (CLAUDE.md, "Archived designs (v0.1 freeze)") — their
                  # committed pages stay as they are.
                  [ -f "designs/$n/product-still.conf" ] || continue
                  if [ -f "designs/$n/ARCHIVED" ]; then
                    echo "skip $n: archived at v0.1, not regenerating stills"
                    continue
                  fi
                  names="$names $n" ;;
              esac
            done < <(git diff --name-only "$range")
          fi
          # shellcheck disable=SC2086  # splitting the name list is the point
          set -- $names
          json="$(printf '%s\n' "$@" \
            | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')"
          echo "designs=$json" >> "$GITHUB_OUTPUT"
          echo "designs: $json"

  generate:
    name: Generate and open a draft PR
    needs: detect
    # The write grants live here, not top-level: this is the only job that
    # pushes a branch and opens the PR; detect is read-only (mirrors
    # lifestyle-shot.yml).
    permissions:
      contents: write
      pull-requests: write
    if: needs.detect.outputs.designs != '[]'
    strategy:
      # One PR per design, and one failure does not cancel the others.
      fail-fast: false
      matrix:
        design: ${{ fromJSON(needs.detect.outputs.designs) }}
    concurrency:
      group: product-still-${{ matrix.design }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20   # backstop: a stalled API call can't hold the runner
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the token in .git/config for the later steps that
          # process API-supplied image bytes; the push below supplies it
          # explicitly instead.
          persist-credentials: false

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick || { sleep 5; sudo apt-get install -y imagemagick; }

      - name: Generate the product still and embed its disclosure
        env:
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
          DESIGN: ${{ matrix.design }}
          ZAI_SIZE: ${{ github.event.inputs.size }}
        run: |
          set -euo pipefail
          if [ -z "${ZAI_KEY:-}" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              # Someone pressed the button and expects a still: say why not.
              echo "::error::ZAI_KEY secret is not set for this repository"
              exit 1
            fi
            # Auto-triggered. The still is supplemental and cosmetic, so a repo
            # without the key should not get a red X on every design change —
            # tier 1 is the deliverable and it is gated elsewhere.
            echo "::notice::ZAI_KEY is not set — skipping the tier-1.5 product still for ${DESIGN}"
            echo "SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          ./scripts/lifestyle-shot.sh --kind product-still "$DESIGN"

      - name: Prove the disclosure gate passes
        if: env.SKIPPED != '1'
        env:
          DESIGN: ${{ matrix.design }}
        # Run the product-page gate here as a fast pre-check so the disclosure
        # (AI-styled scene label + "geometry is approximate" caption) is
        # verified before the PR is even opened. When REGEN_TOKEN is set the
        # full CI also runs on the opened PR (see the token below); this early
        # gate fails the run before any PR exists if the disclosure is wrong.
        run: ./scripts/readme-gate.sh "$DESIGN"

      - name: Open a draft PR with the generated product still
        if: env.SKIPPED != '1'
        env:
          # PAT if present so the opened PR triggers CI (a GITHUB_TOKEN-opened
          # PR runs no workflow — the documented REGEN_TOKEN reason); else the
          # ambient token, and the HAVE_PAT warning below flags that CI won't
          # auto-run. Used for both the branch push and `gh pr create`.
          GH_TOKEN: ${{ secrets.REGEN_TOKEN || github.token }}
          HAVE_PAT: ${{ secrets.REGEN_TOKEN != '' }}
          DESIGN: ${{ matrix.design }}
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One draft per design+kind (issue #420): reuse a STABLE branch instead
          # of opening a fresh per-run PR every dispatch. The stable branch is
          # force-pushed, so its existing open draft updates in place; stale
          # per-run drafts from before this change are closed by the backstop at
          # the end. A PR a human has TAKEN OVER — promoted out of draft, or
          # tagged `ai-shot-hold` — is never force-pushed or closed: this run
          # forks a per-run branch and leaves theirs alone.
          kind="product-still"
          stable="${kind}/${DESIGN}"
          held=""
          existing="$(gh pr list --head "$stable" --base "$BASE" --state open \
            --json number,isDraft,labels 2>/dev/null || echo '[]')"
          if [ "$(echo "$existing" | jq 'length')" -gt 0 ]; then
            if [ "$(echo "$existing" | jq -r '.[0].isDraft')" != "true" ] \
               || [ "$(echo "$existing" | jq -r '[.[0].labels[].name] | index("ai-shot-hold") != null')" = "true" ]; then
              held="$(echo "$existing" | jq -r '.[0].number')"
            fi
          fi
          if [ -n "$held" ]; then
            echo "::notice::PR #${held} on ${stable} was taken over by a human (out of draft or ai-shot-hold) — forking a fresh branch and leaving it untouched."
            branch="${stable}-${RUN_ID}"
            reuse=0
          else
            branch="$stable"
            reuse=1
          fi

          git checkout -b "$branch"
          # Stage exactly the generated product-still PNG(s) and the README — a
          # precise add (not the whole previews/ dir) so no unrelated
          # working-tree change rides along, and via -print0 so it never
          # word-splits or fails on a literal glob.
          git add "designs/${DESIGN}/README.md"
          find "designs/${DESIGN}/previews" -maxdepth 1 -type f -name 'product-still-*.png' -print0 \
            | xargs -0 --no-run-if-empty git add
          if git diff --cached --quiet; then
            echo "::error::generator produced no changes"
            exit 1
          fi
          git commit -m "Add AI product still: ${DESIGN}"
          # persist-credentials:false above means no stored remote auth — supply
          # the token explicitly for this one push (masked in logs by Actions).
          # Reuse force-pushes (the stable branch is regenerated each run so its
          # open draft updates in place); a human-takeover fork is a plain push.
          if [ "$reuse" = "1" ]; then
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          else
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          fi
          body="$(cat <<EOF
          Automated **tier-1.5 AI product still** for \`${DESIGN}\`, generated by Z.AI GLM-Image in **image-to-image** mode from the prompt in \`designs/${DESIGN}/product-still.conf\`.

          This image is a **bare-part AI render**, seeded from a committed geometry-true tier-1 render, but on this provider the model follows the prompt rather than constraining the shape to the seed (issue #302), so its geometry is an approximation, not the real mesh. The studio product shot (tier 1) and the STL remain the geometry-true artifacts. The README embed carries the required disclosure (an \`AI-styled scene\` alt label and a \`geometry is approximate\` caption), and \`readme-gate.sh\` passed in the generating workflow.

          **Review before merging:** confirm the generated scene is presentable and not misleading, then take this out of draft. Regenerate by re-running the *Product still (tier-1.5, AI)* workflow.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )"
          # Reuse the branch's already-open draft (the force-push refreshed its
          # content) — `gh pr create` refuses a second open PR for one head, so
          # this list-first guard is correctness, not just tidiness — else open
          # the draft.
          pr="$(gh pr list --head "$branch" --base "$BASE" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || echo '')"
          if [ -n "$pr" ]; then
            url="$(gh pr view "$pr" --json url --jq '.url')"
            gh pr comment "$pr" --body "$(printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "♻️ Refreshed with a newer generation (run ${RUN_ID}); the previous image on this branch was superseded. Review the updated scene, then take this out of draft.")"
            echo "Refreshed existing draft PR #${pr}: ${url}"
          elif url="$(gh pr create --draft --base "$BASE" --head "$branch" \
              --title "Add AI product still: ${DESIGN}" --body "$body")"; then
            pr="$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
            echo "Opened a draft PR: ${url}"
          else
            # ::error:: not ::warning:: — the step exits 1, so the annotation
            # severity should match the failed job.
            echo "::error::Could not open the PR automatically. The branch '${branch}' IS pushed — enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests' (or use a PAT), then open a PR from that branch into ${BASE}."
            exit 1
          fi
          {
            echo "## Product still — ${DESIGN}"
            echo ""
            echo "Draft PR with the generated tier-1.5 AI product still:"
            echo ""
            echo "**[${url}](${url})**"
            echo ""
            echo "_Review the scene, then take the PR out of draft._"
          } >> "$GITHUB_STEP_SUMMARY"

          # Auto-close backstop: close any OTHER open AI-shot draft for this
          # design+kind (a legacy per-run branch, or a stale stable branch) so
          # exactly one open draft remains. Never touch the current PR, a PR a
          # human promoted out of draft, or an `ai-shot-hold` PR. The per-run
          # match is `<stable>-<digits>`, so a sibling design whose name extends
          # this one's is never caught.
          gh pr list --base "$BASE" --state open \
            --json number,headRefName,isDraft,labels \
            | jq -r --arg stable "$stable" --argjson cur "${pr:-0}" \
                '.[] | select(.headRefName == $stable or (.headRefName | test("^" + $stable + "-[0-9]+$"))) | select(.number != $cur) | select(.isDraft) | select([.labels[].name] | index("ai-shot-hold") | not) | .number' \
            | while read -r stale; do
                [ -n "$stale" ] || continue
                gh pr close "$stale" --delete-branch \
                  --comment "$(printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "Superseded by #${pr} — a newer ${kind} generation for design ${DESIGN}. Closing this stale AI-shot draft; regenerate by re-running the workflow if it is still wanted.")" || true
              done

          # A GITHUB_TOKEN-opened PR triggers no workflow, so without the PAT
          # the required checks never run and the PR can't satisfy branch
          # protection. Say so loudly (mirrors log-print-result.yml).
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::warning::REGEN_TOKEN is not set, so this PR was created with GITHUB_TOKEN and CI will not auto-run on it. Push any commit (or set REGEN_TOKEN — a fine-grained PAT with contents + pull-requests write) to trigger the required checks."
          fi
