# Reeve — the platform PM's bench-health report (issue #272).
#
# print-bench splits the PM role three ways: Remy (/product-scout) proposes what
# designs should exist, Vera (/pm) enforces one design's scope, and REEVE owns
# the system — the bench as a running whole. This is how Reeve reads the ops
# pulse: it runs the tools/reeve detectors over the committed telemetry log, the
# live preview sizes and the routine confs, and upserts ONE sticky "bench
# health" report issue. Advisory-only: no label edits, no closes, no comments
# on other issues. The `report` job below is fully deterministic — no LLM
# anywhere, every finding a recomputable fact — and holds NO provider secret;
# the only token it ever sees is the ambient GITHUB_TOKEN. Reeve's primary
# pulse is committed files, plus GET-only run-health reads via
# src/reeve/github.py (the groomer's pattern; issue #313) — the sticky upsert
# remains its sole write.
#
# The SECOND job, `greenlight` (issue #443, the #296 stage-2 loop's LLM step),
# is the one agentic half: it drafts ONE advisory greenlight comment on each
# workflow-selected open `needs-decision` issue — a YES/NO verdict on
# system-level decisions, a ROUTE note handing design-taste calls to the design
# PM — never resolving the gate, never labeling, never pushing. It runs AFTER
# the report (needs: report), in its own job so the reporter stays byte-for-byte
# keyless, and it is THREE-keyed: the routine's two arming keys (below) plus
# `greenlight: true` in the conf (shipped `false` — the loop is built but not
# lit) plus at least one of its providers' secrets actually being set; no key
# for any provider is a `::notice::` skip, never a red run. Its models come
# from the registry's `reeve-greenlight` chain, walked link by link ACROSS
# providers — the GLM head the conf's `provider:` names, then the Anthropic
# tail (issue #544 Part B) — the walk's shape checked against the conf up
# front (the #326 pattern, generalized); its one shell surface is the #442 wrapper
# (`.claude/skills/reeve-greenlight/`), behind the deny backstop
# `.claude/reeve-settings.json`, with writes bound to the selected set and
# capped by `greenlight_cap`.
#
# The job's FIRST step is the loop's authority half (issue #444): the
# deterministic, keyless approval poll — reactions on the routine's own prior
# greenlight comments, permission-checked, pushed through decide.yml's
# sequence via the API (never a posted command; labels via the workflow
# token, the ledger via REGEN_TOKEN). See the poll step's own comment.
#
# The LEARNING half (issue #445) threads through the same loop: the greenlight
# job's trusted workflow code assembles the drafter's precedent context
# (`.reeve-context/precedent.md` — the most recent records of
# `telemetry/reeve-greenlights.ndjson` plus the inline owner replies on their
# threads, both capped by `greenlight_precedent_cap`), and the THIRD job,
# `observe`, records every round whose gate resolved since the last run
# (closed, or verdict-labeled by decide.yml): it derives one ndjson record per
# newly-resolved round (`reeve greenlight-append`) and pushes the updated log
# to the `telemetry` data branch with GITHUB_TOKEN — ci.yml's roll-up vehicle,
# which triggers no workflow. `observe` is its own job so the secret-bearing
# agent job keeps contents:read only: the observer is deterministic, keyless,
# and runs after the drafter (a round resolved mid-run is recorded by the next
# run — the loop learns across runs, not within one).
#
# TWO keys must agree to run: committed `enabled: true` in .github/reeve.conf
# AND the repo variable REEVE_ENABLED == "true". Either off → inert. The
# decision is code (`reeve armed`), unit-tested over the full 2×2 matrix, not
# YAML expression soup.
#  *  AI andon cord (docs/andon-cord.md): the AI_ANDON_CORD repo variable set
#     to 'pulled' bypasses this workflow's AI job (`greenlight`, the drafter)
#     with a single ::notice:: — grey, never red, no provider call, no
#     escalation. Orthogonal to the arming variable: it overrides an armed
#     routine without touching it. The deterministic `report` and `observe`
#     jobs keep running, and the report carries a 🛑 banner line while the
#     cord is pulled (`reeve run --andon`).
#
# Cadence lives twice by necessity (Actions cannot read a file for
# on.schedule): the cron literal below and the conf's `cadence:` key must stay
# identical (a test pins them). 05:53 UTC daily — an off-peak slot after the
# sibling routines (:11/:17/:23/:29/:41/:47). The report reads committed
# telemetry and preview sizes, not the issue backlog; the greenlight loop does
# read the decision-gate backlog, but its draft is advisory and a parked
# decision already waits on a human, so a day never starves it.

name: Reeve — bench health

on:
  schedule:
    - cron: '53 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the report into the job summary but skip the issue upsert
        type: boolean
        default: false

# Default deny; the report job asks for exactly what it uses.
permissions:
  contents: read

# Serialize against ourselves only; never cancel a mid-upsert run.
concurrency:
  group: reeve
  cancel-in-progress: false

jobs:
  report:
    # Key 1 of the two-key arming: the live repo variable. The same expression
    # pins the run to the default branch so a dispatch against a PR branch can
    # never run that branch's tool code.
    if: vars.REEVE_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # A deterministic report over committed files is seconds of work; bound a
    # hung run well under GitHub's 6-hour default.
    timeout-minutes: 10
    permissions:
      # checkout + reading the committed telemetry/previews/confs
      contents: read
      # the ONE write this workflow performs: upserting the sticky report issue
      issues: write
      # the run-health gather (src/reeve/github.py) lists workflow runs and
      # open PRs; its GETs are uncaught, so a missing scope would hard-fail
      # the run rather than degrade — grant the reads explicitly (the
      # groomer's reasoning)
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install reeve
        # Stdlib-only tool — the [test] extra (pytest) is deliberately NOT
        # installed here; CI's reeve-tests job owns the tests.
        run: pip install -e tools/reeve

      - name: Read policy (key 2 — the committed conf)
        id: policy
        env:
          REEVE_VARIABLE: ${{ vars.REEVE_ENABLED }}
        run: |
          enabled="$(reeve config --get enabled --path .github/reeve.conf)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          # The tested 2×2 decision; appends armed=true/false to $GITHUB_OUTPUT.
          reeve armed --variable "$REEVE_VARIABLE" --conf-enabled "$enabled"

      - name: Paused in git
        if: steps.policy.outputs.armed != 'true'
        env:
          # Env indirection rather than inline ${{ }} in run: — the sibling
          # workflows' template-injection discipline, kept even for values the
          # tool constrains to true/false.
          CONF_ENABLED: ${{ steps.policy.outputs.enabled }}
        run: |
          echo "::notice::Reeve is armed (REEVE_ENABLED=true) but .github/reeve.conf says 'enabled: ${CONF_ENABLED}' — doing nothing. Flip the conf in a reviewed PR to resume."

      - name: Overlay live telemetry from the data branch
        # Telemetry is pushed to the unprotected `telemetry` branch by ci.yml's
        # roll-up step, not the default branch (issue #481: the default-branch
        # ruleset blocks a direct push and telemetry must not re-trigger CI).
        # Overlay that live log + report into the checkout so reeve's gate-side
        # detectors (gate-failing / score-regression / walltime-regression /
        # archived-creep) read current data instead of the frozen seed committed
        # on the default branch. A read-only fetch — the checkout's
        # persist-credentials:false means auth is supplied per-fetch here. If the
        # branch does not exist yet (no record has landed), reeve reads the seed,
        # exactly as before, and those detectors stay 'not evaluated'.
        if: steps.policy.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 "$url" telemetry 2>/dev/null; then
            git show FETCH_HEAD:telemetry/log.ndjson > telemetry/log.ndjson
            git show FETCH_HEAD:telemetry/REPORT.md  > telemetry/REPORT.md 2>/dev/null || true
            echo "overlaid live telemetry ($(wc -l < telemetry/log.ndjson) records)"
          else
            echo "::notice::no telemetry data branch yet — reeve reads the committed seed; gate-side detectors will read 'not evaluated' until the first record lands"
          fi

      - name: Build the report
        if: steps.policy.outputs.armed == 'true'
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          # The AI andon cord's live value (a repo variable, not a secret —
          # the reporter stays keyless); env-indirected, never inline in run:.
          # 'pulled' adds the one 🛑 banner line to the report; the tool
          # compares exactly as GitHub's expression does — case-insensitive,
          # no whitespace trimming — so it can never banner a bypass the
          # job-level gates did not make. Passed as `--andon=` (the = form)
          # below so a dash-leading value is read as the value, never as an
          # option that would exit 2 and red the keyless daily report.
          AI_ANDON_CORD: ${{ vars.AI_ANDON_CORD }}
        run: |
          # GET-only run-health reads via src/reeve/github.py (the groomer's
          # pattern); the sticky upsert remains the sole write.
          reeve run --root . --repo "$GITHUB_REPOSITORY" \
            --conf .github/reeve.conf --andon="$AI_ANDON_CORD" \
            --out report.md > /dev/null
          {
            echo "## Reeve — bench health"
            echo ""
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run — skipping the upsert
        if: steps.policy.outputs.armed == 'true' && inputs.dry_run
        run: |
          echo "::notice::Dry run — the report is in the job summary; the sticky report issue was not touched."

      - name: Upsert the sticky report issue
        id: upsert
        if: steps.policy.outputs.armed == 'true' && !inputs.dry_run
        uses: actions/github-script@v9
        with:
          script: |
            // The one write surface of the whole routine. The report issue is
            // found belt-and-braces: by its label (unspoofable machine state —
            // write access required to set it) AND by the marker that
            // tools/reeve renders as the body's first line. Create once, edit
            // forever after — never a second report issue.
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const MARKER = '<!-- reeve-bench-health -->';
            const LABEL = 'reeve-report';
            const TITLE = '🩺 Bench health report';
            if (!body.startsWith(MARKER)) {
              core.setFailed('report.md does not start with the reeve marker — refusing to upsert');
              return;
            }
            // Ensure the label exists (idempotent, the groomer's pattern).
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: LABEL, color: '1d76db',
                description: 'Reeve\'s sticky bench-health report issue (issue #272)',
              });
            } catch (e) {
              // 422 = already exists (the idempotent path); anything else —
              // 403, rate limit — is a real failure and must stay loud.
              if (e.status !== 422) throw e;
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 100,
            });
            // The issues listing interleaves PRs — never select (and then
            // overwrite!) a PR, the same defensive filter the siblings apply.
            const prev = issues.find(i => !i.pull_request && i.body && i.body.startsWith(MARKER));
            if (prev) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prev.number, title: TITLE, body,
              });
              core.notice(`Updated the bench-health report: #${prev.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL],
              });
              core.notice(`Created the bench-health report: #${created.data.number}`);
            }

      - name: Record the run outcome
        if: always()
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          ARMED: ${{ steps.policy.outputs.armed }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          UPSERT_OUTCOME: ${{ steps.upsert.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Reeve — run outcome"
            if [ "$POLICY_OUTCOME" != "success" ]; then
              echo "- ❌ policy step did not complete (${POLICY_OUTCOME:-skipped}) — the committed conf did not parse; nothing ran."
            elif [ "$ARMED" != "true" ]; then
              echo "- ⏸️ armed by the repo variable but paused in git (conf enabled != true)."
            elif [ "$REPORT_OUTCOME" != "success" ]; then
              echo "- ❌ report build failed — see the step log; the sticky issue was not touched."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "- 🧪 dry run: report rendered above, upsert skipped."
            elif [ "$UPSERT_OUTCOME" != "success" ]; then
              echo "- ❌ report rendered but the upsert did not complete (${UPSERT_OUTCOME:-skipped}) — the sticky issue may be stale; see the upsert step log."
            else
              echo "- ✅ report rendered and upserted to the sticky report issue."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  greenlight:
    name: Draft advisory greenlights on parked decisions
    # The LLM half of the decision-gate loop (issue #443, #296 stage 2). Runs
    # only AFTER a successful report (needs: report) — one routine, report
    # first — and repeats the report job's own arming gate so the two halves
    # can never disagree about whether Reeve is on. The default-branch pin is
    # the same belt-and-braces as the assessor's: this job carries a write
    # scope and a provider secret, and a hand-dispatch against a PR branch must
    # not run that branch's skill code with either.
    # The AI andon cord (docs/andon-cord.md) skips this WHOLE job — the
    # drafter's ship steps, the exhaustion diagnose/red gates, and also the
    # keyless poll step inside it (the 👍 push-through), so a thumbs-up on a
    # prior greenlight waits for release: documented collateral. `observe`
    # below un-couples itself from this skip so the learning half keeps
    # recording; `disarmed-notice` says why in one ::notice::.
    needs: report
    if: >-
      vars.REEVE_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
      && needs.report.result == 'success'
      && vars.AI_ANDON_CORD != 'pulled'
    runs-on: ubuntu-latest
    # Job budget 60 = head-step timeout (30) + one tail-step timeout (25)
    # + 5 min headroom. The GLM head keeps main's WHOLE pre-#544 job budget
    # (30): a per-step cap below it would kill a legitimately long
    # drafter run, read the kill as a failed link and re-run the whole
    # thing on the tail — the common path must not pay for the fallback. The
    # Anthropic tail links are budgeted shorter (25 each) on purpose (Part
    # A's "tail shorter than head" shape): they exist for the fast failures a
    # dead head produces, not for a second full run. So the budget fits
    # exactly ONE stalled head link (30 — a model stall, not the seconds a
    # quota/billing rejection takes) plus ONE full tail link (25) plus the
    # pre-run steps (poll, select, context); two consecutive stalls are NOT budgeted — a second
    # stalled link dies with the job — because a stall is a provider-wide
    # symptom, and the tail exists for the fast failures. The walk is
    # three run steps in a row (the GLM head, then the two-link
    # Anthropic tail — issue #544 Part B); a run reads the charter and the
    # precedent digest for at most greenlight_cap parked threads. The per-step timeouts are what keep a hung drafter
    # from holding a runner and a secret past its budget, unwatched.
    # Well inside GitHub's 360-minute hosted-job cap (the drift guard pins
    # <= 360 and >= head + tail + 5).
    # The report job keeps its own tighter 10-minute bound — this job is the
    # only agentic one.
    timeout-minutes: 60
    permissions:
      # checkout + reading the charter/PM.md and the skill the drafter runs
      contents: read
      # the wrapper's ONE write: greenlight comments on the selected issues.
      # The provider-triage step's one escalation (a deduped needs-decision
      # issue on a human-fixable provider failure) is an issue write too, so
      # this grant covers the whole job.
      issues: write
    env:
      # Secrets cannot be read in a step `if:` directly, so surface each
      # provider's key presence as a plain string and gate on it below. The
      # "Read policy" step turns these into per-provider `zai_key_present` /
      # `anthropic_key_present` outputs (each provider's run steps gate on
      # their own) plus `key_present` = either one (the any-key gate the
      # triage, red and skip-notice steps read).
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ZAI_KEY: ${{ secrets.ZAI_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` above: always check out the
          # default branch — the secret-bearing drafter reads untrusted parked
          # text, so it must run the reviewed, merged skill and wrapper.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install reeve
        # The Select step is `reeve greenlight-select` — the tool's own GET-only
        # seam, so the trusted workflow (not the agent) widens or narrows the
        # candidate set. Stdlib-only; the [test] extra stays with CI's job.
        run: pip install -e tools/reeve

      - name: Read policy (.github/reeve.conf)
        id: policy
        # The same two-key decision the report job makes (same tool, same conf),
        # plus this job's OWN third key: `greenlight: true` — the loop's
        # conf-side switch, shipped false so landing the step lights nothing
        # (the variable stays the live kill switch for the whole routine). The
        # conf's `provider:` is the walk's HEAD provider (issue #544) —
        # validated here, emitted for the resolve step's shape check and the
        # summary. Key presence is emitted PER PROVIDER (each provider's run
        # steps gate on their own, so the tail can run when the head's key is
        # absent) plus the any-key `key_present` the triage / red / skip-notice
        # gates read; no key for any provider is a ::notice:: skip below, never
        # a red run. The model itself is NOT decided here — it comes from the
        # registry chain below.
        env:
          REEVE_VARIABLE: ${{ vars.REEVE_ENABLED }}
        run: |
          set -euo pipefail
          conf=.github/reeve.conf
          enabled="$(reeve config --get enabled --path "$conf")"
          greenlight="$(reeve config --get greenlight --path "$conf")"
          provider="$(reeve config --get provider --path "$conf")"
          case "$provider" in
            anthropic|zai) ;;
            *) echo "::error::unknown provider '$provider'"; exit 1 ;;
          esac
          [ "$HAS_ZAI_KEY" = "true" ] && zai_key=1 || zai_key=0
          [ "$HAS_ANTHROPIC_KEY" = "true" ] && anthropic_key=1 || anthropic_key=0
          if [ "$zai_key" = 1 ] || [ "$anthropic_key" = 1 ]; then key=1; else key=0; fi
          # The tested 2×2 decision, exactly as the report job computes it —
          # and `reeve armed` appends armed=true/false to $GITHUB_OUTPUT
          # itself (the report job's own invocation shape).
          reeve armed --variable "$REEVE_VARIABLE" --conf-enabled "$enabled"
          {
            echo "enabled=$enabled"
            echo "greenlight=$greenlight"
            echo "provider=$provider"
            echo "zai_key_present=$zai_key"
            echo "anthropic_key_present=$anthropic_key"
            echo "key_present=$key"
          } >> "$GITHUB_OUTPUT"

      - name: Paused in git
        if: steps.policy.outputs.armed != 'true'
        env:
          CONF_ENABLED: ${{ steps.policy.outputs.enabled }}
        run: |
          echo "::notice::Reeve is armed (REEVE_ENABLED=true) but .github/reeve.conf says 'enabled: ${CONF_ENABLED}' — doing nothing (report or greenlight). Flip the conf in a reviewed PR to resume."

      - name: Greenlight loop disabled in git
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight != 'true'
        env:
          # Env indirection, never inline ${{ }} in run:.
          CONF_GREENLIGHT: ${{ steps.policy.outputs.greenlight }}
        run: |
          echo "::notice::.github/reeve.conf says 'greenlight: ${CONF_GREENLIGHT}' — the deterministic report ran, the greenlight drafter stays off. Flip the key in a reviewed PR to light the loop."

      # The loop's authority half (issue #444), and the FIRST thing an armed
      # run does: GitHub fires no webhook for reactions, so each run polls
      # its own prior greenlight comments — reads the reactions through the
      # tool's GET seam, keeps only reactions from accounts whose REAL
      # permission is write/maintain/admin (getCollaboratorPermissionLevel,
      # the same check decide.yml makes; never author_association), lets an
      # explicit authorized /decide comment outrank them, and pushes an
      # approved verdict through decide.yml's own sequence VIA THE API —
      # never a posted /decide command (the stage-1 lesson: the comment
      # tooling's attribution footer neutralizes a bot-posted command while
      # the run reports success). Keyless and deterministic: it runs
      # whenever the loop is lit, with or without a drafter provider key,
      # so a lit loop still drains approvals on a keyless day. It runs
      # BEFORE the Select step on purpose — resolving parked decisions
      # shrinks the set the drafter is handed — and BEFORE the chain
      # resolve, whose shape-check failure must stop the drafter (a key
      # about to be spent on the wrong endpoint), not the poll.
      #
      # Tokens, on purpose: labels and the resolution reply use the ambient
      # GITHUB_TOKEN (issues: write — a token-scoped label flip triggers no
      # CI, right for the verdict half); the LEDGER commit authenticates
      # with REGEN_TOKEN, the same PAT the regen job commits artifacts with
      # — the Actions bot cannot push to the ruleset-protected default
      # branch (the GH013 lesson behind telemetry's data branch), and a
      # PAT-authored commit re-triggers CI so the ledger change lands
      # verified (the classifier scopes a ledger-only commit to no design
      # gates). The workflow therefore needs NOTHING wider than its present
      # permissions: the ledger commit is not made with the workflow token.
      # Without the PAT the append skips with a notice — the label carries
      # the verdict, decide.yml's documented degradation.
      - name: Poll prior greenlights for owner reactions
        id: poll
        if: >-
          steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REGEN_TOKEN: ${{ secrets.REGEN_TOKEN }}
        run: |
          set -euo pipefail
          reeve greenlight-poll --repo "$GITHUB_REPOSITORY" --gh-output "$GITHUB_OUTPUT"
          {
            echo "## Reeve greenlight — approval poll"
            if [ -n "$(sed -n 's/^resolved=//p' "$GITHUB_OUTPUT" | head -1)" ]; then
              echo "- resolved by 👍: #$(sed -n 's/^resolved=//p' "$GITHUB_OUTPUT" | head -1 | sed 's/ / #/g')"
            else
              echo "- no greenlights approved by a qualifying reaction this run"
            fi
            if [ -n "$(sed -n 's/^overruled=//p' "$GITHUB_OUTPUT" | head -1)" ]; then
              echo "- overruled by 👎 (gate stays parked): #$(sed -n 's/^overruled=//p' "$GITHUB_OUTPUT" | head -1 | sed 's/ / #/g')"
            fi
            if [ -n "$(sed -n 's/^failed=//p' "$GITHUB_OUTPUT" | head -1)" ]; then
              echo "- ⚠️ push-through FAILED (left parked for the next run to retry): #$(sed -n 's/^failed=//p' "$GITHUB_OUTPUT" | head -1 | sed 's/ / #/g') — see the step log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Resolve the drafter's model chain from the committed provider/model
      # registry (issue #206) — the same resolve step the scout and the
      # labeler run, stdlib-only so it needs no install in front of it. A
      # malformed registry, or one whose `reeve-greenlight` chain went
      # missing, fails this step loudly BEFORE any key is spent — and is
      # caught pre-merge by the model-registry drift-guard tests, which fire
      # on this workflow and on registry.conf. `link<N>_model` is what the
      # run steps below read; the secret stays literal per step (the Actions
      # constraint), so the registry decides the model, never the auth.
      #
      # The shape check guards the one way the conf/chain split can mis-run
      # (issue #544): the walk below is a FIXED sequence of literal run steps
      # — its layout, one provider per step in file order (one Z.AI GLM step,
      # then two Anthropic steps), because Actions can only reference a
      # secret by its literal name — while the registry picks the MODEL each
      # step runs. A link on the wrong slot's provider (claude-* on the Z.AI
      # step, glm-* on an Anthropic step) would fail at request time with a
      # key already spent, and a chain longer or shorter than the walk leaves
      # a step without a link or a link without a step. So the conf's
      # `provider:` must be link 1's (it names the HEAD of the walk), and
      # link N's provider must be step N's — `model-registry shape` applies
      # the same pure rule the drift guard pins pre-merge, so the two cannot
      # drift, and the `--layout` literal below is what the drift guard
      # compares against the steps' actual wiring.
      - name: "Resolve the greenlight model chain (issue #206)"
        id: chain
        env:
          PYTHONPATH: tools/model-registry/src
        run: |
          set -euo pipefail
          python3 -m model_registry resolve reeve-greenlight --gh-output "$GITHUB_OUTPUT"
          conf_provider="$(reeve config --get provider --path .github/reeve.conf)"
          # One layout entry per run step below, in file order.
          python3 -m model_registry shape reeve-greenlight --head "$conf_provider" \
            --conf .github/reeve.conf --layout zai,anthropic,anthropic

      - name: Select parked decisions needing a greenlight
        id: select
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The TRUSTED Select step: `reeve greenlight-select` lists the open
          # needs-decision issues that carry no greenlight marker yet (GET-only,
          # src/reeve/github.py) and prints the oldest greenlight_cap of them.
          # The agent is handed only the resulting numbers — via $GITHUB_OUTPUT
          # here and $REEVE_SELECTED_ISSUES at the ship step — so a
          # prompt-injected run cannot widen its own candidate set, and the
          # cap always covers every issue it is handed.
          reeve greenlight-select --repo "$GITHUB_REPOSITORY" \
            --conf .github/reeve.conf --gh-output "$GITHUB_OUTPUT"
          nums="$(sed -n 's/^issues=//p' "$GITHUB_OUTPUT" | head -1)"
          {
            echo "## Reeve greenlight — selection"
            if [ -z "$nums" ]; then
              echo "- no parked decisions awaiting a greenlight (every open \`needs-decision\` issue already carries one)"
            else
              echo "- parked decisions to draft: #${nums// / #}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Overlay the live precedent log from the data branch
        # The learning half's read (issue #445): the precedent log's live copy
        # lives on the `telemetry` data branch (appended by the `observe` job
        # below and ci.yml's roll-up), not the default-branch seed. Overlay it
        # so the drafter's context and (in `observe`) the append both read
        # current records. Read-only fetch, per-fetch auth — the same shape as
        # the report job's overlay.
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 "$url" telemetry 2>/dev/null; then
            if git show FETCH_HEAD:telemetry/reeve-greenlights.ndjson \
                > telemetry/reeve-greenlights.ndjson 2>/dev/null; then
              echo "overlaid the live precedent log ($(wc -l < telemetry/reeve-greenlights.ndjson) records)"
            else
              echo "::notice::the telemetry branch carries no precedent log yet — the drafter reads the committed seed"
            fi
          else
            echo "::notice::no telemetry data branch yet — the drafter reads the committed seed"
          fi

      - name: Assemble the drafter's precedent context
        # The load half (issue #445): trusted workflow code — never the agent —
        # renders the digest (most recent greenlight_precedent_cap records plus
        # the inline owner replies on their threads, GET-only gather) to
        # `.reeve-context/precedent.md`, which the skill Reads as evidence of
        # the bar the owner actually applies. The `.oracle-context/` pattern:
        # the agent cannot widen its own context, and replies arrive framed as
        # evidence, never instructions. Read-only, so a dry run still builds it.
        id: context
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .reeve-context
          reeve greenlight-context --repo "$GITHUB_REPOSITORY" \
            --conf .github/reeve.conf --gh-output "$GITHUB_OUTPUT" \
            > .reeve-context/precedent.md
          echo "precedent digest: $(wc -l < .reeve-context/precedent.md) lines → .reeve-context/precedent.md"

      # One explicit run step per CHAIN LINK, walked in file order ACROSS
      # providers (issue #544 Part B): link 1 is the Z.AI GLM step, links 2-3
      # the Anthropic tail. A provider is a reviewed, git-tracked step because
      # Actions can reference a secret only by its literal name (secrets
      # can't be selected by a runtime variable), so the walk's provider
      # LAYOUT is fixed here and the registry's `reeve-greenlight` chain
      # (steps.chain.outputs) picks which MODEL each link runs — swapping the
      # drafter to another model is a registry edit, not a workflow edit; the
      # resolve step above refuses a chain that does not fit this layout. The
      # committed `provider:` label names the HEAD provider (link 1 must sit
      # on it); it no longer selects a whole block. Each link is gated on
      # EVERY earlier link NOT having succeeded — a skipped step's outcome is
      # 'skipped', not 'success', so the Anthropic tail runs whether the GLM
      # link failed or was skipped for want of ZAI_KEY — so the first success
      # short-circuits the rest and a dead model, or a whole dead provider,
      # falls through instead of killing the run. Each provider's steps gate
      # on THEIR OWN key (zai_key_present / anthropic_key_present), never the
      # other's. Deepening the chain is a same-PR pair: add the model to the
      # registry AND the matching run step here (and its slot in the resolve
      # step's --layout) — the drift guard fails either half shipped alone.
      #
      # Failure model: the drafter carries no SHIP-LOCK lifecycle, so the
      # non-terminal links (1-2) are continue-on-error so a dead id falls
      # through, and the TERMINAL link (3) keeps none — a total-walk failure
      # then fails the step, and the job, exactly as the single step did
      # before the tail existed. The "Turn an exhausted walk red" step at the
      # end covers the one case that rule misses: a walk exhausted with the
      # tail SKIPPED (only ZAI_KEY set, the GLM link dead) has no failed
      # non-coe step to fail the job. Either way `observe` still runs after
      # this job (always()), so the loop keeps learning through a drafter
      # outage.
      #
      # All three steps share the pin, the write permission, the ambient
      # GITHUB_TOKEN (right for the wrapper's comments — a GITHUB_TOKEN
      # comment triggers no CI, so the REGEN_TOKEN PAT reasoning does not
      # apply), the Select step's bound set, the post-cap state file, the
      # effort (high: a greenlight a human may approve on a 👍 is
      # expensive-to-be-wrong — the assessor's tier reasoning), the
      # transcript posture and the same /reeve-greenlight prompt. Tool
      # surface: the #442 wrapper
      # (.claude/skills/reeve-greenlight/greenlight-helper.sh, both path
      # spellings) is the agent's ONLY shell surface — reading AND writing,
      # which is why there is no MCP server here — plus the read-only file
      # tools (Read/Grep/Glob) for the charter (repo-root PM.md, docs/, the
      # skill) and the precedent digest the context step assembled. Never
      # Write, never a general Bash. --settings closes the additive allow
      # leak from settings.json with the loop's OWN deny backstop
      # (.claude/reeve-settings.json — deny beats allow from every source),
      # kept honest by scripts/reeve-perms-check.sh. The pin is the immutable
      # commit behind the v1 tag.

      - name: Run via Z.AI (GLM, chain link 1)
        id: run_zai_1
        if: >-
          steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.zai_key_present == '1'
          && inputs.dry_run != true
        # continue-on-error so the walk reaches the tail when this id or
        # provider is dead. The step timeout is main's whole pre-#544 job
        # budget — the head is never cut short on the common path — and a
        # stall past it is exactly what the shorter tail links are for.
        timeout-minutes: 30
        continue-on-error: true
        # Z.AI GLM via its Anthropic-compatible endpoint: ANTHROPIC_BASE_URL
        # points at Z.AI (the /api/anthropic path matters), ANTHROPIC_AUTH_TOKEN
        # becomes the Bearer token, and the same ZAI_KEY is passed as
        # anthropic_api_key to satisfy the action's credential check. Which
        # model exactly is the registry's `reeve-greenlight` chain's call —
        # its top GLM link, the head the conf names.
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_KEY }}
          API_TIMEOUT_MS: "3000000"
          # The wrapper authenticates its `gh` calls with this token; the job
          # grants issues:write and nothing more.
          GH_TOKEN: ${{ github.token }}
          # The trusted Select step's bounded set, bound into the agent's
          # environment so the wrapper can refuse any issue not in it.
          REEVE_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
          # The per-run post counter's state file: fresh runner temp per run,
          # so the cap counts THIS run's posts only. Shared by every link of
          # the walk on purpose — a link that posted and then died still
          # counts against the cap when the next link runs (and the wrapper's
          # already-greenlighted refusal keeps that link from re-drafting a
          # thread the dead one finished).
          REEVE_GREENLIGHT_STATE: ${{ runner.temp }}/reeve-greenlight-posts
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_KEY }}
          github_token: ${{ github.token }}
          # Keep the transcript off the public Actions log — this step holds a
          # provider key and GITHUB_TOKEN with issues:write; the run-outcome
          # summary and permission denials still surface.
          show_full_output: "false"
          claude_args: --model ${{ steps.chain.outputs.link1_model }} --effort high --permission-mode dontAsk --settings .claude/reeve-settings.json --allowedTools "Bash(.claude/skills/reeve-greenlight/greenlight-helper.sh:*),Bash(./.claude/skills/reeve-greenlight/greenlight-helper.sh:*),Read,Grep,Glob"
          prompt: /reeve-greenlight

      # The cross-provider tail (issue #544 Part B): links 2 and 3 of the
      # registry's `reeve-greenlight` chain on Anthropic's native endpoint,
      # reached only when the GLM link did not succeed (failed, or skipped
      # for want of ZAI_KEY) and gated on the Anthropic key's own presence.
      # Claude via api.anthropic.com: a plain API key (pay-per-token) is the
      # right fit for an unattended bot — no OAuth token / subscription seat.
      # The same pin, permission, token, bound set, state file, effort,
      # wrapper, backstop, transcript posture and prompt as the GLM link —
      # only the model, secret and endpoint differ. Which model runs is the
      # registry's call (the cheap Anthropic tier, for the monthly-cap reason
      # the registry records).
      - name: Run via Anthropic (Claude, chain link 2)
        id: run_anthropic_2
        if: >-
          steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && inputs.dry_run != true
          && steps.run_zai_1.outcome != 'success'
        timeout-minutes: 25
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REEVE_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
          REEVE_GREENLIGHT_STATE: ${{ runner.temp }}/reeve-greenlight-posts
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "false"
          claude_args: --model ${{ steps.chain.outputs.link2_model }} --effort high --permission-mode dontAsk --settings .claude/reeve-settings.json --allowedTools "Bash(.claude/skills/reeve-greenlight/greenlight-helper.sh:*),Bash(./.claude/skills/reeve-greenlight/greenlight-helper.sh:*),Read,Grep,Glob"
          prompt: /reeve-greenlight

      - name: Run via Anthropic (Claude, chain link 3)
        id: run_anthropic_3
        if: >-
          steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.anthropic_key_present == '1'
          && inputs.dry_run != true
          && steps.run_zai_1.outcome != 'success'
          && steps.run_anthropic_2.outcome != 'success'
        # The TERMINAL link: no continue-on-error, so the last id dying fails
        # the step (and the job) — the walk is over.
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          REEVE_SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
          REEVE_GREENLIGHT_STATE: ${{ runner.temp }}/reeve-greenlight-posts
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "false"
          claude_args: --model ${{ steps.chain.outputs.link3_model }} --effort high --permission-mode dontAsk --settings .claude/reeve-settings.json --allowedTools "Bash(.claude/skills/reeve-greenlight/greenlight-helper.sh:*),Bash(./.claude/skills/reeve-greenlight/greenlight-helper.sh:*),Read,Grep,Glob"
          prompt: /reeve-greenlight

      - name: Explain a skipped drafter run
        if: >-
          steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && steps.select.outputs.issues != ''
          && (steps.policy.outputs.key_present != '1'
              || inputs.dry_run == true)
        env:
          ISSUES: ${{ steps.select.outputs.issues }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — selected parked decisions (${ISSUES}) but did not invoke the greenlight drafter"
          else
            echo "::notice::no key is set for ANY provider in the reeve-greenlight chain (ZAI_KEY for the zai link, ANTHROPIC_API_KEY for the anthropic tail; head provider '${PROVIDER}') — selected (${ISSUES}) but skipping the greenlight drafter. The report ran and is unaffected."
          fi

      - name: Explain an empty selection
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight == 'true' && steps.select.outputs.issues == ''
        run: echo "::notice::no parked decisions awaiting a greenlight — every open needs-decision issue already carries one; nothing to draft"

      # No SHIP-LOCK lifecycle here, so the terminal link failing IS the job
      # failure — but before that stands, recover WHY the chain exhausted (the
      # agent steps hide their provider error) and route the human-fixable
      # causes — out of credit / out of tokens / bad key — to ONE deduped
      # needs-decision issue, so a scheduled red nobody watches becomes an
      # actionable ask. A bad model id or a transient blip is only diagnosed
      # in the log. Advisory: it never fails the job. Fires (always()) only
      # when the loop is lit, a selection existed, a key was present and the
      # walk did not succeed — the same three-link walk-outcome expression the
      # record step reports as RUN. Both keys go in so classify probes both
      # halves of the chain.
      - name: Diagnose the exhausted chain (billing / tokens / technical)
        id: triage
        if: >-
          always()
          && steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && inputs.dry_run != true
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        uses: ./.github/actions/provider-triage
        with:
          chain: reeve-greenlight
          zai-key: ${{ secrets.ZAI_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          context: the Reeve greenlight drafter
          escalate: "true"

      - name: Record the run outcome
        if: always()
        env:
          GREENLIGHT: ${{ steps.policy.outputs.greenlight }}
          ARMED: ${{ steps.policy.outputs.armed }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          CHAIN_OUTCOME: ${{ steps.chain.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          ISSUES: ${{ steps.select.outputs.issues }}
          KEY_PRESENT: ${{ steps.policy.outputs.key_present }}
          PROVIDER: ${{ steps.policy.outputs.provider }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The walk's outcome (#544): 'success' if ANY of the three links
          # across both providers succeeded; otherwise the outcome of the
          # LAST LINK THAT ACTUALLY RAN — the nested tail walks backwards
          # over 'skipped' links, so 'skipped' means every link was skipped
          # (no key for any provider), never "the tail had no key" after the
          # head failed. The terminal link failing fails the job; the "Turn
          # an exhausted walk red" step below covers a walk exhausted with
          # the tail skipped.
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
          # Per-link outcomes + the chain the resolve step emitted, so the
          # summary can name WHICH link served and warn when the head
          # provider fell through (a GLM outage must stay visible even though
          # the run is green — #544).
          L1: ${{ steps.run_zai_1.outcome }}
          L2: ${{ steps.run_anthropic_2.outcome }}
          L3: ${{ steps.run_anthropic_3.outcome }}
          M1: ${{ steps.chain.outputs.link1_model }}
          M2: ${{ steps.chain.outputs.link2_model }}
          M3: ${{ steps.chain.outputs.link3_model }}
          P1: ${{ steps.chain.outputs.link1_provider }}
          P2: ${{ steps.chain.outputs.link2_provider }}
          P3: ${{ steps.chain.outputs.link3_provider }}
        run: |
          # Which link served: the first (only) link whose outcome is success.
          served=""
          for i in 1 2 3; do
            o="L$i"; m="M$i"; p="P$i"
            if [ "${!o}" = "success" ]; then
              served="link $i ${!m} (${!p})"
              if [ "${!p}" != "${PROVIDER}" ]; then
                echo "::warning::the greenlight drafter fell through to ${!p}: every '${PROVIDER}' (head provider) link failed or was skipped and link $i ${!m} served — the run is green, but the head provider is down or keyless; check its quota/key"
              fi
              break
            fi
          done
          {
            echo "### Reeve greenlight — run outcome"
            if [ "$POLICY_OUTCOME" != "success" ]; then
              echo "- ❌ policy step did not complete (${POLICY_OUTCOME:-skipped}) — the conf did not parse; nothing ran."
            elif [ "$ARMED" != "true" ]; then
              echo "- ⏸️ the routine is paused in git (conf enabled != true); the drafter did not run."
            elif [ "$GREENLIGHT" != "true" ]; then
              echo "- ⏸️ 'greenlight' is false in .github/reeve.conf — the loop is built but not lit."
            elif [ "$POLL_OUTCOME" != "success" ] && [ "$POLL_OUTCOME" != "skipped" ]; then
              echo "- ❌ the approval poll did not complete (${POLL_OUTCOME}) — see the poll step log; no verdict was pushed and nothing was drafted."
            elif [ "$CHAIN_OUTCOME" != "success" ]; then
              echo "- ❌ the reeve-greenlight model chain did not resolve or fit the walk (${CHAIN_OUTCOME:-skipped}) — see the resolve step log; no key was spent."
            elif [ "$SELECT_OUTCOME" != "success" ]; then
              echo "- ❌ the selection did not complete (${SELECT_OUTCOME:-skipped}) — see the select step log; nothing was drafted."
            elif [ -z "$ISSUES" ]; then
              echo "- ✅ nothing to draft: every parked decision already carries a greenlight."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "- 🧪 dry run: selected #${ISSUES// / #} but did not draft."
            elif [ "$KEY_PRESENT" != "1" ]; then
              echo "- ⏭️ selected #${ISSUES// / #} but no provider in the reeve-greenlight chain has a key (head provider '${PROVIDER}') — skipped by notice, never red."
            elif [ "$RUN" != "success" ]; then
              echo "- provider: ${PROVIDER} (head)"
              echo "- ❌ the drafter did not complete on any link of the walk (walk outcome: ${RUN:-skipped}; links: ${L1:-skipped} / ${L2:-skipped} / ${L3:-skipped}) — see the ship step logs; the wrapper's refusals (cap, off-selection, already-greenlighted) each say why in the transcript summary."
            else
              echo "- provider: ${PROVIDER} (head)"
              echo "- ✅ drafter ran over #${ISSUES// / #} — check each thread for its greenlight comment."
              echo "- served by: ${served}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The terminal link (3) carries no continue-on-error, so its failure
      # fails the job — but a walk that exhausted with the tail SKIPPED (only
      # ZAI_KEY set and the GLM link dead) has no failed non-coe step, and
      # would leave the run green: exactly the silent-success disguise the
      # burn's red-on-death step exists for. Restore the failure last, after
      # the triage and the record have run (`observe` still follows — it
      # needs this job under always()). Same walk-outcome expression as the
      # triage gate and RUN above.
      - name: Turn an exhausted walk red
        if: >-
          always()
          && steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && steps.select.outputs.issues != ''
          && steps.policy.outputs.key_present == '1'
          && inputs.dry_run != true
          && (steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome)) != 'success'
        env:
          RUN: ${{ steps.run_zai_1.outcome == 'success' && 'success' || steps.run_anthropic_2.outcome == 'success' && 'success' || steps.run_anthropic_3.outcome == 'success' && 'success' || (steps.run_anthropic_3.outcome == 'skipped' && (steps.run_anthropic_2.outcome == 'skipped' && steps.run_zai_1.outcome || steps.run_anthropic_2.outcome) || steps.run_anthropic_3.outcome) }}
        run: |
          echo "::error::the /reeve-greenlight drafter did not succeed on any link of the reeve-greenlight chain (walk outcome: ${RUN}); failing the job so the exhaustion is visible"
          exit 1

  observe:
    name: Record resolved greenlight rounds into the precedent log
    # The learning half's write (issue #445): every greenlighted thread whose
    # gate RESOLVED since the last run — closed, or verdict-labeled by
    # decide.yml — yields one record in telemetry/reeve-greenlights.ndjson
    # (verdict, reasoning digest, the owner's reaction, the outcome), pushed to
    # the `telemetry` data branch so future drafter runs load it as precedent.
    # Its OWN job, not a late step in `greenlight`, so the secret-bearing agent
    # job keeps contents:read only: this job holds no provider secret and runs
    # no agent — it is `reeve greenlight-append` plus trusted git plumbing, the
    # ci.yml roll-up's exact vehicle (GITHUB_TOKEN, which triggers no workflow;
    # a PAT like REGEN_TOKEN would work here too but buys nothing). Runs after
    # the drafter regardless of its outcome: a round that resolved yesterday is
    # recorded today even if today's drafting died — the deterministic half
    # keeps learning through an agent outage.
    # While the AI andon cord is pulled the drafter job is skipped, but this
    # deterministic, keyless job must keep recording resolved rounds — so a
    # cord-skipped `greenlight` does not skip it (docs/andon-cord.md).
    needs: greenlight
    if: >-
      always()
      && (needs.greenlight.result != 'skipped' || vars.AI_ANDON_CORD == 'pulled')
      && vars.REEVE_ENABLED == 'true'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # the data-branch push below (the job's one write)
      contents: write
      # the rounds gather (src/reeve/github.py): search, thread comments,
      # timelines — all GET
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Belt-and-braces with the job `if:` — this job carries a write
          # scope, so it must not run a dispatched branch's tool code either.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install reeve
        run: pip install -e tools/reeve

      - name: Read policy (.github/reeve.conf)
        id: policy
        # The same gates the greenlight job reads, re-read here because this
        # job must decide for itself even when the drafter job failed early.
        env:
          REEVE_VARIABLE: ${{ vars.REEVE_ENABLED }}
        run: |
          set -euo pipefail
          enabled="$(reeve config --get enabled --path .github/reeve.conf)"
          greenlight="$(reeve config --get greenlight --path .github/reeve.conf)"
          reeve armed --variable "$REEVE_VARIABLE" --conf-enabled "$enabled"
          {
            echo "enabled=$enabled"
            echo "greenlight=$greenlight"
          } >> "$GITHUB_OUTPUT"

      - name: Paused in git
        if: steps.policy.outputs.armed != 'true'
        env:
          CONF_ENABLED: ${{ steps.policy.outputs.enabled }}
        run: |
          echo "::notice::Reeve is armed (REEVE_ENABLED=true) but .github/reeve.conf says 'enabled: ${CONF_ENABLED}' — the observer records nothing. Flip the conf in a reviewed PR to resume."

      - name: Greenlight loop disabled in git
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight != 'true'
        env:
          CONF_GREENLIGHT: ${{ steps.policy.outputs.greenlight }}
        run: |
          echo "::notice::.github/reeve.conf says 'greenlight: ${CONF_GREENLIGHT}' — the loop is not lit, so the observer records nothing (no greenlights exist to resolve)."

      - name: Dry run — skipping the append
        if: steps.policy.outputs.armed == 'true' && steps.policy.outputs.greenlight == 'true' && inputs.dry_run
        run: |
          echo "::notice::dry run — the observer derives nothing and pushes nothing."

      - name: Derive and push records for newly-resolved rounds
        id: append
        if: >-
          steps.policy.outputs.armed == 'true'
          && steps.policy.outputs.greenlight == 'true'
          && inputs.dry_run != true
        env:
          # GITHUB_TOKEN is enough: the target branch is unprotected and the
          # push triggers no workflow (CI runs on push: [main] only) — the
          # ci.yml roll-up's reasoning, verbatim.
          PUSH_TOKEN: ${{ github.token }}
          DATA_BRANCH: telemetry
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            # Seed the live files from the data branch's tip if it exists; the
            # committed seeds in the checkout are the first-run fallback. The
            # re-seed on retry matters: a contended branch advanced under us,
            # and greenlight-append re-derives against whatever the new tip
            # holds (idempotent — a recorded round derives nothing).
            lease=""
            if git fetch "$url" "$DATA_BRANCH" 2>/dev/null; then
              git show FETCH_HEAD:telemetry/log.ndjson > telemetry/log.ndjson
              git show FETCH_HEAD:telemetry/REPORT.md > telemetry/REPORT.md 2>/dev/null || true
              git show FETCH_HEAD:telemetry/reeve-greenlights.ndjson \
                > telemetry/reeve-greenlights.ndjson 2>/dev/null || true
              lease="$(git rev-parse FETCH_HEAD)"
            fi
            reeve greenlight-append --repo "$GITHUB_REPOSITORY" \
              --conf .github/reeve.conf --ledger .github/decisions/ledger.conf \
              --gh-output "$GITHUB_OUTPUT"
            appended="$(sed -n 's/^appended=//p' "$GITHUB_OUTPUT" | tail -1)"
            if [ "${appended:-0}" = "0" ]; then
              echo "no newly-resolved greenlight rounds — nothing to push"
              exit 0
            fi
            # Rebuild the THREE-file data branch with plumbing (never touching
            # main's index or working tree) — ci.yml's roll-up shape, plus the
            # precedent log. log.ndjson/REPORT.md ride along unchanged from the
            # tip so this push can never clobber a gate-run record.
            log_blob="$(git hash-object -w telemetry/log.ndjson)"
            rpt_blob="$(git hash-object -w telemetry/REPORT.md)"
            gl_blob="$(git hash-object -w telemetry/reeve-greenlights.ndjson)"
            subtree="$(printf '100644 blob %s\tlog.ndjson\n100644 blob %s\tREPORT.md\n100644 blob %s\treeve-greenlights.ndjson\n' \
              "$log_blob" "$rpt_blob" "$gl_blob" | git mktree)"
            root="$(printf '040000 tree %s\ttelemetry\n' "$subtree" | git mktree)"
            commit="$(git commit-tree "$root" -m "Reeve greenlights: resolved rounds through run ${GITHUB_RUN_ID}")"
            if [ -n "$lease" ]; then
              git push --force-with-lease="refs/heads/${DATA_BRANCH}:${lease}" \
                "$url" "${commit}:refs/heads/${DATA_BRANCH}" && ok=1 || ok=0
            else
              git push "$url" "${commit}:refs/heads/${DATA_BRANCH}" && ok=1 || ok=0
            fi
            if [ "$ok" = "1" ]; then
              echo "recorded ${appended} newly-resolved round(s) — precedent log pushed to the ${DATA_BRANCH} branch"
              exit 0
            fi
            echo "push contended (attempt ${attempt}) — ${DATA_BRANCH} advanced, re-seeding and re-deriving"
          done
          # Non-fatal by design (the roll-up's stance): the rounds re-derive
          # next run, so advisory bookkeeping must not redden a run whose
          # drafting already succeeded.
          echo "::warning::could not push the precedent log after 3 attempts — the rounds re-derive next run."

      - name: Record the run outcome
        if: always()
        env:
          ARMED: ${{ steps.policy.outputs.armed }}
          GREENLIGHT: ${{ steps.policy.outputs.greenlight }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          APPEND_OUTCOME: ${{ steps.append.outcome }}
          APPENDED: ${{ steps.append.outputs.appended }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Reeve greenlight — precedent log"
            if [ "$POLICY_OUTCOME" != "success" ]; then
              echo "- ❌ policy step did not complete (${POLICY_OUTCOME:-skipped}) — the conf did not parse; nothing recorded."
            elif [ "$ARMED" != "true" ]; then
              echo "- ⏸️ the routine is paused in git; the observer recorded nothing."
            elif [ "$GREENLIGHT" != "true" ]; then
              echo "- ⏸️ 'greenlight' is false in .github/reeve.conf; the observer recorded nothing."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "- 🧪 dry run: the observer derived and pushed nothing."
            elif [ "$APPEND_OUTCOME" != "success" ]; then
              echo "- ❌ the observer did not complete (${APPEND_OUTCOME:-skipped}) — see the append step log; nothing was pushed."
            elif [ "${APPENDED:-0}" = "0" ]; then
              echo "- ✅ no newly-resolved rounds — the precedent log is current."
            else
              echo "- ✅ recorded ${APPENDED} newly-resolved round(s) to the telemetry branch's precedent log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  disarmed-notice:
    # The visible no-op: a skipped gated job is mute, so a sibling with no
    # permissions and no secrets says why nothing happened — including the
    # AI andon cord, which greys the `greenlight` job (docs/andon-cord.md).
    if: vars.REEVE_ENABLED != 'true' || github.ref_name != github.event.repository.default_branch || vars.AI_ANDON_CORD == 'pulled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain why nothing ran
        env:
          # Env indirection — never interpolate ref names or variables directly
          # into run: (the siblings' template-injection rule).
          ENABLED_VAR: ${{ vars.REEVE_ENABLED }}
          REF: ${{ github.ref_name }}
          # A boolean string computed in the expression layer, so GitHub's
          # case-insensitive comparison stays authoritative.
          ANDON: ${{ vars.AI_ANDON_CORD == 'pulled' }}
        run: |
          if [ "${ANDON:-}" = "true" ]; then
            echo "::notice::AI andon cord is pulled (repo variable AI_ANDON_CORD=pulled) — Reeve's greenlight drafter did not run (the deterministic report and observer ran and are unaffected; the report carries the 🛑 banner); no provider API call was made and nothing was escalated. Release the cord (delete the variable, or set it to anything but 'pulled') to resume — see docs/andon-cord.md."
          elif [ "$ENABLED_VAR" != "true" ]; then
            echo "::notice::Reeve is disarmed — set the repo variable REEVE_ENABLED=true (and keep .github/reeve.conf 'enabled: true') to arm it. Two keys must agree; this is the live one."
          else
            echo "::notice::Reeve only runs from the default branch — this dispatch targeted '${REF}'."
          fi
