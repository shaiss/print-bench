# Policy for the scheduled spike converter (issue #440, child C of #245) —
# the git-tracked source of truth for WHAT the routine does, mirroring
# .github/product-scout.conf and its siblings. A clone carries it, every run
# reads it identically, and changing it is a reviewed one-line diff.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`         — reproducible intent, in git, reviewed
#   2. repo variable SPIKE_CONVERTER_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings → Secrets and variables →
#      Actions → Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that WRITES issues should be a conscious act a fresh
#      clone/fork does not inherit, and flipping it off halts the routine in
#      seconds without a commit.
#
# Read by tools/backlog-burn's config parser (the same one the labeler and
# the scout reuse — the converter uses only `enabled`/`provider`/`cadence`,
# not the selector):
#   backlog-burn config --get <key> --path .github/spike-converter.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.
# NO parser key exists for the per-run cap, on purpose: the burn's parser has
# a closed key set by design, so the cap is the workflow env SCOUT_MAX_BRIEFS
# (set to 1 in .github/workflows/spike-converter.yml) — read by the reused
# scout MCP filing tool, exactly the product-scout.yml pattern.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Which LLM PROVIDER the /spike-converter walk STARTS on — the HEAD provider
# (issue #544 Part B). Each provider has matching, git-tracked run steps in
# .github/workflows/spike-converter.yml (with its endpoint + which secret it
# uses). Reshaping a human-vetted research section into a brief is the
# cheap-to-be-wrong case, so the cheap Z.AI tier is the default head — a bad
# brief is one a human closes.
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (default)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
# WHICH MODEL each link runs is NOT this file's call: the registry's
# `[chain:spike-converter]` (.github/models/registry.conf, #206) decides it.
# Link 1 of that chain must sit on the provider named here; the chain's TAIL
# may cross to the other provider (today: the GLM head, then the Anthropic
# tail), in the workflow's run-step order — the workflow's resolve step
# checks that shape and fails up front on a mismatch, so flipping this line
# means re-tailoring the chain in the same PR.
provider: zai

# How often the routine fires. A raw 5-field cron literal (kept identical to
# the `cron:` literal in spike-converter.yml — Actions can't read a file for
# on.schedule). Weekly on Tuesday 05:59 UTC: one candidate → one brief per
# week is the ceiling the extractor's one-per-firing rule already bounds, and
# Tuesday keeps the converter's proposal a day off the product scout's Monday
# run so a human's culling load never stacks on one morning.
cadence: 59 5 * * 2
