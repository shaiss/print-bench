# Policy for Reeve, the platform PM's scheduled ops routine (issue #272) — the
# git-tracked source of truth for WHAT the routine does, mirroring
# .github/backlog-groomer.conf and its selector-based siblings. A clone carries
# it, every run reads it identically, and changing it is a reviewed one-line
# diff.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`     — reproducible intent, in git, reviewed
#   2. repo variable REEVE_ENABLED == 'true' — the deliberate, fast, human-only
#      arming/kill switch (Settings → Secrets and variables → Actions →
#      Variables, or `gh variable set`). Not in git on purpose: arming an agent
#      that WRITES an issue should be a conscious act a fresh clone/fork does not
#      inherit, and flipping it off halts the routine in seconds without a
#      commit. Shipped disarmed: the variable is unset.
#
# Read by tools/reeve's own strict parser (the same house `key: value` format
# contract the siblings keep; unknown/duplicate/malformed keys fail loudly):
#   reeve config --get <key> --path .github/reeve.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# How often the routine fires. A raw 5-field cron literal, kept IDENTICAL to the
# `cron:` literal in .github/workflows/reeve.yml (Actions can't read a file for
# on.schedule; a test pins the two together). Daily at 05:53 UTC — an off-peak
# slot after the :11 (labeler), :17 (burn), :23 (design run), :29 (chunker),
# :41 (groomer) and :47 (scout) sibling slots. Reeve reads the committed
# telemetry and preview sizes (not the issue backlog), and the roll-up refreshes
# that telemetry on default-branch pushes, so a daily calm cadence is right;
# bump it here and in the workflow together.
cadence: 53 5 * * *

# --- greenlight loop (issue #296 stage 2; vocabulary landed first in #441) ----
# The advisory-greenlight loop's config vocabulary — the keys the whole loop
# keys off, landed alone so every later piece (#442 wrapper, #443 drafter
# step) is a consumer rather than a format negotiation. Nothing reads them
# yet; they are inert by construction until those pieces land.

# The reproducible on/off for the greenlight loop, shipped disarmed. This is
# NOT a second repo variable: per #296's spec the loop's workflow step is
# separate from the keyless reporter, keyed on its provider secret, and skips
# with a ::notice:: when that secret is absent — so the live kill switch is
# withdrawing the secret, and this key stays the reviewed, in-git intent.
greenlight: false

# Which LLM PROVIDER the greenlight drafter's walk STARTS on — the HEAD
# provider (issue #544 Part B; the key itself landed with #443). The
# DETERMINISTIC REPORTER is keyless and providerless — this key scopes to the
# greenlight job alone. Each provider has matching, git-tracked run steps in
# .github/workflows/reeve.yml's greenlight job (with its endpoint + which
# secret it uses). Verdict-drafting on platform decisions is
# expensive-to-be-wrong (the assessor's tier reasoning), so the walk leads
# with the top GLM tier as its head.
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (default)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
# WHICH MODEL each link runs is NOT this file's call: the registry's
# `[chain:reeve-greenlight]` (.github/models/registry.conf, #206) decides
# it. Link 1 of that chain must sit on the provider named here; the chain's
# TAIL may cross to the other provider (today: the GLM head, then the
# Anthropic tail), in the workflow's run-step order — the workflow's resolve
# step checks that shape and fails up front on a mismatch, so flipping this
# line means re-tailoring the chain in the same PR.
provider: zai

# Max greenlight comments per run (6 = the stage-1 round size), enforced by
# the piece-2 wrapper (#442) and read via conf so tuning is a reviewed diff.
greenlight_cap: 6

# The learning half's context bound (issue #445): how many of the most recent
# precedent-log records — plus the inline owner replies on their threads — the
# drafter's prompt carries. Digest-sized on purpose, so the injected context
# cannot grow unbounded as rounds accumulate; the log itself keeps everything.
greenlight_precedent_cap: 6

# --- standing approval modes (issue #446, #296 loop item 5) -------------------
# Per-category standing rules the approval poll (#444) consults — the
# session-permission-mode analogue #296 named. Comma lists over the closed
# vocabulary in tools/reeve/src/reeve/approval.py (docs, gates); a category in
# neither list ASKS, which is #444's behaviour unchanged: an advisory greenlight
# that resolves only on a write-permission 👍 or a /decide. An unknown name, a
# repeat, or a category in both lists fails the parse; an absent or empty key
# means nothing auto-approves and nothing is denied (fail-safe: everything asks).
#
#   approve_auto — a YES greenlight resolves with NO reaction once the 👎 grace
#                  window (20h from its post) passes with no overrule; a NO
#                  still asks. Only a TRUSTED signal places an issue here: the
#                  category's label (docs → `docs-only`) applied by a human with
#                  write permission — never the issue text, never a bot.
#   approve_deny — human only: Reeve drafts no greenlight and the poll never
#                  resolves one, not even on a 👍. The category's label OR the
#                  issue's own text (gates: a *-check.sh, ci.yml, gate.sh, a
#                  *-settings.json backstop …) places an issue here — text may
#                  only ever tighten.
#
# The owner's minimal set (2026-08-30, #446): auto-approve doc-only follow-ups,
# deny anything touching gate machinery, everything else asks. Inert while
# `greenlight: false` — the poll that reads these runs only in a lit loop.
approve_auto: docs
approve_deny: gates

# --- detector thresholds -----------------------------------------------------
# The pulse's sensitivities. All optional (each falls back to the built-in
# default in tools/reeve/src/reeve/config.py); listed here so tuning is a
# reviewed diff, not a code change.

# A committed preview flagged when its size headroom drops under this percent
# (the readme-gate budget's warning zone; matches tools/telemetry's 15%).
low_headroom_pct: 15

# A part flagged when its printcheck score drops by at least this many points
# versus the prior full-catalog run.
score_drop: 3

# A part flagged when its absolute printcheck score is below this floor.
score_floor: 80

# A design's render+gate wall time flagged when it rises by at least this
# multiple versus the prior full-catalog run …
walltime_ratio: 1.5

# … but only once the current time is at least this many seconds (so tiny
# designs' noise doesn't fire it).
walltime_min_seconds: 30

# A scheduled routine flagged dead when none of its last N completed runs
# succeeded and at least one hard-failed (a pure-cancelled streak is queue
# noise). Capped at 10 — the run-health gather fetches only that many runs
# per workflow.
routine_dead_runs: 3

# An active 🚢 SHIP-LOCK with no corroborating branch or closing PR flagged as
# leaked once older than this many hours — the ghost claim a killed run leaves
# behind (issue #312). Must sit ABOVE the longest agent-step budget and BELOW
# the selector's 6h stale-lock takeover: a healthy design run posts its lock
# first and only pushes a branch / opens the draft PR near the end, so for the
# whole render→slice→iterate cycle — up to design-run.yml's 220-min (~3.7h)
# step budget — the claim legitimately has nothing corroborating it. Anything
# at or under that budget would flag every long-but-healthy in-flight run as a
# leak; 4h clears it yet still surfaces a genuine leak before the selector's
# own 6h recovery quietly absorbs it.
lock_leak_hours: 4
