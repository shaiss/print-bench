name: Install OpenSCAD nightly (cached)
description: >
  Install openscad-nightly from the OBS home:t-paul repository, caching the
  downloaded .deb packages between runs. Five jobs need the nightly engine and
  each used to pay the OBS repo add + apt update + download on every run
  (~30s-2min per job); on a cache hit this installs from the cached packages
  without touching the OBS repo at all. The cache key pins the package set
  until `cache-version` is bumped — the same convention as ci.yml's apt cache
  keys — which has a side benefit: every job in a run installs the SAME
  nightly build, instead of whatever OBS happens to serve each job.
inputs:
  cache-version:
    description: >
      Cache key epoch; bump to re-download the current OBS packages (e.g.
      monthly, or when a nightly fix is needed). Keep it in sync with the
      value ci.yml passes so all five jobs share one cache entry.
    required: false
    default: "2026-10"
runs:
  using: composite
  steps:
    - name: Restore cached openscad-nightly packages
      id: debs
      uses: actions/cache@v4
      with:
        path: ~/.cache/openscad-nightly-debs
        # No restore-keys on purpose: a partial match could mix packages from
        # two different OBS snapshots, and dpkg would install the pair without
        # complaint.
        key: openscad-nightly-debs-${{ runner.os }}-${{ inputs.cache-version }}
    - name: Download openscad-nightly from OBS (cache miss)
      if: steps.debs.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # signed-by binds the OBS key to this one repository — a key dropped
        # into trusted.gpg.d would be trusted for every configured repo.
        curl -fsSL 'https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/Release.key' \
          | sudo gpg --dearmor -o /usr/share/keyrings/openscad-nightly.gpg
        echo 'deb [signed-by=/usr/share/keyrings/openscad-nightly.gpg] https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ /' \
          | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
        sudo apt-get update
        # --download-only into the cache dir: this fetches openscad-nightly
        # AND every dependency the runner image is missing, so the install
        # step below can work from the cache alone on the next run.
        mkdir -p "$HOME/.cache/openscad-nightly-debs/partial"
        sudo apt-get install -y --download-only \
          -o "Dir::Cache::archives=$HOME/.cache/openscad-nightly-debs" \
          openscad-nightly
        # apt downloads as root; the cache action tars as the runner user.
        sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/openscad-nightly-debs"
        # The debs are downloaded; drop the repo entry so any later apt step
        # in the same job resolves against the stock Ubuntu archives only —
        # matching what a cache-hit run sees, where OBS is never added.
        sudo rm -f /etc/apt/sources.list.d/openscad-nightly.list
    - name: Install openscad-nightly from the cached packages
      shell: bash
      run: |
        set -euo pipefail
        # Guarded glob: a restored-but-empty cache would otherwise hand dpkg
        # the literal '*.deb' and fail with a message pointing nowhere near
        # the actual problem.
        shopt -s nullglob
        debs=("$HOME"/.cache/openscad-nightly-debs/*.deb)
        if [ "${#debs[@]}" -eq 0 ]; then
          echo "::error::the openscad-nightly deb cache restored empty — bump the cache-version input (ci.yml passes it) to force a fresh OBS download"
          exit 1
        fi
        # dpkg -i over the whole set resolves the install order itself; the
        # apt -f fallback pulls any residual dependency from the stock Ubuntu
        # archives (never from OBS, which on a cache hit was never added).
        # apt-get update first: on a cache hit nothing has refreshed the
        # package lists this job, and -f resolution needs current ones.
        if ! sudo dpkg -i "${debs[@]}"; then
          sudo apt-get update
          sudo apt-get install -y -f
        fi
        openscad-nightly --version
