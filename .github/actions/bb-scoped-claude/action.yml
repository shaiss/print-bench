name: "Backlog-burn scoped Claude"
description: >
  Run the pinned anthropics/claude-code-action entrypoint inside a transient
  systemd scope (bb-agent-<run_id>-<attempt>-<link>), as the runner user.
  Secrets travel only via inherited process env (sudo --preserve-env); never
  via systemd-run --setenv/-E or unit properties. If sudo -n fails, warn and
  run the agent without a scope (no PID-snapshot fallback).

inputs:
  link_index:
    description: "Workflow-derived link index (1..5); never from agent output"
    required: true
  anthropic_api_key:
    description: "Provider API key (same as claude-code-action)"
    required: true
  github_token:
    description: "GitHub token for the action"
    required: true
  claude_args:
    description: "Arguments forwarded to Claude Code"
    required: true
  prompt:
    description: "Prompt / skill invocation"
    required: true
  show_full_output:
    description: "Forwarded to claude-code-action"
    required: false
    default: "false"
  # Exact upstream action commit the burn workflow already pins.
  action_ref:
    description: "anthropics/claude-code-action git SHA"
    required: false
    default: "374f254f5efaf968abfe15d399fd90972e8138b9"

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Materialize pinned claude-code-action
      shell: bash
      env:
        ACTION_REF: ${{ inputs.action_ref }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/bb-cca-${ACTION_REF}"
        if [ ! -f "${dest}/src/entrypoints/run.ts" ]; then
          rm -rf "${dest}"
          mkdir -p "${dest}"
          archive="${RUNNER_TEMP}/bb-cca-${ACTION_REF}.tar.gz"
          curl -fsSL \
            "https://github.com/anthropics/claude-code-action/archive/${ACTION_REF}.tar.gz" \
            -o "${archive}"
          tar -xzf "${archive}" -C "${dest}" --strip-components=1
          rm -f "${archive}"
        fi
        test -f "${dest}/src/entrypoints/run.ts"
        echo "BB_CCA_PATH=${dest}" >> "$GITHUB_ENV"

    - name: Install action dependencies
      shell: bash
      run: |
        set -euo pipefail
        cd "${BB_CCA_PATH}"
        bun install --production

    - name: Run agent inside systemd scope
      shell: bash
      env:
        # Unit name parts — workflow-derived only (constraint b).
        BB_LINK_INDEX: ${{ inputs.link_index }}
        BB_RUN_ID: ${{ github.run_id }}
        BB_RUN_ATTEMPT: ${{ github.run_attempt }}
        # Agent inputs via normal step env (inherited; never --setenv).
        MODE: ""
        PROMPT: ${{ inputs.prompt }}
        TRIGGER_PHRASE: "@claude"
        ASSIGNEE_TRIGGER: ""
        LABEL_TRIGGER: "claude"
        BASE_BRANCH: ""
        BRANCH_PREFIX: "claude/"
        BRANCH_NAME_TEMPLATE: ""
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        ALLOWED_BOTS: ""
        ALLOWED_NON_WRITE_USERS: ""
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ env.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB || '' }}
        CLAUDE_CODE_SCRIPT_CAPS: ${{ env.CLAUDE_CODE_SCRIPT_CAPS || '' }}
        INCLUDE_COMMENTS_BY_ACTOR: ""
        EXCLUDE_COMMENTS_BY_ACTOR: ""
        GITHUB_RUN_ID: ${{ github.run_id }}
        USE_STICKY_COMMENT: "false"
        CLASSIFY_INLINE_COMMENTS: "false"
        DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
        USE_COMMIT_SIGNING: "false"
        SSH_SIGNING_KEY: ""
        BOT_ID: "41898282"
        BOT_NAME: "claude[bot]"
        TRACK_PROGRESS: "false"
        INCLUDE_FIX_LINKS: "true"
        ADDITIONAL_PERMISSIONS: ""
        CLAUDE_ARGS: ${{ inputs.claude_args }}
        INPUT_PROMPT_FILE: ${{ runner.temp }}/claude-prompts/claude-prompt.txt
        INPUT_SETTINGS: ""
        INPUT_EXPERIMENTAL_SLASH_COMMANDS_DIR: ""
        INPUT_PATH_TO_CLAUDE_CODE_EXECUTABLE: ""
        INPUT_PATH_TO_BUN_EXECUTABLE: ""
        INPUT_SHOW_FULL_OUTPUT: ${{ inputs.show_full_output }}
        DISPLAY_REPORT: "true"
        INPUT_PLUGINS: ""
        INPUT_PLUGIN_MARKETPLACES: ""
        PATH_TO_CLAUDE_CODE_EXECUTABLE: ""
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        CLAUDE_CODE_OAUTH_TOKEN: ""
        # Caller may set ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN / API_TIMEOUT_MS
        # on the step env; sudo --preserve-env keeps them for the scoped process.
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/claude-prompts"
        # Slash-commands dir lives inside the materialized action.
        export INPUT_EXPERIMENTAL_SLASH_COMMANDS_DIR="${BB_CCA_PATH}/slash-commands"
        export GITHUB_ACTION_PATH="${BB_CCA_PATH}"

        UNIT="bb-agent-${BB_RUN_ID}-${BB_RUN_ATTEMPT}-${BB_LINK_INDEX}"
        # Reject anything that is not a safe unit token (defense in depth;
        # values come only from github.* / link_index inputs).
        case "${UNIT}" in
          bb-agent-[0-9]*-[0-9]*-[0-9]*) ;;
          *)
            echo "::error::refusing unsafe unit name" >&2
            exit 1
            ;;
        esac
        echo "bb_agent_unit=${UNIT}" >> "$GITHUB_OUTPUT"

        run_agent() {
          bun --no-env-file \
            --config="${BB_CCA_PATH}/bunfig.toml" \
            run "${BB_CCA_PATH}/src/entrypoints/run.ts"
        }

        if ! sudo -n true 2>/dev/null; then
          echo "::warning::sudo -n failed — running agent without cgroup scope (no PID-snapshot fallback)"
          run_agent
          exit $?
        fi

        # sudo --preserve-env: inherit the step env (including secrets) without
        # listing values on the command line or as unit properties.
        # --uid/--gid: agent runs as the runner user, never root.
        # No systemd-run -E/--setenv (secrets would appear in systemctl show).
        sudo --preserve-env \
          systemd-run --scope \
          --uid="$(id -u)" \
          --gid="$(id -g)" \
          --unit="${UNIT}" \
          --collect \
          --quiet \
          -- bun --no-env-file \
            --config="${BB_CCA_PATH}/bunfig.toml" \
            run "${BB_CCA_PATH}/src/entrypoints/run.ts"
