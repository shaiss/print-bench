name: Provider failure triage
description: >-
  Diagnose a model-registry chain that failed on EVERY link — billing / out of
  tokens / bad key / a retryable blip / an unservable id — and route the
  human-fixable causes to ONE deduplicated needs-decision issue. The ship steps
  hide their own provider error ("full output hidden for security"), so this
  probes each configured link with a live 1-token request to recover the real
  HTTP cause (`model-registry classify`, issue #347), then exposes the aggregate
  `class` (the action bucket) and `reason` (the finer cause) as outputs and
  escalates on the account/config causes. The escalation is shared and
  reason-keyed (issue #550): every chain that exhausts with the same reason
  joins one open issue — per-chain detail lines in the body — so one `/decide`
  resolves the set; the rule lives in `model_registry.escalation`, the same
  tested unit oracle.yml's own exhaustion leg calls. It is ADVISORY: it never
  fails the job on a decided outcome — the calling workflow decides whether to
  red on the class — it only classifies and escalates.

inputs:
  chain:
    description: The registry chain id that exhausted (e.g. review, backlog-burn).
    required: true
  zai-key:
    description: ZAI_KEY secret value (empty when the run holds no Z.AI key).
    required: false
    default: ""
  anthropic-key:
    description: ANTHROPIC_API_KEY value (empty when the run holds no Anthropic key).
    required: false
    default: ""
  github-token:
    description: A token with issues:write, for filing the escalation issue.
    required: true
  context:
    description: >-
      Human label for what failed, woven into the escalation (e.g.
      "the Jane/Drik design-review chain").
    required: true
  escalate:
    description: >-
      When 'true' (default), file/refresh a deduped needs-decision issue on a
      human-fixable cause (billing / quota / auth / no-key). Set 'false' to
      classify only — for a sibling job that must not double-file on the same
      chain.
    required: false
    default: "true"

outputs:
  class:
    description: The action bucket — servable | dead | needs-human | transient.
    value: ${{ steps.classify.outputs.class }}
  reason:
    description: >-
      The finer cause — served | bad-model-id | billing | quota | auth | no-key
      | rate-limit | outage.
    value: ${{ steps.classify.outputs.reason }}

runs:
  using: composite
  steps:
    # Recover the real cause the ship steps hid. Runs from the caller's checkout,
    # so `model_registry` resolves through PYTHONPATH exactly as the resolve step
    # that fed the walk did. Exit 0 regardless — the class/reason ARE the signal.
    - id: classify
      shell: bash
      env:
        PYTHONPATH: tools/model-registry/src
        CHAIN: ${{ inputs.chain }}
        ZAI_KEY: ${{ inputs.zai-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-key }}
      run: |
        set -uo pipefail
        python3 -m model_registry classify "$CHAIN" --gh-output "$GITHUB_OUTPUT"

    # needs-human — the account/config problem CI cannot fix (out of credit, out
    # of tokens, or a bad/missing key). Raise it through the decision gate as
    # ONE shared, reason-keyed needs-decision issue (issue #550): a chain that
    # exhausts while an open issue for its reason exists JOINS it — detail line
    # in the body, never a duplicate issue — so a dual-provider outage files one
    # escalation and one /decide resolves the whole set, with remediation
    # tailored to the reason. dead / transient / servable are the caller's to
    # message. The whole rule lives in model_registry.escalation (tested, and
    # shared with oracle.yml's own exhaustion leg, so the two surfaces cannot
    # drift apart); trusted base-branch Python from the caller's checkout, no
    # PR-head code — the same trust posture as the classify step above.
    - id: escalate
      if: ${{ inputs.escalate == 'true' && steps.classify.outputs.class == 'needs-human' }}
      shell: bash
      env:
        PYTHONPATH: tools/model-registry/src
        ESCALATION_TOKEN: ${{ inputs.github-token }}
        CHAIN: ${{ inputs.chain }}
        REASON: ${{ steps.classify.outputs.reason }}
        CONTEXT: ${{ inputs.context }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        python3 -m model_registry escalate "$CHAIN" \
          --reason "$REASON" --context "$CONTEXT" --repo "$REPO" \
          --token-env ESCALATION_TOKEN
