# Provider / model registry — the single source of truth for which models the
# agentic workflows run, in what preference order, and why (issue #206).
#
# Before this file, every agentic workflow (auto-review.yml first) hard-coded its
# provider + model + fallback order inline, duplicated across jobs. Changing a
# model or reordering a chain meant editing each job's YAML by hand. This file is
# the reproducible source of truth — it lives in git, travels with a clone, and
# every run reads it identically. GitHub supplies only the auth (the literal
# secret references the Actions runtime requires); the *decision* — which models,
# in what order — is this file's.
#
# INI stanzas, parsed by tools/model-registry (stdlib configparser), one stanza
# per entity. The bracketed section name is `<kind>:<id>`:
#
#   [provider:<id>]   an LLM provider.
#       secret   = the repo secret that authenticates it (referenced LITERALLY in
#                  the workflow YAML — Actions cannot select a secret by a runtime
#                  variable, so each provider still owns an explicit ship step).
#       base_url = optional Anthropic-compatible endpoint. Omit for Anthropic's
#                  native endpoint.
#       notes    = optional free text.
#
#   [model:<id>]      a model, hosted by exactly one provider.
#       provider = the [provider:<id>] that serves it (must resolve, or load fails).
#       notes    = REQUIRED when/why-to-use-it: cost, capability, quality — the
#                  whole point of the registry is to say why a model is where it is.
#
#   [chain:<id>]      a named, ORDERED fallback chain a job routes to by name.
#       models   = comma-separated model ids, in preference order. A job walks the
#                  chain, trying each link until one succeeds. Every id must resolve
#                  to a [model:<id>] (a dangling reference fails the load, naming it).
#
# Reordering or swapping a model within a chain is an edit HERE, not in the job.
# Adding a NEW provider still needs a reviewed workflow ship step too (the literal
# secret), the way backlog-burn.yml documents — the registry is the decision, the
# workflow supplies the literal secret wiring. Unknown fields, missing required
# fields, duplicate stanzas, and dangling references all fail the load loudly with
# the stanza id in the message. `model-registry check` validates the whole file.

# ── Providers ────────────────────────────────────────────────────────────────

[provider:zai]
secret   = ZAI_KEY
base_url = https://api.z.ai/api/anthropic
notes    = Z.AI GLM family via the Anthropic-compatible endpoint. FRONTIER-class
           quality at lower cost than Opus/Fable — the preferred first choice, not
           a downgrade. Routing a Claude Code skill to a non-Claude model is
           best-effort at the harness level, but the models themselves are
           frontier. Also the cross-vendor partner: an independent second vendor
           whose blind spots differ from Anthropic's.

[provider:anthropic]
secret   = ANTHROPIC_API_KEY
notes    = Anthropic native endpoint. Frontier quality at higher cost — the
           cross-vendor partner to Z.AI and the fallback when the GLM links are
           unavailable. Not "the" frontier tier (GLM is frontier too); the more
           expensive one.

# ── Models (ordered preference is expressed by the chains, not here) ──────────

[model:glm-5.3]
provider = zai
notes    = Top GLM link and the default first choice: newest GLM, frontier-class
           quality at a fraction of Opus/Fable cost. The overall-cheaper frontier
           model the chains prefer before falling back to Anthropic.

[model:glm-5.2]
provider = zai
notes    = Second GLM link: prior GLM, frontier-class and near-equivalent to 5.3,
           reached if 5.3 is unavailable. Not a quality downgrade — a version step.

[model:glm-5.1]
provider = zai
notes    = Fallback if 5.2 is unavailable — prior GLM, near-equivalent quality.

[model:glm-4.6]
provider = zai
notes    = Last GLM fallback: older, larger context, still capable enough for a
           review when the newer GLMs are down.

# The Anthropic tail is a CHAIN of model ids, not a single model (issue #298):
# one unservable id — a deprecation, a key without access to one tier — must not
# kill the whole backstop. It LEADS with Opus 4.8, the Anthropic model the team's
# own design work rates highest (Opus 5 is verbose/prose in practice and is kept
# declared but out of the default chains). `model-registry smoke <chain>` (the
# model-smoke.yml workflow) proves each link is actually callable with a real
# 1-token request before it is trusted.

[model:claude-opus-4-8]
provider = anthropic
notes    = Leads the Anthropic tail: the Anthropic model the team's design work
           rates highest, and the current ship-routine default. First Anthropic
           choice when a chain falls through the GLM links, and the Anthropic
           side of the cross-vendor Oracle review.

[model:claude-opus-5]
provider = anthropic
notes    = Declared for explicit opt-in / comparison but NOT a default chain
           link: verbose and prose-heavy in practice, so the team prefers
           Opus 4.8. Kept in the registry so a job can still route to it by name.

[model:claude-sonnet-5]
provider = anthropic
notes    = Second Anthropic backstop link (issue #298): near-frontier at less
           than half Opus 5's price. Reached only if the key cannot serve
           Opus 5 (access tiers change; a review is still never silently lost).
           Also the HEAD of the cross-provider tail every chain-walking
           scheduled routine carries (issue #544):
           when a routine's GLM links are all down, this is the first
           Anthropic link it walks. Those routines are the bench's
           high-volume consumers (the burn fires hourly), so with the
           Anthropic account funded a GLM outage shifts their spend HERE —
           the cheap tier is the tail on purpose, never a frontier-priced id.

[model:claude-haiku-4-5]
provider = anthropic
notes    = Last-resort Anthropic backstop link (issue #298): the cheapest,
           most widely servable Anthropic model — near-frontier quality, and
           the id least likely to be outside any key's access. If this link is
           reached and fails, the whole provider is down, not one model id.
           Also the terminal link of the routines' cross-provider tail
           (issue #544), for the same reason it terminates the review chain.

[model:claude-fable-5]
provider = anthropic
notes    = Highest-capability Anthropic option, declared and available for
           explicit opt-in but NOT a default chain link: it burns credits fast,
           so a job routes to it by name only when a task genuinely warrants it,
           never as an automatic fallback.

# ── Chains (named, ordered — the thing a job routes to) ───────────────────────

# The reviewer personas (jane / drik / coach) in auto-review.yml. Cheaper-frontier
# GLM first (5.3 newest → 4.6 oldest), then the Anthropic tail (Opus 4.8 →
# Sonnet 5 → Haiku 4.5, issue #298) as the never-lose-a-review backstop.
# Exactly SIX links: auto-review.yml exposes model1..model6 slots and the drift
# guard pins the count. Three newest GLM (5.3 → 5.1; 4.6 retired from this chain)
# then the Anthropic tail (Opus 4.8 → Sonnet 5 → Haiku 4.5).
[chain:review]
models = glm-5.3, glm-5.2, glm-5.1, claude-opus-4-8, claude-sonnet-5, claude-haiku-4-5

# The cross-vendor Oracle reviewer (Wave 2, issue-tracked): an independent, blind,
# frontier second opinion on every autonomy PR, run on the vendor the shipper did
# NOT use. Two role chains, one per vendor — the Oracle resolves whichever is the
# OPPOSITE of the PR's shipping vendor:
#   * oracle-anthropic — used when the PR shipped on GLM (the cost-optimized
#     default, so this is the common case). Anthropic-first, led by Opus 4.8.
#   * oracle-glm — used when the PR shipped on Anthropic (e.g. a design-run on
#     Opus 4.8). GLM-first. Both are frontier; the split is for INDEPENDENCE, not
#     a quality tier.
[chain:oracle-anthropic]
models = claude-opus-4-8, claude-sonnet-5, claude-haiku-4-5

[chain:oracle-glm]
models = glm-5.3, glm-5.2, glm-5.1, glm-4.6

# The backlog groomer's optional narrative layer (issue #248). A 3-5 sentence
# summary PHRASING the deterministic findings — the cheap-to-be-wrong tier, so
# the cheapest capable model is the right one and there is no frontier
# backstop: a failed call degrades to no narrative, which is the designed
# behavior, so walking fallbacks would buy nothing.
[chain:groomer-narrative]
models = glm-5.2

# The product scout (issues #241/#243). Generation is the cheap-to-be-wrong
# case — a bad proposal is one a human closes — so like the groomer's narrative
# layer it takes the cheapest capable model with no frontier backstop. The
# scout files issues a human curates, so a failed run costs nothing either:
# there is nothing to walk a fallback FOR. Single link on purpose.
[chain:scout]
models = glm-5.2

# The scheduled spike converter (#245 child C, issue #440): reshape ONE
# decided research recommendation (picked deterministically by the #438
# extractor, never by the model) into a design-brief issue. The scout's exact
# tier, for the scout's exact reason: extraction-and-reformatting of
# human-vetted text is cheap-to-be-wrong — a bad brief is one a human closes,
# and the substance is already committed — so the cheapest capable model with
# no frontier backstop. A failed run costs one weekly slot that retries next
# cycle; there is nothing to walk a fallback FOR. Single link on purpose, and
# the one link is a `zai` model because .github/spike-converter.conf sets
# `provider: zai` and the workflow cross-checks that the chain's first link
# resolves to that same provider. `model-registry smoke spike-converter`
# proves the link is callable before the routine runs.
[chain:spike-converter]
models = glm-5.2

# The adoption-study assessor (docs/adoption-study-assessor-proposal.md). Turning
# an untrusted study into a careful split verdict (redundant / additive /
# where-integration) is expensive-to-be-wrong, so it runs on a frontier model:
# glm-5.3, the top GLM link and the head of the `review` chain. GLM is
# frontier-class (see [provider:zai] above), so this is the strong-model tier, not
# the cheap scout tier. It is on the `zai` provider because that is the servable
# frontier one here — the Anthropic key is unfunded, so every anthropic link 400s
# "credit balance too low" (#347), which a single-link Opus 4.8 could not survive
# — and because the assessor's scheduled siblings (design-run, backlog-burn,
# labeler) already run zai. It is SINGLE-LINK on purpose — like the scout's chain,
# and unlike the review chain: the assessor is a low-volume, disarmed, advisory
# routine, and its workflow consumes only link1, so a fallback tail would be an
# unkept promise (a rare unservable model just fails one weekly run that retries
# next cycle). The one link is a `zai` model on purpose: .github/adoption-assessor
# .conf sets `provider: zai`, and the workflow cross-checks that the chain's first
# link resolves to that same provider (a mismatch would spend a key against the
# wrong endpoint). `model-registry smoke adoption-assessor` proves the link is
# callable before the routine runs.
[chain:adoption-assessor]
models = glm-5.3

# ── The four scheduled agentic routines (issues #326, #327, #544) ─────────────
#
# One chain per routine, resolved by its workflow at run time in place of the
# inline `--model` pin those workflows carried before. #326 built the
# chain-WALKING mechanism (resolve → per-link ship steps gated on the earlier
# links failing → an all-links-failed gate) with each chain single-link; #327
# deepened every tail to the multi-model degradation `[chain:review]` already
# had, so no routine bottoms out on one id — a model unservable at run time
# (the #298 defect: deprecation, access tier) falls through to the next link
# instead of killing the scheduled run; #544 let the tail CROSS PROVIDERS, so
# a whole-provider outage (Z.AI out of quota for the month, the incident that
# motivated it) falls through to the funded Anthropic account instead of
# killing every scheduled run until a human flips a conf. Each chain keeps
# its #326 head (the model the routine pinned at migration time) and appends
# fallbacks BELOW it, so the healthy path is byte-for-byte what ran before.
# The drift guard pins each workflow's walk to its chain here link-for-link,
# so widening either side alone fails pre-merge: adding a model to a chain
# requires the matching ship step in the workflow, and a workflow step
# without a chain link behind it fails the same way.
#
# Provider agreement is part of the contract, and since #544 it reads as a
# SHAPE rather than a uniformity rule. A workflow's walk is a fixed sequence
# of literal ship steps — its LAYOUT, one provider per step in file order
# (Actions can only reference a secret by its literal name, so a provider is
# a reviewed, git-tracked step) — while this chain picks the MODEL each step
# runs. So:
#   * the routine's conf `provider:` (.github/<routine>.conf) names the HEAD
#     provider: link 1 must sit on it. Flipping the conf flips where the
#     walk starts, not the whole walk.
#   * a chain may cross to any other declared provider for its TAIL, but only
#     to providers the workflow carries literal ship steps for, and only in
#     the workflow's step order — link N must sit on the provider ship step N
#     is wired for (one ship step per link, exactly).
#   * the four chain-walking routines below (design-run, backlog-burn,
#     chunker, labeler) walk three GLM links (5.2 → 5.1 → 4.6) and then the
#     Anthropic tail (claude-sonnet-5 → claude-haiku-4-5): layout
#     zai,zai,zai,anthropic,anthropic. A GLM link that fails, or is skipped for want of ZAI_KEY,
#     falls through; the Anthropic steps run only after every GLM link did
#     not succeed, and skip without ANTHROPIC_API_KEY. Total exhaustion still
#     reaches provider-triage → classify → one deduped needs-decision issue.
#   * the eight single-link scheduled routines (scout, spike-converter,
#     adoption-assessor, wright, wright-signoff, growth-twitter, reeve-growth,
#     reeve-greenlight) KEEP the single-provider rule — every link on the
#     conf's provider — until #544's Part B extends the walk to them; their
#     drift-guard pins are unchanged.
# Each workflow's resolve step runs `model-registry shape <routine> --head
# <conf provider> --layout <its step order>` — the SAME pure rule the drift
# guard pins pre-merge (tools/model-registry, `walk_shape_errors`), so the
# runtime check and the test cannot drift — before any key is spent, and
# fails the run up front on a mismatch rather than discovering it mid-run
# against the wrong endpoint. `model-registry smoke <routine>` (the
# model-smoke workflow, which fires on every registry edit) proves each link
# callable with the real key.
#
# Spend: these four are the bench's high-volume consumers (the burn fires
# hourly, the labeler 6×/day). With the Anthropic account funded, a GLM outage
# shifts their unattended spend to Anthropic for as long as it lasts — which
# is why the tail is the CHEAP Anthropic tier (claude-sonnet-5, then
# claude-haiku-4-5), never a frontier-priced id, and why each workflow's run
# summary names the link that
# served and warns when the head provider fell through, so a GLM outage stays
# visible even though the run is green.

# The idea→PR design run (/design-run, .github/design-run.conf provider: zai).
# Frontier-class and correctness-over-cost: an unattended run iterates real
# geometry to green gates and opens a draft PR nobody watches live, so it runs
# at max effort on the newest GLM. glm-5.2 is the head (the #326 migration
# pin); the tail walks the older GLMs, each near-equivalent quality, so an
# unservable id costs a version step, not the run — then the Anthropic tail
# (#544). The workflow's anthropic steps wire CLAUDE_KEY (a historical alias
# for the same credential as ANTHROPIC_API_KEY, kept for those steps by the
# drift guard's alias marker).
[chain:design-run]
models = glm-5.2, glm-5.1, glm-4.6, claude-sonnet-5, claude-haiku-4-5

# The scheduled backlog burn (/ship-issue, .github/backlog-burn.conf
# provider: zai). Same shape as the design run — an unattended ship run is the
# correctness-over-cost case — and the same tail: the glm-5.2 head the burn
# pinned at migration time, the older GLMs as fallbacks, then the Anthropic
# tail (#544).
[chain:backlog-burn]
models = glm-5.2, glm-5.1, glm-4.6, claude-sonnet-5, claude-haiku-4-5

# The issue chunker (/chunk-issue, .github/chunker.conf provider: zai).
# Chunking is a splitting judgement — dependency-ordered sub-issues each
# closeable by one PR — where a bad split costs a human a cleanup, so it runs
# on a frontier provider. It was on the Anthropic tail alone while that
# account was unfunded — every anthropic link 400ed "credit balance too low"
# (#347), which failed the daily chunker run the same way it failed the
# adoption-assessor (#358) — so it was rerouted to zai, matching its
# scheduled siblings. Since #544 the question of WHICH provider is moot: the
# chain is the siblings' verbatim — glm-5.2 head, 5.1 and 4.6 behind it, then
# the Anthropic tail — and the workflow's former latent Anthropic block is
# now the live tail (links 4 and 5), reached only when every GLM link did
# not succeed.
[chain:chunker]
models = glm-5.2, glm-5.1, glm-4.6, claude-sonnet-5, claude-haiku-4-5

# The issue labeler (/label-issues, .github/labeler.conf provider: zai).
# Labelling is light and well-bounded, and every label is one click for a
# human to undo — the cheap-to-be-wrong tier — but unlike the scout's chain
# it still walks: the labeler runs unattended on a schedule with nobody
# watching, so a dead head id would silently stop all triage until someone
# noticed. glm-5.2 head (the migration pin), older GLMs behind it, then the
# Anthropic tail (#544) — the labeler runs at low effort, so the tail's spend
# is small even when it carries the whole day.
[chain:labeler]
models = glm-5.2, glm-5.1, glm-4.6, claude-sonnet-5, claude-haiku-4-5

# ── The agent forge (Wright + Reeve's sign-off, docs/agent-forge.md) ─────────
#
# Two chains for one workflow (wright.yml), split ON PURPOSE so a different
# model judges than proposed — the in-vendor half of the Oracle's independence
# property (a cross-VENDOR split waits on the Anthropic account being funded;
# both chains sit on zai, the servable frontier provider, matching
# .github/wright.conf's provider label, which the workflow's resolve steps
# cross-check per link).

# Wright's propose half (/wright, .github/wright.conf provider: zai).
# Proposing is the cheap-to-be-wrong case — a bad brief is one Reeve declines
# — and the routine retries within six hours, so like the scout's chain it is
# SINGLE-LINK on purpose: there is nothing to walk a fallback FOR, and the
# sign-off job is unaffected by a propose failure (separate job).
[chain:wright]
models = glm-5.2

# Reeve's sign-off half (/reeve-signoff, same conf). Ruling on a brief is the
# review tier — an approve applies `autonomy-ok`, the one escalation-shaped
# write in the routine family — so it leads with the top GLM link. Unlike the
# propose half it WALKS (the labeler's reasoning): a dead head id would
# silently stop all sign-offs on an unattended 4×/day routine, so the tail
# degrades through the near-equivalent GLMs; total exhaustion fails the job
# visibly instead.
[chain:wright-signoff]
models = glm-5.3, glm-5.2, glm-5.1

# The Twitter/X growth agent (Lark, /growth-twitter, .github/growth-twitter
# .conf provider: zai — docs/growth.md). Public copy under the bench's name
# is expensive-to-be-wrong, so it leads with the top GLM link, the
# adoption-assessor's tier and reasoning — and like that chain it is
# SINGLE-LINK on purpose: the routine is low-volume, shipped disarmed, and
# dry-run-by-default (its output is a review comment until a human approves
# a live post), and its workflow consumes only link1 — a rare unservable
# model fails one daily sweep that retries next morning, costing nothing a
# human had approved. `model-registry smoke growth-twitter` proves the link
# callable before the routine is armed.
[chain:growth-twitter]
models = glm-5.3

# The PM-growth queueing routine (Reeve, /reeve-growth, .github/reeve-growth
# .conf provider: zai — docs/growth.md, the "Scheduled PM queueing" step). It
# ORIGINATES growth-queue items (Reeve proposing forward-looking posts) that
# Lark later drains, so it leads with the top GLM link, the growth desk's tier
# and reasoning (public-facing copy under the bench's name is
# expensive-to-be-wrong) — and like the growth-twitter and scout chains it is
# SINGLE-LINK on purpose: the routine is low-volume, shipped disarmed, and
# everything it files is a downstream draft a human curates (and that still
# needs the approved-to-post label to publish), so a rare unservable model
# fails one weekly sweep that retries next cycle, costing nothing a human had
# approved. Its workflow consumes only link1. `model-registry smoke
# reeve-growth` proves the link callable before the routine is armed.
[chain:reeve-growth]
models = glm-5.3

# The greenlight drafter (Reeve, /reeve-greenlight — the #296 stage-2 loop's
# LLM step, issue #443). It reads a PARKED decision (#161's needs-decision
# gate) and drafts an advisory YES/NO verdict citing the platform charter
# (PM.md) — the piece-4 approval poll later turns a human 👍 into the gate's
# resolution, so nothing it writes is binding. Verdict-drafting on platform
# decisions is expensive-to-be-wrong in the assessor's sense, so it leads with
# the top GLM link — and like the assessor / reeve-growth / growth-twitter
# chains it is SINGLE-LINK on purpose: the step is low-volume, shipped
# disarmed (.github/reeve.conf `greenlight: false`), keyed and skippable
# (without the provider secret the workflow step exits with a ::notice::,
# never a red run), and its workflow consumes only link1 — a rare unservable
# model fails one daily sweep that retries next run, costing nothing a human
# had approved (every greenlight is advisory until the 👍). The one link sits
# on `zai` — the provider .github/reeve.conf's `provider:` key declares — and
# the workflow's resolve step cross-checks that agreement up front, before any
# key is spent (the #326 pattern). `model-registry smoke reeve-greenlight`
# proves the link callable before the loop is armed.
[chain:reeve-greenlight]
models = glm-5.3
