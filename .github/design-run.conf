# Policy for the scheduled idea→PR pipeline (issue #96, Stage 3) — the
# git-tracked source of truth for WHAT the routine does, mirroring
# .github/backlog-burn.conf exactly (which mirrors .github/ci-gates/registry.conf).
# A clone carries it, every run reads it identically, and changing it is a
# reviewed one-line diff. GitHub supplies only the *live arming* (the
# DESIGN_RUN_ENABLED repo variable) and the *secret* (CLAUDE_KEY).
#
# This file is read by the SAME tool the backlog burn uses — `backlog-burn
# config --get <key> --path .github/design-run.conf` — because the selection
# policy (one issue per firing, oldest-first, skip claimed/branched/PR'd) is
# identical; only the opt-in label differs. That reuse is the point: the
# idea→PR pipeline is orchestration of what already exists, not new machinery.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`      — reproducible intent, in git, PR-reviewed
#   2. repo variable DESIGN_RUN_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings → Secrets and variables →
#      Actions → Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that opens design PRs should be a conscious operational
#      act a fresh clone/fork does not inherit, and flipping it off halts the
#      routine in seconds without a commit.
#
# Cadence lives BOTH here AND as the `cron:` literal in design-run.yml (Actions
# can't read a file/variable for on.schedule). If you edit one, edit both.
# Stored here as a RAW CRON, not a preset name, on purpose: the shared
# tools/backlog-burn preset vocabulary pins every cadence to :17 past the hour
# (that is backlog-burn's slot), and this routine fires at :23 to stay offset
# from it — so the `daily` preset (`17 6 * * *`) would misdescribe the actual
# schedule. The raw cron below is therefore the truthful, in-sync value. A full
# design run renders, slices and iterates, so it is heavier than a /ship-issue
# burn, but the two-key arming guard and the `design-run` concurrency group (no
# cancel-in-progress) keep hourly safe: a long run queues the next firing
# instead of overlapping it, and an idle firing costs nothing. (Preset names
# 4x/2x/daily/weekly are still accepted by the parser if you don't need the :23
# offset; note the `hourly` preset resolves to :17 — backlog-burn's slot — so
# the raw `23 * * * *` below is what keeps design-run offset.)
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# The opt-in label an issue must carry to be eligible. A design session picks
# up a `design-brief` issue cold and runs the co-design loop from it — that is
# exactly this pipeline's input (templates/design-brief.md, filed by /intake or
# the issue form). Nothing is selected until such a brief exists, so the
# routine ships nothing until the backlog is curated.
label: design-brief

# Which LLM PROVIDER the /design-run walk STARTS on — the HEAD provider
# (issue #544). Each provider has matching, git-tracked run steps in
# .github/workflows/design-run.yml (with its endpoint + which secret it uses):
#   anthropic — Claude via api.anthropic.com, secret CLAUDE_KEY
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint
#               (https://api.z.ai/api/anthropic), secret ZAI_KEY (default)
# WHICH MODEL each link runs is NOT this file's call: the registry's
# `[chain:design-run]` (.github/models/registry.conf, issue #326) decides it.
# Link 1 of that chain must sit on the provider named here; the chain's TAIL
# may cross to the other provider (today: three GLM links, then the Anthropic
# tail), in the workflow's run-step order — the workflow's resolve step checks
# that shape and fails up front on a mismatch, so flipping this line means
# re-tailoring the chain in the same PR.
# Note: /design-run is a Claude Code skill; non-Claude models run it
# best-effort (Anthropic doesn't officially support routing Claude Code to
# non-Claude models), so expect quality to vary by provider.
provider: zai

# How often the routine fires, as a raw 5-field cron (see the header note on
# why this is a literal, not the `daily` preset: `daily` means :17, this
# routine runs at :23 to stay offset from backlog-burn). Preset names (4x, 2x,
# daily, weekly) are also accepted by the parser. If you change this, change the
# `cron:` literal in design-run.yml to match — they must stay identical.
cadence: 23 * * * *
