# Policy for the provenance harvester (docs/provenance.md) — the git-tracked
# source of truth for WHAT the keyless harvest does, mirroring
# .github/reeve.conf and .github/backlog-groomer.conf. A clone carries it,
# every run reads it identically, and changing it is a reviewed one-line diff.
#
# Two keys must agree for the HOURLY SCHEDULE to act, by design:
#   1. this file's `enabled: true`            — reproducible intent, in git
#   2. repo variable PROVENANCE_ENABLED == 'true' — the live, human-only
#      arming/kill switch (Settings → Secrets and variables → Actions →
#      Variables). Not in git on purpose: a fresh clone/fork never inherits an
#      armed writer, and flipping it off halts the schedule in seconds.
#      Shipped disarmed: the variable is unset (arming is owner decision 8,
#      phase P2).
# A workflow_dispatch (the #843 ingest, a rescue/backfill harvest, refreeze,
# recover) needs only key 1 — a dispatch is itself a deliberate human act.
#
# Read by tools/provenance's own strict parser (the house `key: value` format
# contract: `#` comments; unknown, duplicate, colonless or malformed keys fail
# loudly with path:lineno):
#   PYTHONPATH=tools/provenance/src python3 -m provenance config --get <key>
#
# The policy values below are owner decision 9 (docs/provenance.md §Conf keys).
# Integers only — the parser refuses a decimal point anywhere.

# Whether the harvester is intended to run at all (the reproducible on/off).
enabled: true

# How often the schedule fires. A raw 5-field cron literal kept IDENTICAL to
# the `- cron:` literal in .github/workflows/provenance.yml (Actions cannot
# read a file for on.schedule; scripts/cadence-sync-check.sh pins the pair).
# Hourly at :29 — clear of the :11/:17/:23/:41/:43/:47/:53 sibling slots.
cadence: 29 * * * *

# A terminal PR (merged or closed) freezes this many hours after it closed —
# about 4x the measured 1.42 h maximum settle of agent activity (42% of PM
# triage comments land after merge).
settle_hours: 6

# A PR still blocked after settle (a watched run on its head branch still
# queued/in progress, or the merge's Production deployment not terminal) is
# deferred, but never past this many hours after close: it then freezes with
# incomplete[] naming why.
max_defer_hours: 24

# How long a merged PR waits for its Production deployment to reach a
# terminal state before it freezes anyway (incomplete: deployment-not-terminal).
deploy_wait_hours: 2

# Hard request cap for one SCHEDULED harvest (GITHUB_TOKEN allows 1,000/h per
# repository, shared with every sibling workflow). Dispatches take their cap
# from the max_requests input instead (default: unlimited, self-paced).
scheduled_max_requests: 400

# Stop (scheduled) or sleep until X-RateLimit-Reset (dispatch) whenever
# X-RateLimit-Remaining drops below this — the floor left for siblings.
rate_floor: 500

# A self-paced dispatch stops cleanly after this many minutes (cursors in
# state.json resume it on the next dispatch). 330 = 5.5 h, inside the 6 h
# job limit with room for the publish step.
dispatch_max_minutes: 330

# The lower bound of a backfill (`harvest since=` may not go earlier): the
# repository's first runs.
backfill_since: 2026-07-31

# The serving join refuses to guess: a main commit touching registry.conf or
# the run's workflow within this many minutes BEFORE a pull_request run was
# created makes that run's code basis `ambiguous` (the merge ref GitHub built
# may predate it).
ambiguity_window_minutes: 15

# A comment edited at least this many seconds after it was created drops to
# the `claimed` trust tier (its body is no longer what the job posted).
edit_grace_seconds: 60

# Each receipts pass re-lists runs created this many hours before its cursor,
# so a re-run attempt of a recent run is captured as a new receipt.
receipt_lookback_hours: 48

# Tip continuity: how many recent default-branch provenance.yml runs are
# searched for declared intent artifacts.
intent_window_runs: 20

# The workflows whose completed, non-skipped runs get a receipt. Comma list,
# each a .github/workflows/ file name; every one must exist on main.
watched_workflows: auto-review.yml, backlog-burn.yml, chunker.yml, design-run.yml, labeler.yml, oracle.yml, product-scout.yml, spike-converter.yml, wright.yml

# Where the #843 Actions/status snapshot lives (the `ingest` dispatch's
# defaults; the dispatch inputs may name another ref/path).
# snapshot_id names the evidence subtree (raw/snapshot/<snapshot_id>/) and the
# receipts' source ("snapshot:<snapshot_id>"): the evidence PR's number.
snapshot_id: pr843
snapshot_ref: ccr-d0be94c3-o4sati-rescue
snapshot_path: audits/provenance-2026-10/rescue
