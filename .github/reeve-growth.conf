# Policy for the scheduled PM-growth routine (Reeve, /reeve-growth —
# docs/growth.md, the "Scheduled PM queueing" step). The git-tracked source of
# truth for WHAT the routine does, mirroring .github/product-scout.conf and its
# scheduled siblings. A clone carries it, every run reads it identically, and
# changing it is a reviewed one-line diff.
#
# WHAT IT DOES: on a cadence it reads the repo's committed signals (CLAUDE.md,
# docs/, the design catalog and its NOTES.md field-test logs, recently-merged
# work) and FILES `growth-queue` + `channel:twitter` issues — forward-looking
# posts in Reeve's build-in-public voice (a platform feature and how to use it;
# a design's unique technique; a pattern the bench established), each with a
# fact budget citing committed files. It is the GENERATIVE front of the growth
# desk — where Lark (/growth-twitter) DRAINS the queue, this ORIGINATES it,
# feeding the same human-gated pipeline (dry-run comment → approved-to-post →
# live). It is the queue's sibling to the design catalog's /product-scout.
#
# DRY-RUN-FIRST BY CONSTRUCTION: this routine can NEVER reach a channel. Its one
# write is `queue_growth_post` (mcp__growth_queue), which files a DRAFT issue;
# its deny backstop denies the poster (mcp__growth_twitter) outright. Every item
# it files is then a draft a human reads and culls, that Lark dry-runs, and that
# still needs the human `approved-to-post` label to ever publish. There is no
# path from here to a live tweet without a human.
#
# Two keys must agree for the routine to act at all, by design:
#   1. this file's `enabled: true`             — reproducible intent, in git, reviewed
#   2. repo variable REEVE_GROWTH_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings -> Secrets and variables ->
#      Actions -> Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that reads untrusted repo text and WRITES issues should
#      be a conscious act a fresh clone/fork can't inherit, and flipping it off
#      halts the routine in seconds without a PR. SHIPPED DISARMED: this file
#      says `enabled: true`, but the variable is unset, so the routine is inert
#      until a maintainer deliberately arms it.
#
# Read by tools/backlog-burn's config parser (the same one product-scout reuses
# — only `enabled`/`provider`/`cadence`, no selector):
#   backlog-burn config --get <key> --path .github/reeve-growth.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Which LLM PROVIDER the /reeve-growth walk STARTS on — the HEAD provider
# (issue #544 Part B). Each provider has matching, git-tracked run steps in
# .github/workflows/reeve-growth.yml (with its endpoint + which secret it
# uses). This is growth-desk content under the bench's name, so it leads with
# the frontier GLM tier as the head — the same posture as
# .github/growth-twitter.conf.
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (default)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
# WHICH MODEL each link runs is NOT this file's call: the registry's
# `[chain:reeve-growth]` (.github/models/registry.conf, #206) decides it. Link
# 1 of that chain must sit on the provider named here; the chain's TAIL may
# cross to the other provider (today: the GLM head, then the Anthropic tail),
# in the workflow's run-step order — the workflow's resolve step checks that
# shape and fails up front on a mismatch, so flipping this line means
# re-tailoring the chain in the same PR.
provider: zai

# How often the routine fires. A raw 5-field cron literal (kept identical to
# the `cron:` literal in reeve-growth.yml — Actions can't read a file for
# on.schedule; the parity is enforced by scripts/cadence-sync-check.sh). Daily
# at 07:13 UTC: the bench has plenty to share and Lark drains the queue daily,
# so a weekly generator would starve the pipeline — daily keeps a steady flow
# of fresh drafts all week for a human to cull. :13 is an off-peak minute so it
# doesn't fire with the 05:4x routine cluster. Tune total volume with
# GROWTHQ_MAX_POSTS in the workflow (drafts/run) or this cadence.
cadence: 13 7 * * *
