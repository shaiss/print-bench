# AI lifestyle imagery feature flag (issue #302).
#
# House `key: value` format; `#` comments; the `enabled` key is the switch.
# Default OFF and fail-safe: anything but exactly `enabled: true` reads as off
# (a missing file, a blank value, a typo — all off).
#
# Why off: Z.AI has no model that treats the source render as a seed. GLM-Image
# follows the prompt, not the reference geometry; CogView-4 is e-commerce
# text-to-image. So the tier's premise — "an AI scene pinned to the real mesh,
# only the styling is AI" — was never achievable on this provider. Until a
# faithful image-to-image path exists, the whole AI-lifestyle tier is disabled
# here in ONE committed place, read by every surface that touches it:
#   - generation:  .github/workflows/{lifestyle-shot,product-still,lifestyle-clip}.yml
#                  skip their generate matrix (no new AI images/clips; no
#                  auto-fire when a manifest lands on main)
#   - display:     the static site passes over previews/lifestyle-*.{png,gif}
#                  and previews/product-still-*.png (site/lib/media.mjs,
#                  site/lib/content.mjs)
#   - gate:        scripts/readme-gate.sh requirement 9 neither requires nor
#                  rejects those embeds
#
# Geometry-true tier-1 studio renders (product shots, contact sheets,
# turntables) are the reality images and are UNAFFECTED. Everything stays
# committed and reversible: flip to `enabled: true` in a reviewed PR to turn
# the tier back on across all three surfaces with no other change.
enabled: false
