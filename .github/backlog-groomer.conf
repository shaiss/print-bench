# Backlog groomer policy — the git-tracked half of the routine's two-key
# arming switch (issue #244). The live half is the BACKLOG_GROOMER_ENABLED
# repo variable; the run is inert unless BOTH agree — either off → nothing
# happens, so a clone/fork can never silently arm it.
#
# Read by tools/backlog-groomer:
#   backlog-groomer config --get <key> --path .github/backlog-groomer.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.
# Edit by hand in a reviewed PR — the groomer has no comment-command writer.

enabled: true

# Daily at 05:41 UTC — after the chunker (05:29), so a freshly chunked
# epic's children appear in the same morning's report. A raw cron rather
# than a preset because the shared preset vocabulary pins :17, the backlog
# burn's minute. Must stay identical to the `- cron:` literal in
# .github/workflows/backlog-groomer.yml (Actions cannot read a file for
# on.schedule).
cadence: 41 5 * * *

# Detector thresholds. "days" thresholds are strict: a finding fires only
# when the age is strictly greater than the value.
staleness_days: 14
armed_stuck_days: 7
oversized_stuck_days: 7

# Title-similarity floor for duplicate candidates (token Jaccard, 0–1], and
# the report's disclosure-capped pair budget.
dup_threshold: 0.6
max_dup_pairs: 10
