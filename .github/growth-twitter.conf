# Policy for the scheduled Twitter/X growth agent (Lark, /growth-twitter —
# docs/growth.md) — the git-tracked source of truth for WHAT the routine
# does, mirroring .github/adoption-assessor.conf and its scheduled siblings.
# A clone carries it, every run reads it identically, and changing it is a
# reviewed one-line diff.
#
# WHAT IT DOES: on a daily cadence it selects open `growth-queue` +
# `channel:twitter` issues (the messages PMs queued via /growth-queue or the
# issue form), and drains at most `max_posts_per_run` of them — turning each
# queued intent into channel-native copy strictly from the item's fact
# budget. By default every drain is a DRY RUN: the would-be tweet lands as a
# comment on the queue issue for a human to review. A LIVE post additionally
# requires the `GROWTH_TWITTER_LIVE` repo variable, the four X credentials,
# and (per `require_approval` below) the human-applied `approved-to-post`
# label on that item — all enforced inside the posting tool, never by prompt.
#
# Two keys must agree for the routine to act at all, by design:
#   1. this file's `enabled: true`            — reproducible intent, in git, reviewed
#   2. repo variable GROWTH_TWITTER_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings -> Secrets and variables ->
#      Actions -> Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that reads UNTRUSTED issue text and WRITES publicly
#      visible output should be a conscious act a fresh clone/fork can't
#      inherit, and flipping it off halts the routine in seconds without a
#      PR. SHIPPED DISARMED: this file says `enabled: true`, but the variable
#      is unset, so the routine is inert until a maintainer deliberately arms
#      it — and even armed, it only dry-runs until the separate live key and
#      approvals exist (the three-key ladder docs/growth.md documents).
#
# Read by tools/growth's own strict parser (this conf carries desk-specific
# keys the shared backlog-burn parser's closed key set must not learn):
#   PYTHONPATH=tools/growth/src python3 -m growth config --get <key> --path .github/growth-twitter.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Which LLM runs Lark. Each has a matching, git-tracked ship step in
# .github/workflows/growth-twitter.yml (with its endpoint + which secret it
# uses).
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (the default: public copy under the bench's name is
#               expensive-to-be-wrong, so a frontier model leads — and zai is
#               the servable frontier provider here, the same reasoning as
#               the adoption-assessor's conf).
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY (kept
#               as a git-tracked ship step for when the account is funded).
# The MODEL is NOT chosen here — it comes from the `growth-twitter` chain in
# .github/models/registry.conf (#206); this key only picks which provider's
# step (and secret) runs, and it must match the chain's first link's provider
# (the workflow cross-checks and fails loudly if they disagree).
provider: zai

# How often the routine fires. A raw 5-field cron literal (kept identical to
# the `cron:` literal in growth-twitter.yml — Actions can't read a file for
# on.schedule). These five slots (13:19, 15:19, 17:19, 19:19, 21:19 UTC —
# reader-awake hours) are DELIVERY REDUNDANCY, not five post times: GitHub's
# scheduled-workflow queue is best-effort — it delivers heavily delayed, at an
# arbitrary hour, and drops most slots — so more slots means more chances one
# lands each day. The drain acts on WHATEVER firing GitHub delivers;
# ≤`max_posts_per_day` LIVE posts per UTC calendar day is enforced by the
# per-day marker guard in the workflow's Select step (`growth daycap`), NOT by
# the slot count. The post
# TIME varies day to day on its own, from GitHub's delivery jitter. :19 keeps
# the off-peak-minute convention the routine family uses.
#
# (This replaced a `postslot` per-date "chosen hour" gate that required the one
# delivered firing to equal a specific hour — under GitHub's unreliable
# scheduler it almost never did, so the drain was skipped and nothing posted.)
cadence: 19 13-21/2 * * *

# How many queue items ONE firing may drain (the posting tool's per-run cap,
# surfaced to it as GROWTH_MAX_POSTS). Kept at 1 so a single delivered firing
# never bursts; the per-DAY total is `max_posts_per_day` below.
max_posts_per_run: 1

# The per-UTC-calendar-day LIVE-post cap — the total across ALL of a day's
# delivered firings (GitHub drops most cron slots, so most days deliver one
# firing and post once; on a day two firings land, this holds the second once
# the cap is met). Enforced by the per-day marker guard in the workflow's
# Select step (`growth daycap --cap`), which COUNTS the posting tool's
# `growth-twitter:posted` markers dated today — NOT by an hour lottery. Change
# the cap here: it is a reviewed one-line diff you PR and merge (the whole
# point of this committed policy file). `max_posts_per_run` bounds one firing;
# this bounds the day.
max_posts_per_day: 2

# Whether a LIVE post requires the human-applied `approved-to-post` label on
# the queue item (the per-item human gate). `true` is the shipped posture:
# the dry-run comment is the review artifact, the label is the sign-off.
# Setting `false` is the one-line PR that turns the desk fully autonomous
# per item — a deliberate, reviewed escalation, never a default.
require_approval: true
