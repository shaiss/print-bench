# Policy for the scheduled toolwright, Wright (docs/agent-forge.md) — the
# git-tracked source of truth for WHAT the routine does, mirroring
# .github/product-scout.conf and its selector-based siblings. A clone carries
# it, every run reads it identically, and changing it is a reviewed one-line
# diff.
#
# WHAT IT DOES: 4×/day it runs the two halves of the agent forge —
#   * PROPOSE (/wright): reads the bench's own pulse (Reeve's bench-health
#     report, the groomer report, telemetry, routine run health, open issues)
#     and files `agent-brief` issues proposing new LLM-based probabilistic
#     agents, deterministic tools, or hybrids that grow or heal the system.
#     Where Remy (/product-scout) proposes DESIGNS, Wright proposes TOOLING.
#   * SIGN-OFF (/reeve-signoff): judges each pending agent-brief against the
#     platform charter (PM.md) as Reeve, Wright's keeper, and posts one verdict
#     comment per brief — approve (arms it with `autonomy-ok` + `points-<n>`
#     so the existing backlog burn builds it into a draft PR), decline
#     (labels `wright-declined`), or needs-human (labels `needs-decision`).
# Everything downstream is the existing pipeline: the burn ships the brief as a
# draft PR, the Oracle reviews it, and A HUMAN STILL MERGES EVERY PR (charter
# N3). Wright never pushes code, never merges, and its labels are one click for
# a human to undo.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`      — reproducible intent, in git, reviewed
#   2. repo variable WRIGHT_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings -> Secrets and variables ->
#      Actions -> Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that WRITES issues and APPLIES arming labels should be a
#      conscious act a fresh clone/fork can't inherit, and flipping it off
#      halts the routine in seconds without a PR. SHIPPED DISARMED: this file
#      says `enabled: true`, but the variable is unset, so the routine is inert
#      until a maintainer deliberately arms it.
#
# Read by tools/backlog-burn's config parser (the same one the scout/labeler
# reuse — Wright uses only `enabled`/`provider`/`cadence`, no selector):
#   backlog-burn config --get <key> --path .github/wright.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Informational only (the parser requires a known key set, so the four sibling
# conf files stay structurally identical). Wright's briefs carry `agent-brief`;
# selection is by that label plus the ABSENCE of a verdict label (done in
# wright.yml's trusted Select steps), so this key is not used to select.
label: agent-brief

# Which LLM PROVIDER runs both halves. Each has matching, git-tracked ship
# steps in .github/workflows/wright.yml (with its endpoint + which secret it
# uses).
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (the default: it is the servable frontier provider here — the
#               Anthropic key is unfunded, every anthropic link 400s "credit
#               balance too low" (#347) — and Wright's scheduled siblings
#               already run zai)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
#               (available again once the account is funded; kept as latent
#               git-tracked ship steps)
# WHICH MODELS run is NOT this file's call: the registry's `[chain:wright]`
# (propose — cheap tier, the scout's reasoning) and `[chain:wright-signoff]`
# (sign-off — frontier head with a walking tail, expensive-to-be-wrong) decide
# (.github/models/registry.conf, #206), and every link of both chains must sit
# on the provider named here — the workflow's resolve steps cross-check that
# and fail up front on a mismatch.
provider: zai

# How often the routine fires. A raw 5-field cron literal (kept identical to
# the `cron:` literal in wright.yml — Actions can't read a file for
# on.schedule). 4×/day at :35 — 00:35 / 06:35 / 12:35 / 18:35 UTC. Stored as a
# raw cron on purpose: the shared `4x` preset pins its fires to :17 past the
# hour (backlog-burn's slot), and this routine takes :35 to stay offset from
# the labeler's :11, the burn's :17, design-run's :23, the chunker's :29, the
# assessor's :37, the groomer's :41, the scout's :47 and Reeve's :53. Each fire
# lands ~40 minutes before the next hourly burn (:17), so a brief armed by this
# run's sign-off is picked up within the hour. If you change this, change the
# `cron:` literal in wright.yml to match — they must stay identical
# (scripts/cadence-sync-check.sh enforces the parity).
cadence: 35 0,6,12,18 * * *
