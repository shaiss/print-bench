# Policy for the scheduled product scout (issues #241/#242) — the git-tracked
# source of truth for WHAT the routine does, mirroring .github/labeler.conf and
# its selector-based siblings. A clone carries it, every run reads it
# identically, and changing it is a reviewed one-line diff.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`         — reproducible intent, in git, reviewed
#   2. repo variable PRODUCT_SCOUT_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings → Secrets and variables →
#      Actions → Variables, or `gh variable set`). Not in git on purpose: arming
#      an agent that WRITES issues should be a conscious act a fresh clone/fork
#      does not inherit, and flipping it off halts the routine in seconds without
#      a commit.
#
# Read by tools/backlog-burn's config parser (the same one the labeler reuses —
# the scout uses only `enabled`/`provider`/`cadence`, not the selector):
#   backlog-burn config --get <key> --path .github/product-scout.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Which LLM runs /product-scout. Each has a matching, git-tracked ship step in
# .github/workflows/product-scout.yml (with its endpoint + which secret it uses).
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (the default: generation is the cheap-to-be-wrong case, so the
#               cheap tier is right — a bad proposal is one a human closes)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
# The MODEL each ship step runs is NOT chosen here — it comes from the `scout`
# chain in .github/models/registry.conf (#206), so swapping it is a registry
# edit. This key only picks which provider's step (and secret) is used.
provider: zai

# How often the routine fires. A raw 5-field cron literal (kept identical to the
# `cron:` literal in product-scout.yml — Actions can't read a file for
# on.schedule). Weekly on Monday 05:47 UTC: a proposal generator wants a calm
# cadence so it seeds the backlog without flooding it; bump it here and in the
# workflow together if you want more.
cadence: 47 5 * * 1
