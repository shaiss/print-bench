# Policy for the scheduled issue labeler (the "triage untriaged issues" routine)
# — the git-tracked source of truth for WHAT the routine does, mirroring
# .github/backlog-burn.conf, .github/design-run.conf and .github/chunker.conf
# exactly (which mirror .github/ci-gates/registry.conf).
# A clone carries it, every run reads it identically, and changing it is a
# reviewed one-line diff. GitHub supplies only the *live arming* (the
# LABELER_ENABLED repo variable) and the *secret* (ZAI_KEY / ANTHROPIC_API_KEY).
#
# This file is read by the SAME parser the backlog burn uses — `backlog-burn
# config --get <key> --path .github/labeler.conf`. The labeler does NOT reuse
# the backlog-burn *selector*, though: the burn/chunker/design-run all pick ONE
# issue carrying a given opt-in label, whereas the labeler sweeps issues that
# carry NONE of the routing labels (that selection lives in labeler.yml as a
# `-label:` search). So `enabled`, `provider` and `cadence` are shared config;
# `label` below is informational only (see its note).
#
# WHAT THE ROUTINE DOES: reads open issues carrying none of the routing labels
# (autonomy-ok / declined-too-big / design-brief / needs-decision) and applies
# the one that routes each — chiefly `autonomy-ok`, which arms the backlog burn.
# It is the front door of the autonomy loop: /ship-issue, the chunker and the
# design run all wait on a routed issue, and the burn ships nothing until an
# issue is armed. The /label-issues skill runs the same attended or unattended
# and is conservative by construction (arms only confident single-PR work).
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`      — reproducible intent, in git, PR-reviewed
#   2. repo variable LABELER_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings → Secrets and variables →
#      Actions → Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that labels issues should be a conscious operational act a
#      fresh clone/fork does not inherit, and flipping it off halts the routine
#      in seconds without a commit.
#
# Cadence lives BOTH here AND as the `cron:` literal in labeler.yml (Actions
# can't read a file/variable for on.schedule). If you edit one, edit both.
# Stored here as a RAW CRON on purpose: the shared preset vocabulary pins every
# cadence to :17 past the hour (backlog-burn's slot), and this routine fires at
# :11 to stay offset from it and from chunker (:29) / design-run (:23). Runs
# every 4 hours at :11 (01:11 / 05:11 / 09:11 / 13:11 / 17:11 / 21:11 UTC) to
# keep the queue moving through the day; the 05:11 fire still lands BEFORE the
# 05:29 chunker and the 06:17 burn, so a freshly-armed issue is available to the
# same morning's chunk-and-ship.
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Informational only. The labeler's PRIMARY output label is `autonomy-ok`, but
# selection is by ABSENCE of routing labels (done in labeler.yml), so this key
# is not used to select. It is recorded here to keep the four sibling conf files
# structurally identical (the parser requires a known key set); the routing
# taxonomy the skill applies is the authoritative list.
label: autonomy-ok

# Which LLM runs /label-issues. Pick a label; each has a matching, git-tracked
# ship step in .github/workflows/labeler.yml. Labelling is a light,
# well-bounded task, so the CHEAP Z.AI tier is the default here (the operator
# asked for a cheap model). Switching provider is this one line.
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint
#               (https://api.z.ai/api/anthropic), secret ZAI_KEY (default)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
# Note: /label-issues is a Claude Code skill; non-Claude models run it
# best-effort (Anthropic doesn't officially support routing Claude Code to
# non-Claude models), so expect quality to vary by provider — acceptable for a
# labelling task, and every label a human can remove.
provider: zai

# How often the routine fires, as a raw 5-field cron (see the header note on why
# this is a literal, not a preset). Runs every 4 hours at :11 — 01:11 / 05:11 /
# 09:11 / 13:11 / 17:11 / 21:11 UTC — so the queue keeps moving through the day
# rather than only once each morning. Preset names (4x, 2x, daily, weekly) are
# also accepted by the parser, but this cadence needs the raw form to keep the
# :11 offset. If you change this, change the `cron:` literal in labeler.yml to
# match — they must stay identical.
cadence: 11 1,5,9,13,17,21 * * *
