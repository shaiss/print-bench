# Policy for the scheduled adoption-study assessor
# (docs/adoption-study-assessor-proposal.md) — the git-tracked source of truth
# for WHAT the routine does, mirroring .github/product-scout.conf and its
# selector-based siblings. A clone carries it, every run reads it identically,
# and changing it is a reviewed one-line diff.
#
# WHAT IT DOES: on a weekly cadence it reads open `adoption-study` issues that
# carry no `disposition:*` label (the "awaiting a disposition" set —
# docs/adoption-studies.md) and posts ONE advisory split-verdict comment per
# study (redundant / additive / where-integration + qualifying questions,
# modelled on the worked example, issue #332). It is ADVISORY-ONLY by
# construction: it comments a reading a human acts on. It never applies a
# label (not even the advisory `disposition:*` ones), never merges, never
# opens a PR, and never edits the tree — the one boundary in the proposal.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`             — reproducible intent, in git, reviewed
#   2. repo variable ADOPTION_ASSESSOR_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings -> Secrets and variables ->
#      Actions -> Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that reads UNTRUSTED issue text and WRITES a comment
#      should be a conscious act a fresh clone/fork can't inherit, and flipping
#      it off halts the routine in seconds without a PR. SHIPPED DISARMED: this
#      file says `enabled: true`, but the variable is unset, so the routine is
#      inert until a maintainer deliberately arms it.
#
# Read by tools/backlog-burn's config parser (the same one the scout/labeler
# reuse — the assessor uses only `enabled`/`provider`/`cadence`, no selector):
#   backlog-burn config --get <key> --path .github/adoption-assessor.conf
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# Which LLM runs the assessor. Each has a matching, git-tracked ship step in
# .github/workflows/adoption-assessor.yml (with its endpoint + which secret it
# uses).
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint, secret ZAI_KEY
#               (the current default: turning an untrusted study into a careful
#               split verdict is expensive-to-be-wrong, so a frontier model leads
#               — GLM is frontier-class, not the cheap scout tier. It is the
#               servable frontier one here: the Anthropic key is unfunded, so
#               every anthropic link 400s "credit balance too low" (#347), and
#               the assessor's scheduled siblings already run zai.)
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY (available
#               again once the account is funded; kept as a git-tracked ship step)
# The MODEL each ship step runs is NOT chosen here — it comes from the
# `adoption-assessor` chain in .github/models/registry.conf (#206), so swapping
# it is a registry edit. This key only picks which provider's step (and secret)
# is used, and it must match the chain's first link's provider (the workflow
# cross-checks and fails loudly if they disagree).
provider: zai

# How often the routine fires. A raw 5-field cron literal (kept identical to the
# `cron:` literal in adoption-assessor.yml — Actions can't read a file for
# on.schedule). Weekly on Monday 06:37 UTC: studies arrive rarely, so a calm
# cadence fits, and 06:37 is an off-peak slot AFTER Reeve's daily 05:53 bench-
# health report, so a freshly-drafted disposition shows up in the next report.
cadence: 37 6 * * 1
