# Decision ledger — the HITL decision gate (issue #161).
#
# One pipe-delimited row per decision id, appended by the /decide command
# (.github/workflows/decide.yml) when a maintainer resolves a `🚦 DECISION
# NEEDED` on an issue or PR:
#
#   <decision-id> | approved|rejected | #<issue> | <login> | <iso8601>
#
# This file is the reproducible AUDIT TRAIL, keyed by decision id. The
# authoritative resolved state a paused pipeline reads is the issue's LABEL
# (decision-approved / decision-rejected), which cannot be forged — setting a
# label needs write access. Committed empty (header only); /decide maintains it.
# Don't hand-edit except to repair. See docs/decision-gate.md.
