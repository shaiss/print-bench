# Policy for the scheduled backlog burn (issue #95) — the git-tracked source
# of truth for WHAT the routine does, mirroring .github/ci-gates/registry.conf.
# A clone carries it, every run reads it identically, and changing it is a
# reviewed one-line diff. GitHub supplies only the *live arming* (the
# BACKLOG_BURN_ENABLED repo variable) and the *secret* (ANTHROPIC_API_KEY).
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`      — reproducible intent, in git, PR-reviewed
#   2. repo variable BACKLOG_BURN_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings → Secrets and variables →
#      Actions → Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that opens PRs should be a conscious operational act a
#      fresh clone/fork does not inherit, and flipping it off halts the routine
#      in seconds without a commit.
#
# Cadence lives BOTH here (as a preset name or raw cron) AND as the `cron:`
# literal in backlog-burn.yml (Actions can't read a file/variable for
# on.schedule). The `/backlog-burn set cadence <value>` command keeps both in
# sync automatically: it patches this file AND the workflow's cron line in one
# commit. If you edit by hand, update both. Preset names: hourly, 4x (every 6h,
# the original default), 2x, daily, weekly. Raw 5-field crons are also accepted.
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# The opt-in label an issue must carry to be eligible. Nothing is selected
# until a human adds this label to an issue, so the routine ships nothing
# until the backlog is curated.
label: autonomy-ok

# Which LLM PROVIDER the /ship-issue walk STARTS on — the HEAD provider
# (issue #544). Each provider has matching, git-tracked ship steps in
# .github/workflows/backlog-burn.yml (with its endpoint + which secret it
# uses):
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint
#               (https://api.z.ai/api/anthropic), secret ZAI_KEY (default)
# WHICH MODEL each link runs is NOT this file's call: the registry's
# `[chain:backlog-burn]` (.github/models/registry.conf, issue #326) decides
# it. Link 1 of that chain must sit on the provider named here; the chain's
# TAIL may cross to the other provider (today: three GLM links, then the
# Anthropic tail), in the workflow's ship-step order — the workflow's resolve
# step checks that shape and fails up front on a mismatch, so flipping this
# line means re-tailoring the chain in the same PR.
# Note: /ship-issue is a Claude Code skill; non-Claude models run it best-effort
# (Anthropic doesn't officially support routing Claude Code to non-Claude
# models), so expect quality to vary by provider.
provider: zai

# How often the routine fires. Preset names: hourly, 4x (every 6 h), 2x,
# daily, weekly. A raw 5-field cron literal is also accepted. The
# `/backlog-burn set cadence <value>` command patches both this line AND the
# cron literal in backlog-burn.yml at the same time, so they stay in sync.
cadence: hourly
