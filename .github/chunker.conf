# Policy for the scheduled issue chunker (the "break up declined-too-big
# issues" routine) — the git-tracked source of truth for WHAT the routine
# does, mirroring .github/backlog-burn.conf and .github/design-run.conf exactly
# (which mirror .github/ci-gates/registry.conf).
# A clone carries it, every run reads it identically, and changing it is a
# reviewed one-line diff. GitHub supplies only the *live arming* (the
# CHUNKER_ENABLED repo variable) and the *secret* (ANTHROPIC_API_KEY / ZAI_KEY).
#
# This file is read by the SAME tool the backlog burn uses — `backlog-burn
# config --get <key> --path .github/chunker.conf` — because the selection
# policy (one issue per firing, oldest-first, skip claimed/branched/PR'd) is
# identical; only the opt-in label differs. That reuse is the point: the
# chunker is orchestration of what already exists, not new machinery. There is
# one tested selector, shared by three routines (backlog burn, design run,
# chunker).
#
# WHAT THE ROUTINE DOES: picks one open issue carrying the `declined-too-big`
# label (applied by /ship-issue when it declines an issue as bigger than one
# reviewable PR) and runs /chunk-issue on it: files dependency-ordered
# sub-issues, each closeable by one PR, and drops the parent's
# `declined-too-big` label so it is not re-chunked. Per the operator's choice,
# sub-issues that are genuinely small are auto-armed with the backlog burn's
# opt-in label (`autonomy-ok`) so the burn can pick them up without a second
# human step — the human gate moved UP to curating what carries
# `declined-too-big` in the first place.
#
# Two keys must agree for the routine to act, by design:
#   1. this file's `enabled: true`      — reproducible intent, in git, PR-reviewed
#   2. repo variable CHUNKER_ENABLED == 'true' — the deliberate, fast,
#      human-only arming/kill switch (Settings → Secrets and variables →
#      Actions → Variables, or `gh variable set`). Not in git on purpose:
#      arming an agent that files issues should be a conscious operational act a
#      fresh clone/fork does not inherit, and flipping it off halts the routine
#      in seconds without a commit.
#
# Cadence lives BOTH here AND as the `cron:` literal in chunker.yml (Actions
# can't read a file/variable for on.schedule). If you edit one, edit both.
# Stored here as a RAW CRON, not a preset name, on purpose: the shared
# tools/backlog-burn preset vocabulary pins every cadence to :17 past the hour
# (that is backlog-burn's slot), and this routine fires at :29 to stay offset
# from both it and design-run's :23 — so a preset name would misdescribe the
# actual schedule. Runs daily at 05:29 UTC, before the 06:17 backlog burn, so a
# freshly chunked issue is available to the next burn. (Preset names 4x/2x/
# daily/weekly are still accepted by the parser if you don't need the offset.)
#
# Format: `key: value`, one per line; `#` comments; unknown keys fail loudly.

# Whether the routine is intended to run at all (the reproducible on/off).
enabled: true

# The opt-in label an issue must carry to be eligible. /ship-issue applies
# `declined-too-big` when it declines an issue for size (see its §1). Nothing is
# selected until such a decline exists, so the routine ships nothing until the
# backlog actually contains an oversized issue.
label: declined-too-big

# Which LLM runs /chunk-issue. Pick a label; each has a matching, git-tracked
# ship step in .github/workflows/chunker.yml (with its endpoint + which secret
# it uses). Switching provider is this one line.
#   anthropic — Claude via api.anthropic.com, secret ANTHROPIC_API_KEY (default)
#   zai       — Z.AI GLM via the Anthropic-compatible endpoint
#               (https://api.z.ai/api/anthropic), secret ZAI_KEY. The model ids
#               come from the registry's chain (issue #297), not this file.
# Note: /chunk-issue is a Claude Code skill; non-Claude models run it
# best-effort (Anthropic doesn't officially support routing Claude Code to
# non-Claude models), so expect quality to vary by provider.
provider: anthropic

# How often the routine fires, as a raw 5-field cron (see the header note on
# why this is a literal, not a preset: presets mean :17, this routine runs at
# :29 to stay offset from backlog-burn and design-run). Preset names (4x, 2x,
# daily, weekly) are also accepted by the parser. If you change this, change the
# `cron:` literal in chunker.yml to match — they must stay identical.
cadence: 29 5 * * *
