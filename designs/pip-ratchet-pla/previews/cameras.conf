# Frozen preview cameras for pip-ratchet-pla. The framing vocabulary is
# the parent's so the two pages read as siblings; the pawl-close shot is
# the story of this design (the 1.0 mm band vs the parent's 1.2 — compare
# against the parent's published pawl-close.png, same framing).
# Re-render with ./scripts/render.sh pip-ratchet-pla --previews
contact-sheet
# One pawl up close: beam band outside the tooth tips, hook nose between
# two teeth, frame block burying the root — the parent's framing, on the
# thinner PLA band. Look-at on the beam mid-span (~-14 deg, r~28.8), 55
# deg tilt so the beam-to-tip radial gap reads, 25 deg spin to center the
# nose-to-block assembly.
pawl-close | 1400x1000 | 28,-7,7,55,0,25,95
# The print-this-first coupon (rack + one PLA-section pawl in its channel)
# — the artifact the README's qualification section sends you to print.
# Look-at is the coupon's measured bbox center (74 mm strip, x centered
# 8.98). Framing was pixel-verified on the render, not eyeballed: at this
# tilt/spin the strip spans ~1216 px of the 1400 px frame at d=150 (right
# margin 62 px — tight) and d=110 crops the far end; d=160 lands ~1140 px
# with >=100 px both sides.
coupon | 1400x1000 | 9,0,4,55,0,25,160 | src=pip-ratchet-pla-coupon.scad
