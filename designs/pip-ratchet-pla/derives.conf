# Lineage of pip-ratchet-pla — the pip-ratchet demonstrator re-sectioned
# for PLA (brief #675): the single override is the force-matched pawl_t
# (1.2·(2000/3500)^(1/3) → 1.0), every pawl band thins, so the claim is the
# parent's default render.  Format: tools/lineage; background:
# docs/derivative-designs.md.  Validate with ./scripts/lineage.sh check.

# Single parent, in include order (one parent, so no diamond is possible).
# "variant-of" rather than "derivative-of": same design, different material
# section — the OKH distinction, documentation for humans (tooling: same).
variant-of:    pip-ratchet

# The parent ships no ci.parts — its only render is the default one, so the
# claim is the empty part (the parent's default render). The gate proves it
# by mesh comparison: identical meshes would mean the pawl_t override never
# bound (OpenSCAD would have said nothing either way).
replaces:      pip-ratchet:
