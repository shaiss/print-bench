# Frozen preview cameras for bistable-toggle. See scripts/render.sh for the
# format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso
# of the production toggle.
contact-sheet
coupon | 1500x500 | 92,2,3,55,0,25,330 | src=bistable-toggle-coupon.scad |
# Round-6 addition (new line, coupon stays frozen): near-top close on the
# strip's label row so the four through-cut digits the calibration sentence
# keys on are legible — coupon.png frames the whole strip, but at 1500px over
# ~197 mm its 3.2 mm labels land on too few pixels to read.
# Round 6.1: recentred within the freeze window (the line lands in this PR,
# so this round IS its freeze moment — Jane's [saw-it]: at tx 91 / dist 126
# the frame clipped cell 4 mid-post and the "1.5" digits were not in the
# image its own row promises). tx 98 = strip centre; dist 150 fits all four
# cells plus a margin.
coupon-close | 2200x520 | 98,3,3,25,0,0,150 | src=bistable-toggle-coupon.scad |
