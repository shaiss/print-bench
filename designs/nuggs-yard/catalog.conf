# run built from one channel cross-section and one lap joint, so it is not a
# NUGGS-ecosystem module; it is a practical printed enclosure. Decision + the
# bidirectional coupling cross-check that enforces it: issue #509 (CodeRabbit
# finding 2 on #501).
category: everyday-functional
