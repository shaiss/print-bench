# Catalog category for the design gallery (issue #374).
# Closed vocabulary + display order: designs/categories.conf.
# Validated by scripts/catalog.sh (a free-text or typo'd value fails CI).
# Provenance: the "nuggs-" prefix here is a NAME collision — named for the
# hamster Nuggs (issue #73), NOT the NUGGS quarter-turn coupling standard. This
