# Tier-2 AI motion-clip prompts (scripts/lifestyle-clip.sh) — one
# '<shot> | <prompt>' per line. COSMETIC and image-to-video, so the geometry is
# an impression and the motion is illustrative; previews/turntable.gif stays
# the motion-true artifact this clip restyles (hence the shared shot name,
# which also parks the embed beside it). The seed is declared explicitly
# (seed=product-hero -> previews/product-hero.png), since the turntable has no
# still of its own — the same still the shots.conf-first fallback would resolve
# to, now stated rather than implied so the PM.md Seed column is a declaration.
# This manifest drives the generator; readme-gate's disclosure check keys on
# the committed previews/lifestyle-<shot>.gif, not on this file.
turntable | seed=product-hero | a slow, steady camera orbit around a 3D-printed orange calibration cube sitting on a heated 3D-printer bed, warm workshop light sweeping across the chamfered bottom edges and the engraved 20 size marker on its top face as the view circles, the cube itself perfectly still, shallow depth of field, photorealistic product videography
