# Frozen preview cameras for nuggs-bottle-adapter. Cameras are FIXED once a
# reviewer has seen a shot — a new region to show gets a NEW line, never a
# moved one. Format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines
#
# contact-sheet re-renders the 4-view sheet used across the repo (the
# bottom-iso quadrant is the overhang/bed-contact check).
contact-sheet
# hero: three-quarter view of the whole adapter, port down on its sector
# tips as it prints — the coupling ring, the shoulder cone closing to the
# throat, and the threaded mouth.
hero | 1400x1050 | 0,0,25,62,0,25,300
# cutaway: half-section on the y = 0 plane through the axis — the port bore
# opening into the funnel, the land annulus at mid-cone, the thread grooves
# in the throat wall and the rim lead-in (viewed from the -x flank).
cutaway | 1400x1050 | 0,0,30,12,72,0,240 | render | part="cutaway"
# cutaway-profile: the same section dead-on (no elevation), so the profile
# reads as a drawing: bore -> funnel ceiling -> land -> groove band -> rim.
cutaway-profile | 1400x1050 | 0,0,30,90,0,0,240 | render | part="cutaway"
# throat: obliquely into the mouth — the rim lead-in flare and the thread
# groove band on the visible bore wall, full-rendered so the recessed grooves
# shade (axial views put a recessed groove edge-on; the preview renderer
# flattens the bore wall). $fn=192 because this extreme close-up would
# otherwise show the 96-gon rim's ~1.1 mm chord flats as a faceted rim.
throat | 1400x1050 | 0,0,52,40,0,25,110 | render | $fn=192
# bed-contact: low, tight three-quarter on one sector-tip foot — the tips,
# the gaps between them, and the shell ring bridging 10 mm above the bed.
bed-contact | 1400x1050 | 0,20,0,76,0,235,240
