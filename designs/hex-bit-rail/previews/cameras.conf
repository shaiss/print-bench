# Frozen preview cameras for hex-bit-rail. See scripts/render.sh for the
# format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso
# of the assembled preview (ghost bits).
contact-sheet
# The printable short rail, 3/4 view down its length: twelve pockets in one
# centred row, equal wall either side, mouths broken 45°.
rail-short | 1600x500 | 100,0,7,60,0,20,260 | ortho |
# The printable long rail — the same vocabulary at the deeper 18 mm socket.
rail-long | 1600x500 | 100,0,10,60,0,20,260 | ortho |
# The print-this-first coupon, near-top so the six embossed fit values are
# legible left to right (-0.15 -0.15 0 0 +0.15 +0.15).
coupon | 1600x400 | 76,0,4,65,0,15,170 | ortho | src=hex-bit-rail-coupon.scad
# Front section through the pocket axis (full render — it is a difference of
# the ghost-bit assembly): the fit you cannot see from outside — pocket depth,
# the 2.4 mm floor, the 45° mouth break, one ghost bit seated.
cutaway | 1600x500 | 100,0,7,90,0,12,260 | ortho render | part="cutaway"
# Same section zoomed to the first three pockets: at full-rail framing the
# 14.4 mm section is a 70 px sliver no reader can measure anything against.
# Pure front view (no rz) so depths read straight off the image.
cutaway-close | 1600x500 | 30,0,7,90,0,0,58 | ortho render | part="cutaway"
