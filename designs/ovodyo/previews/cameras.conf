# Frozen preview cameras for ovodyo. Cameras are FIXED once a reviewer has seen
# a shot — a new region gets a NEW line, never a moved one.
# Format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines
#
# contact-sheet: the standard 4-view sheet (the bottom-iso quadrant is the
# overhang/bed-contact check).
contact-sheet
# hero: three-quarter of the whole clock — two chunky faceted balls on brass
# stalks over the tapered truss, with the red gear-trains and PCB in the base.
hero | 1400x760 | 0,0,80,72,0,18,780
# hours-ball: a single ball three-quarter, showing the flush pentagon faces,
# cut-through numerals and the helical slot framing the interior.
hours-ball | 1000x1000 | 0,0,0,62,0,25,235 | | part="hours-ball"
# slot-corner: close three-quarter aimed at where the helical slot crosses a
# corner facet — the #768 bridge fix (clip at dodeca circumradius). NEW line for
# a new region; never a reframe of hours-ball.
slot-corner | 1100x900 | 0,0,8,68,0,48,155 | | part="hours-ball"
# slot-path: near-equator view of the helical slot band cutting across corner
# facets (Drik R2: slot-corner framed numerals more than the slot — new line,
# not a reframe).
slot-path | 1100x900 | 0,0,0,90,0,5,180 | render | part="hours-ball"
# slot-window: broadside into the helical window with the red interior lit —
# sells the 10 mm aperture as a window, not a slit (Drik/PM: new line; the
# tight pass-by a numeral plaque is the measured #768 clearance).
slot-window | 1100x900 | 0,0,0,20,0,0,150 | render | part="hours-ball"
# base-mech: the base drivetrain on its own — the reference's exposed "gears in
# the base": a geared stepper + reduction train at each pod, a bevel take-off up
# each stalk, and the central electronics bay (PCB + chips + USB-C + WS2812).
base-mech | 1400x600 | 0,0,10,74,0,16,470 | | part="base-mech"
# base-mech-in-situ: same drivetrain seated in the truss (Jane/PM: companion to
# frozen base-mech so the mechanism has scale and a home). NEW line, not a reframe.
base-mech-in-situ | 1400x600 | 0,0,18,72,0,18,520 | | part="base-mech-in-situ"
# what-ships: single-material honesty shot — shells + bare truss, balls pole-flat
# in front of the base on a shared ground plane (clear of wing tips). `render`
# kills OpenCSG cut-face tint. Beside banner, never hero.
what-ships | 1400x760 | 0,-40,35,55,0,15,950 | render | part="what-ships"
