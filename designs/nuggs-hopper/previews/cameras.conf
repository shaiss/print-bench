# Frozen preview cameras for nuggs-hopper. See scripts/render.sh for the format:
#   name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso.
contact-sheet
# hero: three-quarter view of the whole module — bottom port on the bed, bulb
# mid-body, top fill port with its coupling sectors, standing as printed/used.
hero | 1200x900 | 0,0,60,62,0,25,560
# cutaway: sagittal section — the continuous bore through both port zones, the
# bulb cavity, the mesh floor disc at z=13, and the mouth funnels at both faces.
cutaway | 1200x900 | 0,0,55,80,0,15,340 | render | part="cutaway"
# floor: top-down look through the open top port at the mesh floor — the 8 mm
# cells on 10.4 mm pitch, the entry barrier the brief's welfare bound caps.
floor | 1200x900 | 0,0,60,25,0,0,480
