# Product-shot manifest (format documented in scripts/product-shot.sh).
# CI's regen job path-traces and commits these; the manifest and the README
# embed are the design's, the pixels are the generator's. Geometry-true from the
# STL export (part="assembly"), so a shot can never show a feature the print
# lacks — the user's pre-rolls are payload, not printed geometry, so the shots
# show the bare mechanism: the closed bolt, and the raised state. Empty and
# geometry-true, the raised cups stop ~12 mm short of the mouth rather than
# standing proud (only a loaded roll clears the rim — see the elevator GIF);
# product-raised looks down into the mouth to show that honestly.
#   name | color | finish | camera(rotz,elev,zoom) | size | defines
product-hero   | 4c5158 | satin | 24,12,0.85 | 1000x1300 | part="assembly" elevator_pos=0 ghost_rolls=false
product-open   | 4c5158 | satin | 26,14,0.80 | 1000x1300 | part="assembly" elevator_pos=1 ghost_rolls=false
product-raised | 4c5158 | satin | 26,42,0.82 | 1000x1300 | part="assembly" elevator_pos=1 ghost_rolls=false
