# Assembly manifest (format documented in scripts/assembly.sh). PARTS-ONLY — no
# vitamin: lines — so the generated assembly is pure first-party OpenSCAD and the
# design owes no GPL/NopSCADlib combined-work disclosure. CI's regen job renders
# previews/exploded.png and writes ASSEMBLY.md from this; readme-gate checks the
# exploded PNG is committed, embedded and in budget.
title: Pre-roll elevator — 5 printed parts, no hardware
explode: 45

part: screw_knob() | 1 | central lead-screw + hex twist knob (the "bolt"); prints hex-head down
part: retainer() | 1 | base capture ring; press-snaps into the body base, traps the screw flange
part: body() | 1 | threaded bolt-shank tube with 4 anti-rotation slots; prints base down
part: elevator() | 1 | carrier nut + 4 roll cups + 4 anti-rotation tabs; prints cups up
part: lid() | 1 | hex cap-nut lid; prints closed-top down

step: Insert the screw-knob up through the body from below — the journal passes through the floor bore and the flange's 45° cone seats on the matching countersink.
step: From inside the body, drop the retainer ring down over the screw shaft and press it into the base counterbore until it clicks flush; the screw now spins freely but cannot lift out.
step: Thread the elevator onto the screw from the open top, aligning its 4 tabs with the 4 body slots, and wind it down until the tabs run in the slots.
step: Drop one pre-roll into each of the 4 cups.
step: Twist the knob to lower the rolls fully inside, then screw the hex cap-nut lid onto the top to close.
