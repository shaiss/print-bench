# Frozen preview cameras for nuggs-turnaround-tee. Cameras are FIXED once a
# reviewer has seen a shot — a new region to show gets a NEW line, never a
# moved one. Format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines
#
# contact-sheet re-renders the 4-view sheet used across the repo (the
# bottom-iso quadrant is the overhang/bed-contact check).
contact-sheet
# hero: three-quarter view of the whole node — both bed ports down on their
# sector tips, the solid web between them, the oblate chamber rising to the
# crown, and port C's collar and sector ring uppermost on the crown.
hero | 1400x1050 | 0,0,95,62,0,25,720
# cutaway: section on the plane through both bed-port axes (x = 0) — both
# vertical bores, the solid web between them below, the dish handing off to
# each mouth, and port C's neck-tube walls (the plane passes 3 mm beside C's
# axis) rising through the frame to its ring (viewed from the -x /
# use-ceiling flank, so the vents on that flank are in the near wall).
cutaway | 1400x1050 | 0,0,95,12,72,0,560 | render | part="cutaway"
# cutaway-cross: section ACROSS the turn axis at y = 0 — the plane that
# carries the whole A->C through-route: the dish floor rising to the
# handoff, port C's flat bore floor taking over at 13.9 deg, and the
# repaired crown cap (x-gable planes meeting the ridge, hip planes
# descending in |y|) over it. Viewed from the +y end (the removed half),
# slightly elevated for depth. This plane misses the bed bores; `cutaway`
# is their shot.
cutaway-cross | 1400x1050 | 0,0,95,75,0,0,560 | render | part="cutaway-cross"
# cutaway-profile: the same y = 0 section dead-on (no elevation), so the
# profile reads as a drawing: the gable's two straight roof planes, the
# ridge corner, and the hip's steeper descent where the roof turns down
# toward the y-ends — the cap repair's own shot.
cutaway-profile | 1400x1050 | 0,0,95,90,0,0,560 | render | part="cutaway-cross"
# bed-contact: low, tight three-quarter on one bed port's castellated
# sector-tip feet — still the only bed contact (port C prints ring-up and
# the belly dome closes pole-flush at the port plane). The tips, the gaps
# between them, and a slice of the neighbouring ring fill the frame, with
# the collar/web plane bridging 10 mm above the bed.
bed-contact | 1400x1050 | 0,25,0,76,0,235,370
