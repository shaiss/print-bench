# Lineage of nuggs-turnaround-tee — the three-port turnaround, a derivative
# of the two-port nuggs-turnaround (issue #435: the 2-vs-3-ports decision
# deferred from #394, settled on-thread by the owner as "build it as a
# derivative"). Format: tools/lineage; background: docs/derivative-designs.md.
# Validate with ./scripts/lineage.sh check.

# Single parent, in include order (one parent, so no diamond is possible).
variant-of:    nuggs-turnaround

# The parent part this design changes, proven by mesh comparison in gate.sh:
# nuggs_turnaround() is redefined (the tee: chamber_az/chamber_zc moved, the
# crown cap repaired with a hip, port C added, the fitcheck sweep extended),
# so the turnaround mesh moves. Everything else is inherited, not claimed:
# the coupling cfg and neck() port geometry (same standard, same revision —
# a claimed-but-unchanged mesh is indistinguishable from an override that
# never bound, and fails the gate). The coupon is the parent's own
# nuggs_neck stub, unchanged by design.
replaces:      nuggs-turnaround:turnaround
