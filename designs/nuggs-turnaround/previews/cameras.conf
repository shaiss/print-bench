# Frozen preview cameras for nuggs-turnaround. Cameras are FIXED once a
# reviewer has seen a shot — a new region to show gets a NEW line, never a
# moved one. Format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines
#
# contact-sheet re-renders the 4-view sheet used across the repo (the
# bottom-iso quadrant is the overhang/bed-contact check).
contact-sheet
# hero: three-quarter view of the whole node — both ports down on their sector
# tips, the solid web between them, the oblate chamber rising to the crown.
hero | 1400x1050 | 0,0,85,62,0,25,720
# cutaway: section on the plane through both port axes — both vertical bores,
# the solid web between them below, and the dish handing off to each mouth
# ~1 mm below the bore floor (viewed from the -x / use-ceiling flank, so the
# vents on that flank are in the near wall).
cutaway | 1400x1050 | 0,0,85,12,72,0,560 | render | part="cutaway"
# cutaway-cross: section ACROSS the turn axis at mid-span (y = 0) — the crown
# cap's own profile: the two >=45 deg vault planes meeting at the ridge, over
# the dish floor. This plane misses the bores; `cutaway` is the bores' shot.
# Viewed from the +y end (the removed half), slightly elevated for depth.
cutaway-cross | 1400x1050 | 0,0,92,75,0,0,560 | render | part="cutaway-cross"
# cutaway-profile: the same y = 0 section dead-on (no elevation), so the
# profile reads as a drawing: the vault's two straight roof planes and ridge
# are NOT hidden behind the outer dome's silhouette, which from any elevated
# angle nearly coincides with the ridge (the outer pole sits 3.4 mm above it).
cutaway-profile | 1400x1050 | 0,0,92,90,0,0,560 | render | part="cutaway-cross"
# cutaway-ridge: section ALONG the turn axis (x = 0, the plane the #499 roof
# slot lived on) — the cap the hip adds, seen end-on: the gable's flat ridge
# segment at the top centre hands off to the hip planes at |y| ~ 13.7, and the
# hip planes descend to close on the equator at |y| ~ 99.6, where the cavity's
# widest line still spans ~199.3 mm. Dead-on like cutaway-profile: the hip
# planes contain x, so only edge-on do they read as lines and not facets.
cutaway-ridge | 1400x1050 | 0,0,92,90,0,90,560 | render | part="cutaway-ridge"
# bed-contact: low, tight three-quarter on one port's castellated sector-tip
# feet — the only bed contact. The tips, the gaps between them, and a slice of
# the neighbouring ring fill the frame, with the collar/web plane bridging
# 10 mm above the bed (where the first-layer islands merge).
bed-contact | 1400x1050 | 0,25,0,76,0,235,370
