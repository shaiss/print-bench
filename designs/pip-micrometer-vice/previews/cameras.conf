# Frozen preview cameras for pip-micrometer-vice. See scripts/render.sh for
# the format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso
# of the printable assembly (the bottom-iso is the flat-print/no-support
# proof).
contact-sheet
# Straight down over the whole vice at the print pose (opening 12): the
# working gap between the two 40-wide faces, the screw thread crossing the
# moving jaw's nut boss, the rails, and the two M5 holes on the 40 x-grid.
vice-top | 1600x800 | -3,0,13,0,0,0,170 |
# The section (part=cutaway removes the +y half), from +y and tilted so the
# cut face reads in 3/4: guide bore tunnel, sealed collar chamber, the thread
# interleaved with the moving jaw's nut (the serrated band), and the centre
# saddle under the screw's exposed underside — the support story in one view.
# A flush rx=-90 face-on view was tested and reads as a blank wall: without
# hatch shading a section face carries almost no contrast (measured: 4x the
# edge density and 4x the encoded bytes at this 3/4 angle).
section | 1600x1000 | -1,0,14,-72,20,0,170 | | part="cutaway"
# Close 3/4 on the working end: both jaw faces, the opening, the moving
# jaw straddling the saddle, thread emerging past the jaw.
jaws | 1600x1000 | -2,0,12,65,0,25,185 |
# The print-this-first coupon, 3/4 from the thread-row side (a flush top-down
# view gives the sliders and rails no depth cue — they read as a flat plate —
# and a grazing 28-deg elevation foreshortens the studs into rings):
# thread row (digits 1/2/3 = thread_tol) near, guide row (letters A/B/C =
# clr_h) far, digits cut into the nut front faces (facing this camera),
# letters into the slider tops.
coupon | 2000x800 | 50,0,10,-38,0,0,155 | src=pip-micrometer-vice-coupon.scad
