# Frozen preview cameras for nuggs-open. See scripts/render.sh for the format:
#   name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso.
# The part is a 200 mm vertical tube; every camera centers on z=90 (the
# single module) or z=180 (the pair's midplane) and frames the whole part.
contact-sheet
hero       | 1200x900 | 0,0,90,60,0,25,520  |  | part="open"
bottom-iso | 1200x900 | 0,0,90,125,0,25,520 |  | part="open"
bore       | 1200x900 | 0,0,90,60,0,45,520  |  | part="cutaway"
pair       | 1200x900 | 0,0,180,60,0,25,900 |  | part="pair"
