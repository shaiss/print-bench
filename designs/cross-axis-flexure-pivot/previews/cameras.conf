# Frozen preview cameras for cross-axis-flexure-pivot. See scripts/render.sh
# for the format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso
# of the production pivot (also the as-printed 4-view readme-gate requires of
# a mechanism design).
contact-sheet
# Whole-part plan view: the X of the two beams, both ring arcs sharing the
# virtual center, the two grip tabs and the four open pockets flanking the
# crossing.
top | 1400x1000 | 0,0,6,0,0,0,150 | ortho |
# The signature detail close up: the two beams welded where they cross at the
# origin (which stays open — neither body covers it), with the root fillets
# where each beam meets its arc and the pocket clearances either side. Square
# window because the geometry is diagonal: at dist=55 the frame reaches
# +-11 mm, so all four filleted roots (at +-9.9, +-9.9) are in view and the
# arcs enter only at the corners.
crossing | 1100x1100 | 0,0,6,0,0,0,55 | ortho |
# The print-this-first strip: 2 rows — the t ladder (0.6 / 0.8 / 1.0) plus
# the PETG / PLA production-t twins — with all five embossed labels legible.
# TILTED (rx=55, rz=25), not plan: OpenSCAD shades by surface normal and the
# label's readable face is PARALLEL to the pad it sits on, so the letters
# separate from the pad only via their thin side walls — in a straight plan
# view they vanish entirely (measured off the first render: no text visible),
# and at dist=300 (~5.8 px/mm) the walls read as a faint smudge (vision pass
# could not read back a single label). dist=175 fills the 1800x700 window
# with the 152x50 strip; the raised labels read as RELIEF here, not
# letterforms — their readable tops are coplanar-normal with the pad (same
# shade, normal-based shading) so only the thin dark side walls carry the
# letters, and at strip scale those stay sub-legible. The letterform proof
# is the coupon-label line below, not this one. src= is an OPT (field 4),
# not a define — in the defines slot it becomes a no-op -D and the shot
# silently renders the entry .scad instead of the wrapper (measured: content
# bbox was the pivot's 61x38.5 mm footprint, not the strip's 152x50).
coupon | 1800x700 | 52,14,4,55,0,25,175 | src=cross-axis-flexure-pivot-coupon.scad |
# Label legibility proof, one specimen's +x grip close up (dist=45, ~40 px/mm):
# the embossed "0.6" reads as full raised letterforms here — verified by
# read-back, not assumed. The two rows overlap in projection at this tilt, so
# the wide coupon line above stays the layout shot and this one the detail.
coupon-label | 1000x800 | 19,0,8,55,0,25,45 | src=cross-axis-flexure-pivot-coupon.scad |
