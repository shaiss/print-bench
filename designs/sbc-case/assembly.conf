# Assembly manifest for sbc-case — the hardware-rich reference design for
# this feature (issue #158): the vitamin: entries below are what pull
# NopSCADlib into the generated assembly, exercising the BOM collection pass
# and making this design a GPL-3.0 combined work (disclosed in README.md).
title: sbc-case — Raspberry Pi 4, 40 mm fan, heat-set inserts
explode: 40

part: base() | 1 | printed base tray (floor-down, no supports)
part: lid() | 1 | printed lid with fan mount (outer-face-down, no supports)

vitamin: vitamin_pcb() | 1 | Raspberry Pi 4 model B
vitamin: vitamin_insert() | 8 | M3x5.8 heat-set insert (4 base lid-screw posts, 4 lid fan bosses)
vitamin: vitamin_board_screw() | 4 | M2.5 cap screw ×6 mm (board to standoffs)
vitamin: vitamin_lid_screw() | 4 | M3 cap screw ×10 mm (lid to base posts)
vitamin: vitamin_fan_screw() | 4 | M3 dome screw ×20 mm (fan through plate into lid bosses)
vitamin: vitamin_washer() | 4 | M3 washer under each fan screw
vitamin: vitamin_fan() | 1 | 40x11 mm 5 V fan (fan40x11 vitamin; blows into the case)
# NOTE: the vitamin: lines call origin-only wrapper modules defined in
# sbc-case.scad, not raw NopSCADlib constants — assembly.sh's generated preview
# `use`s the design file (modules re-exported, variables not), so `pcb(RPI4)`
# would render with RPI4 undefined. See sbc-case.scad "Vitamin wrappers".

step: Press the 4 F1BM3 inserts into the base's lid-screw posts — melt each one until it sits FLUSH with the post top, no deeper. The posts are through-bored (an M3x10 screw tip then bottoms out in free space, not plastic), so there is no shoulder to stop the insert: sink it too far and the lid screws find nothing to bite. (A stepped seat that stops the insert on its own is a planned refinement.)
step: Press the 4 F1BM3 inserts into the lid's fan bosses from the inner face (lid inner-face-up; the inserts melt in blind-side-down so the fan screws thread into them through the plate).
step: Drop the Raspberry Pi 4 onto the standoffs — every standoff is generated from the board's own hole list, so it self-locates.
step: Fix the board with 4 M2.5 cap screws into the printed pilot bosses (they self-tap; do not overtighten).
step: Fit the lid: the register lip drops into the cavity with 0.25 mm clearance — its notches pass the four lid-screw posts, which locate it — then seats on the wall and post tops.
step: Close the case with 4 M3 cap screws through the lid into the base posts.
step: Bolt the 40 mm fan to the lid bosses with 4 M3 dome screws, washer under each head, airflow blowing into the case.
