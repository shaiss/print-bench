# Frozen preview cameras for nuggs-vent-cap. Cameras are FIXED once a
# reviewer has seen a shot — a new region to show gets a NEW line, never a
# moved one. Format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines
#
# contact-sheet re-renders the 4-view sheet used across the repo (the
# bottom-iso quadrant is the overhang/bed-contact check).
contact-sheet
# hero: three-quarter exterior of the whole cap — port ring down on its sector
# tips, the full-round shell, the 45 deg lattice cone rising to the crown.
# Elevated enough that the latticed crown disc reads at a glance.
hero | 1400x1050 | 0,0,18,45,0,25,420
# lattice-top: straight down into the dome — the crown disc with its 15 radial
# spokes and concentric bands, the 37 meridian ribs falling away to the wall
# rim, the on-slope cell openings this design's welfare number lives in.
lattice-top | 1400x1050 | 0,0,20,0,0,25,300
# cells: tight three-quarter on the rim cells — strand width (1.2) and the
# on-surface openings (<= aperture_max) read at the scale they print at.
cells | 1400x1050 | 0,0,30,72,0,35,180
# cutaway: section on the port-axis plane — the port zone (sector tips to
# collar), the dome's seating ring buried in the wall band below z_top, the
# 45 deg lattice falling off the wall, and the crown disc bridging the last
# 12 mm of radius. Dead-on so the 45 deg lines read as lines.
cutaway | 1400x1050 | 0,0,18,90,0,0,420 | render | part="cutaway"
