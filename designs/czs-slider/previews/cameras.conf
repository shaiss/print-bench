# Frozen preview cameras for czs-slider. See scripts/render.sh for the
# format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines...
# Cameras are FIXED once a reviewer has seen them — a new region gets a NEW
# line, never a reframed existing one. Descriptions in CAMERAS.md.
#
# The lone `contact-sheet` field re-renders the 2x2 iso/top/front/bottom-iso
# of the production part (the bottom-iso is the flat-print/no-support proof).
contact-sheet
# Top-down over the whole mechanism: the slot zone left, both springs in the
# chamber (arch bowing -X from x=-12, V-beam chevron +X from x=+2), far bar
# right. The one shot that shows the parallel pair the design is.
qzs-top | 1700x800 | 21,96,0,0,0,0,700 |
# Near-top close on the chamber's mid-span: the arch band and the V legs
# crossing without touching, with the sweep clearances to the chamber walls.
qzs-midspan | 1500x900 | 0,105,0,20,0,0,260 |
# The print-this-first coupon (three fit cells + the feeler, laid along +X),
# straight down so the through-cut cell digits (1/2/3 = k_xy sweep) read.
coupon | 2250x780 | 98,15,0,0,0,0,210 | src=czs-slider-coupon.scad |
