# Design catalog categories — the closed vocabulary + display order (issue #374).
#
# One "<slug> | <Display label>" per line; `#` comments and blank lines are
# ignored. The order of the lines here IS the display order of the groups, top
# to bottom, in the README gallery and on the site index.
#
# How a design lands in a group:
#   - NUGGS is DERIVED, not declared: a design named "nuggs"/"nuggs-*" that ALSO
#     includes the lib/nuggs-coupling.scad standard is in the "nuggs" group and
#     carries no catalog.conf. The cross-check runs BOTH directions: a design
#     that includes the coupling but is not named "nuggs-*" fails, and a
#     "nuggs-*"-NAMED design that does NOT include the coupling is a name
#     collision (e.g. nuggs-yard, named for the hamster, not the port) — not a
#     NUGGS module, so it declares a category: like any other design.
#   - every other design declares `category: <slug>` in
#     designs/<name>/catalog.conf, and the slug must be one of the four below
#     (a free-text or typo'd value fails scripts/catalog.sh check).
#
# Provenance (N5): the three middle groups are the technique domains from
# docs/advanced-techniques.md (Domain 1 / 2 / 3), kept in the doc's own order so
# the taxonomy reads the same way the reference does. NUGGS leads as the
# flagship interoperating module family; everyday-functional is the practical
# baseline that headlines no single advanced-technique domain, so it closes.
#
# An optional third field, "<slug> | <label> | <blurb>", states the group's
# promise under its heading on both surfaces. Use it only for a heading that
# makes a printability promise a customer decides on (support-free, print-in-
# place) — the hazard is real: printcheck's overhang warnings read to a nervous
# first-timer as "turn supports on", which welds a print-in-place mechanism.
# The three navigational headings carry no blurb.
#
# slug                 | Display label               | Blurb (optional)
nuggs                  | NUGGS ecosystem
compliant-mechanisms   | Compliant mechanisms
# "Designing around supports" is a gerund on purpose — it is docs/advanced-techniques.md's
# own Domain 2 heading verbatim (N5 provenance); don't "fix" it to a noun phrase.
support-free           | Designing around supports   | Every design here prints without slicer supports — leave them off.
print-in-place         | Print-in-place kinematics   | These parts come off the bed ready to move — free each one as its card says, and keep auto-supports off.
everyday-functional    | Everyday functional prints
