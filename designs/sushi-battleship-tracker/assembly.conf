# Assembly manifest for sushi-battleship-tracker, consumed by
# scripts/assembly.sh (issue #158, stage 4 of #98).  Format documented at the
# top of that script: house key: value conf, where part:/vitamin: split their
# value on '|' into <module-call> | <qty> | <description>.  The module calls
# are the geometry producers behind the part dispatch in the parent's
# sushi-battleship.scad — bottom -> tray(), top -> lid_assembly(), door ->
# door("A1") — reached here because this entry .scad includes the parent and
# redefines only door().  There are no vitamins: it is a print-in-place board,
# so the only assembly is seating the lid on the tray and keeping a spare door.
#
# FIXED across review rounds (same rule as shots.conf): add a new entry rather
# than moving or reordering one, so a diff stays legible.

title: Sushi Battleship Shot Tracker

part: tray() | 1 | the tray (bottom half): 4×4 cell grid that holds the sushi pieces, with engraved coordinates on each cell floor
part: lid_assembly() | 1 | the print-in-place lid (top half): all 16 shutter doors captive in their rails, each door carrying a dished miss-marker seat
part: door("A1") | 1 | a spare shutter door with a marker seat — print to replace a captive door that breaks, or to tune door_fit

step: Print the bottom tray and top lid flat-side-down with no supports; all 16 shutter doors print captive inside the lid in one piece.
step: Lower the lid onto the tray so its rim drops into the tray's inner ledge — it seats flush and self-aligns to the grid.
step: Keep a spare door on hand; if a captive shutter ever snaps, slide the broken door out of its rail and drop the spare in.
step: To record a called miss, park a marker (dried soybean, 6 mm BB, or peppercorn) in that door's dished seat — set marker_d to match yours.
