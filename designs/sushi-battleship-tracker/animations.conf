# GIF preview manifest — rendered by scripts/animate.sh, format documented
# there.  Cameras are FIXED across review rounds (same policy as
# previews/CAMERAS.md): add a new entry rather than moving an existing one.
#
# The motion shown here is the deterministic counterpart to the AI motion
# clip (lifestyle-product-hero.gif): what the print actually does, not an
# impression of it.  Both animations are inherited from the parent — the
# tracker includes it verbatim and only redefines door(), so these play on
# the refit's own doors (seat and all) through lid_assembly().

# A "hit" on D1, played by the real mechanism: the shutter slides to its
# end stop and lifts clear, opening the cell.  Same framing as the parent's
# shutter-slide (the D1 corner, where the 6.7 mm travel reads clearly), so
# the seat on the sliding door is visible as it moves.  (The salmon demo
# piece is a $preview prop at the cell floor; it stays occluded behind the
# window membrane, so it does not read in the GIF — the seat does.)
shutter-slide | 48 | 7 | 640x480 | 72,-60,20,60,0,20,330 | 0 | part="assembled" anim="shutter"

# Full-board turntable, D1 slid open: reads the whole refit — 16 seated
# shutters, one slid open, marker seats on the top face.  (The demo piece
# seated under a door stays occluded behind the window membrane — not
# visible here.)  No model motion; the camera turns.
turntable | 36 | 8 | 640x480 | 0,0,22,55,0,25,900 | 360 | part="assembled"
