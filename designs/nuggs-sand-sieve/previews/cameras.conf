# Frozen preview cameras for nuggs-sand-sieve. Cameras are FIXED once a
# reviewer has seen a shot — a new region to show gets a NEW line, never a
# moved one. Format: name | size | camera(tx,ty,tz,rx,ry,rz,dist) | opts | defines
#
# contact-sheet re-renders the 4-view sheet used across the repo (the
# bottom-iso quadrant is the overhang/bed-contact check).
contact-sheet
# hero: three-quarter exterior — port ring down on sector tips, flare to the
# basket, open chamfered mouth up. The grid floor reads through the mouth.
hero | 1400x1050 | 0,0,25,50,0,30,420
# grid: straight down into the basket — the orthogonal web lattice at
# production hole_d / web_w across the full top_id floor.
grid | 1400x1050 | 0,0,30,0,0,0,280
# cutaway: section on the port-axis plane — port zone, flare drain into the
# bore, grid floor, basket wall, 45° pour lip.
cutaway | 1400x1050 | 0,0,25,90,0,0,420 | render | part="cutaway"
