# The 4-view contact sheet (iso / top / front / bottom-iso) — the bottom-iso
# quadrant is the overhang/bed-contact view. Single-field line: re-render with
# ./scripts/render.sh pip-ratchet --previews
contact-sheet
# Close-up of one pawl: beam band outside the tooth tips, hook nose between
# two teeth, frame block burying the beam root. Neighbouring teeth in frame
# for scale. Look-at on the beam mid-span (angle ~-14 deg, r~28.8), 55 deg
# tilt so the beam-to-tip radial gap reads, 25 deg spin to center the nose-to-
# block assembly, pulled back to 95 so the root block's full extent stays in
# frame (the disc's far side cropping the left edge is the close-up's crop,
# not a defect).
pawl-close | 1400x1000 | 28,-7,7,55,0,25,95
