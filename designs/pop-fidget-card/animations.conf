# GIF preview manifest — rendered by scripts/animate.sh, format documented
# there.  Cameras are FIXED across review rounds (same policy as
# previews/CAMERAS.md): add a new entry rather than moving an existing one.

# The flagship trick: the punched "1" easel flap folding out on its
# print-in-place piano hinge to near the measured ~97 deg stop onset and back
# (was 108 at v0.1, 100 at v0.2; the v0.3 fix removed the tongue's living-hinge
# ramp so the tongue is a full-thickness rigid link and the pin hinge does all
# the folding).  anim="easel" triangle-waves the fold from $t (0 -> 95 -> 0 deg,
# mapped inside movings() in the .scad) so the GIF loops seamlessly.  Same
# behind/below camera as the frozen easel-open still, so the hinge tongue and
# rigid neck read.
easel-fold | 48 | 7 | 640x480 | 48,26,-4,70,0,205,150 | 0 | anim="easel"

# Full-card turntable — camera spin only, no model motion.
turntable | 36 | 8 | 640x480 | 56,40,0,55,0,25,320 | 360

# The hot path (Drik round 3): the rotors a thumb works thousands of times
# were the one mechanism the page never showed moving. anim="spin" counter-
# rotates both rotors one full turn per loop (seamless by construction).
# Near-face camera framing both spinners; new entry, frozen cameras untouched.
spinner-flick | 36 | 12 | 640x480 | 52,54,0,40,0,15,245 | 0 | anim="spin"
