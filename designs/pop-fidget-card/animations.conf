# The flagship trick: the punched "1" easel flap folding out on its
# print-in-place piano hinge to the measured 108 deg stop onset and back.
# anim="easel" triangle-waves the fold from $t (0 -> 108 -> 0 deg, mapped
# inside movings() in the .scad) so the GIF loops seamlessly.  Same
# behind/below camera as the frozen easel-open still, so the hinge tongue
# and relief ramp read.
easel-fold | 48 | 7 | 640x480 | 48,26,-4,70,0,205,150 | 0 | anim="easel"

# Full-card turntable — camera spin only, no model motion.
turntable | 36 | 8 | 640x480 | 56,40,0,55,0,25,320 | 360
